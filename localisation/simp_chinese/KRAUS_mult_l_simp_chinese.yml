l_simp_chinese:
 # ===== 10-27 合并：从团队版并入的国策，文案按旧版口径重写 =====
 # --- 经济组 ---
 aus_mult_danube_plan:0 "金色多瑙河"
 aus_mult_danube_plan_desc:0 "从林茨到铁门峡，航道、船闸和码头交给同一个委员会规划。这份计划的图纸在先帝时代就画好了，在部里的柜子里放了二十年。"
 KRAUS_mult_danube_unlock_tt:0 "解锁§Y金色多瑙河§!的工程决议。"
 # --- 议会与四党 ---
 aus_mult_ballhaus_quota:0 "巴尔豪斯广场的配额"
 aus_mult_ballhaus_quota_desc:0 "各党与各邦的代表在巴尔豪斯广场谈了三个星期，定下了各部司局长职位的分配比例。谁也没有拿到全部，谁也没有空手离开。"
 aus_mult_joint_construction:0 "社会住房基金"
 aus_mult_joint_construction_desc:0 "联邦与各邦合出一笔基金，为住房、医院和学校贴息。第一批工程在维也纳、布拉格和布达佩斯同一天开工。"
 aus_mult_sdap_promise_1:0 "八小时工作日"
 aus_mult_sdap_promise_1_desc:0 "社会民主党人把八小时工作日写进了联合执政的条件。法案通过后，波希米亚和下奥地利的工厂主只能多雇人手。"
 aus_mult_sdap_promise_2:0 "工厂委员会"
 aus_mult_sdap_promise_2_desc:0 "大工厂设立工厂委员会，工人代表可以查阅账目、参与分红的讨论。社会民主党人说，这是让工人不必走上更激进道路的办法。"
 aus_mult_cs_promise_1:0 "教区救济"
 aus_mult_cs_promise_1_desc:0 "基督教社会党人要求救济款经由教区发放。乡村的神父比维也纳派来的官员更清楚哪一户人家需要帮助。"
 aus_mult_cs_promise_2:0 "行会与学徒"
 aus_mult_cs_promise_2_desc:0 "手工业行会重新获得主持学徒考试的权力，小作坊的培训开支可以抵税。"
 aus_mult_lb_promise_1:0 "亚得里亚海的自由港"
 aus_mult_lb_promise_1_desc:0 "的里雅斯特与阜姆被定为自由港，各邦之间残留的过境税一并取消。自由派的经济学家们为此争取了十年。"
 aus_mult_lb_promise_2:0 "铁路与电厂的特许"
 aus_mult_lb_promise_2_desc:0 "新建的铁路支线和电厂向私人资本开放特许经营。财政部松了一口气，工会则表示了不满。"
 aus_mult_gdvp_promise_1:0 "技术标准互认"
 aus_mult_gdvp_promise_1_desc:0 "维也纳、布拉格与格拉茨的工学院互认文凭，全国的工厂改用同一套图纸标准。"
 aus_mult_gdvp_promise_2:0 "实业家联合会"
 aus_mult_gdvp_promise_2_desc:0 "北波希米亚和施蒂利亚的实业家组成联合会，政府为他们的矿山和钢厂提供贴息贷款。"
 aus_mult_first_verdict:0 "第一桩合众国判例"
 aus_mult_first_verdict_desc:0 "最高行政法院审理了一名铁路职员的申诉：他因为不说德语而没有得到晋升。法院判他胜诉。判决书只有两页，各地的报纸都全文刊登了。"
 KRAUS_mult_gdvp_industry_bonus:0 "统一的技术标准"
 KRAUS_mult_rural_relief_tt:0 "所有尚未成为本国核心的原王冠领地各州§Y顺从度 +5§!。"
 KRAUS_mult_open_claims_tt:0 "执政党可以在议会提出自己的两项要求（只显示当前执政党的那一对国策）。"
 # --- 备战 ---
 aus_mult_defense_prep:0 "联合动员预案"
 aus_mult_defense_prep_desc:0 "总参谋部与各邦的军区司令部一起制定了一份战时动员预案，规定了哪些营在三天内集结，哪些仓库在十二小时内开门。"
 aus_mult_skoda_relocate:0 "斯柯达的备用厂房"
 aus_mult_skoda_relocate_desc:0 "斯柯达与斯太尔的图纸和模具各复制一份，存进上奥地利山区的新厂房。开战的时候，比尔森不必是唯一能造火炮的地方。"
 aus_mult_officer_corps:0 "共同条令"
 aus_mult_officer_corps_desc:0 "卢多维卡学院与维也纳新城军校改用同一套教范。匈牙利的军官与捷克的参谋第一次站在同一张沙盘前推演。"
 aus_mult_auth_prague:0 "布拉格工业委员会"
 aus_mult_auth_prague_desc:0 "军需订单交给布拉格的实业家委员会分配。内阁只定数目和期限，哪一家工厂接哪一批货，由委员会决定。"
 aus_mult_auth_ludovika_fiume:0 "布达佩斯与阜姆的防务署"
 aus_mult_auth_ludovika_fiume_desc:0 "匈牙利平原的防务交给布达佩斯，亚得里亚海岸交给阜姆。两地各自编练部队，向维也纳交的是同一种报表。"
 aus_mult_fort_line:0 "边境要塞"
 aus_mult_fort_line_desc:0 "苏台德、喀尔巴阡山口与伊斯特拉的旧要塞重新登记造册。工兵按同一套图纸加固，先从边境上的几段修起。"
 KRAUS_mult_autopick_econ_tt:0 "此后每 §Y90§! 天，委员会替我们完成一项前置已满足的§Y联合经济§!国策，并获得其奖励。"
 KRAUS_mult_autopick_mil_tt:0 "此后每 §Y90§! 天，防务署替我们完成一项前置已满足的§Y联合军事§!国策（或它必需的前置），并获得其奖励；不会替我们选择互斥的路线。"
 # --- 战时 ---
 aus_war_entry:0 "战时状态"
 aus_war_entry_desc:0 "战争在欧洲爆发。内阁宣布全国进入战时状态，议会把一批紧急权力交给政府，期限到和约签署为止。"
 aus_war_arms_conversion:0 "工业征用"
 aus_war_arms_conversion_desc:0 "民用工厂的订单簿被收走，换上了军需局的。罐头厂开始做弹壳，卡车厂开始做牵引车。"
 aus_war_mass_conscription:0 "各民族的征召令"
 aus_war_mass_conscription_desc:0 "征兵令用帝国境内的各种语言印发。第一周，各地兵站外面就排起了长队，排队的人说着不同的话。"
 aus_war_air_defense_sabotage:0 "要地警戒"
 aus_war_air_defense_sabotage_desc:0 "多瑙河上的桥梁和各地的编组站布置了高射炮和宪兵岗哨。城市在夜里实行灯火管制。"
 aus_war_multinational_mobilization:0 "动员委员会"
 aus_war_multinational_mobilization_desc:0 "各邦都设立了动员委员会，委员由当地人担任。登记、体检和训练手册都用本地的语言。"
 aus_war_evacuate_industry:0 "工厂内迁"
 aus_war_evacuate_industry_desc:0 "边境地区的机器被拆下装车，运往阿尔卑斯山区。拆不走的，工兵会在撤离之前处理掉。"
 aus_war_rationing:0 "战时配给"
 aus_war_rationing_desc:0 "全国发行统一的粮票和煤票。物价由统制局核定，囤积居奇的案子交给军事法庭审理。"
 aus_war_supreme_command:0 "最高国防委员会"
 aus_war_supreme_command_desc:0 "皇帝主持成立最高国防委员会，陆海军将领与各邦的代表都在其中。此后关于战争的决定都在这里作出。"
 # --- 决议（金色多瑙河分类） ---
 KRAUS_mult_dec_wachau:0 "瓦豪电站"
 KRAUS_mult_dec_wachau_desc:0 "在多瑙河瓦豪段筑坝，扩建电站机组，为下奥地利的工厂供电。"
 KRAUS_mult_dec_wachau_tt:0 "下奥地利获得 §Y1§! 座民用工厂，该州§Y建造速度 +5%§!（该州易手则失效）。"
 KRAUS_mult_dec_budapest:0 "布达佩斯河港"
 KRAUS_mult_dec_budapest_desc:0 "疏浚布达佩斯段航道，扩建深水泊位和编组站。"
 KRAUS_mult_dec_budapest_tt:0 "中匈牙利获得 §Y1§! 级基础设施与 §Y1§! 个建筑槽位。"
 KRAUS_mult_dec_iron_gate:0 "疏浚铁门峡"
 KRAUS_mult_dec_iron_gate_desc:0 "炸掉铁门峡的暗礁，拓宽主航道。驳船过峡时不必再减载。"
 KRAUS_mult_dec_iron_gate_tt:0 "全国§Y消费品工厂需求 -2%§!（长期有效）。"
 KRAUS_mult_dec_bohemia_boom:0 "波希米亚的订单"
 KRAUS_mult_dec_bohemia_boom_desc:0 "财政部与工业部向波希米亚的机械、化工和军械企业下一批订单，并提供信贷。"
 KRAUS_mult_dec_bohemia_boom_tt:0 "全国§Y工厂产出 +15%§!，持续 §Y180§! 天；每 180 天可再执行一次。"
 KRAUS_mult_dec_galicia_boom:0 "加利西亚的公共工程"
 KRAUS_mult_dec_galicia_boom_desc:0 "整合带来的收入被投进加利西亚的公路、桥梁和厂房。"
 KRAUS_mult_dec_galicia_boom_tt:0 "加利西亚各州§Y建造速度 +15%§!（180 天），并获得 §Y2§! 座地图外民用工厂；每 180 天可再执行一次。"
 KRAUS_mult_dec_doleance:0 "义勇社团津贴"
 KRAUS_mult_dec_doleance_desc:0 "向各地的义勇社团和退伍军人协会发放津贴，换取他们在动员时率先报到。"
 KRAUS_mult_dec_doleance_tt:0 "全国§Y动员速度 +15%§!（90 天），立即获得 §Y15000§! 人力；每 180 天可再执行一次。"
 KRAUS_mult_dec_iron_gate_spirit:0 "铁门航道"
 KRAUS_mult_dec_iron_gate_spirit_desc:0 "驳船可以满载通过铁门峡。"
 KRAUS_mult_dec_bohemia_boom_spirit:0 "波希米亚的订单"
 KRAUS_mult_dec_bohemia_boom_spirit_desc:0 "波希米亚的工厂排满了订单。"
 KRAUS_mult_dec_doleance_spirit:0 "义勇社团津贴"
 KRAUS_mult_dec_doleance_spirit_desc:0 "义勇社团领到了津贴。"
 KRAUS_mult_dm_wachau:0 "瓦豪电站"
 KRAUS_mult_dm_galicia:0 "加利西亚的公共工程"
 # --- 事件 ---
 KRAUS_mult.3.t:0 "司法宫的判决"
 KRAUS_mult.3.d:0 "案子本身并不复杂。一名在布尔诺工作了十一年的铁路职员，三次被排除在晋升名单之外，理由每次都一样：他的德语考试没有通过。他把铁路管理局告到了最高行政法院。\n\n管理局的律师说，这是帝国铁路多年的规矩。原告的律师只念了宪章的一个条款。\n\n法院用了四十分钟宣读判决：规矩不能高于宪章，管理局须补发原告被扣的津贴。判决书只有两页。第二天，维也纳、布拉格、利沃夫和萨格勒布的报纸都全文刊登了它。"
 KRAUS_mult.3.a:0 "法院说了算。"
 KRAUS_mult.4.t:0 "多瑙河通航"
 KRAUS_mult.4.d:0 "第一支联合船队在清晨离开林茨，驳船上装着机床、轴承和巴纳特的小麦。船队经过维也纳、布拉迪斯拉发和布达佩斯，在铁门峡前没有停下来卸货减载。\n\n二十年来，这条河上有过七套关税、四种航行规则和数不清的浅滩。如今它们大多已经不在了。沿岸各城的商会给维也纳发来了贺电，码头上的工人则更关心下一班船什么时候到。"
 KRAUS_mult.4.a:0 "让船开下去。"
 KRAUS_mult_evt_verdict:0 "司法宫的判决"
 KRAUS_mult_evt_verdict_desc:0 "各部的规矩须经得起宪章的检验。"
 KRAUS_mult_evt_danube:0 "多瑙河通航"
 KRAUS_mult_evt_danube_desc:0 "从林茨到黑海，船队可以一路直达。"
 # --- 10-27 联邦行政化：消解与消除之后 ---
 KRAUS_mult.5.t:0 "邦议会的第一次会议"
 KRAUS_mult.5.d:0 "各邦的议会都在同一个星期召开了第一次会议，议程上的第一项也都一样：会议记录用什么语言。\n\n内政部的意见很简单：用德语记录，再由各邦自行翻译，这样维也纳的部里看得懂，公文也走得快。各邦的议员则认为，既然联邦承认各民族一律平等，邦议会就该用本邦的语言记录，德语译本可以另附。\n\n两种办法都行得通，只是花钱的地方不一样。"
 KRAUS_mult.5.a:0 "以德语为记录语言。"
 KRAUS_mult.5.b:0 "各邦用本邦的语言记录。"
 KRAUS_fed_lang_german:0 "德语记录"
 KRAUS_fed_lang_german_desc:0 "公文走得快，各邦的议员却不太满意。"
 KRAUS_fed_lang_many:0 "多语记录"
 KRAUS_fed_lang_many_desc:0 "各邦的议员满意了，维也纳的翻译科则多了一倍的活。"
