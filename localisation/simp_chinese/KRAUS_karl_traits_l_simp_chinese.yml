l_simp_chinese:
 KRAUS_karl_tomorrow:0 "普世帝国之父"
 KRAUS_karl_tomorrow_desc:0 "危机之后，卡尔不再只是某一个民族的皇帝，而成了所有民族共同的父亲。"
 KRAUS_karl_federal_monarch:0 "联邦的君主"
 KRAUS_karl_federal_monarch_desc:0 "一个坐在联邦之上的皇帝，把各民族的平等写进了自己的头衔。"
 KRAUS_karl_apostolic_monarch:0 "使徒君主"
 KRAUS_karl_apostolic_monarch_desc:0 "皇冠与祭坛之间只隔着一条街，卡尔把它走成了自己的路。"
 KRAUS_karl_pan_european:0 "泛欧洲的皇帝"
 KRAUS_karl_pan_european_desc:0 "多瑙河的王座也许只是一个更大的议会的雏形，皇帝愿意做第一位议长。"
 KRAUS_karl_merchant_emperor:0 "中欧的皇帝"
 KRAUS_karl_merchant_emperor_desc:0 "交易所的钟声与教堂的钟声同时响起，皇帝在二者之间签字。"
