l_simp_chinese:
 KRAUS_pol_aid.1.t:0 "华沙的共和派"
 KRAUS_pol_aid.1.d:0 "波兰的大选还没有结束，克拉科夫与伦贝格的银行家开始往华沙送钱。共和派的编辑部缺纸，议员的竞选缺车，缺的东西不多，但每一样都要钱。\n\n伦贝格的波兰人团体带来一份清单。"
 KRAUS_pol_aid.1.a:0 "通过加利西亚的银行，资助共和派的报纸与竞选。"
 KRAUS_pol_aid.1.b:0 "除了钱，再派一批顾问，帮共和派组织议会党团。"
 KRAUS_pol_aid.1.c:0 "华沙的事，让华沙人自己去办。"
 KRAUS_pol_aid.2.t:0 "第二批资助"
 KRAUS_pol_aid.2.d:0 "两个月过去，华沙的共和派在议会里多了几个席位，但选举还没结束。克拉科夫的银行家问：还要不要再追加一笔？"
 KRAUS_pol_aid.2.a:0 "再追加一笔。"
 KRAUS_pol_aid.2.b:0 "到此为止。"
 KRAUS_pol_aid_a_tt:0 "§Y波兰共和派§!的影响力上升。"
 KRAUS_pol_aid_b_tt:0 "§Y波兰共和派§!的影响力大幅上升，§Y奥地利§!在波兰的影响力也上升。"
