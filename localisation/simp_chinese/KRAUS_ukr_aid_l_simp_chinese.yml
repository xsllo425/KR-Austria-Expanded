l_simp_chinese:
 KRAUS_ukr_aid.1.t:0 "基辅的枪声"
 KRAUS_ukr_aid.1.d:0 "乌克兰内战爆发了。利沃夫的乌克兰人团体连夜给维也纳送来一封信：愿意出钱、出人，只缺一个肯出面的人。\n\n美泉宫的书房里，哈布斯堡的亲王正在看地图。基辅离他不过几个站台的路程。"
 KRAUS_ukr_aid.1.a:0 "通过利沃夫的乌克兰人团体，资助共和派。"
 KRAUS_ukr_aid.1.b:0 "让亲王亲自去基辅，参加起义。"
 KRAUS_ukr_aid.1.c:0 "这是他们自己的事。"
 KRAUS_ukr_aid.2.t:0 "第二批援助"
 KRAUS_ukr_aid.2.d:0 "两个月过去，战局胶着。利沃夫的团体又送来了账目与请求：再多一点，共和派就能把战线推过第聂伯河。"
 KRAUS_ukr_aid.2.a:0 "再给一批。"
 KRAUS_ukr_aid.2.b:0 "到此为止。"
 KRAUS_ukr_aid_a_tt:0 "§Y乌克兰共和派§!获得政治点数与指挥点数，在内战中的力量增强。"
 KRAUS_ukr_aid_b_tt:0 "哈布斯堡亲王亲赴起义：§Y乌克兰共和派§!获得更多政治点数与指挥点数，力量大幅增强；奥地利稳定度略降。"
