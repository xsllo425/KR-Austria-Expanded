l_simp_chinese:
 KRAUS_echo.1.t:0 "不重演 1848"
 KRAUS_echo.1.d:0 "布达佩斯的枪声已经停了。奥地利的将军们在地图前沉默，因为这一次，谁也不想再把 1848 年的错误重写一遍。\n\n宫廷里有三种声音：有人说，王冠领的忠诚只能靠宽容换回；有人说，叛乱分子必须付出代价，让后人记住；也有人说，圣斯蒂芬王冠本身就是祸根，不如把它裂成几块。"
 KRAUS_echo.1.a:0 "宽容：释放完整的匈牙利王冠领。"
 KRAUS_echo.1.b:0 "严惩：不再释放匈牙利，核心州受到处置。"
 KRAUS_echo.1.c:0 "裂解圣斯蒂芬王冠。"
 KRAUS_echo.1.d_opt:0 "此事已无可再议。"
 KRAUS_echo_lenient_tt:0 "释放完整的匈牙利王冠领（若匈牙利已是附庸则设为王冠领），忠诚推一档。"
 KRAUS_echo_harsh_tt:0 "不再释放匈牙利。匈牙利核心州顺从度 -10，抵抗度 +8，并启用按顺从度造核（顺从度达到 50 后成为奥地利核心）。"
 KRAUS_echo_split_tt:0 "斯洛伐克与特兰西瓦尼亚各自成为王冠领，匈牙利独立成为王冠领；南部平原（伏伊伏丁那）划给伊利里亚，外喀尔巴阡划给加利西亚，多瑙平原划给斯洛伐克。"
