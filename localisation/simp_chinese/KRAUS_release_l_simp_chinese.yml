l_simp_chinese:
 KRAUS_release_SLO:0 "释放斯洛伐克"
 KRAUS_release_SLO_desc:0 "匈牙利已经并入帝国，但斯洛伐克的州从来不属于布达佩斯。把它们重新设为王冠领，是承认事实，也是一个交代。"
 KRAUS_release_TRS:0 "释放特兰西瓦尼亚"
 KRAUS_release_TRS_desc:0 "特兰西瓦尼亚的罗马尼亚人、萨克森人与马扎尔人，在匈牙利的旗下从未真正安心。让他们拥有自己的王冠领，比让他们永远等待要便宜。"
 KRAUS_release_HUN:0 "重设匈牙利王冠领"
 KRAUS_release_HUN_desc:0 "叛乱已经平息，匈牙利本部不再需要驻军，需要的是一个能被接受的名分。放它回到王冠领的位置，是重建的最后一步。"
 KRAUS_release_SLO_tt:0 "斯洛伐克成为§Y王冠领§!，从中立档起步。"
 KRAUS_release_TRS_tt:0 "特兰西瓦尼亚成为§Y王冠领§!，从中立档起步。"
 KRAUS_release_HUN_tt:0 "匈牙利成为§Y王冠领§!，从中立档起步。"
 KRAUS_release_hun_last_tt:0 "斯洛伐克与特兰西瓦尼亚已经释放（或没有对应的州）"
 KRAUS_rel_events.1.t:0 "释放期已过"
 KRAUS_rel_events.1.d:0 "一年过去了，被吞并的匈牙利，其斯洛伐克、特兰西瓦尼亚与匈牙利本部的名分，一直悬在议会的桌子上。\n\n没有放完的，不会因为沉默而得到谅解。各王冠领的议员在走廊里交换着眼色：既然维也纳不给我们名分，我们也不必给它面子。"
 KRAUS_rel_events.1.a:0 "他们不会忘记的。"
 KRAUS_rel_events.2.t:0 "王冠领叛乱"
 KRAUS_rel_events.2.d:0 "帝国同时在两条战线上与列强作战，而王冠领仍然对维也纳心怀不满。电报从布拉格、伦贝格与萨格勒布同时传来：代表们已经退出了议会。\n\n他们说，这不是背叛，是讨还一个迟到的名分。"
 KRAUS_rel_events.2.a:0 "帝国陷入了最坏的时刻。"
 KRAUS_rel_events.3.t:0 "独立宣言"
 KRAUS_rel_events.3.d:0 "我们不再向维也纳缴纳一克朗，也不再向它派一名新兵。"
 KRAUS_rel_events.3.a:0 "以我们自己的名义。"
 KRAUS_election2.1.t:0 "危机之后的议会"
 KRAUS_election2.1.d:0 "议会大厦的走廊里，议员们第一次不再围着那场危机说话。有人开始谈论预算，有人开始谈论学校，有人只是在谈论下一次选举。\n\n半个议会曾经对上一次选举的结果不满，那条裂缝正在被日子磨平。"
 KRAUS_election2.1.a:0 "裂缝在愈合。"
 KRAUS_election2.2.t:0 "第二次大选"
 KRAUS_election2.2.d_sd:0 "选票开出来了。社民党团拿下了最多的席位。维也纳的工人区敲了一夜的锅，从布拉格的维特科夫山到萨格勒布的码头，红旗插上了工会会所的屋顶。\n\n可工人的票不够组一个内阁。社民的领袖在霍夫堡门口对记者说：「帝国要的是一部大家都能签字的宪法，不是一面红旗。」当晚他坐上了另一位党团领袖的马车。\n\n§Y新内阁§!：[KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]\n\n新首相：§Y[KRAUS_pm_GetPremier]§!，同时是本党的党魁。国家元首仍然是卡尔皇帝。"
 KRAUS_election2.2.d_cs:0 "选票开出来了。基社党团拿下了最多的席位。阿尔卑斯山谷的堂区钟声在傍晚连敲了三遍，蒂罗尔的农民把选票结果抄在了教堂门口。\n\n可田野与祭坛撑不起整个帝国。基社的领袖在霍夫堡等了一个下午，才把内阁名单递上去，名单上不止一个党团的名字。\n\n§Y新内阁§!：[KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]\n\n新首相：§Y[KRAUS_pm_GetPremier]§!，同时是本党的党魁。国家元首仍然是卡尔皇帝。"
 KRAUS_election2.2.d_sl:0 "选票开出来了。自由民主联盟拿下了最多的席位。各民族的报纸第一次用同一个标题报道同一个结果，只是用了七种语言。\n\n市民与教授赢下了议会，却还要说服工人与农民。联盟的领袖说：「权利写下来才算数，而要写下来，得有足够多的人一起执笔。」\n\n§Y新内阁§!：[KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]\n\n新首相：§Y[KRAUS_pm_GetPremier]§!，同时是本党的党魁。国家元首仍然是卡尔皇帝。"
 KRAUS_election2.2.d_ml:0 "选票开出来了。民族自由党拿下了最多的席位。交易所的钟声在傍晚比平日晚响了五分钟，信贷银行的股价在开盘前就涨了。\n\n可账本上的多数不等于议会里的多数。民族自由党的领袖在霍夫堡里说：「市场需要秩序，秩序需要盟友。」第二天，内阁名单登上了《新自由报》的头版。\n\n§Y新内阁§!：[KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]\n\n新首相：§Y[KRAUS_pm_GetPremier]§!，同时是本党的党魁。国家元首仍然是卡尔皇帝。"
 KRAUS_election2.2.d_other:0 "选票开出来了。没有一个党团拿到决定性的多数，政府仍由原来的联盟主持，议会里的争论还会继续下去。"
 KRAUS_election2.2.a:0 "帝国的选择。"
