l_simp_chinese:
 KRAUS_golden_danube_policy.1.t:0 "工程款从哪里来"
 KRAUS_golden_danube_policy.1.d:0 "伦纳政府要为金色多瑙河的第一批工程筹钱。合作银行愿意出资，但希望工程稳妥推进；工会愿意先垫付工资，条件是优先雇用会员。"
 KRAUS_golden_danube_policy.1.a:0 "交给合作银行。"
 KRAUS_golden_danube_policy.1.b:0 "让工会先垫付。"
 KRAUS_golden_danube_policy.2.t:0 "工业界的条件"
 KRAUS_golden_danube_policy.2.d:0 "波希米亚和维也纳的工业家愿意承接工程，但要求在规划中有发言权。拒绝他们，政府就只能自己出钱下订单。"
 KRAUS_golden_danube_policy.2.a:0 "请工业界参与规划。"
 KRAUS_golden_danube_policy.2.b:0 "政府直接下订单。"
 KRAUS_golden_danube_policy.3.t:0 "议会还是皇帝"
 KRAUS_golden_danube_policy.3.d:0 "工程预算引起争执。社民党主张交给议会审议，保守派则希望请皇帝出面仲裁，尽快了结。"
 KRAUS_golden_danube_policy.3.a:0 "交给议会审议。"
 KRAUS_golden_danube_policy.3.b:0 "请皇帝仲裁。"
 KRAUS_golden_danube_policy.4.t:0 "工程款从哪里来"
 KRAUS_golden_danube_policy.4.d:0 "米克拉斯政府要为第一批工程筹钱。教区互助社愿意担保，稳妥但见效慢；国家也可以统一发行建设公债，来钱快，却要背上债务。"
 KRAUS_golden_danube_policy.4.a:0 "依靠教区互助担保。"
 KRAUS_golden_danube_policy.4.b:0 "发行建设公债。"
 KRAUS_golden_danube_policy.5.t:0 "用工合同"
 KRAUS_golden_danube_policy.5.d:0 "工程开工前要定下用工办法：与地方工会和雇主签协议，优先雇用本地人；或者由中央统一合同、统一纪律。"
 KRAUS_golden_danube_policy.5.a:0 "签地方协议。"
 KRAUS_golden_danube_policy.5.b:0 "中央统一合同。"
 KRAUS_golden_danube_policy.6.t:0 "重建委员会的席位"
 KRAUS_golden_danube_policy.6.d:0 "社会伙伴重建委员会要确定首批代表。温和派希望多给工人席位，保守派则只接受经过认证的代表。"
 KRAUS_golden_danube_policy.6.a:0 "扩大工人代表。"
 KRAUS_golden_danube_policy.6.b:0 "只要认证代表。"
