l_simp_chinese:
 KRAUS_cl_dispute_tt:0 "请奥地利裁决这一纠纷。"
 KRAUS_dispute_backed_claim:0 "奥地利支持了王领的领土要求"
 KRAUS_dispute_status_quo:0 "奥地利维持了现状"
 KRAUS_dispute_arbitrated:0 "奥地利召开了仲裁会议"
 KRAUS_CZE_war_school:0 "维也纳战争学校的名额"
 KRAUS_CZE_kohout_manual:0 "科胡特的士兵手册"
 KRAUS_GAL_legion_tradition:0 "波兰军团的传统"
 KRAUS_CZE_tatra_trucks:0 "太脱拉的卡车"
 KRAUS_GAL_jagiellonian:0 "雅盖隆大学"
 KRAUS_cl_dispute.1.t:0 "斯洛伐克一带的运价之争"
 KRAUS_cl_dispute.1.d:0 "布拉格的工商会代表团来到美泉宫，抱怨匈牙利治下的铁路运价与过境税，让波希米亚的货物运不进斯洛伐克的市场。布达佩斯回应说，这是匈牙利王冠自己的税则。\n\n皇帝要在两边之间作出裁断。"
 KRAUS_cl_dispute.1.a:0 "运价应当向波希米亚的工商界倾斜。"
 KRAUS_cl_dispute.1.b:0 "维持现状，不必节外生枝。"
 KRAUS_cl_dispute.1.c:0 "召开仲裁会议，各方都坐下来谈。"
 KRAUS_cl_dispute.2.t:0 "农会与行会的收购价之争"
 KRAUS_cl_dispute.2.d:0 "伦贝格的鲁塞尼亚农会代表又一次提出：粮食收购价被行会压得太低，农民的收成都进了行会的账。布达佩斯对此一口回绝。\n\n皇帝要在两边之间作出裁断。"
 KRAUS_cl_dispute.2.a:0 "收购价应当按农会的主张调整。"
 KRAUS_cl_dispute.2.b:0 "维持现状，不必节外生枝。"
 KRAUS_cl_dispute.2.c:0 "召开仲裁会议，各方都坐下来谈。"
 KRAUS_CZE_path:0 "波希米亚的道路"
 KRAUS_CZE_path_desc:0 "圣瓦茨拉夫王冠下的土地，是帝国的铁匠铺：比尔森的炮、布尔诺的枪、利贝雷茨的钨。布拉格要决定，这座铁匠铺替谁打铁。"
 KRAUS_CZE_reopen_diet:0 "重开波希米亚议会"
 KRAUS_CZE_reopen_diet_desc:0 "1930 年以来，布拉格的议员们再没有投过一次票。现在是让议会重新开门的时候了。"
 KRAUS_CZE_tatra_trucks_desc:0 "科普日夫尼采的太脱拉厂是波希米亚唯一完全属于自己的军工企业。它造的卡车，能把步兵师变成摩托化师。"
 KRAUS_CZE_liberec_tungsten:0 "利贝雷茨的钨"
 KRAUS_CZE_liberec_tungsten_desc:0 "利贝雷茨的钨矿是帝国在王冠领里唯一的钨来源。"
 KRAUS_CZE_prague_brno_rail:0 "布拉格—布尔诺铁路"
 KRAUS_CZE_prague_brno_rail_desc:0 "波希米亚和摩拉维亚之间的货运，还要绕道维也纳。一条直通的铁路，能让两座工业城市连成一体。"
 KRAUS_CZE_sudeten_germans:0 "苏台德的德意志人"
 KRAUS_CZE_sudeten_germans_desc:0 "维也纳的谈判代表说过：「我们可以在波希米亚人-德意志人身上多下点功夫。」布拉格不能假装没听见。"
 KRAUS_CZE_loyal_officers:0 "忠于皇帝的军官团"
 KRAUS_CZE_loyal_officers_desc:0 "阿洛伊斯·波德海斯基在普雷斯堡的军官学员学校读书时，没人想到这个捷克农家子弟会进入帝国总参谋部。四十年后，他仍是布拉格最忠于皇帝的人。"
 KRAUS_CZE_war_school_desc:0 "比利、沃特鲁巴、科胡特，波希米亚最好的军官都是在维也纳战争学校学会当参谋的。给布拉格多留几个名额，帝国就多几个波希米亚的将军。"
 KRAUS_CZE_skoda_orders:0 "斯柯达的帝国订单"
 KRAUS_CZE_skoda_orders_desc:0 "比尔森的斯柯达厂靠维也纳的订单活过了黑色星期一。帝国的订单越多，斯柯达的董事们就越清楚自己该站在哪一边。"
 KRAUS_CZE_imperial_bohemia:0 "帝国的波希米亚"
 KRAUS_CZE_imperial_bohemia_desc:0 "布拉格城堡的旗杆上，黑黄旗与红白旗并排升起。老人们说，这让他们想起了大战以前的日子。"
 KRAUS_CZE_masaryk_course:0 "马萨里克的路线"
 KRAUS_CZE_masaryk_course_desc:0 "扬·马萨里克相信，波希米亚可以留在帝国之内，但它必须先是波希米亚人自己的国家。"
 KRAUS_CZE_kohout_manual_desc:0 "1933 年，博胡斯拉夫·科胡特为波希米亚地方防卫军写了一本新的士兵手册。他说：「要找德国人或者匈牙利人并向他们学习！同时我们也可以教他们！」"
 KRAUS_CZE_prague_officer_school:0 "布拉格军官学校"
 KRAUS_CZE_prague_officer_school_desc:0 "维克托·霍佩因为和捷克民族主义团体走得太近，一辈子只能留在地方防卫军里。布拉格要有自己的军官学校，不再让维也纳决定谁能当将军。"
 KRAUS_CZE_crown_of_wenceslas:0 "圣瓦茨拉夫王冠"
 KRAUS_CZE_crown_of_wenceslas_desc:0 "在布拉格的圣维特主教座堂里，圣瓦茨拉夫王冠被郑重地取出来，供人瞻仰。人们说，它属于波希米亚，不属于维也纳。"
 KRAUS_CZE_slovak_brothers:0 "斯洛伐克一带的运价"
 KRAUS_CZE_slovak_brothers_desc:0 "妥协谈判时，波希米亚的工商会就提过：匈牙利治下的铁路运价与过境税，让布拉格的货物进不了斯洛伐克的市场。布拉格要请皇帝来评这个理。"
 KRAUS_GAL_path:0 "加利西亚的道路"
 KRAUS_GAL_path_desc:0 "加利西亚有帝国唯一的油田，也有帝国最穷的农村；有波兰人，也有鲁塞尼亚人。被派来统治这里的卡尔·阿尔布雷希特大公，要替所有人找一条路。"
 KRAUS_GAL_boryslaw_oil:0 "鲍里斯拉夫的油田"
 KRAUS_GAL_boryslaw_oil_desc:0 "鲍里斯拉夫的油井是帝国在王冠领里唯一的石油来源，却没有一家像样的公司在经营。"
 KRAUS_GAL_eastern_farms:0 "东部农业省"
 KRAUS_GAL_eastern_farms_desc:0 "切尔诺维茨和苏恰瓦没有一座工厂，只有麦田和土路。"
 KRAUS_GAL_jagiellonian_desc:0 "克拉科夫的雅盖隆大学是中欧最古老的大学之一，乌拉姆这样的年轻人正在这里长大。"
 KRAUS_GAL_witos_peasants:0 "维托斯的农民"
 KRAUS_GAL_witos_peasants_desc:0 "副元首文岑蒂·维托斯是农民出身。他要维也纳给东部穷省修铁路、送化肥。"
 KRAUS_GAL_ruthenian_schools:0 "鲁塞尼亚人的学校"
 KRAUS_GAL_ruthenian_schools_desc:0 "妥协谈判时，维也纳只肯听波兰精英的，不肯听「鲁塞尼亚农民」的。彼得鲁舍维奇和列维茨基还在等一个答复。"
 KRAUS_GAL_habsburg_poles:0 "哈布斯堡的波兰人"
 KRAUS_GAL_habsburg_poles_desc:0 "卡尔·阿尔布雷希特生于伊斯特里亚的波拉，却比许多波兰人更像波兰人。他要证明，忠于皇帝和爱波兰并不冲突。"
 KRAUS_GAL_magnates:0 "权贵与王冠"
 KRAUS_GAL_magnates_desc:0 "阿尔弗雷德·波托茨基伯爵的庄园比一些公国还大。只要王冠保住他们的地产，加利西亚的大贵族就会保住王冠。"
 KRAUS_GAL_sapieha_blessing:0 "萨皮耶哈主教的祝福"
 KRAUS_GAL_sapieha_blessing_desc:0 "克拉科夫的亚当·萨皮耶哈主教在讲坛上为皇帝祈祷。在加利西亚，这比一百份公告都管用。"
 KRAUS_GAL_imperial_galicia:0 "帝国的加利西亚"
 KRAUS_GAL_imperial_galicia_desc:0 "伦贝格的总督府前，皇帝的画像挂回了原处。克拉科夫的报纸写道：加利西亚是帝国的一部分，不是谁的筹码。"
 KRAUS_GAL_sikorski_army:0 "西科尔斯基的人民军"
 KRAUS_GAL_sikorski_army_desc:0 "大战后，瓦迪斯瓦夫·西科尔斯基「拒绝为另一位德意志国王效力」，留在了加利西亚。他要一支现代化、摩托化的加利西亚军队。"
 KRAUS_GAL_legion_tradition_desc:0 "大战中，波兰军团从克拉科夫出发，去和俄国人作战。那些老兵现在都在加利西亚。"
 KRAUS_GAL_krakow_arms:0 "克拉科夫的军火"
 KRAUS_GAL_krakow_arms_desc:0 "塔尔努夫的机械厂能造火炮。加利西亚的军队，可以用加利西亚的炮。"
 KRAUS_GAL_polish_galicia:0 "波兰人的加利西亚"
 KRAUS_GAL_polish_galicia_desc:0 "克拉科夫的集市广场上，人们唱起了《波兰没有灭亡》。维也纳的官员们没有阻止。"
 KRAUS_GAL_transcarpathia:0 "农会与行会的收购价"
 KRAUS_GAL_transcarpathia_desc:0 "鲁塞尼亚的农会在妥协谈判上提醒过维也纳：粮食的收购价被行会压得太低，农民的收成都进了行会的账。伦贝格要请皇帝给个说法。"
 KRAUS_cl_treat.1.t:0 "王领议会的请愿"
 KRAUS_cl_treat.1.d:0 "[KRAUS_cl_target.GetName]的议会递来一份请愿书：要求本地的官员、法庭和学校使用本地语言，而不是德语。维也纳的官员们认为，这是在一点点拆掉帝国的行政。"
 KRAUS_cl_treat.1.a:0 "准许他们的请求。"
 KRAUS_cl_treat.1.b:0 "驳回请愿，解散这一届议会。"
 KRAUS_cl_treat_1_good:0 "奥地利善待了我们（王领议会的请愿）"
 KRAUS_cl_treat_1_bad:0 "奥地利亏待了我们（王领议会的请愿）"
 KRAUS_cl_treat.2.t:0 "拖欠的税款"
 KRAUS_cl_treat.2.d:0 "[KRAUS_cl_target.GetName]又一次没有按时把税款交到维也纳。地方官说，今年收成不好，工厂也在裁人。财政部说，帝国的账不能总是替别人垫。"
 KRAUS_cl_treat.2.a:0 "这次就免了吧。"
 KRAUS_cl_treat.2.b:0 "派税务官去，一分不少地收回来。"
 KRAUS_cl_treat_2_good:0 "奥地利善待了我们（拖欠的税款）"
 KRAUS_cl_treat_2_bad:0 "奥地利亏待了我们（拖欠的税款）"
 KRAUS_cl_treat.3.t:0 "共同陆军的征兵配额"
 KRAUS_cl_treat.3.d:0 "战争部要求[KRAUS_cl_target.GetName]按配额向共同陆军输送新兵。可当地的团队更愿意把自己的子弟留在本地的部队里，由说同一种语言的军官带。"
 KRAUS_cl_treat.3.a:0 "让他们留在本地的部队里。"
 KRAUS_cl_treat.3.b:0 "按配额征兵，一个都不能少。"
 KRAUS_cl_treat_3_good:0 "奥地利善待了我们（共同陆军的征兵配额）"
 KRAUS_cl_treat_3_bad:0 "奥地利亏待了我们（共同陆军的征兵配额）"
 KRAUS_cl_treat.4.t:0 "工厂搬迁"
 KRAUS_cl_treat.4.d:0 "一家维也纳的企业想把[KRAUS_cl_target.GetName]的一座工厂整个搬回本部：那里的工人便宜，可维也纳的工人更需要工作。当地人则说，帝国应该在这里多建工厂，而不是拆走。"
 KRAUS_cl_treat.4.a:0 "由帝国出资，在当地再建一座。"
 KRAUS_cl_treat.4.b:0 "把工厂搬回本部。"
 KRAUS_cl_treat_4_good:0 "奥地利善待了我们（工厂搬迁）"
 KRAUS_cl_treat_4_bad:0 "奥地利亏待了我们（工厂搬迁）"
 KRAUS_cl_treat.5.t:0 "谁来带兵"
 KRAUS_cl_treat.5.d:0 "[KRAUS_cl_target.GetName]地方部队的一个师长位置空了出来。战争部推荐了一位维也纳的参谋军官，当地则推荐了在本地部队里干了二十年的老团长。"
 KRAUS_cl_treat.5.a:0 "让本地的老团长升上来。"
 KRAUS_cl_treat.5.b:0 "派维也纳的参谋军官去。"
 KRAUS_cl_treat_5_good:0 "奥地利善待了我们（谁来带兵）"
 KRAUS_cl_treat_5_bad:0 "奥地利亏待了我们（谁来带兵）"
 KRAUS_cl_treat.6.t:0 "街头的骚乱"
 KRAUS_cl_treat.6.d:0 "[KRAUS_cl_target.GetName]首府的街头爆发了骚乱：一块只用德语书写的路牌被人砸了，接着是一家报馆，然后是警察局的窗户。"
 KRAUS_cl_treat.6.a:0 "派人去谈，答应换成双语路牌。"
 KRAUS_cl_treat.6.b:0 "派宪兵去，恢复秩序。"
 KRAUS_cl_treat_6_good:0 "奥地利善待了我们（街头的骚乱）"
 KRAUS_cl_treat_6_bad:0 "奥地利亏待了我们（街头的骚乱）"
 KRAUS_CRO_mountain_training:0 "德拉戈伊洛夫的山地训练"
 KRAUS_CRO_illyrian_academy:0 "伊利里亚科学院"
 KRAUS_HUN_ludovika:0 "路德维卡学院"
 KRAUS_trs_magyarization:0 "马扎尔化"
 KRAUS_trs_secured_tt:0 "罗马尼亚在§Y特兰西瓦尼亚§!的秘密起义准备将被破获：准备工作作废，起义计数归零，各州的抵抗运动平息。"
 KRAUS_trs_events.1.t:0 "起义网络被破获"
 KRAUS_trs_events.1.d:0 "特兰西瓦尼亚传来坏消息：我们资助的分离分子一个接一个被宪兵抓走，藏在山村里的步枪被搜了出来，联络人的名单落到了对方手里。几年的准备，一夜之间化为乌有。"
 KRAUS_trs_events.1.a:0 "该死。"
 KRAUS_trs_events.2.t:0 "特兰西瓦尼亚的阴谋"
 KRAUS_trs_events.2.d:0 "宪兵在特兰西瓦尼亚的山村里破获了一个罗马尼亚人资助的起义网络：步枪、传单、联络人名单，全都摆在了桌上。布加勒斯特的计划落空了。"
 KRAUS_trs_events.2.a:0 "特兰西瓦尼亚安全了。"
 KRAUS_cl_dispute.3.t:0 "河运使用费之争"
 KRAUS_cl_dispute.3.d:0 "萨格勒布的商会请求皇帝出面：多瑙河与萨瓦河的使用费由匈牙利单方面决定，伊利里亚的货船要多付一半。布达佩斯的回答很简单：不改。\n\n皇帝要在两边之间作出裁断。"
 KRAUS_cl_dispute.3.a:0 "使用费应当按伊利里亚的主张重订。"
 KRAUS_cl_dispute.3.b:0 "维持现状，不必节外生枝。"
 KRAUS_cl_dispute.3.c:0 "召开仲裁会议，各方都坐下来谈。"
 KRAUS_cl_dispute.4.t:0 "债务清偿之争"
 KRAUS_cl_dispute.4.d:0 "布达佩斯的代表团要求皇帝重议斯拉沃尼亚的债务清偿：1926 年的安排让匈牙利的债权人一分钱也拿不回。萨格勒布则说，那些债务本来就是伊利里亚的地方债。\n\n皇帝要在两边之间作出裁断。"
 KRAUS_cl_dispute.4.a:0 "债务应当按匈牙利的主张清偿。"
 KRAUS_cl_dispute.4.b:0 "维持现状，不必节外生枝。"
 KRAUS_cl_dispute.4.c:0 "召开仲裁会议，各方都坐下来谈。"
 KRAUS_CRO_path:0 "伊利里亚的道路"
 KRAUS_CRO_path_desc:0 "伊利里亚三元王国是 1926 年在南部斯拉夫人起义与德国干涉中建立的。它由忠于维也纳的贵族和军官缔造，却也要求更多的自主，要求结束匈牙利人在南斯拉夫地区的统治。"
 KRAUS_CRO_unity_road:0 "团结公路"
 KRAUS_CRO_unity_road_desc:0 "首相的议案要修一条路，把萨格勒布、萨拉热窝连起来。有了来自奥地利的补贴，就能雇到足够的工人，也能让许多地方的失业问题缓一缓。"
 KRAUS_CRO_dalmatian_bauxite:0 "达尔马提亚的铝土"
 KRAUS_CRO_dalmatian_bauxite_desc:0 "达尔马提亚的山里埋着帝国第二多的铝土，却没有一家像样的公司去开采。"
 KRAUS_CRO_illyrian_academy_desc:0 "这家 1842 年创立的出版社，任务是确立统一的伊利里亚语言标准。现在它要成为王国的科学院。"
 KRAUS_CRO_rijeka_yard:0 "阜姆的船坞"
 KRAUS_CRO_rijeka_yard_desc:0 "阜姆有全帝国王冠领里唯一的船坞。伊利里亚有九座海军基地，却没有一艘自己的船。"
 KRAUS_CRO_two_scripts:0 "一个伊利里亚，两种文字"
 KRAUS_CRO_two_scripts_desc:0 "王国六成是克罗地亚人，三成是塞尔维亚人。一种用拉丁字母，一种用西里尔字母；伊利里亚要学会同时用两种文字写字。"
 KRAUS_CRO_emperors_illyria:0 "皇帝的伊利里亚"
 KRAUS_CRO_emperors_illyria_desc:0 "1926 年，克罗地亚的贵族和帝国的军官在皇帝面前宣誓效忠，换来了这个王国。他们没有忘记，是维也纳替他们挡住了布达佩斯。"
 KRAUS_CRO_croat_serb_coalition:0 "克罗地亚-塞尔维亚联盟"
 KRAUS_CRO_croat_serb_coalition_desc:0 "克塞联盟拿到了 23% 的选票。它亲近维也纳，却不排斥塞尔维亚人：这是伊利里亚最务实的一条路。"
 KRAUS_CRO_stepinac_church:0 "斯泰皮纳茨的教会"
 KRAUS_CRO_stepinac_church_desc:0 "阿洛伊修斯·斯泰皮纳茨在萨格勒布的讲坛上为皇帝祈祷。天主教会是伊利里亚与维也纳之间最结实的一根线。"
 KRAUS_CRO_imperial_illyria:0 "帝国的伊利里亚"
 KRAUS_CRO_imperial_illyria_desc:0 "阜姆港里，帝国海军的旗舰升起了伊利里亚的旗帜。码头上的人说，这片海终于又是帝国的海了。"
 KRAUS_CRO_radic_peasants:0 "拉迪奇的农民党"
 KRAUS_CRO_radic_peasants_desc:0 "斯捷潘·拉迪奇的克罗地亚人民农民党是王国最大的党。农民们不在乎维也纳和布达佩斯怎么吵，他们只要自己的土地和自己的议会。"
 KRAUS_CRO_croatian_command:0 "克罗地亚军官团"
 KRAUS_CRO_croatian_command_desc:0 "「我们必须把军官职位限制为仅有克罗地亚人担任。」斯拉夫科·克瓦特尼克的做法在防卫军里引起了很大的摩擦，但军队从此只听萨格勒布的。"
 KRAUS_CRO_dragojlov_mountaineers:0 "德拉戈伊洛夫的山地部队"
 KRAUS_CRO_dragojlov_mountaineers_desc:0 "费多尔·德拉戈伊洛夫专注于山地战的训练。在迪纳拉山脉里，伊利里亚的山地步兵能拖住任何一支来犯的军队。"
 KRAUS_CRO_south_slav_autonomy:0 "南斯拉夫人的自主"
 KRAUS_CRO_south_slav_autonomy_desc:0 "萨格勒布的议会大厅里，议员们第一次只用克罗地亚语和塞尔维亚语辩论。没有人提到维也纳，也没有人提到布达佩斯。"
 KRAUS_CRO_backa:0 "河运使用费"
 KRAUS_CRO_backa_desc:0 "多瑙河与萨瓦河的使用费由匈牙利单方面决定，伊利里亚的货船要多付一半。妥协谈判时，萨格勒布的商会提过这件事，现在要请皇帝来评理。"
 KRAUS_HUN_path:0 "圣斯蒂芬王冠的道路"
 KRAUS_HUN_path_desc:0 "匈牙利不是王冠领，它是帝国的另一半。1867 年的妥协让布达佩斯拥有自己的议会和内政，可卡尔皇帝的改革只在莱塔河这边推行下去，到了那边就被匈牙利贵族挡了回来。"
 KRAUS_HUN_transdanubian_bauxite:0 "外多瑙的铝土"
 KRAUS_HUN_transdanubian_bauxite_desc:0 "外多瑙的铝土矿占了帝国的一大半，此外还有煤，以及全帝国唯一的一处油井。"
 KRAUS_HUN_alfold_granary:0 "大平原的粮仓"
 KRAUS_HUN_alfold_granary_desc:0 "大平原上住着两百八十万人，种着帝国的小麦。"
 KRAUS_HUN_budapest_factories:0 "布达佩斯的工厂"
 KRAUS_HUN_budapest_factories_desc:0 "匈牙利有 25 座民用工厂、10 座军用工厂，是王冠领里最大的工业。它也是帝国共同财政最大的欠缴方。"
 KRAUS_HUN_ludovika_desc:0 "路德维卡学院培养了匈牙利几乎所有的军官。新教徒院长亚尼一心削弱天主教在学院里的主导地位，修了一座路德宗的小教堂。"
 KRAUS_HUN_mountain_hunters:0 "山地猎兵"
 KRAUS_HUN_mountain_hunters_desc:0 "喀尔巴阡山的山地猎兵是匈牙利防卫军里最好的部队。"
 KRAUS_HUN_joseph_august:0 "约瑟夫·奥古斯特大公"
 KRAUS_HUN_joseph_august_desc:0 "大公 1902 年转入匈牙利王家地方防卫军，从此身心都与匈牙利王国绑在了一起。大战以来，他一直是连接帝国和匈牙利的纽带。"
 KRAUS_HUN_pay_the_quota:0 "偿付共同财政"
 KRAUS_HUN_pay_the_quota_desc:0 "多瑙河危机已经了结。布达佩斯终于把拖欠了十年的那一份税，交到了共同大臣会议的金库里。"
 KRAUS_HUN_imperial_gendarmes:0 "帝国宪兵进驻特兰西瓦尼亚"
 KRAUS_HUN_imperial_gendarmes_desc:0 "罗马尼亚人的特工在特兰西瓦尼亚的山村里散发传单、藏匿步枪。布达佩斯请来了帝国宪兵，一个村子一个村子地搜。"
 KRAUS_HUN_imperial_hungary:0 "帝国的匈牙利"
 KRAUS_HUN_imperial_hungary_desc:0 "布达城堡里，皇帝以匈牙利国王的身份主持了国会开幕。两个王冠，一个君主。"
 KRAUS_HUN_tradition_1848:0 "1848 年的传统"
 KRAUS_HUN_tradition_1848_desc:0 "执政的「48年独立党」以 1848 年的革命命名。巴尔多希·拉斯洛和他的党，从来不接受维也纳的主宰。"
 KRAUS_HUN_magyarization:0 "马扎尔化"
 KRAUS_HUN_magyarization_desc:0 "布达佩斯不需要帝国宪兵。匈牙利的宪兵自己会去特兰西瓦尼亚，罗马尼亚人的学校和报馆一并关掉。"
 KRAUS_HUN_honved:0 "王家防卫军"
 KRAUS_HUN_honved_desc:0 "匈牙利王家地方防卫军从来就不完全是共同陆军的一部分。现在它要成为匈牙利自己的军队。"
 KRAUS_HUN_crown_autonomy:0 "圣斯蒂芬王冠的自主"
 KRAUS_HUN_crown_autonomy_desc:0 "布达佩斯的国会大厦前，人们唱起了《召唤》。维也纳的旗帜一面也没有。"
 KRAUS_HUN_croatia_slavonia:0 "债务清偿"
 KRAUS_HUN_croatia_slavonia_desc:0 "1926 年的安排让匈牙利的债权人在斯拉沃尼亚一分钱也拿不回。布达佩斯要求重议债务清偿，请皇帝出面。"
 KRAUS_found_SLO:0 "设立斯洛伐克王冠领"
 KRAUS_found_SLO_desc:0 "妥协谈判时，波希米亚代表团就提过：匈牙利治下的斯洛伐克人没有任何自治权。斯洛伐克人的政府早已组好，只差一片土地。"
 KRAUS_found_TRS:0 "设立特兰西瓦尼亚王冠领"
 KRAUS_found_TRS_desc:0 "特兰西瓦尼亚大公国曾经直属哈布斯堡王冠，1867 年才被并入匈牙利。把它从布达佩斯手里拿回来，交给一个直属维也纳的特兰西瓦尼亚政府。"
 KRAUS_found_cond_tt:0 "奥地利在多瑙河危机的战争中打赢了匈牙利，§Y或者§!匈牙利处于§Y王冠领地位：忠诚 II§!或更高"
 KRAUS_found_SLO_tt:0 "匈牙利手里带§Y斯洛伐克§!核心的州（加利西亚有核心的除外）划出，设立§Y斯洛伐克王冠领§!。"
 KRAUS_found_TRS_tt:0 "匈牙利手里带§Y特兰西瓦尼亚§!核心的州划出，设立§Y特兰西瓦尼亚王冠领§!。罗马尼亚的起义目标随之从匈牙利变为特兰西瓦尼亚。"
 KRAUS_cl_dispute.10.t:0 "王领之间暂时无事"
 KRAUS_cl_dispute.10.d:0 "再妥协的谈判与多瑙河的危机尚未了结。各王冠领地都在等维也纳与布达佩斯给出结论，没有谁愿意在这个时候再挑起新的争执，已经点下的那几条纠纷国策也被各自搁置。\n\n危机了结之后，运价、收购价、使用费与债务清偿的旧账，才会再被提到皇帝面前。"
 KRAUS_cl_dispute.10.a:0 "先把眼前的事办完。"
 KRAUS_cl_dispute_pause_tt:0 "再妥协与多瑙河危机期间，王冠领地之间的纠纷国策不可选择，了结之后恢复。"
