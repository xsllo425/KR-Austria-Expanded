 KRAUS_fix16.1.t:0 "火药桶熄灭了"
 KRAUS_fix16.1.d:0 "索非亚的胜利没有变成新一轮的复仇，也没有落到哪一方的怀里。志愿军团的旗帜撤下的时候，贝尔格莱德、布加勒斯特与雅典的外交官们第一次在同一张桌子上谈起了通商，而不是边界。维也纳的参谋们把巴尔干的红色图钉一枚枚拔了下来。"
 KRAUS_fix16.1.a:0 "半岛终于安静下来了。"
 KRAUS_fix16.2.t:0 "最后的九十天"
 KRAUS_fix16.2.d:0 "大战已经打响，巴尔干的旧账却还没有清完。总参谋部给它划了一道线：九十天之内必须有个了断，否则它就只能留给战争去处理。"
 KRAUS_fix16.2.a:0 "记在账上。"
