l_simp_chinese:
 KRAUS_miklas_recovery_1:0 "教区信贷网络"
 KRAUS_miklas_recovery_1_desc:0 "教区、互助社与储蓄机构连接储户与生产者，为恢复提供可靠融资。网络依赖地方信任与逐户记录，也要防止互助组织变成政府的征款机关。它能覆盖银行不愿去的乡村，却无法独自承担全部风险。信用网络肯干活，前提是各方都守规矩。"
 KRAUS_miklas_recovery_2:0 "公共工程招标"
 KRAUS_miklas_recovery_2_desc:0 "政府协调公共工程合同，让就业恢复与基础设施建设相互支持。招标公开进行，标书须列明工价、工期与本地用工比例，工程局负责监督。公开能减少私相授受，也会拖慢进度，还可能得罪习惯于内部安排的承包商。政府要在透明与效率之间选一个分寸。"
 KRAUS_miklas_recovery_3:0 "王冠领采购协定"
 KRAUS_miklas_recovery_3_desc:0 "本部企业希望获得稳定订单，王冠领的商人与地方代表则要求知道中央采购会给他们留下什么。米克拉斯提出把分散的需求接成采购协定：订单、供货和参加条件都应在签字前讲清楚。伙伴的同意不能由维也纳单方面宣布；地区整合以后，合同也不能随行政改变而失去效力。"
 KRAUS_miklas_recovery_4:0 "社会伙伴重建委员会"
 KRAUS_miklas_recovery_4_desc:0 "工程与采购已经把劳工、企业和地方机构联结起来，代表席位却仍有争议。小工会要求参与，雇主协会担心未经核验的名册，改革派不愿让社会伙伴只剩签字的权利。米克拉斯将这些争执交给重建委员会，通过共同议程和申诉渠道继续协商。它需要的是被各方接受的规则，而不是一个压过所有人的新权力。"
