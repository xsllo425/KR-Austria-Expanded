 KRAUS_cl_loyal_1:0 "王冠领地位：忠诚 I"
 KRAUS_cl_loyal_1_desc:0 "王领的精英把前途押在维也纳：他们的子弟进帝国的学校，他们的工厂接帝国的订单。整合它的代价越来越低。"
