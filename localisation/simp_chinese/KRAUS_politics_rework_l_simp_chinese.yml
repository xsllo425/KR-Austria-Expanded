 KRAUS_joint_econ_aus_dm_final:0 "多瑙河经济共同体"
 KRAUS_joint_econ_spirit_1:0 "多瑙河共同建设 I"
 KRAUS_joint_econ_spirit_1_desc:0 "维也纳牵头的共同经济纲要把铁路、矿山、研究机构与工厂一路铺进王冠领。每完成共同经济树里的一个国策，这份建设就深入一级，所有永久加成都累积在这一个精神上。"
