 KRAUS_root_ecr_gate_tt:0 "§Y黑色星期一§!的余波仍在。危机过去后，这最后一级会§G自动消除§!。"
 KRAUS_root_pol_gate_tt:0 "需要§Y皇权与秩序 ≥ 50§!。达到后，这最后一级会§G自动消除§!。"
 KRAUS_econ_eff_bonus_tt:0 "经济纲领：工厂产能增长 §G+5%§!"
 KRAUS_econ_start_bonus_tt:0 "经济纲领：工厂起始产能 §G+5%§!"
 KRAUS_bop_locked_tt:0 "§Y皇帝的天平§!就此固定，§R不能再调整§!。"
 KRAUS_renner_hegemony:0 "大帐篷执政"
 KRAUS_renner_hegemony_desc:0 "伦纳赢了。社会民主党与各民族的代表坐满了内阁，保守派的反对已不再能左右政局。工厂、学校和住房计划全速推进——而军官团只能接受一个不再优先考虑他们的帝国。"
 KRAUS_miklas_hegemony:0 "秩序政府"
 KRAUS_miklas_hegemony_desc:0 "米克拉斯赢了。基督教社会党和它的盟友掌握了每一个部，议会只剩下批准。军队得到了它想要的一切，百姓则学会了在更紧的预算里过日子。"
 KRAUS_root_events.1.t:0 "沉疴渐去"
 KRAUS_root_events.1.d:0 "多年来压在帝国身上的一道顽疾终于松动。报纸用了整整一版来写它，部长们却只在走廊里低声交换了一句：还有别的。"
 KRAUS_root_events.1.a:0 "一步一步来。"
 KRAUS_root_events.2.t:0 "王冠领地的和谐发展"
 KRAUS_root_events.2.d:0 "经济危机、军队的积弱、议会的动荡——三道裂缝都已弥合。维也纳与各王冠领第一次可以谈论共同的未来，而不只是共同的麻烦。"
 KRAUS_root_events.2.a:0 "帝国站稳了。"
 KRAUS_root_events.10.t:0 "皇权与秩序"
 KRAUS_root_events.10.d:0 "卡尔皇帝不写法律，也不领导任何一个党。他手里只有两样东西：哈布斯堡王朝六百年的威望，以及维也纳的主教座堂、各地教区与学校所维系的天主教秩序。\n\n这两样东西从来是一回事。皇冠的威望让各民族的代表愿意坐到同一张桌边；教会与秩序则保证他们离开时，帝国还在原地。\n\n眼下，它们都已所剩不多。议会与街头对皇室的耐心正在耗尽，而每一项改革、每一次危机，都会让它再多一分或少一分。"
 KRAUS_root_events.10.a:0 "皇冠必须重新被尊重。"
 KRAUS_root_events.10.a_tt:0 "§Y皇权与秩序§!（0–100）决定一组持续加成，档位越高加成越多。\n推进国策、维持天平居中、熬过危机可以提高它；在§Y皇权与秩序§!决议中可以花掉它换取政治点数、稳定度和其他好处。\n它也是消除§Y政治动荡§!最后一级的条件（≥ 50）。"
 austria_election_events.101.a_tt:0 "获得民族精神§Y割裂的社会§!。"
 austria_election_events.102.a_tt:0 "获得民族精神§Y割裂的社会§!。"
 aus_economic_crisis_1h:0 "复苏乏力的地区经济"
 aus_economic_crisis_1h_desc:0 "大战后的奥地利经济一片废墟。工业产出崩溃，失业率飙升，国库几乎空虚。复苏需要大规模投资和结构性改革。"
 aus_economic_crisis_2h:0 "渐趋平衡的地区经济"
 aus_economic_crisis_2h_desc:0 "大战后的奥地利经济一片废墟。工业产出崩溃，失业率飙升，国库几乎空虚。复苏需要大规模投资和结构性改革。"
 aus_economic_crisis_3h:0 "接近均衡的帝国经济"
 aus_economic_crisis_3h_desc:0 "大战后的奥地利经济一片废墟。工业产出崩溃，失业率飙升，国库几乎空虚。复苏需要大规模投资和结构性改革。"
 aus_military_weakness_1h:0 "统而不和的帝国军队"
 aus_military_weakness_1h_desc:0 "曾经骄傲的奥匈军队如今只是昔日辉煌的影子。装备过时，士气低落，军官团因政治忠诚而非军事学说而分裂。"
 aus_military_weakness_2h:0 "统而不和的帝国军队"
 aus_military_weakness_2h_desc:0 "曾经骄傲的奥匈军队如今只是昔日辉煌的影子。装备过时，士气低落，军官团因政治忠诚而非军事学说而分裂。"
 aus_military_weakness_3h:0 "统而不和的帝国军队"
 aus_military_weakness_3h_desc:0 "曾经骄傲的奥匈军队如今只是昔日辉煌的影子。装备过时，士气低落，军官团因政治忠诚而非军事学说而分裂。"
 aus_political_instability_1h:0 "巴尔干火药桶"
 aus_political_instability_1h_desc:0 "政治派系正在撕裂奥地利。从保皇派到社会主义者，从民族主义者到分离主义者，无法达成共识。政府稳定性降至历史最低点。"
 aus_political_instability_2h:0 "巴尔干火药桶"
 aus_political_instability_2h_desc:0 "政治派系正在撕裂奥地利。从保皇派到社会主义者，从民族主义者到分离主义者，无法达成共识。政府稳定性降至历史最低点。"
 aus_political_instability_3h:0 "巴尔干火药桶"
 aus_political_instability_3h_desc:0 "政治派系正在撕裂奥地利。从保皇派到社会主义者，从民族主义者到分离主义者，无法达成共识。政府稳定性降至历史最低点。"
