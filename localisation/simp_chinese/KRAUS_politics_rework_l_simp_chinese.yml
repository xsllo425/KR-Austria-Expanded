 KRAUS_joint_mil_aus_dm:0 "帝国共同军队"
 KRAUS_joint_mil_spirit_1:0 "帝国共同军队 I"
 KRAUS_joint_mil_spirit_1_desc:0 "王冠领的部队按维也纳的条令整训，与帝国军队共用一套参谋、学校与装备。一支军队，多个民族。"
 KRAUS_joint_mil_spirit_2:0 "帝国共同军队 II"
 KRAUS_joint_mil_spirit_2_desc:0 "王冠领的部队按维也纳的条令整训，与帝国军队共用一套参谋、学校与装备。一支军队，多个民族。"
 KRAUS_joint_mil_spirit_3:0 "帝国共同军队 III"
 KRAUS_joint_mil_spirit_3_desc:0 "王冠领的部队按维也纳的条令整训，与帝国军队共用一套参谋、学校与装备。一支军队，多个民族。"
 KRAUS_joint_mil_spirit_4:0 "帝国共同军队 IV"
 KRAUS_joint_mil_spirit_4_desc:0 "王冠领的部队按维也纳的条令整训，与帝国军队共用一套参谋、学校与装备。一支军队，多个民族。"
 KRAUS_joint_mil_spirit_5:0 "帝国共同军队 V"
 KRAUS_joint_mil_spirit_5_desc:0 "王冠领的部队按维也纳的条令整训，与帝国军队共用一套参谋、学校与装备。一支军队，多个民族。"
 KRAUS_crownland_integration_category:0 "王冠领整合"
 KRAUS_crownland_integration_category_desc:0 "每个王冠领都可以整合进奥地利本部。整合的花费和天数取决于它的§Y王冠领地位§!：越忠诚越便宜，越自主越昂贵。\n\n整合后，它身上的「多瑙河共同建设」与「帝国共同军队」按级数转为奥地利的§Y整合利益§!，此后每 180 天还会带来一次利益。不整合的话，越自主的王领在奥地利共同树精神里算的份数越多。"
 KRAUS_integ_start_tt:0 "读条结束时，该王冠领将被整合进奥地利本部：奥地利获得其核心，其将领、科学家与顾问转入奥地利。"
 KRAUS_integ_dividend_tt:0 "§Y整合利益§!：该王冠领的「多瑙河共同建设」与「帝国共同军队」按级数转入奥地利的「统一的帝国行政」，忠诚 II 档以上额外 §G+50%§!。此后每 §Y180§! 天结算一次利益。"
 KRAUS_integ_dividend_dm:0 "统一的帝国行政"
 KRAUS_integ_dividend_dm_tt:0 "来自已整合王冠领的利益：每 1 份经济利益，工厂产出 §G+1%§!、研究速度 §G+0.5%§!；每 1 份军事利益，陆军组织度 §G+1%§!、可征兵人口 §G+0.5%§!。\n当前经济利益：§Y[?KRAUS_integ_div_econ|1]§! 份，军事利益：§Y[?KRAUS_integ_div_mil|1]§! 份"
 KRAUS_integ_boom_industry:0 "整合利益：工业景气"
 KRAUS_integ_boom_construction:0 "整合利益：建设热潮"
 KRAUS_joint_econ_aus_dm_tt:0 "每 1 份参与共同建设的王冠领：工厂产出 §G+2%§!，研究速度 §G+1%§!。普通王领计 1 份，自主 I、II、III 档的王领分别计 1.5、2、2.5 份。\n当前：§Y[?KRAUS_joint_members|0]§! 个王冠领，合计 §Y[?KRAUS_joint_shares|1]§! 份\n奥地利自己已完成的共同经济国策，其永久加成（消费品、建设速度、研究速度、资源产出、工厂产出等）也累积在这一个修正上。"
 KRAUS_joint_mil_aus_dm_tt:0 "每 1 份参与共同建设的王冠领：陆军组织度 §G+2%§!，可征兵人口 §G+1%§!，训练时间 §G-2%§!。普通王领计 1 份，自主 I、II、III 档的王领分别计 1.5、2、2.5 份。\n当前：§Y[?KRAUS_joint_members|0]§! 个王冠领，合计 §Y[?KRAUS_joint_shares|1]§! 份"
 KRAUS_cl_auto_3:0 "王冠领地位：自主 III"
 KRAUS_cl_auto_3_desc:0 "王领自己的议会、军官学校和财政越来越像一个国家。它是帝国更强的伙伴，也越来越难被整合。"
