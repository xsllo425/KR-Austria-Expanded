 KRAUS_integrate_CZE:0 "整合波希米亚"
 KRAUS_integrate_CZE_desc:0 "把波希米亚的行政、财政与军队并入奥地利本部，并获得核心；其将领、科学家与顾问转入奥地利。完成后将带着「地方的怨言」，红利按忠诚地位结算。"
 KRAUS_integ_dividend_CZE:0 "波希米亚的整合利益"
 KRAUS_integ_dividend_CZE_desc:0 "波希米亚并入本部后，每 180 天结算一次利益。"
 KRAUS_integ_tech_CZE:0 "波希米亚的工程师"
 KRAUS_integ_events.1.t:0 "波希米亚的整合利益"
 KRAUS_integ_events.1.d:0 "布拉格的工厂主们第一次把税交到维也纳的财政部，而不是布拉格的议会。账本换了封面，比尔森和布尔诺的烟囱照旧冒烟。"
 KRAUS_integ_events.1.a:0 "帝国的一本账。"
