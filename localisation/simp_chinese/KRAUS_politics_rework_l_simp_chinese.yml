 KRAUS_ia_need_20_tt:0 "需要§Y皇权与秩序 ≥ 20§!"
 KRAUS_ia_reform_endorsement:0 "请皇帝为改革背书"
 KRAUS_ia_reform_endorsement_desc:0 "伦纳需要的不是皇帝的权力，而是他的名字。只要霍夫堡出面为改革说一句话，保守派就很难再说这是在拆帝国的墙。"
 KRAUS_ia_dipl_powers:0 "皇室致意：[FROM.GetName]"
 KRAUS_ia_dipl_powers_desc:0 "哈布斯堡的外交从来不只靠大使馆。一封皇帝的亲笔信、一次王室成员的私人访问，往往比十份照会更管用——而每一次成功，都在提醒国内：皇冠仍然是帝国在世界上的门面。"
 KRAUS_ia_dipl_italy:0 "皇室致意：[FROM.GetName]"
 KRAUS_ia_dipl_italy_desc:0 "意大利半岛四分五裂，而哈布斯堡家族与其中每一个宫廷、每一位主教都有着几百年的往来。皇帝的问候在这里仍然有分量。"
 KRAUS_ia_dipl_balkans:0 "皇室致意：[FROM.GetName]"
 KRAUS_ia_dipl_balkans_desc:0 "贝尔格莱德条约之外的巴尔干国家，都在寻找一个能与之抗衡的靠山。维也纳愿意成为那个靠山。"
 KRAUS_ia_visit_prague:0 "驾临布拉格"
 KRAUS_ia_visit_prague_desc:0 "皇帝亲临布拉格城堡，在捷克议员面前用捷克语致辞。王冠领因皇帝而存在——政党在维也纳说了算，但在布拉格，人们仍然看皇帝的脸色。"
 KRAUS_ia_visit_lemberg:0 "驾临伦贝格"
 KRAUS_ia_visit_lemberg_desc:0 "皇帝访问伦贝格，接见波兰贵族与乌克兰教会的代表。在加利西亚，能让这两群人同处一室的，只有皇帝。"
 KRAUS_ia_visit_zagreb:0 "驾临萨格勒布"
 KRAUS_ia_visit_zagreb_desc:0 "皇帝前往萨格勒布，向伊利里亚议会重申王冠对南方各族的承诺。"
 KRAUS_unlock_visit_lemberg_tt:0 "解锁皇权与秩序决议§Y驾临伦贝格§!。"
 KRAUS_unlock_visit_zagreb_tt:0 "解锁皇权与秩序决议§Y驾临萨格勒布§!。"
 KRAUS_echo_1848:0 "1848的回响"
 KRAUS_echo_1848_desc:0 "1848 年，匈牙利人也曾举起过反旗，帝国靠刀剑和让步熬了过来，却从未真正回答他们的问题。这一次的危机已经过去，但问题仍然在那里：各民族凭什么留在同一顶王冠之下？"
 KRAUS_galicia_promise:0 "加利西亚的承诺"
 KRAUS_galicia_promise_desc:0 "加利西亚一直是帝国最穷的王领。维也纳许诺给它工厂、铁路与学校——这一次，许诺必须兑现。"
 KRAUS_adriatic_gate:0 "亚得里亚的门户"
 KRAUS_adriatic_gate_desc:0 "伊利里亚握着帝国通往大海的门户。把港口、道路和舰队与它绑在一起，它就再也离不开维也纳。"
 KRAUS_diet_reform:0 "帝国议会改革"
 KRAUS_diet_reform_desc:0 "旧的帝国议会是为一个已经不存在的帝国设计的。执政党要把它改造成真正能代表各王领的议会——按照自己的方式。"
 KRAUS_imperial_tour:0 "皇帝巡幸王冠领"
 KRAUS_imperial_tour_desc:0 "皇帝启程巡视所有王冠领。只有当皇冠足够有威望时，这样的巡行才会是一场凯旋，而不是一场笑话。"
 KRAUS_common_army_people:0 "共同的军队与人民"
 KRAUS_common_army_people_desc:0 "各王领的子弟编入同一支军队，在同一面旗帜下服役。军营成了帝国最有效的学校：在这里，捷克人、波兰人和克罗地亚人学会了同一种命令，也学会了彼此。"
 KRAUS_federal_charter:0 "哈布斯堡王冠领地联邦大宪章"
 KRAUS_federal_charter_desc:0 "经济危机、军队积弱、政坛动荡都已被克服，各王领都已安抚，议会已经改革。现在，帝国可以把这一切写进一部宪章：各民族在同一顶王冠下的权利与义务。"
 KRAUS_dc_resolved_tt:0 "多瑙河危机已经了结"
 KRAUS_political_line_done_tt:0 "政治线已经走完（§Y大帐篷稳住了§!或§Y社会伙伴重建委员会§!）"
 KRAUS_roots_solved_tt:0 "经济危机、军事弱势、政治动荡已全部消除"
 KRAUS_danube_crisis.1.t:0 "王冠领的回应"
 KRAUS_danube_crisis.1.d:0 "对匈牙利的战争已经开始。维也纳的电报发往各王冠领首府——现在要看看，之前争取来的承诺能兑现多少。"
 KRAUS_danube_crisis.1.a:0 "帝国不是孤军奋战。"
 KRAUS_dc_none_join_tt:0 "§R没有任何王领响应§!，我们将独自面对匈牙利。"
 KRAUS_root_events.30.t:0 "柏林伸出援手"
 KRAUS_root_events.30.d:0 "黑色星期一的冲击下，德国并没有袖手旁观。根据关税同盟的安排，德国的贷款与订单开始流入奥地利，帮助我们撑过最艰难的日子。只要危机还在，这笔援助就会持续。"
 KRAUS_root_events.30.a:0 "德国人是可靠的盟友。"
 KRAUS_root_events.31.t:0 "德奥经济共同体"
 KRAUS_root_events.31.d:0 "德奥经济共同体建立后，柏林把对奥地利的援助提高到了新的规模。"
 KRAUS_root_events.31.a:0 "共渡难关。"
 KRAUS_root_events.32.t:0 "援助结束"
 KRAUS_root_events.32.d:0 "黑色星期一的余波已经过去，德国的紧急援助也随之结束。接下来的路，奥地利要靠自己走。"
 KRAUS_root_events.32.a:0 "谢谢，柏林。"
 KRAUS_german_bm_aid_tt:0 "这项援助只在§Y黑色星期一§!期间存在，危机结束时自动取消。"
 KRAUS_german_bm_aid_1:0 "德国的紧急援助"
 KRAUS_german_bm_aid_1_desc:0 "德国贷款与订单帮助奥地利撑过黑色星期一。"
 KRAUS_german_bm_aid_2:0 "德奥共同应对危机"
 KRAUS_german_bm_aid_2_desc:0 "德奥经济共同体全力投入，与奥地利一同应对黑色星期一。"
 KRAUS_party_events.1.t:0 "新学校开学了"
 KRAUS_party_events.1.d:0 "维也纳郊区的新学校今天开学。社民党的市议员亲自给孩子们发了课本，第二天的报纸用了整整半版报道这件事。"
 KRAUS_party_events.1.a:0 "这才是我们该做的事。"
 KRAUS_party_buff_1:0 "公共福利的成效"
 KRAUS_party_buff_1_desc:0 "学校、医院与公园陆续落成，工人家庭第一次感到国家站在他们一边。"
 KRAUS_party_events.2.t:0 "自然之友的远足"
 KRAUS_party_events.2.d:0 "周末，成千上万的工人家庭乘火车进入阿尔卑斯山区远足。自然之友的营地里，人们唱着歌，谈论的不是工资，而是下一次去哪座山。"
 KRAUS_party_events.2.a:0 "让工人也拥有山川。"
 KRAUS_party_buff_2:0 "自然之友运动"
 KRAUS_party_buff_2_desc:0 "工人的闲暇有了去处，城市里的怨气少了，对政府的好感多了。"
 KRAUS_party_events.3.t:0 "维也纳在广播"
 KRAUS_party_events.3.d:0 "帝国广播网络开始覆盖所有王冠领。同一档节目用德语、捷克语和匈牙利语轮流播出，皇帝的新年致辞第一次传到了每一个村庄。"
 KRAUS_party_events.3.a:0 "帝国的声音。"
 KRAUS_party_buff_3:0 "帝国之声"
 KRAUS_party_buff_3_desc:0 "帝国广播让政府的话语传遍各地。"
 KRAUS_party_events.4.t:0 "跨越党派的握手"
 KRAUS_party_events.4.d:0 "基督教社会党与社民工党的领袖在议会走廊里握了手。双方都说这只是礼节，但第二天，几项搁置已久的法案就通过了。"
 KRAUS_party_events.4.a:0 "先把国家稳住。"
 KRAUS_party_buff_4:0 "跨党派共识"
 KRAUS_party_buff_4_desc:0 "两大党暂时搁置分歧，议会终于能做成事情了。"
 KRAUS_party_events.5.t:0 "乡村的感谢信"
 KRAUS_party_events.5.d:0 "下奥地利一个村庄的农民联名寄来一封感谢信，信里说补贴让他们熬过了最难的冬天。米克拉斯把它挂在了办公室的墙上。"
 KRAUS_party_events.5.a:0 "农民是国家的根基。"
 KRAUS_party_buff_5:0 "农民的支持"
 KRAUS_party_buff_5_desc:0 "乡村对政府的支持更加坚定，农家子弟也更愿意应征入伍。"
 KRAUS_party_events.6.t:0 "工厂门口的和解"
 KRAUS_party_events.6.d:0 "一家罢工三个月的工厂终于复工。厂主与工会代表在厂门口签下协议，围观的工人鼓起了掌。"
 KRAUS_party_events.6.a:0 "和解比对抗更难，也更值得。"
 KRAUS_party_buff_6:0 "社会和解"
 KRAUS_party_buff_6_desc:0 "劳资之间的紧张缓和下来，社会重新获得了一点耐心。"
 KRAUS_ia_gain_3_tt:0 "§Y皇权与秩序§! §G+3§!"
 KRAUS_ia_cost_3_tt:0 "§Y皇权与秩序§! §R-3§!"
 KRAUS_ia_cost_5_tt:0 "§Y皇权与秩序§! §R-5§!"
 KRAUS_ia_cost_10_tt:0 "§Y皇权与秩序§! §R-10§!"
 KRAUS_bop_pending_miklas_05_tt:0 "大选后，§Y皇帝的天平§!向§Y米克拉斯§!一侧移动 §Y5%§!"
 KRAUS_bop_pending_miklas_10_tt:0 "大选后，§Y皇帝的天平§!向§Y米克拉斯§!一侧移动 §Y10%§!"
 KRAUS_bop_pending_renner_05_tt:0 "大选后，§Y皇帝的天平§!向§Y伦纳§!一侧移动 §Y5%§!"
 KRAUS_bop_pending_renner_10_tt:0 "大选后，§Y皇帝的天平§!向§Y伦纳§!一侧移动 §Y10%§!"
 KRAUS_bm_present_tt_NOT:0 "黑色星期一已经结束"
 KRAUS_montage_upgrade_tt:0 "§Y奥地利阿尔卑斯矿业公司§!升级：民用工厂建设速度 §G+10%§! → §G+20%§!（雇用后生效）"
 KRAUS_austria_montage_2:0 "奥地利阿尔卑斯矿业公司"
 KRAUS_bm_recovered:0 "从黑色星期一中恢复过来"
 KRAUS_bm_recovered_desc:0 "最坏的日子过去了。工厂重新开工，订单回来了，人们开始相信明天会比今天好。"
 KRAUS_root_events.41.t:0 "四分五裂的王冠"
 KRAUS_root_events.41.d:0 "奥地利本部由议会和政党治理；波希米亚、加利西亚、伊利里亚和匈牙利各有自己的议会、自己的政府，还有对维也纳各不相同的怨气。把这些土地联结在一起的，既不是哪个政党，也不是哪部法律，而是同一位皇帝。\n\n卡尔皇帝不能下令，只能劝说；不能立法，只能仲裁。他的威望就是帝国的黏合剂——威望越高，各王领越愿意留下；威望耗尽，帝国就只剩下地图上的一条线。"
 KRAUS_root_events.41.a:0 "王冠的重量，由皇帝来扛。"
 KRAUS_root_events.40.t:0 "新兵宣誓"
 KRAUS_root_events.40.d:0 "在维也纳新城的阅兵场上，来自各王冠领的新兵用各自的语言宣誓效忠同一位皇帝。一位老军官说，他从 1914 年以后就没再见过这样的场面。"
 KRAUS_root_events.40.a:0 "一支军队，一个帝国。"
 KRAUS_cw_invite:0 "邀请王冠领共同投资"
 KRAUS_cw_invite_desc:0 "邀请各王冠领（包括匈牙利）加入共同投资计划。政治点数不少于 50 的王领一定会接受，7 天后答复。接受的王领每 90 天获得一次投资。多瑙河危机期间无法邀请。"
 KRAUS_cw_invite_tt:0 "政治点数 ≥ 50 的王冠领将接受邀请，§Y7 天§!后答复。"
 KRAUS_cw_program:0 "王冠领共同投资"
 KRAUS_cw_program_desc:0 "每 90 天，每个已加入的王冠领获得一项投资：军用工厂、民用工厂、基础设施或建筑位之一。之后自动开始下一轮。"
 KRAUS_cw_program_tt:0 "每个已加入的王冠领随机获得：§G1 座军用工厂§!、§G1 座民用工厂§!、§G1 级基础设施§!或§G1 个建筑位§!之一。"
 KRAUS_cw_program_start_tt:0 "开始§Y王冠领共同投资§!：每 90 天投资一轮，循环进行。"
 KRAUS_dc_ongoing_tt:0 "多瑙河危机正在进行"
 KRAUS_dc_hun_no_declare_tt:0 "战争期间，§Y匈牙利§!不能对其他国家宣战。"
 KRAUS_cw_events.1.t:0 "王冠领的答复"
 KRAUS_cw_events.1.d:0 "各王冠领首府的回电陆续送到了维也纳。"
 KRAUS_cw_events.1.a:0 "共同投资开始。"
 KRAUS_cw_events.1.b:0 "无人响应，下次再说。"
 KRAUS_cw_events.2.t:0 "投资暂停"
 KRAUS_cw_events.2.d:0 "多瑙河危机爆发，各王冠领的共同投资计划暂时搁置。危机结束后将自动恢复。"
 KRAUS_cw_events.2.a:0 "先应付眼前。"
 KRAUS_cw_events.3.t:0 "投资恢复"
 KRAUS_cw_events.3.d:0 "多瑙河危机已经过去，王冠领共同投资计划重新启动。"
 KRAUS_cw_events.3.a:0 "继续建设。"
 KRAUS_cw_events.4.t:0 "共同投资的遗产"
 KRAUS_cw_events.4.d:0 "王冠领已不复存在，但多年来共同投资留下的工厂、铁路与人才仍然留在帝国的土地上。"
 KRAUS_cw_events.4.a:0 "它们不会白费。"
 KRAUS_cw_legacy_1:0 "共同投资的遗产"
 KRAUS_cw_legacy_2:0 "共同投资的丰厚遗产"
 KRAUS_cw_legacy_3:0 "王冠领建设的丰碑"
 KRAUS_cw_legacy_1_desc:0 "多年来与各王冠领共同投资留下的工业与基础设施。"
 KRAUS_cw_legacy_2_desc:0 "多年来与各王冠领共同投资留下的工业与基础设施。"
 KRAUS_cw_legacy_3_desc:0 "多年来与各王冠领共同投资留下的工业与基础设施。"
 KRAUS_dc_release_tt:0 "§Y波希米亚、加利西亚、伊利里亚§!等王冠领宣布在这场冲突中§R独立并退出我们的阵营§!。只有被争取的王领，才会在开战时重新成为王冠领并与我们并肩作战。"
 KRAUS_military_lock_tt:0 "§R在统而不和的帝国军队降到第三级之前，我们无法招募部队、编辑编制或者解散部队。§!"
 KRAUS_military_lock_desc:0 "帝国军队尚未整合（统而不和的帝国军队降到第三级后解锁）"
 KRAUS_military_unlock_tt:0 "§G帝国军队完成整合：§!可以重新招募部队、编辑编制和解散部队。"
 KRAUS_danube_crisis.2.t:0 "清算"
 KRAUS_danube_crisis.2.d:0 "多瑙河危机已经了结。危机中宣布独立的王冠领被重新收归帝国。\n\n那些在战争中袖手旁观的王领将付出代价：他们的工厂被拆解，机器装上火车运往维也纳，以及那些与帝国并肩作战的王领。"
 KRAUS_danube_crisis.2.a:0 "忠诚有回报，背弃有代价。"
 KRAUS_dc_illyria_rally_tt:0 "§Y波希米亚§!与§Y加利西亚§!加入对匈牙利的战争。代价由§Y伊利里亚§!承担：每拉来一个王领，伊利里亚§R-75§!政治点数，并转交一座民用工厂给该王领。"
 KRAUS_joint_econ_gate_2_tt:0 "§Y第 2 级门槛§!：奥地利的经济危机已缓解至少 §Y3 层§!（第 2 级半或更好），且皇权与秩序至少 §Y25§!"
