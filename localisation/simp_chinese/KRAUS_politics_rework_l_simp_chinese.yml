 KRAUS_integ_tech_SLO:0 "斯洛伐克的工程师"
 KRAUS_integ_events.5.t:0 "斯洛伐克的整合利益"
 KRAUS_integ_events.5.d:0 "斯洛伐克的山区矿镇被并入帝国的统一行政，新修的公路一直通到了村口。"
 KRAUS_integ_events.5.a:0 "帝国的一本账。"
 KRAUS_integrate_TRS:0 "整合特兰西瓦尼亚"
 KRAUS_integrate_TRS_desc:0 "把特兰西瓦尼亚的行政、财政与军队并入奥地利本部，并获得核心；其将领、科学家与顾问转入奥地利。完成后将带着「地方的怨言」，红利按忠诚地位结算。"
 KRAUS_integ_dividend_TRS:0 "特兰西瓦尼亚的整合利益"
 KRAUS_integ_dividend_TRS_desc:0 "特兰西瓦尼亚并入本部后，每 180 天结算一次利益。"
 KRAUS_integ_tech_TRS:0 "特兰西瓦尼亚的工程师"
 KRAUS_integ_events.6.t:0 "特兰西瓦尼亚的整合利益"
 KRAUS_integ_events.6.d:0 "特兰西瓦尼亚的铝土与天然气，如今由帝国的统一行政直接调配。"
 KRAUS_integ_events.6.a:0 "帝国的一本账。"
 KRAUS_ia_need_95_tt:0 "需要§Y皇权与秩序 ≥ 95§!"
 KRAUS_je_institute:0 "帝国技术研究院"
 KRAUS_je_institute_desc:0 "维也纳、布拉格、布达佩斯与克拉科夫各有自己的工学院，各自为政多年。把它们并为帝国技术研究院，统一课题、统一经费，让每一个王冠领都有人坐在同一张绘图桌前。"
 KRAUS_je_works:0 "多瑙河运河与港口工程"
 KRAUS_je_works_desc:0 "从维也纳到黑海的航道一直没有跟上货运量。疏浚、筑堤、扩建港口，把王冠领的河流连成一张网，货物和人员才能在帝国之内自由流动。"
 KRAUS_je_resources:0 "油田与铝土矿特许"
 KRAUS_je_resources_desc:0 "维也纳盆地的油田与匈牙利的铝土矿一直由私人特许经营，产量也始终不高。收回特许权、统一经营，帝国才有属于自己的战略资源。"
 KRAUS_je_charter:0 "多瑙河经济共同体"
 KRAUS_je_charter_desc:0 "军工、研究、民用与资源四条线都走完之后，剩下的是把它们写进一份宪章：各王冠领的出资、分红与义务，从此不再是每年谈一次的交易，而是帝国财政的一部分。"
 KRAUS_je_institute_tb:0 "帝国技术研究院成果"
 KRAUS_flame_tank:0 "喷火坦克"
 KRAUS_flame_tank_desc:0 "要在碉堡与坑道里清除守军，机枪与火炮往往不够。一辆带着火焰喷射器的坦克，可以让步兵少死很多人。帝国的工兵与装甲兵联合设计了第一批喷火坦克，让它们和突击营一起上前线。"
 KRAUS_nuclear_tech:0 "核技术"
 KRAUS_nuclear_tech_desc:0 "火箭技术让我们能够把东西送到很远的地方，而维也纳与布拉格的物理学家早已知道，原子核里藏着更大的能量。把它列入帝国研究计划，是一场没有人知道终点的赌注。"
 KRAUS_jm_intel:0 "帝国情报网"
 KRAUS_jm_intel_desc:0 "共同军事线把各王冠领的无线电监听站与情报处连成一张网。"
 KRAUS_jm_war_ministry:0 "帝国陆军部改组"
 KRAUS_jm_war_ministry_desc:0 "维也纳的陆军部不再只是奥地利的陆军部，各王冠领的军官在这里共用一套指挥与补给的章程。"
 KRAUS_military_theorist_2:0 "军事理论家（学派）"
 KRAUS_military_theorist_2_tt:0 "军事理论家（学派）"
 KRAUS_armour_theorist_2:0 "装甲理论家（学派）"
 KRAUS_armour_theorist_2_tt:0 "装甲理论家（学派）"
 KRAUS_air_warfare_theorist_2:0 "空战理论家（学派）"
 KRAUS_air_warfare_theorist_2_tt:0 "空战理论家（学派）"
 KRAUS_victory_through_airpower_2:0 "决胜当量（学派）"
 KRAUS_victory_through_airpower_2_tt:0 "决胜当量（学派）"
 KRAUS_submarine_specialist_2:0 "潜艇专家（学派）"
 KRAUS_submarine_specialist_2_tt:0 "潜艇专家（学派）"
 KRAUS_naval_theorist_2:0 "海军理论家（学派）"
 KRAUS_naval_theorist_2_tt:0 "海军理论家（学派）"
 KR_military_theorist_tt:0 "军事理论家"
 KR_armour_theorist_tt:0 "装甲理论家"
 KR_air_warfare_theorist_tt:0 "空战理论家"
 KR_victory_through_airpower_tt:0 "决胜当量"
 KR_submarine_specialist_tt:0 "潜艇专家"
 KR_naval_theorist_tt:0 "海军理论家"
 KRAUS_war_college_1:0 "帝国陆军大学"
 KRAUS_war_college_1_desc:0 "玛利亚·特蕾莎军事学院的毕业生与总参谋部的教官在维也纳开办了一所面向各王冠领军官的陆军大学，课程、考试与任官资格都按同一套章程。"
 KRAUS_war_college_2:0 "帝国陆军大学 II"
 KRAUS_war_college_2_desc:0 "陆军大学开始按战区轮训各王冠领的校官，毕业者带着同一套参谋作业回到部队。"
 KRAUS_war_college_3:0 "帝国陆军大学 III"
 KRAUS_war_college_3_desc:0 "战史、测绘与后勤并成了必修课。从这里毕业的军官，对地图与伤亡数字都更有分寸。"
 KRAUS_doctrine_enhance_tt:0 "按已选择的作战学说强化陆军现代化精神："
 KRAUS_balkan_events.70.t:0 "巴尔干的炮声"
 KRAUS_balkan_events.70.d:0 "保加利亚与塞尔维亚的战争已经打响。贝尔格莱德条约成员的使节、军官与商人接连来到维也纳，要求帝国表明态度。\n\n是派出志愿军团站到一方，还是在边境之外观望，让双方先消耗力气？无论选哪一条，之后点选定路线的国策都会得到额外的政治点数。"
 KRAUS_balkan_events.70.a:0 "派出志愿军团，干涉战争"
 KRAUS_balkan_events.70.a_tt:0 "之后完成干涉路线的国策（制裁罗马尼亚、军工合作）时，追加政治点数。"
 KRAUS_balkan_events.70.b:0 "不干涉，静观其变"
 KRAUS_balkan_events.70.b_tt:0 "之后完成不干涉路线的国策（不干涉巴尔干、关注战局、保存实力）时，追加政治点数。"
 KRAUS_dip_spain:0 "伊比利亚的旧王冠"
 KRAUS_dip_spain_desc:0 "西班牙曾经是哈布斯堡的领地，马德里王冠上的影子至今还在。西班牙内战进行时，各方的使者都在维也纳的候见室里排队；内战结束之后，新的主人也需要邻国的承认。\n\n内战进行时，这个国策让奥地利选择支援一方；内战结束后，则接触胜者。如果胜者是社会主义政府，这个国策不可点击。"
 KRAUS_dip_italy_others:0 "联络意大利的其他势力"
 KRAUS_dip_italy_others_desc:0 "意大利不只是一个政府：两西西里、撒丁-皮埃蒙特、教宗国，每一个都有自己的主张和自己的顾虑。维也纳派出的使者要在这些宫廷之间逐一拜会，弄清谁愿意回到多瑙-亚得里亚的同盟里来。\n\n如果意大利已经统一，由统一者回答：不控制撒丁-皮埃蒙特且没有对外宣称的，一定接受；控制撒丁-皮埃蒙特且已加入阵营的，一定拒绝；其余情形不可进行。意大利是奥地利的傀儡时，本国策自动完成，不给任何奖励。"
 KRAUS_maria_theresia_academy:0 "玛利亚特蕾莎军事学院"
 KRAUS_maria_theresia_academy_theorist:0 "玛利亚特蕾莎军事学院"
 KRAUS_academy_theorist:0 "军事学院"
 KRAUS_academy_theorist_tt:0 "军事学院"
 KRAUS_sp_fire_production:0 "自行火力制胜"
 KRAUS_sp_fire_production_desc:0 "优火制胜的编制延伸到了自行火炮、自行反坦克炮与自行防空炮：同一套射表，同一批炮兵军官。"
 KRAUS_engineering_vehicles:0 "军用工程车辆"
 KRAUS_engineering_vehicles_desc:0 "架桥、排障与爆破用的工程车辆跟着装甲师一起行动，行军中的损耗更小。"
 KRAUS_tactical_reform:0 "战术改良"
 KRAUS_tactical_reform_desc:0 "新的战术手册配上更快的补充流程，前线缺额能更快补上。"
 KRAUS_mechanised_wave:0 "机械化洪流"
 KRAUS_mechanised_wave_desc:0 "步兵与坦克被当作同一件工具来编组：突破能力更强，行军中的损耗更小，装甲部队的设计也更便宜。"
 KRAUS_common_air:0 "新式帝国共同空军"
 KRAUS_common_air_desc:0 "各王冠领的飞行学校、机场与机体厂并入同一套编制与训练体系，飞行员在哪个王冠领毕业，都飞同一种机型、守同一份手册。"
 KRAUS_common_navy:0 "新式帝国共同海军"
 KRAUS_common_navy_desc:0 "亚得里亚海沿岸的港口、船坞与舰队并入共同编制，水兵和轮机手在任何一座军港都能顶替彼此的岗位。"
 KRAUS_common_air_force:0 "帝国共同空军"
 KRAUS_common_air_force_desc:0 "统一编制与手册，让各王冠领出身的飞行员能够互相补位。"
 KRAUS_common_navy_force:0 "帝国共同海军"
 KRAUS_common_navy_force_desc:0 "共同的编制与港口体系，让水兵与轮机手能在任何一座军港互相补位。"
 KRAUS_nb_flexible:0 "弹性舰队编制"
 KRAUS_nb_large:0 "大型舰队整训"
 KRAUS_nb_small:0 "小型舰艇战术"
 KRAUS_nb_capital:0 "主力舰队经验"
 KRAUS_nb_ports:0 "伊斯特里亚港口群"
 KRAUS_ab_aviation:0 "航空兵团整训"
 KRAUS_ab_school:0 "飞行学院体系"
 KRAUS_ab_fighter:0 "战斗机试验成果"
 KRAUS_ab_light:0 "轻型轰炸机战术"
 KRAUS_ab_medium:0 "中型轰炸机战术"
 KRAUS_ab_bases:0 "空军基地网"
 KRAUS_dip_blackhand:0 "扫清“黑手”"
 KRAUS_dip_blackhand_desc:0 "萨拉热窝的枪声来自塞尔维亚军队内部的秘密会社。黑手的旧部改了名字，叫康斯皮拉齐亚，1925 年推翻了王朝，一面绕过《沃尔特霍尔茨条约》重整军备，一面盼着复仇。大战既已打响，帝国不会再让这些军官团的密谋者握着一支军队。"
 KRAUS_dip_impaler:0 "再无穿刺公"
 KRAUS_dip_impaler_desc:0 "军团党把穿刺公弗拉德的名字写在旗上，把战败的屈辱当作新的信仰，把大罗马尼亚当作要用血去兑现的誓言。多瑙河下游的这股战士崇拜，帝国不打算再看它一次抬头。"
 KRAUS_balkan_events.80.t:0 "维也纳的最后通牒"
 KRAUS_balkan_events.80.d:0 "塞尔维亚在第四次巴尔干战争中败给了保加利亚，既要赔款，又没有一个阵营肯收留它。康斯皮拉齐亚的军官们仍在贝尔格莱德的参谋部里议论复仇。\n\n奥地利的使者带来一份新的文书：把外交与军队交给维也纳，撤销军官团的秘密会社。它将取代已经形同虚设的《沃尔特霍尔茨条约》。"
 KRAUS_balkan_events.80.a:0 "签字：塞尔维亚成为奥地利的傀儡国。"
 KRAUS_balkan_events.80.b:0 "拒绝，由军官团决定。"
 KRAUS_balkan_events.81.t:0 "维也纳的最后通牒"
 KRAUS_balkan_events.81.d:0 "罗马尼亚在第四次巴尔干战争中败给了保加利亚，又一次孤身一人。国王的宫廷与军团党的「队长」都在争着替这场失败找一个罪人。\n\n奥地利的使者带来一份文书：把外交与军队交给维也纳，军团党的战士团体就地解散。"
 KRAUS_balkan_events.81.a:0 "签字：罗马尼亚成为奥地利的傀儡国。"
 KRAUS_balkan_events.81.b:0 "拒绝，由国王与军团党决定。"
 KRAUS_balkan_events.82.t:0 "巴尔干的分成"
 KRAUS_balkan_events.82.d:0 "塞尔维亚与罗马尼亚都已在维也纳的旗下。财政部送来一份清单：两国各自 20% 的军工与民工产能划归帝国，境内的煤、铁与石油也向奥地利敞开。"
 KRAUS_balkan_events.82.a:0 "签字。"
 KRAUS_balkan_events.82.b:0 "与保加利亚共享收益，换取它加入奥地利的阵营。"
 KRAUS_balkan_events.82.b_tt:0 "§Y保加利亚§!获得两国境内资源的使用权，并加入奥地利的阵营。"
 KRAUS_blackhand_apply_tt:0 "塞尔维亚与罗马尼亚各 §Y20%§! 的军工与民工产能转给奥地利，奥地利获得两国境内全部战略资源的使用权。"
 KRAUS_blackhand_share:0 "巴尔干的分成"
 KRAUS_blackhand_share_desc:0 "傀儡国的军工与民工，一部分在为维也纳开工。"
 KRAUS_ab_heavy:0 "重型轰炸机战术"
 KRAUS_ab_phoenix:0 "凤凰机型体系"
 KRAUS_no_form_germany_tt:0 "奥地利不会因此成为「德意志」，只在南德意志各州获得宣称；其余德意志邦国改走扶植附庸的路线。"
 KRAUS_promise.1.t:0 "履约：匈牙利的独立"
 KRAUS_promise.1.d:0 "大战结束了。战前与布达佩斯的密约里，有一条写着：战争之后，匈牙利以共主的形式独立，国防仍由共同的军队承担。皇帝翻到那一页，没有多说什么。"
 KRAUS_promise.1.a:0 "兑现承诺。"
 KRAUS_promise.1.a_tt:0 "§Y匈牙利§!脱离附庸，获得§Y共同防务§!精神。"
 KRAUS_promise.2.t:0 "履约：王冠领的特权"
 KRAUS_promise.2.d:0 "战前大德意志的密约里，有几个王冠领被许诺保留自己的地位与特权。路线走到今天，帝国回到宪政的道路，这些话依然要算数。"
 KRAUS_promise.2.a:0 "照约保留。"
 KRAUS_promise.2.a_tt:0 "签过「保留地位与特权」的王冠领获得精神§Y帝国的承诺§!。"
 KRAUS_promise_common_defence:0 "共同防务"
 KRAUS_promise_common_defence_desc:0 "独立之后，匈牙利的防务仍与帝国共用一套参谋体系。"
 KRAUS_promise_privileges:0 "帝国的承诺"
 KRAUS_promise_privileges_desc:0 "战前签下的地位与特权被帝国如数保留。"
 KRAUS_habsburg_monarch_leader_desc:0 "哈布斯堡家族的成员，经奥地利推举出任这个国家的元首。"
 KRAUS_war_order_events.20.t:0 "伦敦的新君主"
 KRAUS_war_order_events.20.d:0 "伦敦重建委员会的方案送到了桌上：由哈布斯堡家族的成员出任不列颠的君主，英国政府以立宪君主制的形式与维也纳绑在一起。\n\n老王室的代表没有出席签字仪式。"
 KRAUS_war_order_events.20.a:0 "加冕。"
 KRAUS_war_order_events.20.a_tt:0 "§Y奥托·冯·哈布斯堡§!成为§Y英国§!的元首。"
 KRAUS_war_order_events.21.t:0 "巴黎的新君主"
 KRAUS_war_order_events.21.d:0 "法国的处置事务进入最后一页：政府由哈布斯堡家族的成员出任元首，经济与关税事务向维也纳敞开。\n\n巴黎的报纸用了很长篇幅解释，这不是占领，而是协议。"
 KRAUS_war_order_events.21.a:0 "签字。"
 KRAUS_war_order_events.21.a_tt:0 "§Y马克西米利安·欧根·冯·哈布斯堡§!成为§Y法国§!的元首。"
 KRAUS_war_order_events.22.t:0 "马德里的新君主"
 KRAUS_war_order_events.22.d:0 "西班牙已经成为维也纳的附庸。随着内战的收场，宫廷里提出了一份名单：由哈布斯堡家族的约瑟夫·奥古斯特出任国家元首，让伊比利亚的旧王冠重新回到一个与维也纳有血缘的家族手中。"
 KRAUS_war_order_events.22.a:0 "批准。"
 KRAUS_war_order_events.22.a_tt:0 "§Y约瑟夫·奥古斯特·冯·哈布斯堡§!成为§Y西班牙§!的元首。"
 KRAUS_hd_double_tt:0 "§Y哈布斯堡外交遗产§!的效果翻倍：每个盟友的政治点数获取由 +1% 变为 +2%。"
 KRAUS_war_order_events.20.b:0 "不插手，英国自己决定元首。"
 KRAUS_war_order_events.21.b:0 "不插手，法国自己决定元首。"
 KRAUS_war_order_events.22.b:0 "不插手，西班牙自己决定元首。"
 KRAUS_joint_econ_spirit_6:0 "多瑙河共同建设 VI"
 KRAUS_joint_econ_spirit_6_desc:0 "维也纳牵头的共同经济纲要把铁路、矿山、研究机构与工厂一路铺进王冠领。每完成共同经济树里的一个国策，这份建设就深入一级，所有永久加成都累积在这一个精神上。"
 KRAUS_joint_econ_spirit_7:0 "多瑙河共同建设 VII"
 KRAUS_joint_econ_spirit_7_desc:0 "维也纳牵头的共同经济纲要把铁路、矿山、研究机构与工厂一路铺进王冠领。每完成共同经济树里的一个国策，这份建设就深入一级，所有永久加成都累积在这一个精神上。"
 KRAUS_joint_econ_spirit_8:0 "多瑙河共同建设 VIII"
