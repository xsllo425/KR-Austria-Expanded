 KRAUS_root_events.20.t:0 "王权危机"
 KRAUS_root_events.20.d:0 "皇室的威望跌到了谷底。议会里有人公开嘲笑宫廷，街头开始有人撕毁皇帝的画像。再不做点什么，帝国就只剩下一个名字。"
 KRAUS_root_events.20.a:0 "颁布紧急法令，重树皇威。"
 KRAUS_root_events.20.b:0 "动用国库，换取各方的忠诚。"
 KRAUS_root_events.20.c:0 "听之任之。"
 KRAUS_crown_eclipse:0 "王权旁落"
 KRAUS_crown_eclipse_desc:0 "宫廷的话已经没有人听了。部长们各行其是，地方官员只等着看下一届政府是谁。"
 KRAUS_bul_won_balkan_war_tt:0 "保加利亚赢得了巴尔干战争"
 KRAUS_balkan_events.42.t:0 "保加利亚战败"
 KRAUS_balkan_events.42.d:0 "保加利亚输掉了巴尔干战争。维也纳在南方押下的赌注全部落空：贝尔格莱德条约的胜利者正盯着帝国的南部边境，国内已经有人在追问，是谁让我们站错了队。"
 KRAUS_balkan_events.42.a:0 "这笔账迟早要算。"
 KRAUS_ia_gain_5_tt:0 "§Y皇权与秩序§! §G+5§!"
 KRAUS_ia_gain_8_tt:0 "§Y皇权与秩序§! §G+8§!"
