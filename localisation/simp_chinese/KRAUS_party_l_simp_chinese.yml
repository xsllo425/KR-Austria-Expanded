l_simp_chinese:
 KRAUS_pp_main_tt:0 "§Y先走的党团§!主导议会，奖励全额生效；之后的党团奖励减半。"
 KRAUS_pp_root:0 "帝国议会的四个党团"
 KRAUS_pp_root_desc:0 "帝国议会里不再只有两个声音。社民、基社、自由民主联盟与民族自由党各自代表着无数个阶层与地区的呼声：左与右，整合与分权，地方自治与中央集权，联邦与帝国，在它们身上排成了不同的组合。"
 KRAUS_pp_sd_1:0 "红色维也纳的账本"
 KRAUS_pp_sd_1_desc:0 "住房、八小时工作制、企业委员会。维也纳与施泰尔马克的产业工人、工会、市政雇员，是社民工党的基本盘。"
 KRAUS_pp_sd_2:0 "各民族的工人"
 KRAUS_pp_sd_2_desc:0 "布拉格的钳工、伦贝格的铁路工人、萨格勒布的码头工人，加入的是同一个工会。社民主张让各民族在帝国之内享有文化与地方上的自治。"
 KRAUS_pp_sd_3:0 "联邦的宪法"
 KRAUS_pp_sd_3_desc:0 "奥托·鲍尔写过：民族不是领土，而是人的共同体。把这句话写进宪法，就是联邦。"
 KRAUS_pp_cs_1:0 "教区与田野"
 KRAUS_pp_cs_1_desc:0 "农业信贷、教会学校、小商人的合作社。阿尔卑斯的农民、教区的神父、维也纳的小店主，是基社党的基本盘。"
 KRAUS_pp_cs_2:0 "帝国的忠诚"
 KRAUS_pp_cs_2_desc:0 "对皇帝的忠诚，比对任何民族的忠诚更久远。基社主张把王冠领更紧地系在维也纳身上。"
 KRAUS_pp_cs_3:0 "皇冠与祭坛"
 KRAUS_pp_cs_3_desc:0 "卢埃格尔的维也纳从来不是纯粹的政治，它是教堂、市政厅和皇宫之间的一条街。"
 KRAUS_pp_sl_1:0 "市民的权利"
 KRAUS_pp_sl_1_desc:0 "普选、出版自由、大学自治。教师、律师、记者和各民族的知识分子，是自由民主联盟的基本盘。"
 KRAUS_pp_sl_2:0 "用母语投票"
 KRAUS_pp_sl_2_desc:0 "布拉格的议员和利沃夫的议员，都希望在地方议会里用自己的语言说话。自由民主联盟主张扩大各王领议会的权限。"
 KRAUS_pp_sl_3:0 "欧罗巴的蓝图"
 KRAUS_pp_sl_3_desc:0 "库登霍韦-卡莱吉写过泛欧洲的构想。一个多民族帝国，也许就是欧洲联盟的雏形。"
 KRAUS_pp_ml_1:0 "统一的市场"
 KRAUS_pp_ml_1_desc:0 "关税、货币、铁路。信贷银行、斯柯达与施泰尔的董事会、出口商，是民族自由党的基本盘。"
 KRAUS_pp_ml_2:0 "一张资产负债表"
 KRAUS_pp_ml_2_desc:0 "一个市场，一份账本，一个财政部。民族自由党主张把各王领的财政并进帝国的资产负债表。"
 KRAUS_pp_ml_3:0 "中欧的交易所"
 KRAUS_pp_ml_3_desc:0 "维也纳可以成为中欧的伦敦，条件是它与柏林的关税，能够像一个国家一样说话。"
 KRAUS_pps_sd_1:0 "正在发展中的工人组织"
 KRAUS_pps_sd_2:0 "茁壮成长的工人组织"
 KRAUS_pps_sd_3:0 "趋于完备的工人组织"
 KRAUS_pps_cs_1:0 "正在发展中的堂区与田野"
 KRAUS_pps_cs_2:0 "茁壮成长的堂区与田野"
 KRAUS_pps_cs_3:0 "趋于完备的堂区与田野"
 KRAUS_pps_sl_1:0 "正在发展中的公民社会"
 KRAUS_pps_sl_2:0 "茁壮成长的公民社会"
 KRAUS_pps_sl_3:0 "趋于完备的公民社会"
 KRAUS_pps_ml_1:0 "正在发展中的统一市场"
 KRAUS_pps_ml_2:0 "茁壮成长的统一市场"
 KRAUS_pps_ml_3:0 "趋于完备的统一市场"
 KRAUS_pp_boom_sd:0 "红色维也纳的热潮"
 KRAUS_pp_boom_cs:0 "丰收节与堂区集市"
 KRAUS_pp_boom_sl:0 "自由的出版热"
 KRAUS_pp_boom_ml:0 "交易所的繁荣"
 KRAUS_pp_events.1.t:0 "工人站到了你这边"
 KRAUS_pp_events.1.d:0 "议会里第一次出现这样的场面：社民党的议员站起来，替维也纳的钳工、施泰尔马克的钢铁工人、布拉格的纺织女工、萨格勒布的码头工人同时发言。\n\n工会、市政雇员和各民族的工人组织把这一次的纲领当成了自己的旗帜。他们不指望帝国立刻变成天堂，只想在帝国里有一个说话的位置。"
 KRAUS_pp_events.1.a:0 "工人是帝国的筋骨。"
 KRAUS_pp_events.2.t:0 "农民与教区站到了你这边"
 KRAUS_pp_events.2.d:0 "阿尔卑斯山谷的农民、堂区的神父、维也纳的小店主与低阶公务员，在同一周里联名致信议会：他们愿意把票投给那个会维护秩序、保卫教会学校、不把他们的账本交给银行家的党。\n\n基社党的议员发现，自己代表的是帝国里最沉默的那一群人。"
 KRAUS_pp_events.2.a:0 "秩序，是穷人最后的财产。"
 KRAUS_pp_events.3.t:0 "市民与知识分子站到了你这边"
 KRAUS_pp_events.3.d:0 "大学教授、中学教师、律师、记者与各民族的知识分子，在咖啡馆里把自由民主联盟的纲领抄了又抄。\n\n他们要的不多：说自己的语言，读自己的报纸，在地方议会里投自己的票。他们相信，一个多民族的国家，是靠权利而不是靠恐惧维系的。"
 KRAUS_pp_events.3.a:0 "权利，是最便宜的忠诚。"
 KRAUS_pp_events.4.t:0 "银行与工厂站到了你这边"
 KRAUS_pp_events.4.d:0 "信贷银行的董事会、斯柯达与施泰尔的股东、出口商和大地主，罕见地在同一份声明上签了字：他们支持一个统一的市场、一份统一的账本。\n\n维也纳的交易所，在这一天收盘时涨了三个点。"
 KRAUS_pp_events.4.a:0 "市场，是帝国最大的议会。"
 KRAUS_usga_main_sd:0 "合众国的劳工之盟"
 KRAUS_usga_main_cs:0 "合众国的堂区之盟"
 KRAUS_usga_main_sl:0 "合众国的公民之盟"
 KRAUS_usga_main_ml:0 "合众国的市场之盟"
 KRAUS_pp_events.11.t:0 "工人们的纲领写完了"
 KRAUS_pp_events.11.d:0 "社民党团的纲领三步走完，条文被印成了小册子，在维也纳的工人区、施泰尔马克的矿区和布拉格的车间里一页页地传阅。\n\n有人把它读给不识字的老工人听。老人听完，只问了一句：「这是写给我们的，还是写给议会的？」"
 KRAUS_pp_events.11.a:0 "写给我们，也写给议会。"
 KRAUS_pp_events.12.t:0 "堂区的纲领写完了"
 KRAUS_pp_events.12.d:0 "基社党团的纲领三步走完，被神父在礼拜日读给堂区的人听。条文里有农业信贷，有教会学校，也有对帝国的忠诚。\n\n农妇们听完，把篮子放下，说：「这样的话，至少明年的税不会更重。」"
 KRAUS_pp_events.12.a:0 "田野，是帝国最老的议会。"
 KRAUS_pp_events.13.t:0 "市民的纲领写完了"
 KRAUS_pp_events.13.d:0 "自由民主联盟的纲领三步走完，各家报纸都登了全文，有的用德语，有的用捷克语，有的用波兰语和鲁塞尼亚语。\n\n咖啡馆里，有人把报纸折成四折，塞进外套：「这是第一次，有人把我们的权利写得这么具体。」"
 KRAUS_pp_events.13.a:0 "把权利写下来，是最便宜的忠诚。"
 KRAUS_pp_events.14.t:0 "交易所的纲领写完了"
 KRAUS_pp_events.14.d:0 "民族自由党的纲领三步走完。信贷银行把它装订成册，寄给了每一位董事和每一位出口商。\n\n伦敦的《泰晤士报》难得地用了一整栏：「维也纳想做中欧的账房。」"
 KRAUS_pp_events.14.a:0 "账房，也是国家的心脏。"
 KRAUS_pc_boom_fed:0 "联邦派的热潮"
 KRAUS_pc_fed_1:0 "民族平等法案"
 KRAUS_pc_fed_1_desc:0 "社民与自由派在同一份提案上签了字：各民族在议会与官府里享有同等的语言地位。"
 KRAUS_pc_fed_2:0 "社会保险法"
 KRAUS_pc_fed_2_desc:0 "病了、老了、失业了，国家不能不管。社民要的是工人的保险，自由民主联盟要的是市民的保障，两党在同一份法案上签了字，车间里的人和田野里的人第一次被写进了同一张名单。"
 KRAUS_pc_fed_3:0 "多民族宪章"
 KRAUS_pc_fed_3_desc:0 "一份可以用六种文字印刷的宪章：各族语言平等，各邦议会握有自己的预算。社民与自由民主联盟都相信，帝国只有让每一个民族都觉得是自己的，才能长久。"
 KRAUS_pc_boom_mkt:0 "自由市场的繁荣"
 KRAUS_pc_mkt_1:0 "出版与贸易自由"
 KRAUS_pc_mkt_1_desc:0 "自由派要的是两样东西：不被审查的报纸，不被盘剥的关税。"
 KRAUS_pc_mkt_2:0 "帝国中央银行"
 KRAUS_pc_mkt_2_desc:0 "一家银行，一种货币，一个账本。民族自由党与自由民主联盟都认为这是帝国最缺的东西。"
 KRAUS_pc_mkt_3:0 "维也纳的交易所"
 KRAUS_pc_mkt_3_desc:0 "维也纳可以成为中欧的伦敦，条件是它能让柏林的资本也愿意在此停留。"
 KRAUS_pc_boom_imp:0 "帝国统一的利益"
 KRAUS_pc_imp_1:0 "帝国商法典"
 KRAUS_pc_imp_1_desc:0 "一部法典，从布拉格到萨格勒布都适用。商人与官僚在这一点上难得一致。"
 KRAUS_pc_imp_2:0 "一种克朗，一张时刻表"
 KRAUS_pc_imp_2_desc:0 "克朗在每一个王领里应该一模一样，列车时刻表上不该再出现边界。民族自由党要的是畅通的市场，基社要的是统一的帝国，这一次两党要的是同一件事。"
 KRAUS_pc_imp_3:0 "堂区与互助金库"
 KRAUS_pc_imp_3_desc:0 "基社不愿让国家包办一切，民族自由党不愿让税单越来越长。两党都同意：救济交给堂区的救济站和行会的互助金库，帝国只出一份章程、一笔补贴。"
 KRAUS_pc_boom_soc:0 "社会立法的春天"
 KRAUS_pc_soc_1:0 "社会保险法"
 KRAUS_pc_soc_1_desc:0 "基社与社民在一件事上不用吵：病了、老了、失业了，国家不能不管。"
 KRAUS_pc_soc_2:0 "堂区救济与工会"
 KRAUS_pc_soc_2_desc:0 "堂区的救济站与工会的互助金库，第一次坐在了同一张桌子旁。"
 KRAUS_pc_soc_3:0 "工农同盟"
 KRAUS_pc_soc_3_desc:0 "田野里的人和车间里的人，在议会里第一次被写进了同一个名单。"
 KRAUS_pp_coal.1.t:0 "基社的条件"
 KRAUS_pp_coal.1.d:0 "基社党团的议员团在会议室里坐了一夜。\n\n教区神父、乡村教师和大庄园的管事派来的人都说了话：帝国不能没有祭坛与王座，但也不能一个人说了算。最后他们列出了三条——堂区学校不动、农业信贷不收紧、皇帝的家务不提——只要写进联合纲领，他们愿意坐进内阁。"
 KRAUS_pp_coal.1.a:0 "写进纲领，请他们入阁。"
 KRAUS_pp_coal.1.b:0 "这一次不谈了。"
 KRAUS_pp_coal_join_cs_tt:0 "基社党团加入执政联盟。"
 KRAUS_pp_coal.2.t:0 "民族自由党的账本"
 KRAUS_pp_coal.2.d:0 "民族自由党团派来的是一位银行家出身的议员，他把一本账摊在桌上。\n\n关税、铁路运费与国债利率，一项一项对过去。他并不要求政纲同调，只要求一件事：预算不能由不懂算术的人来写。账对得上，他们愿意坐进内阁。"
 KRAUS_pp_coal.2.a:0 "账对得上，请他们入阁。"
 KRAUS_pp_coal.2.b:0 "这一次不谈了。"
 KRAUS_pp_coal_join_ml_tt:0 "民族自由党团加入执政联盟。"
 KRAUS_pp_coal.3.t:0 "社民的三个名额"
 KRAUS_pp_coal.3.d:0 "社民党团的代表团穿过议会走廊时，没有人说话。\n\n工会的代表要求三个名额：劳动部、住房署、工厂检查局。他们声明不是来分肥缺的，而是要让车间里的人知道，议会里有人在替他们值班。条件谈拢了，他们愿意坐进内阁。"
 KRAUS_pp_coal.3.a:0 "给他们三个名额，请入阁。"
 KRAUS_pp_coal.3.b:0 "这一次不谈了。"
 KRAUS_pp_coal_join_sd_tt:0 "社民党团加入执政联盟。"
 KRAUS_pp_coal.4.t:0 "联盟的最后一页"
 KRAUS_pp_coal.4.d:0 "自由民主联盟的议员们带来的不是清单，而是一份宪章草案。\n\n他们愿意在内阁里与执政党共事，条件是草案里关于出版自由、母语学校与地方议会的那一页，原样写进联合纲领的最后一页。执政党的谈判代表翻到那一页，沉默了一会儿，点了头。"
 KRAUS_pp_coal.4.a:0 "写进最后一页，请入阁。"
 KRAUS_pp_coal.4.b:0 "这一次不谈了。"
 KRAUS_pp_coal_join_sl_tt:0 "自由民主联盟加入执政联盟。"
 KRAUS_pc_adj_fed_tt:0 "执政党须为社民党团或自由民主联盟"
 KRAUS_pc_adj_mkt_tt:0 "执政党须为自由民主联盟或民族自由党团"
 KRAUS_pc_adj_imp_tt:0 "执政党须为民族自由党团或基社党团"
