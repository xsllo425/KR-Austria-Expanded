 KRAUS_cg_gov_3:0 "地方的怨言"
 KRAUS_cg_gov_2:0 "地方的怨言"
 KRAUS_cg_gov_1:0 "地方的怨言"
 KRAUS_cg_gov_3_desc:0 "王冠领地并入后，行政机构与各界社团还在重新编排。公文在各个衙门之间来回转，新旧官员互相不服气。需要由议会或皇帝出面，一步一步把这些怨言平息下去。"
 KRAUS_cg_gov_2_desc:0 "重组仍在进行，积压的公文已经少了一些，但各界仍在观望。"
 KRAUS_cg_gov_1_desc:0 "只剩最后的余波：个别衙门的人事与账目还没有理顺。"
 KRAUS_cr_CZE:0 "波西米亚的工场"
 KRAUS_cr_CZE_desc:0 "布拉格的设计室和皮尔森的车间并入帝国的生产名册，工业统计的第一栏从此写着它的名字。"
 KRAUS_cr_CZE_s:0 "波西米亚的工场（成熟）"
 KRAUS_cr_CZE_s_desc:0 "布拉格的设计室和皮尔森的车间并入帝国的生产名册，工业统计的第一栏从此写着它的名字。行政整合走得稳妥，红利比起初更大。"
 KRAUS_cg_CZE_3:0 "波西米亚官员与军官的不满"
 KRAUS_cg_CZE_3_desc:0 "波西米亚的公务员和军官对新的行政安排心存不满，办事拖沓，兵役也不积极。"
 KRAUS_cg_reg_CZE_3:0 "安抚波西米亚的官员与军官"
