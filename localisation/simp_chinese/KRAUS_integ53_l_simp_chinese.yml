 KRAUS_integ_start_fast_tt:0 "§Y快速整合§!：天数更短、花费更高；完成后带着较重的「地方的怨言」（消除 3 级）。"
 KRAUS_integ_start_slow_tt:0 "§Y稳妥整合§!：天数更长、花费更低；完成后的怨言较轻（消除 2 级），平息后的「王冠领地」精神为强化版。"
