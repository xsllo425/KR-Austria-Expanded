 KRAUS_cg_diet_3:0 "议会听证会"
 KRAUS_cg_diet_3_desc:0 "帝国议会召集各王领与各界社团的代表，逐条听取对新行政安排的意见，并把能改的改了。"
 KRAUS_cg_tour_3:0 "巡幸安抚"
 KRAUS_cg_tour_3_desc:0 "皇帝亲自到各地的衙门、学校与兵营里露面，让官员和军官看到，维也纳并没有忘记他们。"
