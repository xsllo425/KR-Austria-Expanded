l_simp_chinese:
 KRAUS_usga_federal:0 "联邦式合众国"
 KRAUS_usga_federal_desc:0 "各王领保留自己的议会与语言，在维也纳的联合议会里平等发言。帝国不再要求谁像谁，稳定因此更牢，只是整合的利益摊得更薄。"
 KRAUS_usga_unitary:0 "统一式合众国"
 KRAUS_usga_unitary_desc:0 "一部宪法，一个政府，一套军令。中央直辖带来更高的工业与动员效率，也把旧王领的体面一并收走。"
 KRAUS_usga_unrest:0 "地方的怨言"
 KRAUS_usga_unrest_desc:0 "统一式的合众国里，旧王领的议员接连在维也纳提出同一个问题：我们的位置在哪里？只有一次性的决议能平息这些怨言。"
 KRAUS_usga_unrest.1.t:0 "波西米亚的请愿"
 KRAUS_usga_unrest.1.d:0 "布拉格的议员联名递上请愿书：学校与官署里捷克语的位置，不该因为合众国统一了宪法就被取消。\n\n总理府的秘书提醒，这是第一份，不会是最后一份。"
 KRAUS_usga_unrest.1.a:0 "作些让步，批准双语的学校与官署。"
 KRAUS_usga_unrest.1.b:0 "驳回，统一的国家只有一种官署语言。"
 KRAUS_usga_unrest.2.t:0 "加利西亚的税收"
 KRAUS_usga_unrest.2.d:0 "伦贝格的议员说，加利西亚缴上去的税，回到加利西亚的不及一半。他们要求保留一部分税收，由地方议会自理。"
 KRAUS_usga_unrest.2.a:0 "作些让步，划出一部分税收归地方。"
 KRAUS_usga_unrest.2.b:0 "驳回，国库只有一个。"
 KRAUS_usga_unrest.3.t:0 "匈牙利的旧特权"
 KRAUS_usga_unrest.3.d:0 "布达佩斯的议员在联合议会上说出了所有王领想说的话：合众国要的是平等，不是抹平。他们提出一份清单，列明匈牙利世代保有的特权。\n\n怨言已经攒了三次，再不平息，就只会越攒越深。"
 KRAUS_usga_unrest.3.a:0 "作些让步，把清单上的几条写进法律。"
 KRAUS_usga_unrest.3.b:0 "驳回，特权的时代已经过去。"
 KRAUS_usga_unrest_open_tt:0 "决议栏里出现一次性决议§Y平息王领§!：只有它能去掉§Y地方的怨言§!带来的减益。"
 KRAUS_usga_pacify:0 "平息王领"
 KRAUS_usga_pacify_desc:0 "一次性的了结：付出一笔政治点数，在联合议会里重开一轮对话，把三次怨言一并了结。"
 KRAUS_us_united_tt:0 "忠诚度达到§Y忠诚 II§!以上的王冠领（匈牙利、斯洛伐克、特兰西瓦尼亚等）自动完成整合；其余王领仍需用整合决议。"
