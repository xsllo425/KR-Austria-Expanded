l_simp_chinese:
 KRAUS_dip_beyond_danube:0 "多瑙河之外"
 KRAUS_dip_beyond_danube_desc:0 "多瑙河危机过去了，帝国的家务事告一段落。维也纳终于可以抬起头，看看多瑙河以外的世界：亚平宁、维斯瓦河、第聂伯河，还有巴尔干的群山。多瑙-亚得里亚同盟不该只是一纸空文。"
 KRAUS_dip_italy_return:0 "重返多瑙-亚得里亚"
 KRAUS_dip_italy_return_desc:0 "黑色星期一之后，意大利挣脱了维也纳的缰绳。但它的邻居依旧是那些邻居，它的敌人也依旧是那些敌人。只要罗马还没有落入社会主义者手中，维也纳就可以重新递出橄榄枝，这一次，以盟友的身份。意大利一旦回到同盟，两国的大学互派学者，参谋部交换地图。"
 KRAUS_dip_italy_invite_tt:0 "向§Y意大利§!发出邀请，请它重返§Y多瑙-亚得里亚同盟§!。意大利可能接受，也可能拒绝。"
 KRAUS_dip_friendship:0 "多瑙河之外的友谊"
 KRAUS_dip_events.1.t:0 "维也纳的邀请"
 KRAUS_dip_events.1.d:0 "奥地利大使带来了一封信：维也纳邀请我们重返多瑙-亚得里亚同盟。这一次不是附庸，而是盟友。\n\n有人说，我们好不容易才摆脱维也纳；也有人说，在这个世道，意大利需要朋友。"
 KRAUS_dip_events.1.a:0 "我们接受。"
 KRAUS_dip_events.1.b:0 "意大利要走自己的路。"
 KRAUS_dip_events.2.t:0 "意大利重返同盟"
 KRAUS_dip_events.2.d:0 "罗马接受了我们的邀请。意大利重新加入了多瑙-亚得里亚同盟，这一次是作为盟友。"
 KRAUS_dip_events.2.a:0 "亚得里亚海又是我们的海了。"
 KRAUS_dip_events.3.t:0 "意大利拒绝了"
 KRAUS_dip_events.3.d:0 "罗马婉拒了我们的邀请。意大利人还记得做附庸的日子。"
 KRAUS_dip_events.3.a:0 "也许以后。"
 KRAUS_diplomacy_category:0 "多瑙河之外"
 KRAUS_diplomacy_category_desc:0 "奥地利在多瑙河以外的外交。\n\n§Y波兰§!：奥地利影响力 §Y[?POL.POL_AUS_influence|0]§!，德国影响力 §Y[?POL.POL_GER_influence|0]§!。当波兰共和国成立、德国发出最后通牒时，奥地利影响力超过 §Y30§! 且高于德国，波兰就会转投维也纳。"
 KRAUS_dip_pol_fund_republicans:0 "资助波兰共和派"
 KRAUS_dip_pol_fund_republicans_desc:0 "经克拉科夫和伦贝格的银行，把钱送到华沙的共和派手里。"
 KRAUS_dip_pol_academic:0 "克拉科夫的学术交流"
 KRAUS_dip_pol_academic_desc:0 "雅盖隆大学和维也纳大学互派教授。波兰的下一代精英，在维也纳的咖啡馆里读书。"
 KRAUS_dip_pol_aid:0 "对波兰的经济援助"
 KRAUS_dip_pol_aid_desc:0 "维也纳的银行向华沙提供低息贷款。钱不多，但足以让波兰人知道，柏林不是唯一的选择。"
 KRAUS_dip_poland_hand:0 "向华沙递出的手"
 KRAUS_dip_poland_hand_desc:0 "德国人在大战中从俄国手里夺走了波兰，又给它安上了一个德意志国王。华沙的共和派一直在等一个不同的选择：维也纳。"
 KRAUS_dip_poland_corridor:0 "加利西亚的走廊"
 KRAUS_dip_poland_corridor_desc:0 "加利西亚和波兰之间只隔着一条看不见的边界。共和派的报纸、传单和人，都从这里过。加利西亚越忠于维也纳，这条走廊就越安全。"
 KRAUS_dip_poland_integration:0 "奥波经济一体化"
 KRAUS_dip_poland_integration_desc:0 "同盟条约签了，接下来是关税、铁路和银行。维斯瓦河与多瑙河之间，加利西亚成了两国的交汇点。"
 KRAUS_dip_poland_decisions_tt:0 "开放§Y多瑙河之外§!决议：资助波兰共和派、学术交流、经济援助，提升奥地利在波兰的影响力。"
 KRAUS_dip_poland_habsburg_tt:0 "§Y卡尔·阿尔布雷希特·冯·哈布斯堡§!成为§Y波兰§!元首（按波兰执政党任职）；加利西亚由新的元首接任，§Y加利西亚§!的王冠领地位向自主推一档。"
 KRAUS_gal_invest_start_tt:0 "§Y加利西亚§!获得或升级精神「四方之交」，并开始每 §Y180§! 天分别收到来自§Y奥地利§!与§Y波兰§!的投资。"
 KRAUS_gal_invest_category:0 "四方之交"
 KRAUS_gal_invest_category_desc:0 "加利西亚是奥地利、波兰、乌克兰的交汇点。各方的投资分别结算。"
 KRAUS_gal_invest_AUS:0 "来自维也纳的投资"
 KRAUS_gal_invest_POL:0 "来自华沙的投资"
 KRAUS_gal_invest_UKR:0 "来自基辅的投资"
 KRAUS_pol_aus_integration:0 "奥波经济一体化"
 KRAUS_ukr_aus_integration:0 "奥乌经济一体化"
 KRAUS_gal_crossroads_1:0 "四方之交"
 KRAUS_gal_crossroads_2:0 "四方之交（全面）"
 KRAUS_gal_crossroads_1_desc:0 "加利西亚夹在维也纳、华沙和基辅之间。从前这是它的不幸，如今成了它的生意。"
 KRAUS_gal_crossroads_2_desc:0 "加利西亚夹在维也纳、华沙和基辅之间。从前这是它的不幸，如今成了它的生意。"
 KRAUS_dip_events.10.t:0 "哈布斯堡的元首"
 KRAUS_dip_events.10.d:0 "卡尔·阿尔布雷希特大公离开伦贝格，来到华沙。他生于伊斯特里亚，却比许多波兰人更像波兰人。如今，他成了波兰的元首。"
 KRAUS_dip_events.10.a:0 "波兰万岁。"
 KRAUS_dip_events.20.t:0 "来自维也纳的投资"
 KRAUS_dip_events.20.d:0 "维也纳的银行家又来了一趟伦贝格，带着新的贷款和新的订单。"
 KRAUS_dip_events.20.a:0 "好。"
 KRAUS_dip_events.21.t:0 "来自华沙的投资"
 KRAUS_dip_events.21.d:0 "华沙的商人们在克拉科夫开了新的商行。维斯瓦河上的货船，一直开到了加利西亚。"
 KRAUS_dip_events.21.a:0 "好。"
 KRAUS_dip_events.22.t:0 "来自基辅的投资"
 KRAUS_dip_events.22.d:0 "基辅的合作社在东加利西亚的村子里建了新的粮仓和工坊。"
 KRAUS_dip_events.22.a:0 "好。"
 KRAUS_dip_ukraine_republicans:0 "第聂伯河对岸的共和派"
 KRAUS_dip_ukraine_republicans_desc:0 "第聂伯河对岸的共和派，需要维也纳的承认与支持。奥地利一面暗中扶持他们，一面向基辅发出邀请：多瑙-亚得里亚同盟里，有一把为乌克兰留的椅子。"
 KRAUS_dip_ukraine_integration:0 "奥乌经济一体化"
 KRAUS_dip_ukraine_integration_desc:0 "乌克兰的粮食和顿巴斯的煤，经伦贝格的铁路运往维也纳；维也纳的机器和资本，沿同一条路运往基辅。加利西亚又多了一个伙伴。"
 KRAUS_dip_ukraine_decisions_tt:0 "开放§Y多瑙河之外§!决议：经加利西亚向乌克兰共和派输送武器（乌克兰起义期间可用）。"
 KRAUS_dip_ukraine_invite_tt:0 "邀请§Y乌克兰§!加入§Y多瑙-亚得里亚同盟§!。乌克兰可能接受，也可能拒绝。"
 KRAUS_dip_ukraine_habsburg_tt:0 "§Y威廉·弗朗茨·冯·哈布斯堡§!（红色亲王）成为§Y乌克兰§!元首（按乌克兰执政党任职）。"
 KRAUS_gal_invest_start_ukr_tt:0 "§Y加利西亚§!的精神「四方之交」升级，并开始每 §Y180§! 天收到来自§Y乌克兰§!的投资。"
 KRAUS_dip_ukr_arms:0 "经加利西亚输送武器"
 KRAUS_dip_ukr_arms_desc:0 "布罗迪和拉德希夫附近的边境，从来就管不严。步枪和弹药从伦贝格运出，交到乌克兰共和派手里。"
 KRAUS_dip_events.4.t:0 "维也纳的邀请"
 KRAUS_dip_events.4.d:0 "奥地利邀请我们加入多瑙-亚得里亚同盟。维也纳的红色亲王在乌克兰人中间很有名望，也许这是个好兆头。"
 KRAUS_dip_events.4.a:0 "我们接受。"
 KRAUS_dip_events.4.b:0 "乌克兰要走自己的路。"
 KRAUS_dip_events.5.t:0 "乌克兰加入同盟"
 KRAUS_dip_events.5.d:0 "基辅接受了我们的邀请。乌克兰加入了多瑙-亚得里亚同盟。"
 KRAUS_dip_events.5.a:0 "第聂伯河也是我们的朋友了。"
 KRAUS_dip_events.6.t:0 "乌克兰拒绝了"
 KRAUS_dip_events.6.d:0 "基辅婉拒了我们的邀请。"
 KRAUS_dip_events.6.a:0 "也许以后。"
 KRAUS_dip_events.11.t:0 "红色亲王"
 KRAUS_dip_events.11.d:0 "威廉·弗朗茨·冯·哈布斯堡，乌克兰人叫他\"瓦西里·维希凡尼\"，绣花衬衫的瓦西里。他是哈布斯堡家的人，却穿着乌克兰农民的衣服长大。如今，他成了乌克兰的元首。"
 KRAUS_dip_events.11.a:0 "乌克兰万岁。"
 KRAUS_poland_events_233_prosperity:0 "加利西亚不割让，但我们可以共同繁荣。"
 KRAUS_poland_events_246_prosperity:0 "伦贝格谁也不给。加利西亚应当是三方共同繁荣的桥梁。"
 KRAUS_ukraine_republican_events_100_prosperity:0 "加利西亚不割让，但我们可以共同繁荣。"
 KRAUS_galicia_events_3_prosperity:0 "留在帝国内，同时与波兰共同繁荣。"
 KRAUS_common_prosperity_tt:0 "§Y加利西亚§!不割让。作为替代，它与提出要求的一方建立§Y经济一体化§!。"
 KRAUS_dip_events.30.t:0 "共同繁荣"
 KRAUS_dip_events.30.d:0 "维也纳拒绝交出加利西亚，却提出了另一个方案：关税同盟、铁路联运、共同投资。加利西亚仍属于帝国，但它的工厂和油井将同样为我们服务。"
 KRAUS_dip_events.30.a:0 "这比一场战争划算。"
 KRAUS_dip_events.31.t:0 "维也纳的答复"
 KRAUS_dip_events.31.d:0 "维也纳没有同意我们并入波兰，但也没有简单拒绝：加利西亚留在帝国内，同时与华沙建立经济一体化。伦贝格的波兰人和鲁塞尼亚人都松了一口气。"
 KRAUS_dip_events.31.a:0 "那就这样吧。"
 KRAUS_dip_bul_hand:0 "索非亚的位置"
 KRAUS_dip_bul_hand_desc:0 "保加利亚在巴尔干战争里赢得了什么、失去了什么，索非亚比谁都清楚。奥地利不替它做主，只告诉它：多瑙-亚得里亚同盟里有一把椅子，是为一个独立的保加利亚留的。入盟之后，两国总参谋部交换动员计划，军官互相进修。"
 KRAUS_dip_bul_invite_tt:0 "向§Y保加利亚§!发出邀请，请它加入§Y多瑙-亚得里亚同盟§!。保加利亚在巴尔干战争中的结局和它的外交取向，决定它接受的可能。"
 KRAUS_dip_gre_settlement:0 "雅典协定"
 KRAUS_dip_gre_settlement_desc:0 "希腊没收了奥地利的产业，奥地利也为此制裁了希腊。两边都清楚，这样下去只会让第三方得利。维也纳愿意放弃索赔，换取一份体面的协定。（如果在「雪崩之下」已经放过希腊，这一步自动跳过。）"
 KRAUS_dip_gre_invite:0 "爱琴海的邀请"
 KRAUS_dip_gre_invite_desc:0 "希腊在巴尔干战争里没有跟着贝尔格莱德条约走到底，它记得是谁在最难的时候没有落井下石。现在维也纳可以向雅典提一个问题：希腊的海岸线很长，朋友很少。入盟之后，两国海军联合演习，互派教官。"
 KRAUS_dip_gre_settlement_tt:0 "奥地利放弃对希腊的索赔，希腊的§Y奥地利制裁§!被解除。"
 KRAUS_dip_gre_invite_tt:0 "向§Y希腊§!发出邀请，请它加入§Y多瑙-亚得里亚同盟§!。希腊面临的威胁越大，越可能接受。"
 KRAUS_dip_alb_gendarmerie:0 "地拉那的宪兵"
 KRAUS_dip_alb_gendarmerie_desc:0 "维德的王位是借来的。奥地利的宪兵教官可以让它稳一些，但谁也不能保证借来的东西会一直留在手里。"
 KRAUS_dip_alb_gendarmerie_tt:0 "阿尔巴尼亚获得§Y宪兵队§!，大大降低维德国王遇刺的风险。"
 KRAUS_dip_alb_invite:0 "亚得里亚对岸"
 KRAUS_dip_alb_invite_desc:0 "阿尔巴尼亚是亚得里亚海的东岸。把它留在同盟里，海峡就不会被别人关上。"
 KRAUS_dip_alb_invite_tt:0 "向§Y阿尔巴尼亚§!发出邀请，请它加入§Y多瑙-亚得里亚同盟§!。"
 KRAUS_dip_ott_olive:0 "博斯普鲁斯的橄榄枝"
 KRAUS_dip_ott_olive_desc:0 "奥斯曼帝国是旧欧洲最后的大帝国之一，与维也纳没有解不开的结。萨拉热窝是个合适的地方：不在维也纳，也不在伊斯坦布尔。"
 KRAUS_dip_ott_olive_tt:0 "向§Y奥斯曼帝国§!发出萨拉热窝会谈的邀请，开启§YKR 原有的萨拉热窝同盟事件链§!；两国研究所加入同一个技术共享组。"
 KRAUS_dip_events.40.t:0 "维也纳的邀请"
 KRAUS_dip_events.40.d:0 "奥地利大使带来了一封信：维也纳邀请保加利亚加入多瑙-亚得里亚同盟。巴尔干战争刚刚过去，每个人都在重新计算谁是朋友。"
 KRAUS_dip_events.40.a:0 "保加利亚接受。"
 KRAUS_dip_events.40.b:0 "保加利亚走自己的路。"
 KRAUS_dip_events.41.t:0 "保加利亚入盟"
 KRAUS_dip_events.41.d:0 "索非亚接受了我们的邀请。保加利亚加入了多瑙-亚得里亚同盟。"
 KRAUS_dip_events.41.a:0 "巴尔干多了一个朋友。"
 KRAUS_dip_events.42.t:0 "保加利亚拒绝了"
 KRAUS_dip_events.42.d:0 "索非亚婉拒了我们的邀请。保加利亚人记得巴尔干战争里每一个转身的人。"
 KRAUS_dip_events.42.a:0 "也许以后。"
 KRAUS_dip_events.43.t:0 "维也纳的邀请"
 KRAUS_dip_events.43.d:0 "制裁已经取消，奥地利大使带来了一封信：维也纳邀请希腊加入多瑙-亚得里亚同盟。希腊的邻居不少，朋友不多。"
 KRAUS_dip_events.43.a:0 "希腊接受。"
 KRAUS_dip_events.43.b:0 "希腊保持中立。"
 KRAUS_dip_events.44.t:0 "希腊入盟"
 KRAUS_dip_events.44.d:0 "雅典接受了我们的邀请。希腊加入了多瑙-亚得里亚同盟。"
 KRAUS_dip_events.44.a:0 "爱琴海也有了朋友。"
 KRAUS_dip_events.45.t:0 "希腊拒绝了"
 KRAUS_dip_events.45.d:0 "雅典婉拒了我们的邀请。希腊人记得没收产业之后的那些制裁。"
 KRAUS_dip_events.45.a:0 "也许以后。"
 KRAUS_dip_events.46.t:0 "维也纳的邀请"
 KRAUS_dip_events.46.d:0 "奥地利大使带来了一封信：维也纳邀请阿尔巴尼亚加入多瑙-亚得里亚同盟。地拉那的政府需要一个靠山，也不想失去独立。"
 KRAUS_dip_events.46.a:0 "阿尔巴尼亚接受。"
 KRAUS_dip_events.46.b:0 "阿尔巴尼亚拒绝。"
 KRAUS_dip_events.47.t:0 "阿尔巴尼亚入盟"
 KRAUS_dip_events.47.d:0 "地拉那接受了我们的邀请。阿尔巴尼亚加入了多瑙-亚得里亚同盟。"
 KRAUS_dip_events.47.a:0 "亚得里亚对岸安稳了。"
 KRAUS_dip_events.48.t:0 "阿尔巴尼亚拒绝了"
 KRAUS_dip_events.48.d:0 "地拉那婉拒了我们的邀请。"
 KRAUS_dip_events.48.a:0 "也许以后。"
