l_simp_chinese:
 KRAUS_pl_L1:0 "联邦行政化纲要"
 KRAUS_pl_L1_desc:0 "维也纳把各王冠领地改组为联邦各邦的步骤列成一张时间表：谁来签字，谁来接收，账册何时过户。表一贴出，各地的旧衙门才第一次知道自己要在哪一天改换门牌。"
 KRAUS_pl_L2:0 "留用旧官员"
 KRAUS_pl_L2_desc:0 "王冠领地的旧官员没有被一纸命令打发走，而是被问了一个问题：愿意留下的，职位照旧，只是薪水从此由联邦的账上发。他们熟悉本地的矿山、农庄和户籍，这是新来的人一时学不会的。"
 KRAUS_pl_L3:0 "重组地方行政机构"
 KRAUS_pl_L3_desc:0 "各邦的旧衙门不再按王冠领地的老规矩分科办事。民政、财政、工务三个厅照联邦的统一编制设立，战争留下的荒地也由新的工务厅重新丈量。"
 KRAUS_pl_L4:0 "议席并入"
 KRAUS_pl_L4_desc:0 "各邦的议席被并进帝国议会的名册。议员们在新的席位上坐下，随他们一起交过来的，还有军官团的名册。"
 KRAUS_pl_L5:0 "民族大和解"
 KRAUS_pl_L5_desc:0 "最后一场联席会议上，没有人再谈谁吞并了谁。各民族的代表在同一份文件上签字，文件规定：联邦由各邦组成，各邦的人民在联邦之内一律平等。"
 KRAUS_pl_M0:0 "重启金色多瑙河计划"
 KRAUS_pl_M0_desc:0 "从林茨到铁门峡，航道、船闸和码头交给同一个委员会规划。这份计划的图纸在先帝时代就画好了，在部里的柜子里放了二十年；如今计划委员会把各邦的铁路、工厂和仓库也画上了同一张图。"
 KRAUS_pl_M_diet:0 "组建邦议会"
 KRAUS_pl_M_diet_desc:0 "各邦按新宪章选出自己的邦议会。第一次会议上，议员们先要商定的是用哪几种语言记录会议，然后才轮到预算。"
 KRAUS_pl_M_lang:0 "各语言的平等地位"
 KRAUS_pl_M_lang_desc:0 "官方文件开始用帝国境内的主要语言并列印发。学校的教学语言由地方议会决定，不再由维也纳统一指派。"
 KRAUS_pl_M_seat:0 "联邦与各邦的分权"
 KRAUS_pl_M_seat_desc:0 "哪些事归维也纳，哪些事归各邦，写进了一张两栏的清单：外交、军队、铁路与货币在左栏，学校、警察、道路与救济在右栏。清单的附件比清单本身厚得多。"
 KRAUS_pl_M_rail:0 "铁路与公路的统一检修"
 KRAUS_pl_M_rail_desc:0 "帝国铁路局把各邦自己的线路并入同一套检修编制，道岔和路标的标准从此一致。"
 KRAUS_pl_M_park:0 "联邦工业规划局"
 KRAUS_pl_M_park_desc:0 "联邦工业规划局决定新工厂建在哪里。它的第一份规划没有照顾任何一个邦，而是照着煤、电和铁路的位置画的。"
 KRAUS_pl_M_mob:0 "联合动员预案"
 KRAUS_pl_M_mob_desc:0 "总参谋部与各邦的军区司令部一起制定了一份战时动员预案，规定了哪些营在三天内集结，哪些仓库在十二小时内开门。"
 KRAUS_pl_M_arms:0 "军工的区域分布"
 KRAUS_pl_M_arms_desc:0 "军工订单不再集中在维也纳近郊，而是分摊到各邦的工厂，地方的技术人员也被请进了军工设计室。"
 KRAUS_pl_M_dock:0 "伊斯特拉的船台"
 KRAUS_pl_M_dock_desc:0 "亚得里亚海岸的伊斯特拉半岛上，旧船台被重新铺上龙骨，海军部在这里给各邦的造船厂拨下第一批订单。"
 KRAUS_pl_M_end:0 "帝国统一大市场"
 KRAUS_pl_M_end_desc:0 "各邦之间最后一批关卡被撤销，度量衡与商业登记也统一了。报纸用整版刊登了一张地图，地图上已看不出哪些线路原本属于哪一个王冠领地。"
 KRAUS_pl_R0:0 "对外纲要"
 KRAUS_pl_R0_desc:0 "外交部起草了一份致邻国的说明：帝国的联邦行政化是内政，对邻国的通商与来往照旧，而且会更便利。"
 KRAUS_pl_R_pol:0 "波兰合作"
 KRAUS_pl_R_pol_desc:0 "华沙与维也纳的商会共同起草了一份合作章程，规定了关税、铁路联运与共同投资的比例。"
 KRAUS_pl_R_ukr:0 "乌克兰合作"
 KRAUS_pl_R_ukr_desc:0 "基辅的粮食合作社与维也纳的银行签下了长期协议，粮食与贷款开始双向流动。"
 KRAUS_pl_R_ger:0 "德国合作"
 KRAUS_pl_R_ger_desc:0 "德奥贸易协定之后，莱茵与多瑙的工厂主们又签了一份更细的合作条款，涉及机床、电机与技术标准。"
 KRAUS_pl_R_ita:0 "意大利合作"
 KRAUS_pl_R_ita_desc:0 "亚得里亚海两岸的港口开始互通班轮，的里雅斯特与热那亚的船东组成了联合航运公司。"
 KRAUS_pl_R_bal:0 "巴尔干的清算"
 KRAUS_pl_R_bal_desc:0 "保加利亚战败之后，贝尔格莱德与布加勒斯特的旧账被摆上了谈判桌。维也纳提出的方案是：互相撤回在对方境内的一切秘密行动。"
 KRAUS_pl_speed_tt:0 "「官员与军官的不满」决议的读条时间和点数花费各降低 10%（读条最低 10 天）。"
 KRAUS_pl_cycle30_tt:0 "整合红利的周期缩短 30 天。"
 KRAUS_pl_cycle15_tt:0 "整合红利的周期缩短 15 天。"
 KRAUS_pl_power_tt:0 "整合红利强化一档。"
 KRAUS_pl_generals_tt:0 "此后整合的王冠领，其将领转为奥地利国籍。"
 KRAUS_pl_comp_15_tt:0 "奥地利占有的、核心属于王冠领的非核心州顺从度 +15，并开启按顺从度整合。"
 KRAUS_pl_comp_10_tt:0 "奥地利占有的、核心属于王冠领的非核心州顺从度 +10，并开启按顺从度整合。"
 KRAUS_pl_recovery_tt:0 "原王冠领地的核心州获得「地方的复苏」：当地建设速度 +10%，当地人力 +5%。"
 KRAUS_pl_militia_1_tt:0 "获得 1 个人力装备满编、经验最高的 9 营山地民兵师。"
 KRAUS_pl_militia_2_tt:0 "获得 2 个人力装备满编、经验最高的 9 营山地民兵师。"
 KRAUS_pl_div_pp_tt:0 "整合红利新增一项：政治点数加成。"
 KRAUS_pl_div_rs_tt:0 "整合红利新增一项：研究加成。"
 KRAUS_pl_div_pop_tt:0 "整合红利新增一项：民兵师与更多人力。"
 KRAUS_pl_levy_tt:0 "可征兵人口按各邦的忠诚档位增加。"
 KRAUS_pl_R0_tt:0 "解锁四个邻国的合作国策与「巴尔干的清算」。"
 KRAUS_coop_POL_tt:0 "开启与波兰的合作，之后每隔一个周期得到一次合作红利。"
 KRAUS_coop_UKR_tt:0 "开启与乌克兰的合作，之后每隔一个周期得到一次合作红利。"
 KRAUS_coop_GER_tt:0 "开启与德国的合作，之后每隔一个周期得到一次合作红利。"
 KRAUS_coop_ITA_tt:0 "开启与意大利的合作，之后每隔一个周期得到一次合作红利。"
 KRAUS_coop_start_tt:0 "合作红利从下一个周期起生效。"
 KRAUS_pl_bal_tt:0 "罗马尼亚在特兰西瓦尼亚的破坏行动与塞尔维亚针对伊利里亚的行动，其效果被撤销；塞尔维亚对奥地利的战争预案国策此后不再可选。"
 KRAUS_pl_no_war_tt:0 "与塞尔维亚、罗马尼亚都不在战争中"
 KRAUS_pl_no_war_tt_NOT:0 "与塞尔维亚或罗马尼亚处于战争中"
 KRAUS_pl_advisors_tt:0 "此后整合的王冠领，其顾问转为奥地利国籍。"
 KRAUS_pl_scientists_tt:0 "此后整合的王冠领，其科学家转为奥地利国籍；「军工的区域分布」得到额外奖励。"
 KRAUS_pl_gov_none_tt:0 "此后整合的王冠领地不再带来「地方的怨言」。"
 KRAUS_pl_harmony_tt:0 "「哈布斯堡王冠领地大宪章」的效果翻倍。"
 KRAUS_div_bonus_tt:0 "红利强度已满：另得 30 点政治点数与 5000 人力。"
 KRAUS_pl_mobilisation_tt:0 "获得 10 个人力装备满编、经验最高的 9 营山地民兵师。"
 KRAUS_pl_mobilisation_bal_tt:0 "与塞尔维亚或罗马尼亚交战，另得 5 个同样的民兵师。"
 KRAUS_pl_recovery:0 "新设的地方行政机构"
 KRAUS_pl_recovery_desc:0 "民政、财政、工务三个厅按联邦的统一编制办事。"
 KRAUS_pl_mobilisation:0 "帝国动员令"
 KRAUS_pl_mobilisation_desc:0 "战争爆发的第二天，总参谋部的电报发往各邦的军区司令部：预案启用，民兵集结。"
 KRAUS_coop_tech_POL:0 "与波兰的合作"
 KRAUS_coop_POL:0 "与波兰的合作红利"
 KRAUS_coop_POL_desc:0 "合作章程按周期结算一次红利。"
 KRAUS_coop_tech_UKR:0 "与乌克兰的合作"
 KRAUS_coop_UKR:0 "与乌克兰的合作红利"
 KRAUS_coop_UKR_desc:0 "合作章程按周期结算一次红利。"
 KRAUS_coop_tech_GER:0 "与德国的合作"
 KRAUS_coop_GER:0 "与德国的合作红利"
 KRAUS_coop_GER_desc:0 "合作章程按周期结算一次红利。"
 KRAUS_coop_tech_ITA:0 "与意大利的合作"
 KRAUS_coop_ITA:0 "与意大利的合作红利"
 KRAUS_coop_ITA_desc:0 "合作章程按周期结算一次红利。"
 KRAUS_pl.1.t:0 "各邦的企业家"
 KRAUS_pl.1.d:0 "管理各邦的办法定下之后，维也纳商会的会长递来一份名单：各邦的几十位企业家和旧政府的顾问，愿意到联邦的部委任职，条件是有人为他们引见。"
 KRAUS_pl.1.a:0 "引见他们，把他们吸纳进来。"
 KRAUS_pl.1.b:0 "暂且搁置。"
 KRAUS_pl.2.t:0 "各邦的科学家"
 KRAUS_pl.2.d:0 "联邦工业规划局的名单里，有一页记着各邦研究所的研究员。他们的实验室没有被撤销，却一直在等维也纳给出一个明确的说法。"
 KRAUS_pl.2.a:0 "邀请他们加入联邦的研究体系。"
 KRAUS_pl.2.b:0 "保持现状，只给予经费。"
 KRAUS_coop.1.t:0 "与波兰合作的开端"
 KRAUS_coop.1.d:0 "合作章程的签字仪式没有演讲，只有两位办事员交换了盖好章的文本。第二天，第一批货物与第一笔汇款同时出发。"
 KRAUS_coop.1.a:0 "章程生效。"
 KRAUS_coop.11.t:0 "与波兰的合作红利"
 KRAUS_coop.11.d:0 "一个周期过去，合作章程的账册被送到维也纳。账面上的数字不大，却比上一个周期多出了一行。"
 KRAUS_coop.11.a:0 "记入帝国的账。"
 KRAUS_coop.2.t:0 "与乌克兰合作的开端"
 KRAUS_coop.2.d:0 "合作章程的签字仪式没有演讲，只有两位办事员交换了盖好章的文本。第二天，第一批货物与第一笔汇款同时出发。"
 KRAUS_coop.2.a:0 "章程生效。"
 KRAUS_coop.12.t:0 "与乌克兰的合作红利"
 KRAUS_coop.12.d:0 "一个周期过去，合作章程的账册被送到维也纳。账面上的数字不大，却比上一个周期多出了一行。"
 KRAUS_coop.12.a:0 "记入帝国的账。"
 KRAUS_coop.3.t:0 "与德国合作的开端"
 KRAUS_coop.3.d:0 "合作章程的签字仪式没有演讲，只有两位办事员交换了盖好章的文本。第二天，第一批货物与第一笔汇款同时出发。"
 KRAUS_coop.3.a:0 "章程生效。"
 KRAUS_coop.13.t:0 "与德国的合作红利"
 KRAUS_coop.13.d:0 "一个周期过去，合作章程的账册被送到维也纳。账面上的数字不大，却比上一个周期多出了一行。"
 KRAUS_coop.13.a:0 "记入帝国的账。"
 KRAUS_coop.4.t:0 "与意大利合作的开端"
 KRAUS_coop.4.d:0 "合作章程的签字仪式没有演讲，只有两位办事员交换了盖好章的文本。第二天，第一批货物与第一笔汇款同时出发。"
 KRAUS_coop.4.a:0 "章程生效。"
 KRAUS_coop.14.t:0 "与意大利的合作红利"
 KRAUS_coop.14.d:0 "一个周期过去，合作章程的账册被送到维也纳。账面上的数字不大，却比上一个周期多出了一行。"
 KRAUS_coop.14.a:0 "记入帝国的账。"
 KRAUS_pl_sci:0 "各邦科学家的成果"
 KRAUS_pl_sci_tt:0 "研究加成：来自加入联邦研究体系的各邦科学家。"
 KRAUS_pl_balkan_open_tt:0 "奥地利尚未完成§Y巴尔干的清算§!"
 KRAUS_pl_L2b:0 "统一联邦土地政策"
 KRAUS_pl_L2b_desc:0 "各邦的土地册一页一页抄进联邦的地籍簿，土地的买卖、继承与征税从此照同一部法律办。维也纳与地方的税册第一次对上了账。"
 KRAUS_pl_L3b:0 "派遣联邦总督"
 KRAUS_pl_L3b_desc:0 "维也纳不撤销各邦的政府，而是往每座首府派一位总督，人选出自本地，只对联邦负责。各邦的用地与工程从此要经总督府批准，批下来的也比从前多。"
 KRAUS_pl_L3c:0 "联邦建设局"
 KRAUS_pl_L3c_desc:0 "联邦建设局在每一个邦的首府都设了分局，预算由联邦拨付，工程由地方挑选。第一批获准动工的是粮仓、学校与城市供水。"
 KRAUS_pl_L3d:0 "开放的联邦军官团"
 KRAUS_pl_L3d_desc:0 "共同军队的委任状向各邦的军官世家开放，条件与奥地利人相同。新名册上最先写下的名字，来自萨格勒布、布拉格与利沃夫。"
 KRAUS_pl_M_crown:0 "联邦发展纲要"
 KRAUS_pl_M_crown_desc:0 "议席、铁路与工业园都已议定，规划委员会为整个联邦提出一份纲要：一张工期表，一本预算，一枚印。纲要建什么，取决于帝国此刻是什么模样。"
 KRAUS_pl_R_stance_ger:0 "德意志取向"
 KRAUS_pl_R_stance_ger_desc:0 "外交部认定维也纳的未来在北方与西方。德国公使馆得到一句低声的保证：将来的任何一条界线，奥地利都不会站在对面。"
 KRAUS_pl_R_stance_ent:0 "协约取向"
 KRAUS_pl_R_stance_ent_desc:0 "外交部认定帝国的未来在西方的强国一边。巴黎与伦敦都接见了使节，巴尔干的那只卷宗被收进写着「日后再议」的抽屉。"
 KRAUS_pl_R_stance_own:0 "自己的路"
 KRAUS_pl_R_stance_own_desc:0 "外交部认定帝国不加入任何集团，也不向任何人许诺。发给各国使馆的照会只有三句话，三句都关于贸易。"
 KRAUS_pl_R_second:0 "第二期合作"
 KRAUS_pl_R_second_desc:0 "最初几年签下的合作宪章续期。还是那些书记在那些房间里碰面，只是这一次的附件更长，数目也更大。"
 KRAUS_pl_gov_to2_tt:0 "「地方的怨言」降低一档。"
 KRAUS_pl_slots_crownland_tt:0 "奥地利占有并控制的、核心属于王冠领的每个州获得一个共享建筑槽。"
 KRAUS_pl_M_crown_seats_tt:0 "奥地利占有并控制的、核心属于王冠领的每个州获得一个共享建筑槽；其中非奥地利核心的州另获 10 点顺从度。"
 KRAUS_pl_M_crown_dyn_tt:0 "获得两座地图外民用工厂，稳定度 +5%。"
 KRAUS_pl_R_stance_ger_tt:0 "德国对奥地利的好感上升。"
 KRAUS_pl_R_stance_ent_tt:0 "法国与英国对奥地利的好感上升。"
 KRAUS_pl_R_stance_own_tt:0 "奥地利置身于一切集团之外，不向任何人许诺。"
 KRAUS_pl_R_second_ger_tt:0 "立即再抽一次对德合作红利。"
 KRAUS_pl_R_second_pol_tt:0 "立即再抽一次对波合作红利。"
 KRAUS_pl_R_second_ita_tt:0 "立即再抽一次对意合作红利。"
 KRAUS_pl_R_second_ukr_tt:0 "立即再抽一次对乌合作红利。"
 KRAUS_pl_R_second_none_tt:0 "奥地利未与任何国家签有合作宪章，独行的收益即在此。"
 # --- 10-27 第三轮 ---
