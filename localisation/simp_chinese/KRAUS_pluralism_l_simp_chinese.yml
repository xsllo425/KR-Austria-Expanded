 KRAUS_fed_no_SLO_tt:0 "没有民族精神：§Y$KRAUS_cg_SLO_1$§!"
 KRAUS_fed_no_TRS_tt:0 "没有民族精神：§Y$KRAUS_cg_TRS_1$§!"
 KRAUS_pl.3.t:0 "怎样管理各邦"
 KRAUS_pl.3.d:0 "纲要贴出去之后，内阁要回答的问题只剩一个：由谁来管各邦。\n\n内政部主张留用王冠领地的旧官员，他们熟悉本地，换人只会耽误事。财政部主张按联邦的统一编制重组各邦的行政机构，旧衙门的规矩一律作废。总理府则主张往每座首府派一位联邦总督，地方政府照旧，但重要的事由总督批。\n\n三种办法都有人支持，内阁只能选一种。"
 KRAUS_pl.3.a:0 "留用旧官员。"
 KRAUS_pl.3.b:0 "重组地方行政机构。"
 KRAUS_pl.3.c:0 "派遣联邦总督。"
 KRAUS_pl_harmony_later_tt:0 "以后完成「$KRAUS_federal_charter$」时，直接获得加强版的「$KRAUS_crown_harmony$」。"
