l_simp_chinese:
 KRAUS_news_events.1.t:0 "[AUS.GetNameDef]新内阁成立"
 KRAUS_news_events.1.d:0 "[AUS.GetNameDef]第二次议会选举的结果已经公布，新的内阁名单随后获得皇帝认可。\n\n议会的重心已经随选举结果移动，新内阁接下来要处理的是语言、财政、行政和军队四个问题。"
 KRAUS_news_events.1.a:0 "知道了。"
 KRAUS_news_events.2.t:0 "[AUS.GetNameDef]改组为联邦式合众国"
 KRAUS_news_events.2.d:0 "维也纳宣布，帝国依照合众国决议改组为联邦式的合众国。各王冠领保留自己的议会与语言，并在联合议会中平等发言，外交与军队仍由中央负责。\n\n评论认为，这样的安排让国内更为稳固，但各王领的整合也会因此进行得更慢。"
 KRAUS_news_events.2.a:0 "知道了。"
 KRAUS_news_events.3.t:0 "[AUS.GetNameDef]改组为统一式合众国"
 KRAUS_news_events.3.d:0 "维也纳宣布，帝国依照合众国决议改组为统一式的合众国：一部宪法、一个政府、一套军令。\n\n中央直辖提高了工业与动员的效率，但旧王冠领的议员已经开始就各自的地位向维也纳提出异议。"
 KRAUS_news_events.3.a:0 "知道了。"
 KRAUS_news_events.4.t:0 "多瑙河危机宣告了结"
 KRAUS_news_events.4.d:0 "围绕多瑙河沿岸王冠领地的危机已经了结。维也纳随后恢复了各地的行政与财政安排，航运与关税也重新回到正常的轨道上。"
 KRAUS_news_events.4.a:0 "知道了。"
 KRAUS_news_events.5.t:0 "维也纳对 1848 年旧案从宽处理"
 KRAUS_news_events.5.d:0 "维也纳宣布，对 1848 年遗留的控诉从宽处理：相关人员获得赦免，被没收的财产将发还。\n\n保守派的报纸称此举过于软弱，自由派则表示欢迎。"
 KRAUS_news_events.5.a:0 "知道了。"
 KRAUS_news_events.6.t:0 "维也纳严惩 1848 年旧案"
 KRAUS_news_events.6.d:0 "法院公布了对 1848 年事件的追诉结果：多名当年的领袖被缺席判处重刑，相关社团被取缔。\n\n匈牙利的议员对判决提出了抗议。"
 KRAUS_news_events.6.a:0 "知道了。"
 KRAUS_news_events.7.t:0 "圣斯蒂芬王冠的权力被拆分"
 KRAUS_news_events.7.d:0 "维也纳宣布，圣斯蒂芬王冠所涉及的领土将由各王冠领地分别行使权利：南部平原划入伊利里亚，外喀尔巴阡划入加利西亚，多瑙平原划入斯洛伐克。\n\n匈牙利议会对这一决定表示强烈反对。"
 KRAUS_news_events.7.a:0 "知道了。"
 KRAUS_news_events.8.t:0 "《王冠领地联邦大宪章》公布"
 KRAUS_news_events.8.d:0 "《王冠领地联邦大宪章》今日公布，规定了各王冠领的权利与帝国的义务，并划分了王冠领议会与帝国议会的职权。\n\n宪章将于近期交由各王冠领议会批准。"
 KRAUS_news_events.8.a:0 "知道了。"
 KRAUS_news_events.9.t:0 "哈布斯堡世界帝国"
 KRAUS_news_events.9.d:0 "战争结束之后，哈布斯堡的影响力迅速扩大，已不再局限于欧洲，而是延伸到了欧洲之外。\n\n各国政府尚未公开回应。"
 KRAUS_news_events.9.a:0 "知道了。"
