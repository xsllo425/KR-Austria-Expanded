l_simp_chinese:
 KRAUS_world_category:0 "世界的风暴"
 KRAUS_world_category_desc:0 "别人家的内战，对维也纳是一面镜子，也是一次机会。"
 KRAUS_spa_support:0 "西班牙：选择一方"
 KRAUS_spa_support_desc:0 "西班牙已经陷入内战。奥地利可以选择支援其中一方，也可以只在远处观察；内战一旦结束，这个机会就错过了。"
 KRAUS_spa_contact:0 "西班牙：接触胜者"
 KRAUS_spa_contact_desc:0 "西班牙的内战已经结束。新的主人需要邻国的承认，奥地利可以做第一批。如果胜者是社会主义政府，这一步会自动完成，不获得任何奖励。"
 KRAUS_acw_support:0 "美国：选择一方"
 KRAUS_acw_support_desc:0 "美国已经分裂。交战方的数量和阵营每局都不一样，奥地利可以选择支援其中一个非社会主义的政权，也可以只在远处观察。内战结束后这个机会就错过了。"
 KRAUS_acw_contact:0 "美国：接触胜者"
 KRAUS_acw_contact_desc:0 "美国的内战已经结束。留下来的几个大国需要欧洲的承认，奥地利可以先伸出手。如果留下来的都是社会主义政府，这一步会自动完成，不获得任何奖励。"
 KRAUS_civwar_events.1.t:0 "大洋彼岸的选择"
 KRAUS_civwar_events.1.d:0 "美国分裂了。各个政权的使者在同一周里敲开了维也纳外交部的门，每一个都说，自己才是合法的继承者。\n\n奥地利比任何人都清楚，一个多民族的国家是怎样分裂的，也清楚自己该从中学到什么。"
 KRAUS_civwar_events.1.USA:0 "支援联邦政府。"
 KRAUS_civwar_events.1.ACC:0 "支援宪法联盟。"
 KRAUS_civwar_events.1.WCA:0 "支援西海岸政权。"
 KRAUS_civwar_events.1.NEE:0 "支援新英格兰。"
 KRAUS_civwar_events.1.watch:0 "只作观察，不选边。"
 KRAUS_civwar_events.2.t:0 "比利牛斯山以南"
 KRAUS_civwar_events.2.d:0 "西班牙的内战里，各方的使者都来了维也纳：君主派、共和派、卡洛斯派，每一方都希望得到哈布斯堡的支持。\n\n老外交官说：「别忘了，马德里的王冠上，也有哈布斯堡的影子。」"
 KRAUS_civwar_events.2.SPA:0 "支援西班牙政府。"
 KRAUS_civwar_events.2.SPK:0 "支援共和派。"
 KRAUS_civwar_events.2.SPR:0 "支援卡洛斯派。"
 KRAUS_civwar_events.2.watch:0 "只作观察，不选边。"
 KRAUS_civwar_events.3.t:0 "美国内战爆发"
 KRAUS_civwar_events.3.d:0 "美国的内战爆发了。电报机整夜响个不停，参谋本部的地图前围满了人。\n\n外交线的「大洋彼岸」国策现在可以让奥地利选择支援一方。内战的进程是它们自己的，机会只在战争进行时存在。"
 KRAUS_civwar_events.3.a:0 "关注事态发展。"
 KRAUS_civwar_events.4.t:0 "西班牙内战爆发"
 KRAUS_civwar_events.4.d:0 "西班牙爆发了内战。\n\n外交线的「伊比利亚的旧王冠」国策现在可以让奥地利选择支援一方。内战的进程是它们自己的，机会只在战争进行时存在。"
 KRAUS_civwar_events.4.a:0 "关注事态发展。"
 KRAUS_hungary_rebuild:0 "重建匈牙利"
 KRAUS_hungary_rebuild_desc:0 "叛乱留下的是烧毁的仓库、断掉的铁路和被打碎的信任。重建，是比镇压更漫长的一场战争：用货币、工程与时间，把布达佩斯重新缝回帝国。"
 KRAUS_hd_legacy_dm:0 "哈布斯堡外交遗产"
 KRAUS_hd_legacy_dm_tt:0 "每个盟友：政治点数获取 +1%（哈布斯堡世界帝国之后 +2%）。\n完成「多瑙河之外」后，每个附庸（任意形式）另外多贡献 1% 的民用与军用工业。"
 KRAUS_hd_legacy_tt:0 "获得动态修正§Y哈布斯堡外交遗产§!：每个盟友 +1% 政治点数获取。"
 KRAUS_hd_sub_tt:0 "§Y哈布斯堡外交遗产§!延伸到附庸：每个附庸（任意形式）多贡献 1% 的民用与军用工业。"
 KRAUS_hd_subject:0 "哈布斯堡外交遗产（附庸）"
