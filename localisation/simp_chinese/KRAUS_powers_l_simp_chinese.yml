l_simp_chinese:
 KRAUS_pwr_root:0 "列强的邀请"
 KRAUS_pwr_root_desc:0 "第三国际和莫斯科协约的阴影压在东面，奥地利作为德国传统的盟友，不可能独善其身。柏林、伦敦、巴黎和莫斯科都在看着维也纳，各有各的请柬。"
 KRAUS_pwr_ger_trade:0 "德奥贸易协定"
 KRAUS_pwr_ger_trade_desc:0 "德国需要稳定的中欧市场，奥地利需要德国的工业品与资本。一份关税减让协定，对两边都是实惠。"
 KRAUS_pwr_entente:0 "接触协约国"
 KRAUS_pwr_entente_desc:0 "协约国的大使馆里从来不缺茶会。伦敦不指望奥地利成为朋友，但它记得，哥本哈根的桌子上少不了一把中立的椅子。"
 KRAUS_pwr_usa:0 "大洋彼岸"
 KRAUS_pwr_usa_desc:0 "美国正陷在自己的内战里，却依然是最大的工业国家。把目光越过大西洋，可以看到另一个多民族国家的教训。"
 KRAUS_pwr_internationale:0 "接触第三国际"
 KRAUS_pwr_internationale_desc:0 "巴黎的人民公社不会放弃输出革命，但它的工人阶级也需要买卖。这样的交易，不能让柏林知道。"
 KRAUS_pwr_moscow_pact:0 "东面的互不侵犯条约"
 KRAUS_pwr_moscow_pact_desc:0 "莫斯科的要求很简单：奥地利不要出现在它的西边防线上。一纸条约能让边境安静一阵，但谁也不会真的相信它。"
 KRAUS_pwr_moscow_pact_tt:0 "向§Y俄国§!提议互不侵犯条约。俄国可能接受，也可能拒绝；接受后获得小增益，但这只是一张纸，莫斯科随时可能撕毁它。"
 KRAUS_pwr_ger_trade_idea:0 "德奥贸易协定"
 KRAUS_pwr_entente_contact:0 "协约国联络"
 KRAUS_pwr_internationale_contact:0 "第三国际联络"
 KRAUS_pwr_moscow_pact_idea:0 "东面的和平"
 KRAUS_pwr_events.1.t:0 "维也纳的提议"
 KRAUS_pwr_events.1.d:0 "奥地利大使带来一份草案：互不侵犯，边境安静，各自管好自己的西边或东边。\n\n克里姆林宫的外交人民委员把草案翻了两遍，说：「条约不贵。但它得有个价钱。」"
 KRAUS_pwr_events.1.a:0 "签字。"
 KRAUS_pwr_events.1.b:0 "暂时不必。"
 KRAUS_pwr_events.2.t:0 "俄国接受了条约"
 KRAUS_pwr_events.2.d:0 "莫斯科接受了互不侵犯条约。边境将安静一段时间，至少在两国都需要它安静的时候。"
 KRAUS_pwr_events.2.a:0 "东面暂时安全了。"
 KRAUS_pwr_events.3.t:0 "俄国拒绝了条约"
 KRAUS_pwr_events.3.d:0 "莫斯科婉拒了互不侵犯条约。「时机不对」，大使转述道。"
 KRAUS_pwr_events.3.a:0 "也许以后。"
 KRAUS_pwr_entente_cph_tt:0 "协约国的联络人会在§Y哥本哈根会议§!上为奥地利充当调停者：会议开启时，奥地利可以出面斡旋，降低世界紧张度。"
 KRAUS_pwr_internationale_tt:0 "这是一项§R密约§!：背着德国签订。一旦被柏林察觉，德奥关系将严重受损，德奥贸易协定也会作废。"
 KRAUS_copenhagen_mediation:0 "哥本哈根会议的调停"
 KRAUS_pwr_betrayal:0 "被背叛的信任"
 KRAUS_pwr_events.10.t:0 "哥本哈根的席位"
 KRAUS_pwr_events.10.d:0 "德国、法国与协约国的代表即将在哥本哈根坐到同一张桌子上，谈如何降低世界的紧张。协约国的联络人转来一句话：奥地利在两边都有朋友，也许愿意出面。\n\n维也纳的外交部长说：「这是一次表现的机会，也是一次风险。」"
 KRAUS_pwr_events.10.a:0 "出面斡旋，做会议的调停者。"
 KRAUS_pwr_events.10.b:0 "只派观察员。"
 KRAUS_pwr_events.20.t:0 "柏林的情报"
 KRAUS_pwr_events.20.d:0 "德国的情报机关截获了一份文件：奥地利与第三国际之间存在一份未曾公开的贸易与通行协定。\n\n德国大使要求解释。他的语气很平静，平静得让人不安。"
 KRAUS_pwr_events.20.a:0 "否认一切。"
 KRAUS_pwr_events.20.b:0 "承认，并解释这只是生意。"
 KRAUS_pwr_events.30.t:0 "莫斯科撕毁了条约"
 KRAUS_pwr_events.30.d:0 "互不侵犯条约被莫斯科单方面宣布「不再适应形势」。官方的措辞很客气，实际的意思是：它从来就没有打算遵守。\n\n外交部的老官员叹了口气：「与虎谋皮，本来就不可能真的可信。我们只是多拿了几个月的安静。」"
 KRAUS_pwr_events.30.a:0 "我们早有预料。"
