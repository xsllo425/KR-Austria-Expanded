l_simp_chinese:
 KRAUS_german_military_mission: "玛丽亚·特蕾莎军事学院"
 KRAUS_german_military_mission_desc: "1751 年，玛丽亚·特蕾莎女皇于维也纳新城创办了这座世界上最古老的军事学院。如今德国教官进驻讲席，课程体系按照国防军「快速、协同、决战」的教范全面重编。"
 KRAUS_eco_recovered: "多瑙河的繁荣"
 KRAUS_eco_recovered_desc: "闲置的产能重新转动了。第一批订单来自克虏伯，第二批来自柏林的铁路公司。\n\n工人回到了车间，机器重新发出声音。维也纳的货架满了，物价稳了，街头的抱怨少了。"
 KRAUS_german_military_equipment: "斯柯达-克虏伯联合体"
 KRAUS_german_military_equipment_desc: "口径统一了。\n\n步枪、机枪、火炮、弹药——所有规格向德国看齐。后勤部门的抱怨少了，前线的补给顺了，新兵训练的时间短了。\n\n代价是：§Y奥地利的军械库从此长在德国的供应链上。§!"
 KRAUS_german_military_armor: "艾曼斯贝格的装甲教范"
 KRAUS_german_military_armor_desc: "总参谋部选择了装甲兵。\n\n斯柯达的车间开始生产坦克底盘，蒂罗尔的试验场昼夜不停。德国人提供了图纸，奥地利人提供了产能——这是双方都满意的分工。\n\n§Y集中使用装甲力量，而不是把它们拆散给步兵。§!"
 KRAUS_german_military_infantry: "马特纳的征兵与训练体系"
 KRAUS_german_military_infantry_desc: "总参谋部选择了步兵与炮兵。\n\n理由很实际：帝国的人力充足，工业有限。与其造几百辆坦克，不如让每个步兵师都拥有足够的火炮和训练。\n\n§Y这是贫穷国家最理性的军事选择。§!"
 KRAUS_german_military_combined: "总参谋部的最后方案"
 KRAUS_german_military_combined_desc: "总参谋部拒绝了单一兵种路线。\n\n装甲、步兵、炮兵、工兵、通信——所有兵种被编进同一个战斗群，按统一的节奏协同。这需要极高的训练水平，也需要士兵们愿意为彼此负责。\n\n§Y代价是昂贵，回报是：这样的部队能打赢任何一场势均力敌的仗。§!"
 KRAUS_common_army_reborn: "帝国陆军重生"
 KRAUS_common_army_reborn_desc: "旧操典被逐条翻出来质疑，新的训练周期跑完了一整轮。\n\n营连长们不再用尺子画轴线，而是用无线电协调；装甲兵重新编成独立单位。一支知道怎么一起打仗的军队，终于代替了那支「什么都有一点」的军队。"
 KRAUS_german_capital_inflow: "德国资本输入"
 KRAUS_german_capital_inflow_desc: "德国银行开始向奥地利企业放贷。\n\n条件不算苛刻：股份可以保留，管理由奥地利人负责。德国人要的是市场和原料——而这两样，奥地利的工业体系刚好能提供。\n\n§Y资本的流向决定了政治的走向。从这一天起，维也纳的经济周期和柏林同步了。§!"
 KRAUS_german_industrial_standard: "克虏伯标准"
 KRAUS_german_industrial_standard_desc: "生产流程被重新整理了一遍。\n\n工期缩短了，废品率下降了，工人换班时的交接变顺了。工程师们第一次明白，为什么德国工厂的单位产出比奥地利高。\n\n§Y效率是可以学的，但前提是你愿意承认自己落后。§!"
 KRAUS_german_economic_heavy: "鲁尔区模式"
 KRAUS_german_economic_heavy_desc: "钢铁、煤炭、机械、军工——资源集中投向重工业。\n\n工厂的烟囱更粗了，铁路的货运量翻倍了，军工厂的产能上来了。这条路见效快，但代价是消费品依旧短缺。\n\n§Y战备优先，民生其次。§!"
 KRAUS_german_economic_light: "维也纳消费品工业"
 KRAUS_german_economic_light_desc: "纺织、食品、日用消费品——资源投向民生。\n\n维也纳的商店货架满了，物价稳了，街头的抱怨少了。这条路不能立刻造出坦克，但它让帝国更稳固。\n\n§Y一个饿肚子的国家打不赢任何战争。§!"
 KRAUS_german_economic_infrastructure: "多瑙河航道与南方铁路"
 KRAUS_german_economic_infrastructure_desc: "铁路、公路、电站、港口——钱花在了看不见的地方。\n\n但从长期看，这是最划算的投资。阿尔卑斯的矿石运得出来了，蒂罗尔的电送上电网了，多瑙河的驳船不再堵在浅滩上。\n\n§Y基础设施是唯一一种，永远不会过时的生产力。§!"
 KRAUS_arms_trade_profits: "两面售械"
 KRAUS_arms_trade_profits_desc: "两边下注的战时的利益：工厂满负荷，国库充实。"
 KRAUS_refugee_labour: "难民劳动力"
 KRAUS_refugee_labour_desc: "从巴尔干涌入的难民填满了维也纳和下奥地利的工厂。他们大多没有证件，接受任何工资——这既让工厂主欣喜，也让工会愤怒。\n\n§G建设速度与动员速度提升，但消费品供给紧张。§!"
 KRAUS_volunteer_act_idea: "志愿军法"
 KRAUS_volunteer_act_idea_desc: "帝国允许现役军官以\"个人志愿\"的名义赴海外参战。这一安排在外交上无可指摘——毕竟，帝国政府从未派出过一个士兵。\n\n然而保加利亚人很快发现，这些\"志愿人员\"穿着奥地利的军装，操着奥地利的口令，带着帝国的装备。而他们的数量，足以填满一条战线。"
 aus_economic_crisis: "不均衡的地域发展"
 aus_economic_crisis_desc: "大战后的奥地利经济一片废墟。工业产出崩溃，失业率飙升，国库几乎空虚。复苏需要大规模投资和结构性改革。"
 aus_political_instability: "巴尔干火药桶"
 aus_political_instability_desc: "政治派系正在撕裂奥地利。从保皇派到社会主义者，从民族主义者到分离主义者，无法达成共识。政府稳定性降至历史最低点。"
 aus_military_weakness: "统而不和的帝国军队"
 aus_military_weakness_desc: "曾经骄傲的奥匈军队如今只是昔日辉煌的影子。装备过时，士气低落，军官团因政治忠诚而非军事学说而分裂。"
 aus_military_weakness_2: "统而不和的帝国军队"
 aus_military_weakness_3: "统而不和的帝国军队"
 aus_economic_crisis_2: "略有发展的地区经济"
 aus_economic_crisis_3: "均衡发展的帝国经济"
 aus_political_instability_2: "巴尔干火药桶"
 aus_political_instability_3: "巴尔干火药桶"
 KRAUS_german_brotherhood: "日耳曼兄弟"
 KRAUS_german_brotherhood_desc: "柏林和维也纳终于不再互相算计。\n\n两国的工厂共用一套标准，两国的实验室共享一批成果，两国的报纸开始用同一个词称呼彼此——不是「盟友」，是「兄弟」。\n\n§Y亲如一家的，从来不只是王室。§!"
 KRAUS_common_prosperity_CZE: "共同繁荣（波西米亚）"
 KRAUS_common_prosperity_CZE_desc: "维也纳和波西米亚的工厂共用同一套标准，铁路连成一条线，订单在两地之间来回流动。\n\n帝国的繁荣不再只属于首都。"
 KRAUS_common_prosperity_CRO: "共同繁荣（伊利里亚）"
 KRAUS_common_prosperity_CRO_desc: "维也纳和伊利里亚的工厂共用同一套标准，铁路连成一条线，订单在两地之间来回流动。\n\n帝国的繁荣不再只属于首都。"
 KRAUS_common_prosperity_GAL: "共同繁荣（加利西亚-洛多梅里亚）"
 KRAUS_common_prosperity_GAL_desc: "维也纳和加利西亚-洛多梅里亚的工厂共用同一套标准，铁路连成一条线，订单在两地之间来回流动。\n\n帝国的繁荣不再只属于首都。"
 KRAUS_common_prosperity_HUN: "共同繁荣（匈牙利）"
 KRAUS_common_prosperity_HUN_desc: "维也纳和匈牙利的工厂共用同一套标准，铁路连成一条线，订单在两地之间来回流动。\n\n帝国的繁荣不再只属于首都。"
 KRAUS_crown_harmony: "王冠领地的和谐发展"
 KRAUS_crown_harmony_desc: "王领不再只是地图上的颜色。\n\n波希米亚的工厂按维也纳的标准交货，斯洛伐克的铁路接进了帝国的干线，匈牙利平原的粮食装上了驶往的里雅斯特的列车。过去那种「首都繁荣、边疆凋敝」的格局，第一次被打破了。\n\n更重要的是人心。布拉格不再谈掷出窗外，布达佩斯不再提关税壁垒，萨格勒布的码头灯火通到半夜。帝国终于不再是十一种不满的总和，而是一个能一起赚钱的地方。\n\n§Y「不均衡的地域发展」到此为止 —— 帝国终于像一个整体那样运转。§!"
 KRAUS_sanctioned_by_austria: "奥地利的制裁"
 KRAUS_sanctioned_by_austria_desc: "维也纳切断了信贷、航线与订单。\n\n没有一枪一弹，但贝尔格莱德的国库开始空了，布加勒斯特的报纸开始骂政府无能，国会里第一次有人公开质疑：为了贝尔格莱德条约，我们把国家带到了什么地方？\n\n§Y有些战争不用军队打。§!"
 KRAUS_cep_final_infra: "德奥经济共同体"
 KRAUS_cep_final_infra_desc: "多瑙河疏浚了，南方铁路电气化了，阿尔卑斯的矿石第一次能便宜地运到布拉格。\n\n这条路的终点不是某一座工厂，而是一张把整个中欧缝起来的网。货物流转的速度快了一倍，成本降了一半——这是所有工业的基础。\n\n§Y基础设施是唯一一种，永远不会过时的生产力。§!"
 KRAUS_cep_final_heavy: "德奥经济共同体"
 KRAUS_cep_final_heavy_desc: "鲁尔区的烟囱在维也纳也竖起来了。\n\n钢铁、煤炭、机械、军工——资源集中投向重工业，军工厂的产能上了整整一个台阶。代价是货架依旧空着，物价依旧高。\n\n§Y这不是奥地利加入德国，也不是德国吞并奥地利。这是两个国家终于开始按同一张资产负债表算账。§!"
 KRAUS_cep_final_light: "德奥经济共同体"
 KRAUS_cep_final_light_desc: "维也纳的货架满了，物价稳了，街头的抱怨少了。\n\n纺织、食品、日用消费品——这条路的产出不能直接变成坦克，但它让帝国更稳固。工人家庭餐桌上多了肉，孩子们有了新鞋。\n\n§Y一个饿肚子的国家打不赢任何战争。§!"
 KRAUS_cep_germany_infra: "德奥经济共同体"
 KRAUS_cep_germany_infra_desc: "多瑙河的疏浚与南方铁路的电气化，让奥地利的货物第一次能便宜地流进德国。\n\n德奥两国共享这张网，柏林也从中获益——只是收益比维也纳小一些。\n\n§Y基础设施的利益，从来不是一国独享的。§!"
 KRAUS_cep_germany_heavy: "德奥经济共同体"
 KRAUS_cep_germany_heavy_desc: "鲁尔区的产能与奥地利的技工接上了线。\n\n钢铁、煤炭、机械、军工——两国按同一张表排产。德国的工厂拿到了稳定的南方订单与原料。\n\n§Y把盘子做大，是双方都愿意干的事。§!"
 KRAUS_cep_germany_light: "德奥经济共同体"
 KRAUS_cep_germany_light_desc: "奥地利把资源投向民生，德国的日用品与机械找到了稳定市场。\n\n维也纳的货架满了，柏林的工厂有了订单——这条路不造坦克，但它让两个国家都更稳。\n\n§Y一个稳定的邻居，比一个饥饿的邻居有用得多。§!"
 KRAUS_bata_industrial_cooperation: "拔佳工业合作"
 KRAUS_bata_industrial_cooperation_desc: "托马斯·拔佳带着兹林的鞋业帝国走进了维也纳的工业体系。\n\n拔佳的流水线管理、标准化零件与全球销售网络，正是奥地利重工业最缺的那一环。他本人在布尔诺与维也纳之间来回奔波，把两家工厂的工时表排成了同一张。\n\n§Y鞋匠的儿子教会了哈布斯堡的工程师：效率本身，就是一种工业能力。§!"
 KRAUS_common_prosperity_SLO: "共同繁荣（斯洛伐克）"
 KRAUS_common_prosperity_SLO_desc: "维也纳和斯洛伐克的工厂共用同一套标准，铁路连成一条线，订单在两地之间流动。"
 KRAUS_common_prosperity_TRS: "共同繁荣（特兰西瓦尼亚）"
 KRAUS_common_prosperity_TRS_desc: "维也纳和特兰西瓦尼亚的工厂共用同一套标准，铁路连成一条线，订单在两地之间流动。"
