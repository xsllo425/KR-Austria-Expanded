 # ===== 政治人物介绍（2026-09-21 第六轮）=====
 KRAUS_leader_intro.1.t: "卡尔·伦纳"
 KRAUS_leader_intro.1.d: "每当社会民主党需要组阁，人们就会提起这个名字：卡尔·伦纳。\n\n他做过这件事。1918 年，当君主国分崩离析、谁也不知道该用什么来取代它的时候，是伦纳把碎片拢在了一起——不是靠武力，而是靠拒绝把任何一个民族当作敌人。他那次并没有拯救帝国。他拯救的是「帝国」这个东西的可能性，并且自那以后的每一年，他都在论证同一套把戏可以再耍一次。\n\n他领导 §Y奥地利社会民主工党§!——工业工人、工会与大城市的党。在维也纳的保守派眼中，他是个伺机而动的革命者；在他自己党内的激进派眼中，他是个妥协太多次的人。\n\n他管自己的办法叫 §Y大帐篷§!：把所有人都留在里面，不让任何人完全满意，结构就撑得住。"
 KRAUS_leader_intro.1.a: "一个有办法的人。"

 KRAUS_leader_intro.2.t: "威廉·米克拉斯"
 KRAUS_leader_intro.2.d: "伦纳在搭建，米克拉斯在守护。\n\n邮差之子，受过师范教育，十二个孩子的父亲——米克拉斯只有一个信念，并且从未拿它做过交易：天主教奥地利必须在这场现代化的洪流中活下来。他不是什么胸怀宏图的人。他只有一条线，只划了一次，并且绝不越过。\n\n他领导 §Y基督教社会党§!——教会、乡间、小镇与天主教中产阶级的党；这个党治理奥地利的次数比任何其他党都多，并把社会民主党视为它存在所要守护的一切的长期威胁。\n\n他知道那些以他之名所行之事并不完全合乎宪法。他说过——亲笔写在自己的私人日记里，篇幅很长，是在深夜。而在公开场合，他什么也不说。了解他的人明白，这两半都是真话，而真正要紧的是后一半。"
 KRAUS_leader_intro.2.a: "一个只守一条线的人。"

 KRAUS_leader_intro.3.t: "皇帝的天平"
 KRAUS_leader_intro.3.d: "两个人，两个党，两种对「奥地利为何存在」截然不同的理解——而夹在他们之间的，是皇帝。\n\n卡尔既不是任何一套纲领的作者。他是这两套纲领都无法单独推行的那份理由。伦纳掌握着城市与工会；米克拉斯掌握着教会与乡间。若其中一方彻底压倒另一方，帝国就不得不变成另一种东西——而在奥地利，并没有别的什么东西撑得住。\n\n于是皇室做了皇室在奥地利一向做的事：居中。给每一方刚好足够留住他们坐上谈判桌的东西，也刚好扣下足够不让他们离席的东西。\n\n1936 年的大选将决定由谁来组阁。但它不会决定谁是对的——也不会让皇帝从「平衡两者」这件差事中解脱出来。\n\n§Y自下次大选起，帝国天平将出现在「权力平衡」面板中。让两派大致均衡，帝国就不散；放任任何一方独大，中间就守不住了。§!"
 KRAUS_leader_intro.3.a: "这一次，中间守住了。"

 # --- 米克拉斯胜选二选一 ---
 KRAUS_leader_intro.10.t: "基督教社会党政府"
 KRAUS_leader_intro.10.d: "米克拉斯完成组阁——基督教社会党居首，右翼的威权民主派也被拉进来共事：秩序需要盟友，而他选的是那些不会碍事的。\n\n政府内部正在争论：奥地利的未来该锚定在哪里。德意志这条纽带既能提供步枪，也能提供工厂。两者无法同时取得。"
 KRAUS_leader_intro.10.a: "先要步枪。"
 KRAUS_leader_intro.10.b: "先要工厂。"
 KRAUS_intro10_mil_tt: "§Y德奥军事合作§!——「从柏林到维也纳」的军事分支，其国策启动时间缩短（每个最多 §G14 天§!）。"
 KRAUS_intro10_eco_tt: "§Y德奥经济合作§!——「从柏林到维也纳」的经济分支，其国策启动时间缩短（每个最多 §G14 天§!）。"

 # --- 伦纳胜选 ---
 KRAUS_leader_intro.11.t: "大帐篷政府"
 KRAUS_leader_intro.11.d: "伦纳完成组阁，用的还是他唯一会用的办法：拉进来的人比严格需要的更多。社民党掌握各部；激进社会党人得到的是被倾听的机会，而不是怨恨的理由；中间派中有足够多的人被说服，认为这顶帐篷足够大，站得进去。\n\n他也转向了皇室——奥地利政治中那个根本不是政党的部分。在皇帝的分量压在这套安排上之后，帝国的各民族与各王领就能被带向一个了结，而不是被逼向一场决裂。\n\n§Y「王冠的重量」之下的国策，其启动时间全部缩短。§!"
 KRAUS_leader_intro.11.a: "大家都把屋顶撑住。"
 KRAUS_intro11_tt: "§Y大帐篷§!——§Y王冠§!分支的国策启动时间缩短（每个最多 §G14 天§!）。同时组成一个广泛的执政联盟。"
 # ===== 覆写的 KR 选举事件（2026-09-21 第六轮）=====
 austria_election_events.1.t: "1936 年奥地利选举"
 austria_election_events.1.d: "自 1867 年奥匈折衷以来，「奥地利问题」一直是在帝国的德语区里解决的——而在大部分时间里，给出答案的都是两大党之一。基督教社会党代表教会、乡间与天主教中产阶级，治理奥地利的次数比任何其他政党都多。社会民主工党代表工业工人、工会与大城市，并把基督教社会党视为它一切诉求的长期阻碍。\n\n在经济问题上，两党不只是意见不同——他们是截然相反。社会民主党人想用失业救济、公共工程和国家机器为工人撑腰来应对危机。基督教社会党人想用紧缩来应对：削减开支、平衡账目，并坚信一个入不敷出的国家很快就会不再存在。\n\n皇帝没有为任何一方的纲领背书。但他已让人明白：无论谁组阁，都不会是单独组阁。这两派之间的平衡，如今已被皇室视为自己的分内之事。\n\n§Y大选将决定由谁治理奥地利。它不会决定谁是对的。§!"
 austria_election_events.1.a: "让人民来决定这一切！"

 austria_election_events.3.t: "阿德勒谴责社民党"
 austria_election_events.3.d: "弗里德里希·阿德勒——党的创始人维克多·阿德勒之子——是一名激进社会主义者，最出名的事迹是 1916 年为抗议世界大战而枪击首相。岁月并没有让他变得温和。\n\n在党代会前，他用一种简直像是从对岸说出来的措辞谴责社民党：它已经变成「一种为当权派而存在的社会主义」——它谈判、它妥协、它调和，直到那个理念只剩下一个词。\n\n半个会场鼓掌。另一半没有。阿德勒的追随者人数不多、声音很大，而且完全真诚。"
 austria_election_events.3.a: "激进派还是那个激进派。"
 austria_election_events.3.a_tt: "激进社会主义支持率：§G+2.50%§!——放任阿德勒自行其是。"
 austria_election_events.3.b: "向阿德勒递出谅解。"
 austria_election_events.3.b_tt: "社会民主主义支持率：§G+2.00%§!"
 austria_election_events.3.b2_tt: "激进社会主义支持率：§G+1.00%§!——而且他们会记住这份递出的手。"

 austria_election_events.7.t: "左翼的谅解"
 austria_election_events.7.d: "谈话很安静，很短，地点是一间门外没有记者的房间。\n\n公开场合什么也没有让步。达成的是这样一条共识：阿德勒的激进派不会在这次选举中从左边攻击本党；而如果社会民主党组成下一届政府，那个政府里不会没有这些曾批评过它的人的位置。\n\n阿德勒离开时没有握手。他离开时也没有谴责任何人。"
 austria_election_events.7.a: "桌边留一个位子。"
 austria_election_events.7.a_tt: "社会民主主义支持率：§G+2.00%§!——左翼被团结起来，而不是被分裂。"

 ### 权力平衡 · 决议 ---------------------------------------------------------
 KRAUS_bop_crown_arbitration: "皇帝仲裁"
 KRAUS_bop_crown_arbitration_desc: "这两个人都不会自己走进霍夫堡。但只要皇帝派人去叫，两个都会来。\n\n皇室不当政——皇室维持。把两人召进同一间屋子，提醒他们：若其中任何一方大获全胜，奥地利会变成什么样。"
 KRAUS_bop_renner_rally: "党的集会"
 KRAUS_bop_renner_rally_desc: "社会民主工党至今仍能在一个下午之间把十万人送上环城大道。\n\n代价只是秩序。维也纳会喧闹一个星期——但霍夫堡里不会再有任何人对「谁代表奥地利的工人说话」心存疑问。"
 KRAUS_bop_miklas_decree: "以法令治国"
 KRAUS_bop_miklas_decree_desc: "内阁可以被驱使去做议会不肯做的事。\n\n狭义上讲，这是合法的。这也正是卡尔·伦纳花了三十年论证「帝国撑不下去」的那个方法。\n\n§Y180 天的秩序——以及一笔比它更长寿的债。§!"
 KRAUS_bop_imperial_audience: "御前听政"
 KRAUS_bop_imperial_audience_desc: "皇帝一直在看报，也注意到了风往哪边吹。\n\n他会接见那位正在扩大声势的领袖。他会很客气。他几乎什么都不说。而那个人离开时已经明白：皇室在看着，而且还没有决定要表示满意。"
