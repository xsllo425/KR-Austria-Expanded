 ### 危机选边（黑色星期一） --------------------------------------------------------
 KRAUS_crisis_left_tt: "§G左翼满意了。§!右翼不会忘记这件事。"
 KRAUS_crisis_right_tt: "§G右翼满意了。§!左翼不会忘记这件事。"
 KRAUS_crisis_choices.1.t: "银行挤兑"
 KRAUS_crisis_choices.1.d: "信贷银行的大门一开，队伍就绕过了街角，而且至今没有变短。\n\n左翼要求国家直接接管银行。右翼要求国家只为存款作保。两者都要花钱，而钱我们没有。"
 KRAUS_crisis_choices.1.a: "把银行国有化。"
 KRAUS_crisis_choices.1.b: "为存款作保。"
 KRAUS_crisis_choices.2.t: "失业者游行"
 KRAUS_crisis_choices.2.d: "他们成千上万地沿着环城大道走来，秩序井然——而这不知为何更让人不安。\n\n一翼要求扩大救济，不计代价。另一翼要求削减预算，也不计代价。他们在算术上都没错，而在国家这件事上都错了。"
 KRAUS_crisis_choices.2.a: "扩大救济。"
 KRAUS_crisis_choices.2.b: "削减预算。"
 KRAUS_crisis_choices.3.t: "乡下撑不住了"
 KRAUS_crisis_choices.3.d: "收成很差，抵押贷款却没有变少，小农们开始写信，而农业部已经不再回信。\n\n土地改革能回答那些信。补贴能回答那些贷款。钱只够做一件。"
 KRAUS_crisis_choices.3.a: "土地改革。"
 KRAUS_crisis_choices.3.b: "农业补贴。"
 KRAUS_crisis_choices.4.t: "总罢工"
 KRAUS_crisis_choices.4.d: "铁路停了。电车停了。印刷厂也停了——这意味着一天之内，没有人会知道任何地方正在发生什么。\n\n政府必须迅速决定：它究竟是一个什么样的国家。"
 KRAUS_crisis_choices.4.a: "承认工会。"
 KRAUS_crisis_choices.4.b: "出动军队。"

