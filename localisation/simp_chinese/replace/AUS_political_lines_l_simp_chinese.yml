 KRAUS_regime_balance: "皇帝的天平"
 KRAUS_renner_side: "伦纳——社会民主党"
 KRAUS_miklas_side: "米克拉斯——基督教社会党"
 KRAUS_bop_imperial_balance_range: "皇帝居中"
 KRAUS_bop_renner_tilt_range: "伦纳占了上风"
 KRAUS_bop_renner_dominant_range: "伦纳无人制衡——帐篷变成多数"
 KRAUS_bop_miklas_tilt_range: "米克拉斯占了上风"
 KRAUS_bop_miklas_dominant_range: "米克拉斯无人制衡——无同意的统治"
 KRAUS_bop_imperial_balance_tt: "§G皇帝居中。§!伦纳与米克拉斯谁也无法独治——只要这一点成立，帝国就不散。"
 KRAUS_bop_renner_tilt_tt: "伦纳一派正在扩大声势。维也纳的保守派已经开始物色另一个代言人。"
 KRAUS_bop_renner_dominant_tt: "§R伦纳无人可制。§!工人与各民族拿到了他们所要的——而那些没被问过的人，已经开始另寻出路。"
 KRAUS_bop_miklas_tilt_tt: "米克拉斯一派正在扩大声势。每一道法令买到的是秩序，花掉的是合法性。"
 KRAUS_bop_miklas_dominant_tt: "§R米克拉斯无人可制。§!帝国井井有条。帝国已不再合法——而有人正在等着，他们两者都不在乎。"
 KRAUS_regime_balance_category: "皇帝的天平"
 KRAUS_regime_balance_category_desc: "两个想要执掌奥地利的人，以及那个不让任何一方独治的皇室。"
 # --- 第三轮：黑一出现事件、结算 tooltip、风味选项 ---
 KRAUS_black_monday_events.0.t: "黑色星期一波及奥地利"
 KRAUS_black_monday_events.0.d: "当黑色星期一冲击德国的时候，距离席卷整个欧洲也不远了。奥地利是第一批被拖入的国家之一。\n\n内阁已经开设了一本应急账簿：决议面板中的 §Y重整帝国经济§! 现已可用。每层读条 §Y110§! 天——条件凑够且已过 §Y90§! 天就提前结算、危机缓解一层；凑不够则读满 110 天，危机加深一层。\n\n除了国家层面的§Y民族精神§!，各州也挂上了§Y「大萧条」的地区修正§!：越是工业重镇，人力与建设速度的惩罚越重，可在省份面板中查看。它们会随着经济重整一档一档地消退。"
 KRAUS_black_monday_events.0.a: "哦，上帝！"
 KRAUS_black_monday_events.3.t: "毫无进展"
 KRAUS_black_monday_events.3.d: "账簿到期，上面空空如也。那些本该缓和危机的措施从未被采取，危机也就相应地蔓延开来。"
 KRAUS_black_monday_events.3.a: "我们让它溜走了。"
