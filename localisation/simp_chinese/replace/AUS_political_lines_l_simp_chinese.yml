 ### 皇权与秩序 ------------------------------------------------------------------
 KRAUS_imperial_authority_dm: "皇权与秩序"
 KRAUS_imperial_authority_dm_tt: "§Y皇室的威望与天主教秩序，合为一体。§!当前：§Y[?KRAUS_imperial_authority|0]§!/100\n\n§Y0–24§! 王权旁落：稳定度与政治点数下降\n§Y25–49§! 勉力维持：稳定度小幅提升\n§Y50–74§! 皇权稳固：稳定度、政治点数、战争支持度、组织度\n§Y75–100§! 帝国权威：以上全部提高，并增加可征兵人口\n\n靠维持平衡、熬过危机、推进国策积攒，也可以在「皇权与秩序」决议里花用。"
 KRAUS_ia_convoke_diet: "召集帝国议会"
 KRAUS_ia_convoke_diet_desc: "皇帝不立法。他召集。\n\n两院同处一室，皇室在场倾听。什么也没有决定——但许多事情被理解了，那些原本在走廊里大喊大叫的人，回到了桌边。\n\n§Y消耗 25 点权威。§!"
 KRAUS_ia_convoke_diet_tt: "§G+30§! 政治点，§G+3%§! 稳定度"
 KRAUS_ia_imperial_honours: "颁发帝国嘉奖"
 KRAUS_ia_imperial_honours_desc: "勋章、头衔，以及那些只花掉皇室「注意力」的礼节。\n\n它们被发往最能发挥作用的地方——由那些会记住「是谁给的」的人收下。\n\n§Y消耗 15 点权威。§!"
 KRAUS_ia_imperial_honours_tt: "§G+2%§! 战争支持度，§G+1§! 陆军经验"
 KRAUS_ia_royal_reserves: "动用皇室储备"
 KRAUS_ia_royal_reserves_desc: "哈布斯堡的私产不是国家的。但它可以被动用——代价不会用金钱来付。\n\n§R它要花掉皇室积累的一半。§!现在花掉，皇室在很长一段时间里都会显得大不如前。\n\n§Y消耗 50 点权威。§!"
 KRAUS_ia_royal_reserves_tt: "§G+50§! 政治点"
 KRAUS_dm_renner_victory: "社会改革的利益"
 KRAUS_dm_miklas_victory: "秩序的利益"


 ### 皇权与秩序 · 单轴累积重构 --------------------------------------------------
 KRAUS_catholic_order_decisions: "皇权与秩序"
 KRAUS_catholic_order_decisions_desc: "只有皇权与秩序才能赋予正当性的法令——也只有皇权与秩序必须为它付账。"


 ### 决议 -----------------------------------------------------------------------
 KRAUS_order_decree_in_emergency: "以紧急法令治国"
 KRAUS_order_decree_in_emergency_desc: "内阁可以做议会不肯做的事。狭义上讲这是合法的——这也正是伦纳花了三十年论证「帝国撑不下去」的那个方法。\n\n代价用政治资本支付，而且每做一次，就要再付一次。"
 KRAUS_order_suppress_press: "取缔敌对报纸"
 KRAUS_order_suppress_press_desc: "不肯说真话的报纸，索性就不必出刊了。\n\n街头会注意到。他们总是会注意到。"
 KRAUS_order_church_schools: "扩张教会学校"
 KRAUS_order_church_schools_desc: "教区学校是帝国拥有过最便宜的秩序工具。\n\n它也很慢——而学校建起来的时候，危机是不会等的。"
 KRAUS_order_seize_industry: "征用工业产能"
 KRAUS_order_seize_industry_desc: "国家拿走一座工厂，把它用于国家的目的。\n\n事后，会有一座工厂不在了。这不是比喻。"
 KRAUS_order_state_of_emergency: "宣布国家紧急状态"
 KRAUS_order_state_of_emergency_desc: "停摆、逮捕、征用，然后独自治理——公开地做，并且盖上皇帝的签名。\n\n§R这会很贵，而且会被记住。§!"

