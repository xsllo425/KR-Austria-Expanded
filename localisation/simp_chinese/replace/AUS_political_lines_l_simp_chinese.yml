 # --- 1936 大选风味事件 + 伦纳大帐篷国策（2026-09-21）---
 KRAUS_renner_tent_1:0 "布拉格工业圆桌"
 KRAUS_renner_tent_1_desc:0 "波希米亚的工业界关系着就业、订单与地方财政，也关系着联盟能否跨过民族界线。伦纳请他们参加施政协商，以继续投资和稳定合作争取支持。产业界不会因此放弃自己的要求；政府既要给他们提问题的渠道，也要让他们为共同承担的计划负责。圆桌只是协商，不是服从。"
 KRAUS_renner_tent_2:0 "安抚维也纳与军队"
 KRAUS_renner_tent_2_desc:0 "军官团与官僚层担心帝国正在他们身边瓦解，维也纳的工薪阶层则怕恢复的代价由自己承担。政府用预算保障、军费安排与对公务员的承诺回应两边，明确哪些要求能够兑现、哪些要等。安抚不是收买，而是让这些力量相信中央仍在协调，并未放弃秩序。"
 KRAUS_renner_tent_3:0 "大帐篷稳住了"
 KRAUS_renner_tent_3_desc:0 "产业界、地方代表与联盟各派终于找到继续共事的办法。内阁可以把精力从相互试探转向尚未完成的恢复工作，但分歧并没有消失。伦纳要维持的，是一个能够继续协商的联盟，而非永久一致的队伍。大帐篷暂时稳住，接下来的预算与建设仍会检验这份合作。"

 KRAUS_election_flavor.1.t: "首都的街头"
 KRAUS_election_flavor.1.d: "职业介绍所外的队伍比去年更长。在工人街区，那些曾经只满足于发发牢骚的人，开始问起该由谁来负责。"
 KRAUS_election_flavor.2.t: "讲坛上的一句话"
 KRAUS_election_flavor.2.d: "主教们已经委婉地表明了他们的偏好。在乡间和小镇上，这句话传得比任何报纸都远。"
 KRAUS_election_flavor.3.t: "狩猎之行"
 KRAUS_election_flavor.3.d: "皇储的狩猎之行本意是展示帝国的强盛。结果各家报纸满篇都是它所造成的破坏——以及这场狩猎的开销抵得上一个村子一年的收入。\n\n政府必须作出回应。"
 KRAUS_election_flavor.3.a: "力挺王室"
 KRAUS_election_flavor.3.b: "承认失仪"
 KRAUS_election_flavor.4.t: "伦纳的演说"
 KRAUS_election_flavor.4.d: "卡尔·伦纳在党代会上讲话。他说帝国是一栋有许多房间的房子，而每个房间都有责任把屋顶撑住。工人们在听，而店主们——小心翼翼地——也在听。"
 KRAUS_election_flavor.4.a: "大家都把屋顶撑住。"
 KRAUS_election_flavor.5.t: "沉默"
 KRAUS_election_flavor.5.d: "即将卸任的政府爆出丑闻，决定权落到了米克拉斯手上。换了别的政客，中午之前就会发表声明。\n\n米克拉斯什么也没说，而且看起来打算就这么不说下去。"
 KRAUS_election_flavor.5.a: "他保持沉默。"
 KRAUS_election_flavor.5.b: "他公开发声。"
