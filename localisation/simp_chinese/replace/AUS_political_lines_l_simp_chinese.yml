 # ===== KRAUS 政治线：伦纳 + 米克拉斯（2026-09-21）=====

 # --- 入口国策 ---


 # --- 米克拉斯秩序国策 ---
 KRAUS_miklas_order_1:0 "紧急法令"
 KRAUS_miklas_order_1_desc:0 "米克拉斯准备以紧急措施整顿行政与社会协调，让拖延的事务得到答复。支持者相信果断行动能恢复秩序，反对者则担心政府越过正常协商。命令可以缩短程序，却不能抹去执行中的不满，也可能在日后被追究。政府须说明这些措施的权限边界，并承担眼前的政治代价。"
 KRAUS_miklas_order_2:0 "守住象征"
 KRAUS_miklas_order_2_desc:0 "红白红再次飘扬在霍夫堡之上。在一个万事都可谈判的年代，皇室坚持某些象征不容退让，以求为中央的权威留下立足点。守住旗帜能凝聚一部分忠诚，也会让要求更多自治的一方更加警惕。象征无法替代预算与合同，却能为履约提供一份公共的信誉。"
 KRAUS_miklas_order_3:0 "整顿的代价"
 KRAUS_miklas_order_3_desc:0 "整顿终于触及一家民用工厂。关停决定送到地方，厂主要求重新审议，工人追问下一份工资从何而来，连支持内阁的教区代表也来替他们陈情。米克拉斯不能只在报告里写下秩序改善，把损失留给别人。他必须公开承担这项决定的责任，并面对它将在联盟和地方留下的裂痕。"

 # --- 米克拉斯分级精神 ---

 # --- BOP 叙事 ---

 # --- BOP 分段提示 ---

 # --- 米克拉斯双轴提示 ---

 # --- 伦纳事件 ---
 KRAUS_renner_events.1.t: "大帐篷稳住了"
 KRAUS_renner_events.1.d: "眼下这套安排还行得通。捷克工业界拿到了自治，匈牙利人拿到了语言权利，军队也仍然听命于同一个参谋部。没有一个人完全满意——而这已经是这个帝国所能达到的、最接近成功的状态了。"
 KRAUS_renner_events.1.a: "所有人都在里面。"
 KRAUS_renner_events.2.t: "王领擅自行动"
 KRAUS_renner_events.2.d: "天平向边缘摆得太远了。布拉格和布达佩斯已经开始当作无须征求维也纳的意见——而这种念头一旦扎下根，就极难收回。"
 KRAUS_renner_events.2.a: "我们正在失去他们。"
 KRAUS_renner_events.3.t: "这不是大帐篷"
 KRAUS_renner_events.3.d: "天平向维也纳摆得太远了。各王领名义上还在帐篷里，但已经不再假装满意——而一顶没人愿意站的帐篷，不过是个屋顶罢了。"
 KRAUS_renner_events.3.a: "我们抓得太紧了。"
 KRAUS_renner_events.10.t: "伦纳组阁"
 KRAUS_renner_events.10.d: "卡尔·伦纳接下了组阁的重任。他的第一件事，就是宣布帝国此后将在中央与各民族之间保持平衡——而平衡本身就是政策。\n\n批评者称之为优柔寡断。他称之为唯一真正奏效过的办法。"
 KRAUS_renner_events.10.a: "我们会一起待在这顶帐篷里。"

 # --- 米克拉斯事件 ---
 KRAUS_miklas_events.1.t:0 "整顿的代价"
 KRAUS_miklas_events.1.d:0 "整顿终于触及一家民用工厂。关停决定送到地方，厂主要求重新审议，工人追问下一份工资从何而来，连支持内阁的教区代表也来替他们陈情。米克拉斯不能只在报告里写下秩序改善，把损失留给别人。他必须公开承担这项决定的责任，并面对它将在联盟和地方留下的裂痕。"
 KRAUS_miklas_events.1.a:0 "这项决定由我们负责。"
 KRAUS_miklas_events.2.t: "紧急法令"
 KRAUS_miklas_events.2.d: "政府依据紧急权力又颁布了一批法令。一周之内，秩序明显好转。\n\n走廊里有人评论说，共和国如今靠笔而不是靠议会统治——而且运转得更好了。"
 KRAUS_miklas_events.2.a: "秩序优先。"
 KRAUS_miklas_events.3.t: "红白红"
 KRAUS_miklas_events.3.d: "旧旗帜再次升上霍夫堡。这件事没有任何实际用处；旗帜喂不饱任何人。\n\n但帝国各地，那些已经开始怀疑「奥地利」到底还意味着什么的人，抬头看着它，安静了下来。"
 KRAUS_miklas_events.3.a: "旗帜并非虚无。"
 KRAUS_miklas_events.10.t: "米克拉斯掌舵"
 KRAUS_miklas_events.10.d: "威廉·米克拉斯接过了政府的责任。他的纲领很短：奥地利的天主教性质将被保住，无论代价为何。\n\n了解他的人明白，这句话的后半段——无论代价为何——并不是一个修辞。"
 KRAUS_miklas_events.10.a: "无论代价为何。"
 KRAUS_miklas_events.20.t: "合法性危机"
 KRAUS_miklas_events.20.d: "他成功了。皇权与秩序得以保住，国家从未如此稳固。\n\n但为了保住它，他在宪法之外统治了三年，而宪法没能挺过这段经历。帝国井井有条。帝国已不再合法。在维也纳的沙龙里，那些曾经被排挤在边缘的人，开始收到晚宴的邀请。"
 KRAUS_miklas_events.20.a: "他保住了秩序，却失去了帝国。"

