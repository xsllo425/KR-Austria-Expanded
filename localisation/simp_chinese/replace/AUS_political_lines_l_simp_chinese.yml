 ### 国策地块奖励 + 经济纲领 --------------------------------------------------------

 KRAUS_renner_economic_program:0 "大帐篷经济协议"
 KRAUS_renner_economic_program_desc:0 "伦纳希望把恢复经济变成维持联盟的共同事业。合作信贷、公共采购与地方投资将写进一份可以讨论、可以追责的协议，让工人、产业界与王领代表都看到自己的利益。金色多瑙河计划从本部试点起步，再与帝国共同建设衔接；能走多远，取决于联盟是否愿意继续承担代价。"
 KRAUS_miklas_economic_program:0 "秩序经济"
 KRAUS_miklas_economic_program_desc:0 "米克拉斯主张以可兑现的信用和明确的责任恢复生产。教区网络、雇主与劳动者的协商，以及皇室的背书，共同支撑金色多瑙河计划。秩序不能只意味着要求服从，也要让合同得到履行、地方能够参与。由本部工程走向帝国共同建设，政府必须证明这套办法不只服务维也纳。"
 KRAUS_econ_program_dm_tt: "§Y经济纲领。§!\n\n政府真正建成了什么，以及它打算继续建什么。\n\n§G+5% 政治点，且工厂产出随着每一项兑现的承诺而上升。§!"


 KRAUS_econ_program_dm:0 "金色多瑙河：经济纲领"
