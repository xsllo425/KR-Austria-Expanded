l_simp_chinese:
 ausgleich_events.323.t: "匈牙利拒绝了赔偿"
 ausgleich_events.323.d: "布达佩斯的代表团把奥地利的赔款清单原样退了回来：匈牙利要的是权利，不是钱。"
 ausgleich_events.323.a: "意料之中。"
 ausgleich_events.324.t: "[From.GetName]的赔款被退回"
 ausgleich_events.324.d: "我们已经把赔款清单退还给了[From.GetName]。匈牙利不会为任何数目的金钱放弃自己的要求。"
 ausgleich_events.324.a: "知道了。"
