l_simp_chinese:
 KRAUS_industrial: "帝国工业计划"
 KRAUS_industrial_desc: "黑色星期一之后，帝国的机器有一半停了。\n\n斯柯达的闲置产能、阿尔卑斯的矿场、多瑙河畔的码头——它们不缺工人，缺的是订单和资本。维也纳的银行不敢放贷，帝国的市场太小，资金太贵。\n\n要撑过下一场危机，就必须让这些机器重新转起来。这不是补贴，是投资：每一座新建的厂房、每一条修复的铁路、每一口重开的矿井，都是在为帝国换取喘息的时间。\n\n§Y工业不是目的。工业是让我们在下一次有人敲门时，还握有选择权的东西。§!"
