############################################################
### 全球民主化运动 · 决议与类目（2026-09-24）
############################################################

KRAUS_global_democratisation: "全球民主化运动"
KRAUS_global_democratisation_desc: "战争没有随我们的战争一起结束。在某个地方，两个政府还在为一条谁也解释不清的边界花掉他们的孩子。\n\n维也纳从这些事情里得不到一寸土地。而这恰恰是维也纳能走进那个房间的原因。\n\n§Y我们不是世界的警察。我们是世界的见证人——而见证人更难被无视。§!"

KRAUS_mediate_war: "提出奥地利调停"
KRAUS_mediate_war_desc: "派一个代表团去交战双方那里，只带一个提议：停下，各自留着手上握着的东西。不夺取、不复原、不报仇。枪停下的那条线，就是边界。\n\n这是一个几乎没人在自以为还能赢的时候会接受的提议。\n\n§Y这个提议只花我们一张车票的代价。拒绝它，花掉他们的一切。§!"
