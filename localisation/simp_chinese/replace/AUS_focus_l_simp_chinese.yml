 KRAUS_new_year_new_way:0 "新一年，新办法"
 KRAUS_new_year_new_way_desc:0 "维也纳仍有时间作出选择。王冠领地要求听见自己的声音，柏林期待奥地利表明立场，巴尔干的局势又牵动帝国边境。把这些问题逐个拖延，只会让它们同时找上门。内阁决定重新安排施政次序：先建立能够履约的协商，再决定帝国如何与外部世界相处。"
