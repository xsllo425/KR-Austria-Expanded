 KRAUS_joint_doctrine_ger: "德奥联合学说（德国）"
 AUS_military_occupation_tooltip_allies: "盟国将被要求交出指挥权"
 AUS_military_occupation_tooltip_puppets: "附庸国将被并入帝国"
 AUS_request_forces_hungary: "向匈牙利索要部队"
 AUS_request_forces_puppets: "向附庸国索要部队"
 AUS_Alt_pat_aut_party: "奥地利祖国阵线"
 AUS_joseph_august_von_habsburg_leader_desc: "约瑟夫·奥古斯特·冯·哈布斯堡"
 KRAUS_german_central_european_prosperity_desc: "此前德奥两国经济各自运行，缺乏统筹。现双方整合资源：德国提供资本、机器与订单，奥地利提供技工、煤铁及多瑙河航道，建成一条自鲁尔区至的里雅斯特的生产链。具体分工上，维也纳工厂按柏林标准交货，布拉格斯柯达为斯图加特制造底盘，林茨化工厂将原料直接供应巴伐利亚车间。此举并非奥地利并入德国，亦非德国吞并奥地利。用一位工业家的话说：我们不是把国家卖了，我们只是终于找到了那个愿意和我们一起赚钱的邻居。"
 KRAUS_german_central_european_prosperity_tt: "整条经济线合流：德奥资本、产能与基建并入同一套体系"
 KRAUS_joint_ventures_mio_tt: "§C斯柯达与伯勒获得德方注资：规模等级 +2，追加经费§!"
 KRAUS_arms_collab_mio_tt: "§C斯柯达获得订单并扩容：规模等级 +1，追加经费§!"
 KRAUS_combined_arms_operations_desc: "本次联合军事演习在巴伐利亚举行，由奥地利山地师与德国装甲师编入同一战斗群，按统一节奏推进。第一周暴露出多项协同问题：双方无线电频率不一致，炮兵射表不同，地图等高线间距存在差异。至第三周，上述问题逐步解决。一位奥地利上校在报告中写道：我们不是来学他们的，我们是来确认——真打起来的时候，我们能不能站在一起。"
 KRAUS_greek_question_desc: "黑色星期一起于华尔街，经柏林银行业传导至维也纳汇率市场，并进一步波及希腊港口，导致其订单全部中断，雅典失业率在三个月内翻倍。大国尚具缓冲空间，希腊体量有限，无法独立抵御此次危机。鉴于此前我国已在希腊景气阶段获取其工业资源，现阶段应向其提供维持运转的必要支持。弱国在此类冲击中受损最重，此时介入所建立的合作关系，将产生长期影响。"
 KRAUS_trust_czech_desc:0 "布拉格不会因为一次投资就放下对中央的戒心。下一步必须让合作具有连续性：工业订单不能随着内阁争执而中断，建设安排也不能停留在签字仪式上。维也纳用可核查的工程与日常协作证明诚意，使地方的让步不再只依靠对皇室保证的信任。"
 KRAUS_german_joint_ventures_desc: "德奥合资账目显示，德方资金已注入奥地利两家主要兵工厂。具体举措包括：扩建斯柯达装甲车间，为伯勒火炮生产线更换德国机床。上述调整使维也纳股东方的供货对象由单一帝国转变为横跨中欧的工业体系。资本的流向，决定了炮口的方向。"
 KRAUS_balkan_arms_collaboration_desc: "保加利亚向斯柯达下达火炮订单，部分图纸由德国提供。维也纳银行为此交易提供融资，斯柯达车间增设夜班组织生产。此项军售的对象系奥地利的邻国及其敌对方。卖武器给邻居，和卖武器给邻居的敌人，是两门完全不同的生意。"
 KRAUS_balkan_bulgarian_refugees_desc: "维也纳人口承载已达上限，外省矿区与工厂存在用工缺口。美泉宫决定将保加利亚难民分流至外省安置：经铁路运输，分别派往施蒂利亚的矿区、克恩顿的工厂，以及上奥地利与福拉尔贝格。此项安置产生财政支出并降低稳定度，但施蒂利亚的车间已实现满负荷运转。安置他们花了钱，也赔了稳定度，但施蒂利亚的车间终于开满了工。"
 KRAUS_greek_question_tt: "雪崩之下，伸手拉雅典一把——此刻的恩情，会被记很久"
 KRAUS_greek_question_spare_tt: "§G若我们放过希腊，他们会对我们心怀感激。§!\n\n§Y这份人情，日后或许用得上。§!"
 KRAUS_german_armor_desc: "1934年，艾曼斯贝格完成《坦克战争》一书，未获重视。1936年，柏林方面派古德里安赴奥地利，两人就装甲战术产生分歧：古德里安主张集中使用坦克，艾曼斯贝格指出奥地利山地地形不具备装甲集群作战条件。双方讨论三小时后，共同前往演习场实地勘察，着手将理论付诸实践。艾曼斯贝格说，纸上谈兵他谈了十年，现在终于有人肯陪他把它打一遍。"
 KRAUS_german_infantry_desc: "战争部三楼的马特纳办公室负责征兵与训练事务。经向总参谋部核算，帝国当前人力充足而工业产能不足。据此，马特纳调整建军方向，暂缓坦克等重装备扩产计划，优先保障步兵师的火炮、弹药配给与训练时间。德国教官抵达后，将原定八个月的训练周期压缩至五个月。马特纳要的不是精锐，是一支不会垮的军队。"
 KRAUS_german_combined_desc: "总参谋部经三日会议，就装甲派集中使用、步兵派分散部署及炮兵派异议进行审议。最终方案为：各兵种统一编入同一战斗群，按同一节奏行动。该方案训练成本高，且任何单一兵种均无法独立决定胜负。一位老将军签下名字时说，这是最后一份他还能签字的方案——再改下去，就得让士兵自己决定了。"
 KRAUS_german_standardisation_desc: "奥地利与德国在弹药口径及枪械零部件上执行两套标准，导致炮弹无法互装、螺丝无法通用。后勤部门耗时半年将两套标准合并为一套，并报废了大批尚能使用的原有库存。负责此事的军官写道：我们不是在省钱，我们是在买一样比钱贵的东西——打到一半的时候，子弹还能通用。"
 KRAUS_german_advisors_desc:0 "维也纳新城的玛丽亚·特蕾莎军事学院创办于 1751 年，是帝国培养军官的老学校。柏林军事协定之后，课程表重新排过：战术、测绘、后勤与参谋作业并入同一套大纲，各王冠领的军官在这里同班受训。\n\n学院里设了一席理论教席，讲义由此流向各个王冠领的军营，军官们用同一种语言讨论同一场战争。"
 KRAUS_german_military_coop_desc: "当前形势下，奥地利与德国于柏林签署军事协定。协定全文共十七页，其中十四页未予公开，公开部分仅三页。在具体举措上，公开条款规定了联合演习、军官交换与情报共享三项内容；未公开的十四页涉及开战后两军指挥权的划分方案，该议题在谈判中耗时最长，双方均未率先提出具体主张。协定的预期效果取决于未公开条款的落实程度，即战时指挥权划分的实际安排。同盟的真正内容，永远在没写出来的那十四页里。"
 KRAUS_german_industry_standard_desc: "克虏伯工程师向奥地利各工厂提供了一套生产标准表格，对单道工序工时、每吨钢成品率及废品容许上限作出量化规定。斯柯达厂据此执行三个月后，单位产出上升两成。一位工程师在报告里写：效率是可以学的，但前提是你愿意承认自己落后。"
 KRAUS_german_heavy_industry_desc: "鲁尔区重工业规模超过维也纳，帝国据此确定产业发展方向，将钢铁、煤炭、机械及军工列为优先领域，集中配置资源。半年内军工厂产能提升一个台阶，但民用商品供应减少，物价上涨。战备优先于民生，属既定政策选择。这是选择，不是意外。"
 KRAUS_german_infrastructure_desc: "枯水期多瑙河驳船搁浅，南方铁路为单线运行，制约帝国货运效率。针对上述问题，帝国同步实施两项工程：疏浚多瑙河航道，完成南方铁路电气化改造。工程完工后，维也纳至亚得里亚海的货物运输时间缩短三天，阿尔卑斯矿石得以低成本运抵布拉格。基础设施是唯一一种永远不会过时的生产力。"
 KRAUS_german_capital_desc: "德意志银行在维也纳设立分行，系二十年来首家。根据放贷条件，企业股份予以保留，管理权由奥地利方面负责；德方主要获取市场与原料，帝国工业体系具备相应供给能力。自此，维也纳的经济周期与柏林同步。资本的流向决定了政治的走向。"
 KRAUS_german_economic_coop_desc: "关税同盟谈判历时两年，核心争议在于维也纳是否保留自主制定关税的权力。德方承诺予以保留，但附加三项条款。奥方审阅条款内容后签署协定。财政大臣在日记中写道：我们在拿一部分自由，换一整个市场。"
 KRAUS_balkan_volunteer_act_desc: "志愿军团系奥匈既有编制，普法战争期间已有先例。此次法案规定：不宣战，不派正规军，仅允许志愿人员以个人身份前往巴尔干；薪饷由私人基金发放，装备从库存旧物中调拨。外交大臣在议会上的说法是：我们没有派兵，我们只是没有阻止他们。"
 KRAUS_balkan_arms_factory_desc: "索菲亚郊外荒地已启动兵工厂扩建工程。该项目由保加利亚提供土地与劳工，帝国方面负责技术与设备输入，施工图纸由斯柯达提供，部分工人自维也纳调派，钢轨已铺设至工地现场。建成后产出的火炮由两国各分一半。一座工厂比一份条约更牢靠——因为它拆不掉。"
 KRAUS_balkan_isolate_done_desc: "奥地利与保加利亚在普罗夫迪夫举行联合参谋演习，双方各投入两个师。地图推演进行至第三天，保加利亚参谋提出一项方案，奥地利联络官当场予以否决，理由是该方案与帝国总参两年前的计划高度重合，而该计划在彼次演习中已告失败。\n能当着盟友的面说你错了，这段关系就算立住了。"
 KRAUS_balkan_sanction_romania_desc: "多布罗加地区难民沿多瑙河向上游迁移，入境人数由数千人增至数万人。保加利亚各港口城市人口短期内骤增，粮食价格三日内上涨四成，当地警察已对相关路段实施封锁。邻国灾情已向周边国家扩散。邻国的灾难，从来不会老老实实待在邻国境内。"
 KRAUS_balkan_nonintervention_desc: "当前巴尔干局势受贝尔格莱德条约框架约束，维也纳方面据此明确不干涉政策，声明帝国不介入该条约内部事务。此项举措在划定奥地利行动边界的同时，向柏林传递了不在巴尔干采取单边行动的立场，从而稳定各方对奥地利战略意图的判断。什么都不做，有时候也是一种姿态。"
 KRAUS_balkan_watch_desc: "当前巴尔干局势尚不明朗，何时介入仍需研判。帝国情报部门已在贝尔格莱德、索菲亚、雅典各部署一组人员，每周汇总报告，内容限于列车班次、动员规模及议会争论等具体事项。总参谋部对上述信息进行比对分析后认定，现阶段不具备行动条件。观望的目的在于等待对方先出现失误。观望不是犹豫，是在等对方先犯错。"
 KRAUS_balkan_preserve_strength_desc: "总参谋部评估认为，贝尔格莱德条约若引发战争，无论塞尔维亚取胜导致多瑙河南岸出现强国，还是罗马尼亚取胜导致特兰西瓦尼亚局势复杂化，均不利于帝国。据此，帝国确定不介入该冲突，将兵力留作后续行动使用。蓄势不发不是怯懦，是把力气留给下一场。"
 KRAUS_balkan_joint_condemnation_desc: "针对巴尔干地区武力改变现状的企图，外交大臣主持起草联合照会。文件篇幅一页半，措辞经十一次修改定稿，通篇未出现「奥地利」三字，署名栏交由柏林方面签署，确保塞尔维亚与罗马尼亚均能准确理解文件内容。外交大臣的主张是让盟友出面——这样奥地利的手就还是干净的。"
 KRAUS_balkan_sanction_serbia_desc: "维也纳军方评估认为，在巴尔干地区采取经济手段优于军事部署。根据备忘录所列方案，塞尔维亚经济依赖农产品出口，罗马尼亚石油外运须经多瑙河航道，上述两条贸易通道均由帝国控制。具体举措为切断对两国的信贷供应并封锁多瑙河相关航段，以替代派遣两个军的军事行动，从而施加更大压力。关掉信贷和航道，比派两个军更省事，也更疼。"
 KRAUS_reflect_our_rule_desc:0 "各地递来的诉求不能被只归入治安案卷。财政分配、地方行政与中央的承诺，才是王冠领地不满的根源。维也纳把这些问题放进同一份施政议程，厘清哪些要求可以立即回应、哪些需要各方共同承担。承认治理出了问题，是重新获得信任的起点，而非软弱的表示。"
 KRAUS_soothe_czech_desc:0 "布拉格需要的答复必须落到地方生活与工业生产上。维也纳以投资和产业合作支持协商，让地方代表能向选民说明继续合作的好处。工厂与合同可以打开谈判的门，却不能代替政治信任；今天达成的安排，还要经得起往后的履约。橄榄枝要配得上实际的动作。"
 KRAUS_soothe_hungary_desc:0 "布达佩斯坚持自己不能被当作普通行省，中央也不能用无法兑现的许诺换取片刻平静。财政、军队和交通问题需要逐项商谈，工业援助则为谈判提供现实基础。双方先在能够执行的事项上取得进展，把更难的争执留在谈判桌上，而不是交给街头与军营。"
 KRAUS_imperial_mediation_desc:0 "分别安抚各地还不足以解决帝国的共同问题。皇宫召集各方，把已经讨论的援助、责任与地方诉求放到同一张桌上。皇帝以协调者的身份协助各方找到可以履行的安排，而不是替任何一方宣布胜利。会谈能否继续，取决于下一次承诺是否得到兑现。"
 KRAUS_trust_slovak_desc:0 "最初的援助已经打开沟通渠道，接下来要让它成为持续的合作。工程队、地方代表与中央部门共同安排道路和产业建设，把零散的许诺接成可以执行的计划。地方不必先相信帝国的每一句话，但应能够追问每项承诺的进度。这样的联系比一时的感激更牢靠。"
 KRAUS_plot_desc:0 "正式会谈之外，订单、运输安排和地方联络也在改变各方的选择。维也纳把这些分散的联系组织起来，使支持合作的人不必各自为战。中央的影响力由此深入地方，但关系网仍须靠履约维持。它能够为政治妥协创造条件，却不能替代各地对帝国未来的决定，也无法抹去其中的政治色彩。"
 KRAUS_accord_vassal_tt: "§C该辖区共享「王冠领地的和谐发展」，忠诚直接拉满，并获得两座民用工厂§!"


############################################################
### 战后秩序 · 处理第三国际与莫斯科协约的废墟（2026-09-24）
############################################################

KRAUS_war_order_britain: "伦敦重建委员会"
KRAUS_war_order_britain_desc: "流亡者回来了，回到一个已经不再有他们位置的国家。\n\n老国王被要求签字，把他家族在革命中失去的王位交出去——王冠落到一位哈布斯堡头上。英国被重建成的不是工团共和国，而是一个立宪君主国：通过婚姻与金钱，与维也纳绑在一起。\n\n§Y他们被允许回来。只是不再被允许统治。§!"
KRAUS_war_order_britain_tt: "§C在英国扶植亲奥政府。老国王退位，王冠归于哈布斯堡。§!"

KRAUS_war_order_france: "巴黎重建委员会"
KRAUS_war_order_france_desc: "法国需要的是重建，而不是占领。\n\n公社倒台，是因为它的经济早已空掉。维也纳出资金、工程师和煤，协助法国修复铁路、重开工厂，换回一个能长期往来的市场和一份善意。\n\n§Y我们要的不是法国的顺从，是它的账本能重新平衡。§!"
KRAUS_war_order_france_tt: "§C奥地利出资协助法国重建，两国往来因此恢复。§!"

KRAUS_war_order_russia: "莫斯科重建委员会"
KRAUS_war_order_russia_desc: "俄国是这场战争里最彻底的战败者之一。它的旧秩序已经崩塌，今后走向何方，并不由维也纳一手决定。\n\n莫斯科重建委员会能提供的，是贷款、工程师和外交上的斡旋，帮助俄国走出战争留下的废墟。至于它最后建成什么样的国家，要看俄国自己的政治走向。\n\n§Y维也纳可以搭桥，但路得俄国人自己走。§!"
KRAUS_war_order_russia_tt: "§C奥地利协助俄国重建；俄国的未来由其自身的政治走向决定。§!"
