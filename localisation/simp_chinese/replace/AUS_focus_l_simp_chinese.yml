 KRAUS_balkan_dual_arms_sales: "两面售械"
 KRAUS_balkan_dual_arms_sales_desc: "1935年6月起，军需总局向南斯拉夫交付Gewehr M95步枪12,700支、Skoda 100mm野炮36门；向保加利亚交付同型步枪8,400支、Skoda 150mm榴弹炮24门。合同以瑞士法郎计价。至少三批次弹药用于1936年马其顿边境冲突。货出维也纳，钱入国库，弹着点不在合同条款内。"
