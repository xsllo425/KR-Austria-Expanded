 AUS_heavy_bomber_trials: "重型轰炸机测试"
 AUS_eco_council_desc:0 "波希米亚的厂房、克罗地亚的工地与加利西亚的地方代表，要的不是演说，而是可以执行的投资安排。\n\n纲要把四条竖列分派下去：军工与制造商、研究、民用工程、战略资源。各王冠领按各自的份额出资，也按各自的份额分红；四条线走完，再由一份宪章把这一切固定下来。"
 AUS_vienna_circle_2_desc:0 "学派如今根基稳固、经费充足，在国际上也有了声望。下一步是邀请与王室有渊源的外国学者与研究机构加入，用共享的成果换取共享的资源。"
 AUS_daimler_desc:0 "戴姆勒在维也纳新城制造发动机与装甲车底盘，却一直受制于德国母公司的专利。让帝国境内的制造商结成同盟，共享专利、模具与熟练工人，军工订单也就不必再向柏林低头。"
 AUS_military_expansion_desc:0 "大战以来帝国的经济困境使军费难以到位。随着经济形势好转、全洲紧张局势加剧，军费已大幅增加，我们终于得以让军队实现现代化。"
 AUS_naval_effort_desc:0 "皇家与王家海军（k.u.k. Kriegsmarine）一向经费不足，也不受奥地利政府及其人民重视。没有殖民帝国，海军便从未获得任何真正的支持或战略目标。然而这是一种危险的心态，加之地中海出现了新的工团主义威胁，一支全新的海军对保卫我们的腹地至关重要。"
 AUS_flexible_navy_desc:0 "我们的海军参谋部决定奉行以潜艇与破交作战为核心的学说，以便在不正面迎击法国与英国海军压倒性力量的情况下造成尽可能大的破坏。我们的潜艇将在敌人最痛之处下手——经济。"
 AUS_istria_ports_desc:0 "的里雅斯特与普劳姆是我们两大主要海军基地，对我们的海外贸易至关重要。海军——历来被历代皇帝所忽视——恳请我们增加对伊斯特里亚工业设施与海军基地的投入；被其关于贸易收入增长的论据所打动，当今皇帝听取了他们的意见。"
 AUS_cattaro_desc:0 "科托尔湾（Cattaro，即Kotor）的k.k.空军基地始建于1914年，大战期间曾用于对亚得里亚海上空进行侦察飞行，战后却已被废弃。然而，它紧邻亚得里亚海入口的位置或许仍具有战略意义。"
 AUS_military_tech_desc:0 "皇家与王家军事技术委员会（TMK）的渊源可追溯至1717年，是k.u.k.战争部下辖的机构，负责军事技术的观测、开发与应用。他们在军队现代化中的作用绝对不可或缺，确保帝国在技术发展上不致落后，并使我们的部队始终保持精良装备。"
 AUS_radar_desc:0 "匈牙利数学家鲍伊·佐尔坦·拉约什（Zoltán Lajos Bay）在雷达方面的研究引起了TMK与飞行军团（Fliegerkorps）的注意，后者急于将这一发明付诸实践，以加强帝国对空中威胁的防御。关于无线电辅助飞机定位装置（Funkgestützte Flugzeugortung）的实验已见成效，帝国很快就能拥有一部可用的雷达。"
 AUS_rockets_desc:0 "帝国各地有不少火箭科学家，如欧根·桑格尔（Eugen Sänger）与西奥多·冯·卡门（Theodor von Kármán）。尽管人们对火箭及其军事用途仍存疑虑，委员会仍希望进一步发展火箭，认为其潜力巨大，不容忽视。"
 AUS_rifle_trials_desc:0 "尽管TMK在资源有限的情况下仍使帝国免于落后太远，但战争部尚未为我们的部队采用一款半自动步枪。委员会希望纠正这一点，而帝国众多军火公司也急于竞争政府合同。为确保采用最优良的步枪，TMK正组织新一轮步枪试验。"
 AUS_artillery_modernisation_desc:0 "尽管斯柯达与伯勒尔等公司凭借海外合同得以紧跟世界火炮发展，但我们的大多数火炮仍是来自大战。火炮是最重要的军事技术之一，随着我们扩充军械库，TMK急于用现代化火炮替换军中老旧的火炮。"
 AUS_military_mountaineers_desc:0 "战场上的桥、路与堡垒，靠的是受过正规训练的工兵，而不是临时抽调的壮丁。帝国把各王冠领的工兵连并入统一编制，设立职业军衔与固定的训练周期，让他们带着同一套作业规程出现在任何一条战线上。"
 AUS_motorisation_desc:0 "尽管奥匈帝国是军队采用汽车的先驱，但数量始终有限。k.u.k.军事汽车事务局（Militär-Automobilwesen）是TMK中负责军用车辆开发与部署的部门。卡车的重要性总参谋部早已明了，他们将军队摩托化列为优先事项。"
 AUS_aviation_effort_desc:0 "飞行军团（Fliegerkorps）旧称k.u.k.航空部队（Luftfahrtruppen），是奥匈帝国的空中力量。大战期间它兵力捉襟见肘，可动用的飞机数量有限。战后因经费短缺，鲜有作为来纠正这一点。如今军队重新获得充裕资金，现代化并扩充飞行军团终于成为可能。"
 AUS_mil_expanded_desc:0 "我军的改革是一段漫长而昂贵的历程，但终于得到了回报。新式坦克、火炮、舰船与飞机正源源不断地下线，进入待命的军队，经过改革，随时准备迎战帝国的敌人！"
 AUS_farms_expand_desc:0 "匈牙利与下奥地利的平原出产供养帝国的粮食，耕作方式与产出却仍然落后。改良轮作、扩大垦殖，让王冠领的粮仓真正成为帝国的粮仓。"
 AUS_homeland_mil_desc:0 "各王冠领的兵工厂要同时开工，就需要统一的标准、统一的验收和统一的原料调度。设立多瑙河兵工总局，把下奥地利与波希米亚的重工业区连成一片，帝国第一次拥有了可以与德国对称的军工产能。"
 AUS_small_ships_effort_desc:0 "我们已决定需要新型驱逐舰与轻巡洋舰，以对抗敌方潜艇并建立水面存在。我们的潜艇固然不错，但需要更大的舰船来支援陆上作战，并完成潜艇火力所不能胜任的任务。"
 AUS_tank_trials_desc:0 "对许多人而言大战的创伤仍记忆犹新，坦克却因其在战争中的表现被奥匈军方欣然接纳，斯柯达与ČKD等公司更研发出世界上一些最先进的坦克设计。随着坦克技术迅猛发展，TMK希望举行试验，为不同用途选用新型坦克。"
 AUS_large_navy_desc:0 "按照传统学说，海军参谋部决定支持我们现有的较大规模水面舰队。以愈发庞大的战列舰为核心，并通过更大的舰炮增强火力，这些构想将帮助我们投送实力并支援陆上作战。"
 AUS_capital_ships_effort_desc:0 "参谋部已开始齐心协力改进我们的战列舰设计，为海战带来更强的火力。增大舰炮口径与装甲带，使我们的战列舰在领头发起攻击时能够承受多得多的打击，同时也造成更大的伤害。"
 AUS_skoda_desc:0 "大战期间，布拉格以西的斯柯达工厂是帝国最大的军火生产商，战后却在德国重工业的压力下勉强维生。纲要把它和各王冠领的兵工厂并成一个联合体：订单统一下发，图纸统一共享。王冠领的工厂从此是帝国军工的一部分，而不是它的竞争者。"
 AUS_suedbahn_desc:0 "南铁从维也纳经格拉茨通往莱巴赫与的里雅斯特，是帝国通向亚得里亚的大动脉。把它电气化，沿线的工厂、港口与矿区才算真正接进同一个市场。"
 AUS_homeland_eco_desc:0 "黑色星期一的冲击在维也纳及周边尤为强烈。比起再发一轮救济，不如把钱投在住宅、水厂和车站上：民用建设是最快让人回到工作岗位的办法。"
 AUS_reform_AOK_desc:0 "陆军最高指挥部（Armeeoberkommando，AOK）始设于1914年。其任务是统一共同陆军、海军、奥地利地方军（Landwehr）与匈牙利国防军（Honvéd）的不同指挥机构，以统筹战争。但战后不久AOK即被解散，我们的部队再度被分割。重建AOK被视为统一各部队所必需。"
 AUS_doctrine_Hickmann_desc:0 "总参谋部成员、工程师少将埃米尔·希克曼（Emil Hickmann）认为，军队应致力于对帝国敌人取得技术优势。由于大战仍是一段创伤性的经历，尽量减少伤亡至关重要，希克曼相信改进火力支援与装备是现代战争的关键。"
 AUS_better_support_equipment_desc:0 "部队必须装备精良才能发挥效力。支援越多，表现就越好，伤亡也越少。这不仅包括火炮，还包括运送伤员的卡车、适当的侦察与维护单位等等。"
 AUS_doctrine_von_Hubicki_desc:0 "骑兵上将阿尔弗雷德·冯·胡比基（Alfred von Hubicki），现任奥匈骑兵司令，认为战争的未来在于坦克与卡车。机动性是关键，坦克是战场上新式的骠骑兵与胸甲骑兵。这支新骑兵必须在敌人反应过来之前机动取胜并将其压倒。"
 AUS_mech_cavalry_desc:0 "坦克虽强，却需要步兵支援，否则会变得极为脆弱。步兵必须能跟上坦克，而卡车虽适合公路，履带式运输车却更为理想。所幸，一支匈牙利部队已将过时的坦克与火炮牵引车改装为临时装甲运兵车，恰好可以填补这一空白。"
 AUS_doctrine_Jansa_desc:0 "陆军中将阿尔弗雷德·扬萨·冯·坦内瑙（Alfred Janša von Tannenau），下一任总参谋长可能的候选人之一，在经历大战的创伤性损失后，主张帝国采取防御战略。他相信周密的计划与准备是进行战争的最佳方式，希望改善指挥官之间的通讯，以尽可能限制伤亡。"
 AUS_auftragstaktik_desc:0 "任务式战术（Auftragstaktik）在大战期间已被成功采用。这种战术由高层下达明确界定的任务，由下属独立完成，给予后者极大的灵活性并鼓励主动精神。任务式战术可加以改编以适用于现代战争，并应用于新学说之中。"
 AUS_communications_desc:0 "自大战爆发以来，无线电等发明使指挥官与部队之间的通讯大为便利。通讯改善后，高层可以更迅速地应对突发事态，限制其造成的损害并予以反击。"
 AUS_infanteriepanzer_desc:0 "尽管军中已有众多成功的骑兵坦克设计，步兵坦克项目迄今却未能拿出成果。这一点必须纠正，因为在我们的新学说中步兵支援被列为优先，该项目应进一步推进。即将问世的设计正变得更重、更昂贵，但也更强大、防护更好。"
 AUS_kavalleriepanzer_desc:0 "装甲部队跑得再快，也过不去一条没有桥的河。帝国把架桥、排障与爆破用的工程车辆编进装甲师，让它们跟着坦克一起行动，而不是等在后方的仓库里。"
 AUS_vienna_circle_1_desc:0 "维也纳学派汇聚了维也纳大学最聪明的头脑：数学家、哲学家与自然科学家。给它固定的经费、固定的席位和固定的实验室，让这股思潮变成一个机构，而不再只是一场沙龙。"
 AUS_elections_desc:0 "维也纳在危机阴影下举行大选。各党争夺议席，也争夺对恢复方案的解释权。伦纳与米克拉斯都要说明自己依靠谁、向谁负责：是议会多数与工会，还是地方网络与皇室背书。选票只决定内阁的起点，不能替政府兑现任何一项承诺。"
 AUS_cs_national_austerity_council_desc:0 "[KRAUS_fr_AUS_cs_national_austerity_council_d]"
 AUS_cs_7_desc:0 "[KRAUS_fr_AUS_cs_7_d]"
 AUS_cs_6_desc:0 "[KRAUS_fr_AUS_cs_6_d]"
 AUS_cs_fill_the_coffers_desc:0 "[KRAUS_fr_AUS_cs_fill_the_coffers_d]"
 AUS_ausgleich_desc:0 "布达佩斯的代表带来了新的要求，维也纳的内阁也准备了一叠关于共同开支与帝国责任的文件。二元协定的再谈判，关系着谁承担费用、谁作出决定，以及各王冠领是否继续相信这套安排。过去的承诺与尚未解决的不满都会被带到桌上。皇室可以促成会面，却不能替各方决定他们愿意付出的代价。"
 AUS_embrace_pluralism_desc:0 "将帝国改为更民主的政府形式的时机已经到来。这个中央集权联邦国家的建立，将为所有奥地利民族带来更光明的未来。"
 AUS_military_occupation_desc:0 "叛乱的王室领地已被镇压，但我们无意在近期以任何形式放任其自由。让所有哪怕只是动念挑战奥地利帝国的人，都面对与他们相同的命运。"
 AUS_extend_hungarian_airbases_desc:0 "匈牙利幅员辽阔，要迅速应对任何新威胁都很困难，尤其是来自罗马尼亚与巴尔干的威胁。在全国各地修建新机场将缓解这一问题，同时也支持地方经济与全国的重建工作。"
 AUS_the_new_Empire_desc:0 "奥地利不仅仅是一个地理区域或一个国家。它是一种理念，是对一个蒙受守望欧洲之天命的神圣天主教帝国的信仰的表达。尽管数百年来我们的权威在内外都受到挑战，我们的帝国却始终长存，因为统治世界乃是奥地利的宿命。"
 AUS_hungarian_lands_desc:0 "匈牙利虽主要是个农业国，但在西部确有庞大的民用工业，不幸的是，大部分战斗恰好发生于此。在战争中部分被毁的布达佩斯，将成为帝国政府一项努力的核心，旨在让这片饱受战火摧残的地区重现昔日荣光。"
 AUS_adria_sea_ports_desc:0 "随着新工业就位，是时候提升我们的造船能力，以及推动对我们的工业至关重要的贸易的能力了。这些崭新的船坞将支撑我们的海军与商船队，确保我们在亚得里亚海相对于任何潜在的意大利觊觎者的首要地位。"
 AUS_italy_desc:0 "大战之后，我们将意大利重组为一个由哈布斯堡家族领导的、由统一前各邦国组成的联邦，但1925年我军撤出意大利南部后，联邦的大部分成员放弃了我们的宏图，联邦随之瓦解。我们是否应当重燃那不勒斯的纽带？"
 AUS_united_states_desc:0 "各王冠领不再按谁先到、谁的声音大来分座位。每一个民族在议会里有同样的席位，每一个邦在联邦里有同样的宪法权利：语言、教育、税收与军役，都以同一张表格写明。\n\n这是合众国真正开始运转的一天。从今天起，国策树里的每一条路都服务于同一个目标：让各个民族相信，这个国家属于他们每一个人。"
 AUS_us_looking_outwards_desc:0 "往昔的分歧既已抛诸脑后，各邦的动员、粮食与交通预案被写进同一份文件。我们不再被内部权斗的重负所累，而是准备好团结一心面对世界。"
 AUS_us_deal_with_Hungary_desc:0 "匈牙利多年来索要的赔偿，是一个财政问题，也是一个面子问题。联邦愿意把账目摊开来算，一次付清，让这个邦不必再带着旧账走进新宪法。"
 AUS_italy_republic_ultimatum_desc:0 "我们南边米兰的意大利共和国将永远是我们的危险与眼中钉。若我们希望让奥地利重新主宰意大利，就必须要求共和派将权力归还给意大利联邦委员会，这样当他们攻占北意大利其余地区后，才不会背叛我们。"
 AUS_decentralised_development_scheme_desc:0 "财富不能只留在维也纳。联邦设立均衡发展基金，把关税与铁路收入按各邦的人口与需求重新分配。每个邦都拿到自己的那一份，也负责把它用好。"
 AUS_transformation_of_nature_desc:0 "科技建设落到土地上：多瑙河与蒂萨河的堤防重筑，沼泽被排干，平原上的农场第一次有了稳定的灌溉。山地的林场也按新的采伐表经营。"
 AUS_decentralised_more_factories_desc:0 "工业园之后是准独立的区域性制造机构，由当地的工程师与工人共同管理，产品按联邦统一的标准验收。"
 AUS_decentralised_infrastructure_desc:0 "民生从路开始。铁路轨距、公路养护与桥梁荷载都按同一标准重修，让一个邦的农民可以把货运到另一个邦的集市上。"
 AUS_decentralised_docks_desc:0 "强大的海军需要船坞。联邦在亚得里亚沿岸的几个邦同时扩建造船能力，让沿海的邦第一次把海军当作自己的事业。"
 AUS_decentralised_resources_desc:0 "加利西亚或许相对落后，地下却蕴藏着丰富的石油。联邦出资勘探、开采与运输，让这笔收入同时进入各邦的预算。"
 AUS_all_austrian_development_scheme_desc:0 "虽然名义上帝国已在一个中央政府之下重新统一，现实却大不相同。旧有的各邦需要时间与努力才能融入帝国行政，帝国形形色色的民族也需要时间才能接受我们的统治。"
 AUS_ANI_tirol_desc:0 "意大利民族主义协会（ANI）几乎从定义上就是我们的死敌。他们的领袖是疯子，他们的民族主义言论危险，他们对我们南方领土的声索不可接受。我们并不像他们以为的那样脆弱，我们将像碾死虫子一样碾碎他们。"
 AUS_claim_romanian_lands_desc:0 "科尔内留·泽莱亚·科德雷亚努（Corneliu Codreanu）治下的罗马尼亚政权，以当地存在大量罗马尼亚族群为由，声索特兰西瓦尼亚的大片地区及我们最东部的省份。然而，当前的政治动荡使罗马尼亚军队的效力远不及本可达到的水平，因此如今正是为皇帝索回整个罗马尼亚与所有罗马尼亚人的时机！"
 AUS_status_quo_desc:0 "正如十年前一样，我们为建立一个行政上统一的帝国而进行的谈判归于失败。我们别无他法，只能静待时机，同时试图通过改革将外莱塔尼亚更紧密地绑缚过来。"
 AUS_kk_Administrative_Reform_desc:0 "在维也纳改革的事情，也应在布拉格、克拉科夫与萨格勒布改革。基于此，我们目前正在开发一套新的地方行政体系。"
 AUS_agram_industrial_complex_desc:0 "阿格拉姆，即萨格勒布，在十余年前刚被定为伊利里亚的首府。这在很大程度上是个图方便的选择，因为该城靠近奥地利边境。然而，一项新提出的计划打算开设一个大型工业综合体，使它更配得上作为全体伊利里亚人的首府。"
 AUS_northern_railway_bohemia_desc:0 "鉴于匈牙利的铁路系统达不到一个工业化的加利西亚融入帝国经济所需的标准，k.k.国家铁路公司（Staatsbahnen）提出了一项绕开喀尔巴阡盆地的计划。这将从修建一条穿越摩拉维亚的坚固连接线开始，以抵达加利西亚的土地。"
 AUS_ausgleich_1947_desc:0 "奥匈折衷方案将再次重新谈判，而这一次，帝国的奥地利部分所处的地位远比上次强大。现在我们将把我们的意志强加于他们。"
 AUS_the_illyrian_suedbahn_desc:0 "已通达的里雅斯特的南铁路，可以轻易延伸进入伊利里亚，这有助于将阿格拉姆盆地与伊利里亚海岸线融入帝国的工业。这还将使我们能够加快为海军生产新舰船的速度。"
 AUS_cisleithania_centralised_desc:0 "我们正在进行的改革已将帝国凝聚在一起。诚然，匈牙利仍在抵抗，但即便是他们也无法否认，奥地利比以往任何时候都更加统一。"
 AUS_galician_oil_desc:0 "我们发现东加利西亚蕴藏石油。开采它，将使我们得以在帝国这片相当偏远的地区建立更多工业。"
 AUS_still_their_king_desc:0 "匈牙利尽可随意宣称，我们仍是他们的宗主，而我们如今正与一个外部威胁交战。无论结局如何，我们眼下都必须搁置分歧。"
 AUS_kk_Ministeria_desc:0 "k.k.各部（Ministeria）与昔日同匈牙利共有的各部类似，旨在与新臣民协调行政事务。"
 AUS_cs_5_desc:0 "[KRAUS_fr_AUS_cs_5_d]"
 AUS_unify_italy_desc:0 "都灵的意大利工团主义者起义将这个国家一分为二：西部是由法国支持的意大利社会主义共和国，而我国边境上则是意大利共和国。德法两国公开敌对，帮助共和国不仅会使我们讨得他们的欢心，还将为对法战争稳固我们的侧翼。"
 AUS_cs_2_desc:0 "[KRAUS_fr_AUS_cs_2_d]"
 AUS_us_deal_with_Cisleithania_desc:0 "内莱塔尼亚的各个邦已经有了统一的铁路和邮政，下一步是统一的行政区。边界保留在历史与文化里，不再保留在公文的抬头上。"
 AUS_am_followup_2_desc:0 "最糟糕的时刻过去了，医院、救济站与孤儿院的账目却才刚刚列出来。联邦把各邦的医疗体系并入同一套标准，由地方管理、中央拨款。"
 AUS_am_followup_3_desc:0 "官方文书、学校与法庭都必须同时使用各民族的语言。这是文化上最慢的一步，也是最难被推翻的一步。二元协定的旧账同时作废。"
 AUS_am_followup_4_desc:0 "为协调匈牙利而设的各项安排终于完成，匈牙利议员的席位并入联邦议会的同一份名单。骄傲的邦也有了与其他邦同样的发言权。"
 AUS_am_followup_5_desc:0 "数十年的相互指责渐渐变成了日常的合作。各邦的报纸开始互相引用，各民族的学校开始互相交换教师。和解不是一件事，而是一千件小事。"
 AUS_bohemian_lands_desc:0 "作为我们与德国之间的主要边境地区，保持道路与铁路系统维护良好、容量足够，以便一旦冲突爆发能够运送我军，至关重要。在那场短暂却高度机械化的战争之后，波希米亚的道路已谈不上维护良好，捷克叛军在该地区的战斗更是雪上加霜。"
 AUS_direct_rule_from_Vienna_desc:0 "既然新臣民已更紧密地绑缚于维也纳，我们目前正在制定一项如何重新整合他们的计划。"
 AUS_bohemian_resources_desc:0 "随着布拉格现处于新中央政府的控制之下，该城的钢铁产量已远远偏离应有水平，这一点已显而易见。一项补贴布拉格铁厂的计划已由帝国议会（Kaiserrat）提出，看来已引起皇帝与帝国行政部门的注意。"
 AUS_claim_serbia_desc:0 "塞尔维亚长期以来是我们的眼中钉，从奥斯曼统治时期侵入匈牙利劫掠，到弗朗茨·斐迪南之死与对波斯尼亚的袭击。这样一个好战的国家不能被容许在我们的边境上不受挑战地坐大，仅凭其自身的存在便公然藐视皇帝的权威。"
 AUS_northern_railway_galicia_desc:0 "北方铁路的修建将从摩拉维亚开始继续，途经克拉考，然后朝向伦贝格及更远处的重要工业目标。"
 AUS_us_united_desc:0 "奥地利不再有统一的虚表，而是真正的统一。昔日争吵内斗之处，如今各邦的官员坐在同一张桌子前处理同一份预算。"
 AUS_adriatic_ports_desc:0 "奥地利一直以来的梦想之一便是主宰亚得里亚海。随着意大利大为削弱，伊利里亚海岸线又已准备好修建更多船坞与海军基地，这个梦想或可成真。"
 AUS_kk_Education_Reform_desc:0 "通过将1920年代奥地利本部发生的各项教育体系改革推行到内莱塔尼亚的其他各邦，我们便能更高效地教育我们臣民的子弟，并使之更乐于接受统一奥地利的理念。"
 AUS_decentralised_factories_desc:0 "各邦分别设立工业园，由当地的商会和联邦共同出资。工人不必为了一份工资搬到维也纳，产品也不必只往维也纳卖。"
 AUS_transcarpathian_railway_desc:0 "过去二十年里，抵达帝国的边远尽头一直困难重重，匈牙利拒绝让我们现代化其铁路网络。如今我们重新掌权，就让我们实施一项旧计划——一条笔直横穿喀尔巴阡盆地的高速铁路。"
 AUS_decentralised_military_factories_desc:0 "军工不再集中于一处。联邦把军工订单分摊给各邦，既降低了对单一地区的依赖，也让每个邦都有一部分自己的军需产业。战时，这意味着没有一个邦只是旁观者。"
 AUS_morava_industrial_park_desc:0 "举目所及，皆是混凝土与钢铁。摩拉瓦工业园是一座具有革命性的综合体，将主要生产重型机械。"
 AUS_sdap_industrial_workers_council_desc:0 "[KRAUS_fr_AUS_sdap_industrial_workers_council_d]"
 AUS_sdap_4_desc:0 "[KRAUS_fr_AUS_sdap_4_d]"
 AUS_sdap_3_desc:0 "[KRAUS_fr_AUS_sdap_3_d]"
 AUS_sdap_2_desc:0 "[KRAUS_fr_AUS_sdap_2_d]"
 AUS_sdap_5_desc:0 "[KRAUS_fr_AUS_sdap_5_d]"
 AUS_sdap_6_desc:0 "[KRAUS_fr_AUS_sdap_6_d]"
 AUS_drastic_measures_desc:0 "正在进行的战争已使内莱塔尼亚政府不堪重负，地方治理陷入混乱。若要度过这场危机，我们必须对联邦内的臣民承担更直接的控制。"
 AUS_cs_4_desc:0 "[KRAUS_fr_AUS_cs_4_d]"
 AUS_the_kk_Identity_desc:0 "奥匈帝国常被描述为一堆各自独立、只是碰巧由同一家族统治的国家。随他们怎么嘲笑我们的帝国，我们对我们的皇帝怀有信心。"
 AUS_italy_republic_friendship_desc:0 "既然意大利南部的各邦看来不太可能帮助我们恢复联邦，我们便应把全部希望寄托在米兰的盟友身上。他们长期以来对我们保持忠诚，我们也将回报这份友谊。"
 AUS_cisleithanian_development_scheme_desc:0 "内莱塔尼亚发展计划的部分提出目的，是以超越匈牙利的方式来削弱它；该计划旨在让内莱塔尼亚奥地利的众多地区更加紧密，并在经济上使它们赶上帝国较发达的地区。"
 AUS_us_approaching_the_autonomies_desc:0 "各王冠领的议会不再只是维也纳的回声。联邦议会设立协调委员会，每个邦都能提出自己的议案，也能否决别人的议案。政治上的平等，从议席表开始。"
 AUS_cro_bosnian_lands_desc:0 "波斯尼亚与克罗地亚虽不像匈牙利那样饱受战火摧残，却仍遭受了破坏，而族群恐怖主义与异议更使之加剧。然而，作为对我们的海军与民用贸易都重要的地区，在此地创建新工业对我们经济的助益之大，不容忽视。"
 AUS_sdap_1_desc:0 "[KRAUS_fr_AUS_sdap_1_d]"
 AUS_am_stabilising_the_country_desc:0 "国家需要先稳下来，才谈得上平等。社会议题的清单被逐条排队：语言文书、行政官员的任免、地方警察的权限。每解决一件，街头就少一个争吵的理由。"
 AUS_claim_silesia_desc:0 "西里西亚于1742年奥地利王位继承战争期间被普鲁士夺取，他们占据这个奥匈帝国昔日的工业心脏已近两百年。值此德国一年中格外动荡之际，我们觉得此刻正是夺回本属于我们之物的好时机。"
 AUS_sdap_7_desc:0 "[KRAUS_fr_AUS_sdap_7_d]"
 AUS_cs_3_desc:0 "[KRAUS_fr_AUS_cs_3_d]"
 AUS_alpine_mines_desc:0 "阿尔卑斯山下埋着足够的铁矿，我们直到如今才有钱把它开采出来。让王冠领的矿区也分到一份设备与技术。"
 AUS_flugschule_desc:0 "奥匈帝国各地虽有不少飞行学校，却从未有一所中央化的学院来统筹飞行军团飞行员与军官的训练。设立这样一所机构对改革至关重要，因为它将培养出新一代的军官与飞行员，同时也将飞行军团整合得不那么临时拼凑。"
 AUS_light_bomber_trials_desc:0 "由于支援陆军作战是飞行军团的优先事项，采用一款轻型轰炸机来担此角色实属必要。潜在设计从相对\"重型\"的双引擎轰炸机，到改装为俯冲轰炸机的战斗机，各不相同。"
 AUS_fighter_trials_desc:0 "飞机技术正以惊人的速度发展。为了跟上步伐，必须举行试验，为飞行军团采用一款新型战斗机。毕竟，战斗机可以说是空军的骨干，将有助于确保我们天空的安全。"
 AUS_phoenix_desc:0 "大战期间，维也纳一家名为凤凰（Phönix）的小公司通过生产授权德国飞机供应我国市场，为我空军供货。自那以后，该公司试验了多种设计，其中一些或许正是现代化飞行军团的关键。"
 AUS_medium_bomber_trials_desc:0 "一款多用途双引擎中型轰炸机承担多种不同任务的潜力，已引起高层的注意。由于战术轰炸机对飞行军团将极为有用，飞机制造商们又一次在试验中竞争下一代轰炸机。"
 AUS_airbase_expansion_desc:0 "航程更长的单翼机为我们带来了军事与经济上的新机会。为飞行军团完善基地，使这些飞机得以充分发挥作用，将帮助我们争夺制空权，减少人员损失。航空运输也能把新的商品送往地方，带动当地经济。"
 AUS_heavy_bomber_trials_desc:0 "重型轰炸机是飞机技术中相对较新的发展，战略轰炸的拥护者看到了它们的潜力。其远航程与巨大载弹量使之非常适合这一角色。因此，试验正在举行，各飞机公司都急于赢得这样一份利润丰厚的合同。"
 KRAUS_german_deep_binding: "从多瑙河到莱茵河"
 KRAUS_german_deep_binding_desc: "奥地利与德国此前各自独立运行，多瑙河流经维也纳、布达佩斯、贝尔格莱德，莱茵河北流至鲁尔区及克虏伯工厂。现通过铁路运输钢材与机床，建立两国间的经济联系。从此以后，奥地利的事就是德国的事——反过来说，也一样。"
