 KRAUS_german_standardisation_tt: "德制口径统一，新建军工厂"
 KRAUS_german_armor_doctrine: "艾曼斯贝格的装甲教范"
 KRAUS_german_armor_doctrine_desc: "总参谋部经三日会议，决定将装甲兵作为建军方向。帝国面临石油、工业产能及试验场地不足的制约，但基于未来战争形态将脱离战壕战的判断，仍推进该计划。具体举措包括：斯柯达工厂底盘生产线转向坦克制造，蒂罗尔试验场实行昼夜连续作业；德方提供图纸与教官，奥方负责产能与工人配置。第一批量产坦克下线后，一位老将军的评价是：我们造的不是坦克，是让维也纳再次说话的方式。"
 KRAUS_german_armor_doctrine_tt: "装甲装备加成，陆军攻击/突破提升"
 KRAUS_german_infantry_doctrine: "马特纳的步兵教范"
 KRAUS_german_infantry_doctrine_desc: "总参谋部评估认为，帝国人力充足而工业有限，据此确定以步兵师为基本建设单位的方针。具体举措包括：斯柯达火炮分厂扩建三条生产线，斯蒂尔-戴姆勒卡车产量翻倍；新编步兵操典要求每名士兵掌握火炮操作、工事构筑与机枪使用。上述措施旨在使每个步兵师的火炮、弹药与训练达到规定标准。一位参谋在备忘录里写道：我们不做最先进的军队，我们做一支不会垮的军队。"
 KRAUS_german_infantry_doctrine_tt: "步兵与炮兵装备加成"
 KRAUS_german_combined_doctrine: "合成兵种"
 KRAUS_german_combined_doctrine_desc: "当前合成兵种建设面临经费压力，德国顾问曾以“奥地利养不起”为由提出反对意见。维也纳方面坚持推进此项编制调整，将装甲、步兵、炮兵、工兵、通信等兵种编入同一战斗群，统一行动节奏，并配套开展高强度训练，强化各兵种间的协同责任。演习结果显示，合成战斗群以三分之二兵力达成了同等战术目标，柏林方面对此不再持异议；该编制方案的额外开支已计入预算，其实际成效将在后续作战中体现。\n代价写在预算表上，回报写在未来的战报里。"
 KRAUS_german_combined_doctrine_tt: "合成兵种：全面战斗加成，要求战争支持 > 30%"
