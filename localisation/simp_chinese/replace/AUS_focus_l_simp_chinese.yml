l_simp_chinese:
 KRAUS_german_relations: "从维也纳到柏林"
 KRAUS_german_relations_desc: "柏林从不掩饰对奥地利的兴趣。对德国来说，奥地利是缺失的一块；对奥地利来说，德国是唯一能救它的力量，也是唯一能吞掉它的力量。\n\n维也纳的结论是：不是去投靠德国，而是去用德国。"
 KRAUS_german_light_industry: "维也纳消费品工业"
 KRAUS_german_light_industry_desc: "资源投向纺织、食品、日用消费品。维也纳的货架满了，物价稳了，街头的抱怨少了。工人家庭餐桌上多了肉，孩子们有了新鞋。\n\n军方仍要炮。财政大臣的回答是：炮不能当饭吃。"
 KRAUS_balkan_war_ended: "枪声停下的那一天"
 KRAUS_balkan_war_ended_desc: "枪声终于停了。旧格局结束了。维也纳的档案室把过去几年的文件装进一个标着「巴尔干—已结案」的文件夹。没有人写总结——战后他们自会明白，巴尔干的每一次转折都是从这间会议室开始的。"
 KRAUS_soothe_slovak:0 "山间的声音"
 KRAUS_soothe_slovak_desc:0 "斯洛伐克地方的诉求不应淹没在维也纳与布达佩斯的争执中。道路、就业和公共服务是否得到照顾，比远处的政治口号更容易检验。中央把地方需要纳入援助安排，让协商有具体的着落。只有当地人看见持续的投入，帝国的保证才会获得分量。"
 KRAUS_balkan_anchor: "巴尔干的守护者"
 KRAUS_balkan_anchor_desc: "巴尔干是帝国南翼的软腹。贝尔格莱德条约把整个半岛变成了塞尔维亚人的后院，而维也纳能做的只有一件事：把罗马尼亚人、保加利亚人、希腊人和阿尔巴尼亚人重新拉回自己的轨道上。"
