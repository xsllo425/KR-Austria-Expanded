 KRAUS_balkan_isolate_done: "巴尔干联合参谋演习"
 AUS_loehr-plan: "洛尔的攻势空军方案"
 AUS_loehr-plan_desc: "亚历山大·洛尔少将主张战略轰炸，并让航空兵团从陆军中进一步独立出来。\n\n有了重型轰炸机，帝国空军就能把战火烧到任何一个敌人头上，摧毁他们的军事能力与意志——而不是只在前线当代价高昂的炮兵。"
 AUS_uzelac-plan: "乌泽拉茨的对地支援方案"
 AUS_uzelac-plan_desc: "米兰·埃米尔·乌泽拉茨是航空兵团的首任指挥官，在总参谋部和飞行军团中仍有影响力。\n\n他认为空军存在的意义就是支援陆军作战——因此必须专注于战斗机以维持制空权，以及轻型轰炸机以打击敌方前线阵地。"
 AUS_austro-marxism: "国家中的民族"
 AUS_austro-marxism_desc: "帝国旧有的边界与行政体系，从来不肯承认它民族构成的荒谬程度。\n\n没有「波西米亚人」，只有德意志人和捷克人；同样也没有「加利西亚人」，只有波兰人和鲁塞尼亚人。旧官僚体系甚至懒得记录一个人属于哪个民族。\n\n§Y这种局面必须结束。§!"
 KRAUS_common_army_reborn_merge_tt: "§C本项将把你的三项军事精神合并为一个全新的精神：§Y巴伐利亚联合军事演习§!§!"
 KRAUS_central_european_prosperity_merge_tt: "§C本项将把经济线的现有成果合并为一个全新的精神：§Y德奥经济共同体§!。\n获得的加成取决于你在三条路线中选择的那一条——§Y基建§!、§Y重工§!或§Y轻工§!——该路线的效果将§C翻倍§!，其余两条不生效。§!"
