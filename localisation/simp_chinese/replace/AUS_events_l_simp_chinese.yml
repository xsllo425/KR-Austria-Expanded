############################################################
### 战后秩序 · 全球去殖民化浪潮（2026-09-24）
############################################################

KRAUS_war_order_events.1.t: "去殖民化浪潮"
KRAUS_war_order_events.1.d: "欧洲的帝国都跪在了地上，而每一个都还攥着它已经养不起的殖民地。\n\n维也纳没有殖民地。这不是弱点——这是资格。我们是欧洲唯一一个可以在要求拆掉殖民体系时，不必回答「你自己打算留哪块」的大国。\n\n§Y平等博爱。团结合作。民主自由。我们造这些词，不是为了把它们关在欧洲。§!"
KRAUS_war_order_events.1.a: "宣布浪潮，无一例外"
KRAUS_war_order_events.1.b: "只对已战败的国家施压"

KRAUS_war_order_events.2.t: "维也纳要求殖民地"
KRAUS_war_order_events.2.d: "一份奥地利的照会送到了，而它不是请求。它白纸黑字地写着：殖民体系已经结束；维也纳不持有殖民地，因此不会被收买；任何仍持有殖民地的国家，都会在下一次会议上被点名。\n\n信里没有威胁。也不需要。\n\n§Y战争结束了。清账还没结束。§!"
KRAUS_war_order_events.2.a: "放手吧。已经没有钱去留它们了。"
KRAUS_war_order_events.2.b: "我们不会听维也纳发号施令。"

KRAUS_war_order_events.3.t: "浪潮已经开始"
KRAUS_war_order_events.3.d: "回音陆续传来，而它们不像是对请求的回应——更像被称作政策的投降书。\n\n一个接一个，殖民列强发现自己既没有船，也没有国库，更没有心思再去维持一个帝国。旗帜一面面降下。没有人开一枪。\n\n§Y我们并没有打败他们的帝国。我们只是把代价的真相，大声说出了口，说给所有人听。§!"
KRAUS_war_order_events.3.a: "地图在变。就让它变。"

KRAUS_war_order_events.4.t: "德国殖民问题"
KRAUS_war_order_events.4.d: "中央非洲与德属东亚，是世界上仅存的两个最大的殖民管理机构，而它们都听命于柏林。\n\n德国政府清楚这笔账：一个它管不动的大陆、一支它养不起的驻军，以及国内整整一代人在问——德国男孩为什么死在刚果。\n\n§Y我们不是在要求他们放弃一个帝国。我们是在请他们注意到：他们早就已经失去它了。§!"
KRAUS_war_order_events.4.a: "接受：解散中央非洲与德属东亚"
KRAUS_war_order_events.4.b: "拒绝：德国保留其殖民地"

KRAUS_war_order_events.5.t: "一块殖民地成了一个国家"
KRAUS_war_order_events.5.d: "又一个殖民管理机构收摊了，又一个国家在桌前占下了它的位置——带着一面旗、一个代表团，以及欧洲联盟里的一个席位。\n\n他们会记得是谁打开了这扇门。不是出于感激，而是因为当时门口没有站着别人。\n\n§Y帝国是一笔债。国家是一个伙伴。这个区别，我们自己站错过边。§!"
KRAUS_war_order_events.5.a: "欢迎他们。"


############################################################
### 全球民主化运动 · 调停事件（2026-09-24）
############################################################

KRAUS_war_order_events.10.t: "一份奥地利的提议"
KRAUS_war_order_events.10.d: "一个奥地利代表团到了前线，没带条款，也没带要求——只带了一个观察。\n\n它说：两支军队此刻站的那条线，今天就可以变成永久边界，双方都不必有损失，维也纳将为它担保。不放弃任何东西，也不夺回任何东西。枪声只是停下来。\n\n§Y他们愿意给我们手上已有的东西。问题是——我们相信自己还能拿到更多吗？§!"
KRAUS_war_order_events.10.a: "接受。让那条线成为边界。"
KRAUS_war_order_events.10.b: "拒绝。我们还没打完。"

KRAUS_war_order_events.11.t: "枪声停了"
KRAUS_war_order_events.11.d: "两个本不愿交谈的政府，都和维也纳谈了，而回答都是「是」。\n\n停战协定按现有战线签署。没有交换领土，没有支付赔款，没有政府倒台。边界就是命令下达时士兵恰好站的地方。\n\n§Y我们并没有替他们打赢战争。我们只是让这场战争不再值得继续。§!"
KRAUS_war_order_events.11.a: "记下来，然后继续。"

KRAUS_war_order_events.12.t: "他们拒绝了维也纳"
KRAUS_war_order_events.12.d: "回答按战时的老样子回来了：这场战争不归我们结束、态势可以挽回、维也纳不懂。\n\n它这么说的时候，它自己的伤亡名单还在印。\n\n§Y他们选择了战争。我们只选择了——是否还继续看着。§!"
KRAUS_war_order_events.12.a: "记下他们的拒绝。什么都不说。"
KRAUS_war_order_events.12.b: "公开说出去：维也纳不会袖手旁观。"


KRAUS_mediation_accepted_tt: "§G已按现有战线签署停战协定。§!"
KRAUS_mediation_escalated_tt: "§R解锁「加入任一方介入战争」的选项。§!"
### ══ 战序兑现 · 协约国归来与俄国处置（2026-10-07 补完） ══
KRAUS_war_order_events.6.t: "不列颠归来"
KRAUS_war_order_events.6.d: "停战协定签署的第七天，一支挂著旧王室旗号的舰队驶入朴茨茅斯。哈利法克斯的密约终于兑现——德���在整个战争期间没有西进，英国保住了本土。流亡了二十七年的不列颠回来了，随船回来的还有一份请求：希望在新的欧洲秩序里，王冠仍由它的主人戴着。"
KRAUS_war_order_events.6.a: "迎接他们。英王仍在他的王座上——这很好。"

KRAUS_war_order_events.7.t: "法兰西的处置"
KRAUS_war_order_events.7.d: "同一批条款也惠及了另一个流亡政府。自本土陷落、阿尔及尔流亡以来，法兰西就一直没有拿回自己的国家。现在维也纳必须表态：法兰西公社是那个曾经焚烧自己首都的政权，而民族法国是那个从未放弃本土的政权。奥地利没有理由替巴黎做这个决定——但巴黎需要一个愿意认它的人。"
KRAUS_war_order_events.7.a: "承认法兰西的处置权。这是我们的传统。"

KRAUS_war_order_events.8.t: "沙皇的遗产"
KRAUS_war_order_events.8.d: "皇帝还在位。也正因为如此，我们才有资格开口。\n\n维也纳很清楚自己的处境：我们也曾经是一个多民族帝国，我们撑下来的办法不是把差异压下去，而是让它们各自安放。沙皇的俄国走的恰恰是相反的路子——代价正在那里累积。战后他要不要继续走，看他自己。\n\n不过我们至少可以给他两条路：一条是继续走他的，一条是看看我们的。"
KRAUS_war_order_events.8.a: "与沙皇同行。旧世界的最后几位君主，应该彼此有个照应。"
KRAUS_war_order_events.8.b: "把我们的样本送过去。让他看看多民族不必靠镇压才能共处。"

KRAUS_war_order_events.9.t: "共和派的俄国"
KRAUS_war_order_events.9.d: "皇帝不在了。\n\n我们也没有资格再劝谁留在旧世界里——我们自己已经不是那个帝国了。大奥地利合众国这几年的日子不算好过，但它证明了一件事：没有皇帝，多民族的国家照样能立住。\n\n现在轮到俄国走这一步。我们能做的不多，但至少可以站在旁边。"
KRAUS_war_order_events.9.a: "承认他们。我们走过同一条路。"
 KRAUS_greece_events.12.t:0 "雅典的重新评估"
 KRAUS_greece_events.12.d:0 "贝尔格莱德条约的文本是三天里谈成的，可是接下来的一周里，每一条要求都变得更具体：要塞、港口的使用权、对爱琴海航运的过问。\n\n雅典的内阁想起了另一封信。维也纳没有执行制裁，也没有提任何条件，什么也没有要。\n\n内阁在周四表决，七票对四票。"
 KRAUS_greece_events.12.a:0 "希腊退出贝尔格莱德条约。"
 KRAUS_greece_events.12.b:0 "留在条约内。"
 KRAUS_greece_events.13.t:0 "雅典退约"
 KRAUS_greece_events.13.d:0 "希腊向贝尔格莱德递交了退约照会，理由是「对自身利益的重新评估」。维也纳没有派出特使，也没有提出任何条件。\n\n公使在报告里写道：§Y「他们记得是谁没有落井下石。」§!"
 KRAUS_greece_events.13.a:0 "我们什么也没做。这也许就是最好的做法。"
 KRAUS_crisis_events.4_slo: "斯洛伐克——多瑙河上游的工业走廊"
 KRAUS_crisis_events.4_trs: "特兰西瓦尼亚——喀尔巴阡山里的矿与林"
