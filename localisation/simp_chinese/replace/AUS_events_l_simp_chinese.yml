l_simp_chinese:
 KRAUS_balkan_events.1.t: "巴尔干局势"
 KRAUS_balkan_events.1.d: "外交部的备忘录摊在皇帝的书桌上，只有三行：\n\n§Y其一§!，贝尔格莱德条约已经成形。塞尔维亚、罗马尼亚、希腊——它们把哈布斯堡视为共同的敌人。\n\n§Y其二§!，索菲亚被夹在中间。保加利亚是巴尔干唯一还对维也纳抱有善意的首都。\n\n§Y其三§!，帝国没有军队可以派。\n\n但在第三行下面，有人用铅笔加了一句：\n\n§Y「没有军队可以派，不代表没有人可以派。」§!"
 KRAUS_balkan_events.1.a: "「没有军队可以派，不代表没有人可以派。」"
 KRAUS_balkan_events.30.t: "一份送达柏林的公告文本"
 KRAUS_balkan_events.30.d: "维也纳送来的文件很短，只有一页半。\n\n它谴责的是「以武力改变巴尔干现状的企图」。起草者很小心，通篇没有出现「奥地利」三个字——公告的署名栏留给了柏林。\n\n随附的备忘录更直白：\n\n§Y「德意志帝国无需承担任何义务，只需表明立场。中欧的秩序，需要一个声音。」§!\n\n威廉街的官员们讨论了很久。反对者的理由是：为一个巴尔干的局部冲突表态，不值得。支持者的理由更简单：\n\n§Y「如果连表态都不肯，那我们凭什么让中欧相信，我们会为更大的事情出手？」§!"
 KRAUS_balkan_events.30.a: "「中欧的秩序，需要一个声音。」"
 KRAUS_balkan_events.30.b: "不表态。这不值得我们出头。"
 KRAUS_balkan_events.11.t: "索菲亚的回应"
 KRAUS_balkan_events.11.d: "保加利亚方面接受了援助，而且比预期更痛快。\n\n对于索菲亚来说，这笔账算得很清楚：在巴尔干，它唯一能指望的大国就是奥地利。塞尔维亚恨它，罗马尼亚恨它，希腊恨它，土耳其的机会主义从来不可靠。\n\n如果维也纳愿意伸手，那么即便只是几列车皮和几百个人，也值得回报以善意。\n\n使团离开时，沙皇的私人秘书追出来，递上一封没有署名的信。信里只有一句话：\n\n§Y「请告诉维也纳，我们不会忘记。」§!"
 KRAUS_balkan_events.11.a: "「我们不会忘记。」"
 KRAUS_balkan_events.12.t: "天平的倾斜"
 KRAUS_balkan_events.12.d: "战报陆续抵达维也纳。塞尔维亚的动员已经难以为继，罗马尼亚的补给线被拖垮，希腊在边境上按兵不动——它已经看出这场战争不再划算。\n\n奥地利的报纸用了一个谨慎的措辞：\n\n§Y「巴尔干局势趋于稳定。」§!\n\n《新自由报》的社论说得更直白：\n\n§Y「我们派出去的不是军队，是决心。而决心，比军队更便宜。」§!\n\n在总参谋部的档案柜里，一份标着「巴尔干—已结案」的文件夹被归档。没有人注明，这场战争真正的转折点，发生在维也纳一间没有窗户的会议室里。"
 KRAUS_balkan_events.12.a: "局势趋于稳定。"
 KRAUS_balkan_events.40.t: "巴尔干战争结束"
 KRAUS_balkan_events.40.d: "枪声停了。\n\n维也纳的档案官把几年的文件装进一个文件夹，封面上只写了两个字：结案。\n\n他没有写总结。因为真正的总结不在纸上——在保加利亚人记得谁送来了列车皮，在塞尔维亚人记得谁关上了边境，在柏林记得谁第一个提出了那份公告。\n\n§Y帝国在这几年里一枪未开，却改变了整个巴尔干的走向。§!\n\n美泉宫的走廊里，有人问接下来做什么。老档案官的回答后来被传了出去：\n\n§Y「准备下一场。这一次，我们不用等他们先动手。」§!"
 KRAUS_balkan_events.40.a: "「准备下一场。这一次，我们不用等他们先动手。」"
 KRAUS_balkan_events.31.t: "签署邀请"
 KRAUS_balkan_events.31.d: "柏林转来一份公告，附了一句简短的说明：帝国已署名，请各成员自行决定。\n\n公告的措辞留足了余地。签了，不代表要出兵；不签，也不代表要翻脸。这是一份精心设计成「没有代价」的外交文件。\n\n§Y但正因为它没有代价，拒绝才显得格外显眼。§!"
 KRAUS_balkan_events.31.a: "在公告上署名。"
 KRAUS_balkan_events.31.b: "把文件压进抽屉。"
 KRAUS_balkan_events.21.t: "新的账本"
 KRAUS_balkan_events.21.d: "战后第一份巴尔干情势评估送到了美泉宫。\n\n文件的开头照例是客套，但从第二页开始，语气变了：\n\n§Y「贝尔格莱德条约的成员现已拥有实战经验与协调机制。其对我国边境地区的渗透活动预计将增加。」§!\n\n§Y「保加利亚方面，因战败而陷入孤立，短期内不具备作为可靠伙伴的能力。」§!\n\n最后一段更短：\n\n§Y「综上所述，帝国在下一轮危机中，将缺少必要的地区支点。」§!\n\n皇帝在页脚批了两个字：§Y「知道了。」§!"
 KRAUS_balkan_events.21.a: "「知道了。」"
 KRAUS_balkan_events.20.t: "一场我们没参与的战争"
 KRAUS_balkan_events.20.d: "外交部的每日简报上，巴尔干的消息被压缩成了一个词条。\n\n§Y「保加利亚处境不利，然帝国无相关利益。」§!\n\n这行字被反复抄写了三个月。三个月里，前线在推进，条约在签订，而维也纳的立场始终如一：这是巴尔干人自己的事。\n\n省下来的钱用在了别处：铁路翻新、格蒙登的兵工厂扩建、维也纳的工人住宅区。财政大臣对此非常满意。\n\n只有军需处的一位上校，在某天的备忘录边角上写了一句不合时宜的话：\n\n§Y「便宜是便宜了，就是不知道这笔账最后记在谁头上。」§!"
 KRAUS_balkan_events.20.a: "「这是巴尔干人自己的事。」"
 KRAUS_balkan_events.10.t: "非官方援助"
 KRAUS_balkan_events.10.d: "总参谋部提交了一份简短的方案，标题是《关于巴尔干地区非官方军事存在的可行性》。\n\n方案的第一页写着：帝国无法承受一场正规战争，但索菲亚能。\n\n第二页写着：如果索菲亚不能，那么维也纳就必须准备好在三年内，在自己的边界上面对一个胜利的贝尔格莱德条约。\n\n第三页是空白的。据说皇帝看到这里，拿起笔，在空白页上写了一个字。"
 KRAUS_balkan_events.10.a: "批准方案。"
 KRAUS_court_events.13.t: "看不见的手"
 KRAUS_court_events.13.d: "会议结束时，三方代表都觉得维也纳还算讲道理——没有承诺什么，也没有拒绝什么。\n\n这正是维也纳想要的。\n\n在此后的几个月里，帝国的资金以各种名目流入布拉格、布拉迪斯拉发与布达佩斯：文化基金、商会赞助、留学生奖学金、乡村诊所。与此同时，帝国情报部门在王领的每一个关键位置上，都安插了自己的人。\n\n这不是安抚，而是经营。\n\n当危机真正来临时，维也纳不需要任何人同舟共济——它会知道自己该按哪一个按钮。"
 KRAUS_court_events.13.a: "不承诺什么，也不拒绝什么。"
 KRAUS_court_events.2.t: "山间的声音"
 KRAUS_court_events.2.d: "维也纳派出的代表没有去布拉迪斯拉发的总督府，而是往北走进了山区。\n\n他们在日利纳的一所神学院里停留了三天。谈话的对象不是议员，不是贵族，而是几个乡村神父和一位在当地教书的教师。\n\n维也纳问的是很朴素的问题：你们的村子缺什么？学校的屋顶漏吗？冬天有多少孩子走不到教室？\n\n这些问题在布达佩斯从来没有人问过。\n\n代表离开时，带走的不是请愿书，而是一份手写的名单——那些愿意在合适的时机，为维也纳说话的人的名字。"
 KRAUS_court_events.2.a: "把名单收好。"
 KRAUS_court_events.12.t: "山间的回响"
 KRAUS_court_events.12.d: "斯洛伐克代表团带着一份朴素的协议回到布拉迪斯拉发：本地学校可以用斯洛伐克语教学，地方议会获得有限的税收权限，几位斯洛伐克人被任命为帝国官员。\n\n这些让步在维也纳看来微不足道。但对斯洛伐克人来说，这是几百年来第一次有人认真听他们说话。\n\n消息传遍喀尔巴阡山的村庄。据说，有位老神父在弥撒后对教众说：\n\n「孩子，记住今天。奥地利人终于知道我们叫什么名字了。」"
 KRAUS_court_events.12.a: "「奥地利人终于知道我们叫什么名字了。」"
 KRAUS_court_events.10.t: "王领关系协商会议"
 KRAUS_court_events.10.d: "代表们在美泉宫的会议厅里落座。三面旗帜并排悬挂——红白的波希米亚狮、蓝白的斯洛伐克双十字、红白绿的匈牙利条纹。\n\n维也纳的善意已经给出去了，现在该收回了。\n\n究竟哪一面旗帜，会在下一次危机中继续留在这间厅堂里？"
 KRAUS_court_events.10.a: "让三面旗帜都留下来。"
 KRAUS_court_events.3.t: "布达佩斯的礼节"
 KRAUS_court_events.3.d: "维也纳的使团受到了布达佩斯最高规格的礼遇。匈牙利首相亲自到车站迎接，晚宴上演奏了《天佑吾皇》，席间谈笑风生。\n\n宾主尽欢——如果忽略掉晚宴之后，匈牙利议会连夜召开的那场闭门会议的话。\n\n据后来流出的消息，会上讨论的议题是：§Y「维也纳这次为什么这么客气？」§!\n\n没有人能给出答案。但有位老议员说了一句被记录下来、后来又被人忘记的话：\n\n§Y「他们越是客气，我们越是要小心。六七年那次，他们也很客气。」§!"
 KRAUS_court_events.3.a: "「他们越是客气，我们越是要小心。」"
 KRAUS_court_events.1.t: "布拉格的会面"
 KRAUS_court_events.1.d: "帝国财政大臣的专列停在了布拉格中央车站。迎接他的不是仪仗队，而是一群穿着深色大衣的男人——捷克工业界与民族党的代表，他们的表情介于礼貌与警惕之间。\n\n会谈持续了两天。维也纳提出的方案很具体：斯柯达的军械订单将由帝国优先采购，布尔诺的机械厂获得铁路运价补贴，作为交换，布拉格的议员们将在帝国议会上得到几个关键委员会的位置。\n\n没有谈民族问题，没有谈语言权利，没有谈任何写在历史书上的东西。只谈生意。\n\n会后，一位捷克代表对记者说：§Y「至少他们这次带了算盘，而不是刺刀。」§!"
 KRAUS_court_events.1.a: "「至少他们这次带了算盘，而不是刺刀。」"
 KRAUS_court_events.11.t: "布拉格的承诺"
 KRAUS_court_events.11.d: "捷克代表团离开维也纳时，带回了一份比预期更具体的协议。布拉格得到了它在语言与地方自治上想要的东西——不是全部，但是真实的。\n\n在返回的火车上，一位捷克议员对同伴说了一句话，后来被刊登在《民族报》的头版：\n\n「维也纳这一次，似乎是认真的。」\n\n这句话在帝国境内流传开来。有人欣慰，有人警惕，更多的人在盘算自己是不是被牺牲的那一个。"
 KRAUS_court_events.11.a: "「维也纳这一次，似乎是认真的。」"
 KRAUS_crisis_events.2.t: "账本上的转机"
 KRAUS_crisis_events.2.d: "王领线走通了。布拉格、布达佩斯、萨格勒布的代表终于坐到了同一张桌子前，签下了一份谁都不满意但谁都能接受的分配方案。\n\n斯柯达的闲置产能开始转动，阿尔卑斯的矿场重新开工。维也纳的银行第一次愿意放贷了。"
 KRAUS_crisis_events.2.a: "让机器重新转起来。"
 KRAUS_crisis_events.1.t: "陆军的旧账"
 KRAUS_crisis_events.1.d: "德奥线走通了。德国顾问团进驻之后，总参谋部第一次拿到了完整的现代化方案。\n\n第一批被推翻的是炮兵协同条例，第二批是骑兵编制——几个老将军当场摔了帽子。但演习结果摆在那里：按新方法打的营，比按旧方法快了两个小时。"
 KRAUS_crisis_events.1.a: "按新方法操练全军。"
 KRAUS_crisis_events.3.t: "王冠合拢"
 KRAUS_crisis_events.3.d: "巴尔干线走通了。枪声停了，账本合上了，帝国在这场战争中一兵未损、银库充盈。\n\n但真正被改变的不是地图，是维也纳和布达佩斯之间那条看不见的线。当首相在议会里第一次不用靠收买就凑够票数时，所有人都明白了一件事：这个帝国不再是三个部分各说各话，而是有人真的在替它做决定。"
 KRAUS_crisis_events.3.a: "这个帝国，终于有人替它做决定了。"
 KRAUS_startup_events.1.t: "奥地利的抉择"
 KRAUS_startup_events.1.d: "1936年的元旦，维也纳没有庆祝。\n\n黑五破产的账单还摊在首相的桌上，帝国的三个部分各说各话，议会已经吵了三个月。皇帝在美泉宫召见首相，问了一个很轻的问题：\n\n§Y「我们还要照着老办法过下去吗？」§!\n\n首相没有立刻回答。窗外是维也纳灰白的天空，工厂的烟囱有一半是冷的。"
 KRAUS_startup_events.1.a: "「照着老办法过下去。」"
 KRAUS_startup_events.1.b: "「不。从头来过。」"
 KRAUS_crisis_events.4.t: "未雨绸缪"
 KRAUS_crisis_events.4.d: "参谋部送来的不再是作战计划，而是一份更长远的东西：下一场战争，最可能从哪里开始？\n\n既然帝国的繁荣已经和几个王领兄弟绑在一起，那就该趁现在还太平，把其中一个真正拉进这套体系——工厂、铁路、军械，全部共用一套标准。\n\n§Y兄弟富了，帝国才算真的富。§!"
 KRAUS_crisis_events.4.a: "波西米亚——把工业心脏交给布拉格"
 KRAUS_crisis_events.4.b: "伊利里亚——亚得里亚海的出海口"
 KRAUS_crisis_events.4.c: "加利西亚-洛多梅里亚——东方的粮仓与油田"
 KRAUS_crisis_events.5.t: "柏林的回电"
 KRAUS_crisis_events.5.d: "电报发出后的第三天，柏林的回电到了。\n\n措辞简短，但内容出乎意料地积极。柏林方面承认，黑色星期一之后，德国自身也在泥潭里挣扎——一个稳定的奥地利对德国有价值，而一个崩溃的奥地利只会给巴伐利亚送去难民潮。\n\n两周后，两国签署了一份没有对外公布的谅解备忘录。没有条约，没有仪式，只有一份关于关税、铁路运价和信贷的清单。\n\n§Y维也纳和柏林的关系，比任何人预期的都更近了一步。§!"
 KRAUS_crisis_events.5.a: "同舟共济。"
 KRAUS_balkan_events.50.t: "谁替这笔账买单？"
 KRAUS_balkan_events.50.d: "机器已经拆下来了，账却还没结。\n\n索菲亚方面传来口信：他们愿意分担一部分费用——当然，代价是其中一台机器要留在保加利亚。\n\n维也纳的军需官把两张纸推到你面前，等你签字。"
 KRAUS_balkan_events.50.a: "让索菲亚出钱（保加利亚获得 1 座民工厂）"
 KRAUS_balkan_events.50.b: "奥地利自己承担（2 座民工厂全部归奥地利）"
 KRAUS_balkan_events.41.t: "多瑙河的繁荣"
 KRAUS_balkan_events.41.d: "枪声停了。\n\n萨瓦河上的驳船重新装满了粮食，布达佩斯的粮价一天之内掉了两成，维也纳的工厂主开始给新的工人发工牌。\n\n帝国的经济学家们把这段日子叫做「多瑙河的繁荣」——他们没说出口的是：这种繁荣很脆，脆得一炮就能打碎。"
 KRAUS_balkan_events.41.a: "让他们富起来。"
 KRAUS_crisis_events.4_hun: "匈牙利——多瑙河对岸的盟友"
 KRAUS_court_events.14.t: "帝国协同发展协定"
 KRAUS_court_events.14.d: "协定签了，但试点只能选一个。\n\n财政大臣把地图铺在桌上，用尺子量了半天：波西米亚有煤和机器，伊利里亚有港口，加利西亚有石油，匈牙利有粮食和工人。每一个都合适，每一个都有限。\n\n「先选一个，」皇帝说，「把账本做漂亮。剩下的自己会来要求加入。」"
 KRAUS_court_events.14.cze: "波西米亚——工厂与煤"
 KRAUS_court_events.14.cro: "伊利里亚——亚得里亚的港口"
 KRAUS_court_events.14.gal: "加利西亚——石油与粮仓"
 KRAUS_court_events.14.hun: "匈牙利——平原与工人"

 # ═══ 希腊问题（KRAUS_greece_events）═══
 KRAUS_greece_events.1.t: "爱琴海边的账本"
 KRAUS_greece_events.1.d: "雅典的报纸连续三天都在骂「外国资本」。希腊议会吵成一团，有人提议把德奥两国在比雷埃夫斯港的股份、在雅典的电车公司、在色萨利的矿场，统统收归国有。\n\n但最后，什么都没发生。\n\n财政大臣在最后一刻压下了那份议案。理由说得很直白：§Y「我们没钱赔。收归国有之后，谁来经营？」§!\n\n消息传到维也纳时，皇帝只说了一句话：\n\n§Y「一个连没收都不敢没收的邻居，是可以谈的。」§!"
 KRAUS_greece_events.1.a: "「一个连没收都不敢没收的邻居，是可以谈的。」"
 KRAUS_greece_events.1.a_tt: "§G希腊获得 50 政治点数，并对奥地利的好感大幅上升。§!"
 KRAUS_greece_events.1.b: "各扫门前雪。巴尔干的事，我们没有余力去管。"



