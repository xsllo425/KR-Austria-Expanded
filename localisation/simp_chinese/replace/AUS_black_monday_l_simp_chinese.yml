 KRAUS_bm_dc320_reached:0 "多瑙河谈判已走到收尾事件"
 KRAUS_bm_dc320_reached_NOT:0 "多瑙河谈判尚未走到收尾事件"
 KRAUS_bm_worst_snapshot:0 "期限到来时黑色星期一仍在最重一层"
 KRAUS_bm_worst_snapshot_NOT:0 "期限到来时黑色星期一不在最重一层"
