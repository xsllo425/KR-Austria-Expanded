l_simp_chinese:
 KRAUS_dc_category:0 "多瑙河危机"
 KRAUS_dc_category_desc:0 "我们为与匈牙利的摊牌争取了几天时间。匈牙利人的要求不可能满足——趁这几天争取各王领站到我们这边。时限一到，匈牙利将拒绝最后通牒。"
 KRAUS_dc_stall:0 "拖住匈牙利"
 KRAUS_dc_stall_desc:0 "谈判只是幌子，我们在争取时间。时限一到匈牙利将拒绝最后通牒，战争随即爆发。"
 KRAUS_dc_win_GAL:0 "争取加利西亚"
 KRAUS_dc_win_GAL_desc:0 "派特使前往伦贝格，以皇帝的名义请求加利西亚在与匈牙利的冲突中站在维也纳一边。"
 KRAUS_dc_win_CRO:0 "争取伊利里亚"
 KRAUS_dc_win_CRO_desc:0 "派特使前往萨格勒布。伊利里亚与匈牙利素有领土纠纷，只要维也纳给出保证，他们乐于出兵。"
 KRAUS_dc_won_CZE_tt:0 "开战时，§Y波希米亚§!将与我们并肩作战。"
 KRAUS_dc_won_GAL_tt:0 "开战时，§Y加利西亚§!将与我们并肩作战。"
 KRAUS_dc_won_CRO_tt:0 "开战时，§Y伊利里亚§!将与我们并肩作战。"
 KRAUS_dc_alone_tt:0 "§R其他王领不会参战§!，我们将单独面对匈牙利。"
 KRAUS_dc_341_stall:0 "先稳住各王领，再与匈牙利摊牌。"
 KRAUS_dc_stall_tt:0 "开始 §Y7 天§!读条。期间可以花费政治点数争取各王领；读条结束时匈牙利拒绝最后通牒，战争爆发，§G只有被争取的王领会参战§!。"
