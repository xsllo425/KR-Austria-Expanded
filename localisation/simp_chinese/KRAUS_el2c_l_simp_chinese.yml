l_simp_chinese:
 KRAUS_el2c.0.t:0 "竞选开始了"
 KRAUS_el2c.0.d:0 "帝国议会的四个党团都把旗子插在了自己的广场上。社民、基社、自由民主联盟、民族自由党，每一个都有自己的口号和自己的听众。\n\n接下来的几个月里，每一个问题都会被拿出来争一遍，议会的重心也会随着每一次表态而移动。"
 KRAUS_el2c.0.a:0 "让他们去说吧。"
 KRAUS_el2c.1.t:0 "竞选：官署里用什么语言"
 KRAUS_el2c.1.d:0 "布拉格的法院、伦贝格的税务所、萨格勒布的邮局，都在问同一个问题：柜台后面的官员该用哪种语言说话？\n\n眼下议会里领先的是[KRAUS_pm_GetLeader]。"
 KRAUS_el2c.1.cs:0 "基社：官署语言以德语为准，其他语言只在家里讲。"
 KRAUS_el2c.1.ml:0 "民族自由党：德语与商业通用语，市场不需要翻译官。"
 KRAUS_el2c.1.sd:0 "社民：每个民族都有权用自己的语言办事。"
 KRAUS_el2c.1.sl:0 "自由民主联盟：两种官方语言，由当地议会选择第二种。"
 KRAUS_el2c.2.t:0 "竞选：学校与教堂"
 KRAUS_el2c.2.d:0 "每个村子里，教堂的钟声和学校的铃声在抢同一批孩子。议会里有人要把它们分开。\n\n眼下议会里领先的是[KRAUS_pm_GetLeader]。"
 KRAUS_el2c.2.cs:0 "基社：学校归堂区管理，教师由神父推荐。"
 KRAUS_el2c.2.ml:0 "民族自由党：学校自筹经费，家长出钱，家长选择。"
 KRAUS_el2c.2.sd:0 "社民：国家办免费学校，教师领国家工资。"
 KRAUS_el2c.2.sl:0 "自由民主联盟：地方议会办学，课程各族自定。"
 KRAUS_el2c.3.t:0 "竞选：谁来缴税"
 KRAUS_el2c.3.d:0 "财政大臣在预算案里留下一行空白：税收的缺口，该由谁来补？\n\n眼下议会里领先的是[KRAUS_pm_GetLeader]。"
 KRAUS_el2c.3.cs:0 "基社：统一税制，由维也纳的官员征收。"
 KRAUS_el2c.3.ml:0 "民族自由党：减税，让生意自己长出税基。"
 KRAUS_el2c.3.sd:0 "社民：累进税，富裕的人多缴一些。"
 KRAUS_el2c.3.sl:0 "自由民主联盟：各王领自行征税，向中央上缴份额。"
 KRAUS_el2c.4.t:0 "竞选：田野里的土地"
 KRAUS_el2c.4.d:0 "农会的代表把请愿书放到了议长的桌上：大地产的土地，该不该分给种它的人？\n\n眼下议会里领先的是[KRAUS_pm_GetLeader]。"
 KRAUS_el2c.4.cs:0 "基社：保护教会与贵族的地产，农民由堂区救济。"
 KRAUS_el2c.4.ml:0 "民族自由党：土地自由买卖，由农民赎买。"
 KRAUS_el2c.4.sd:0 "社民：大地产分给无地的农业工人。"
 KRAUS_el2c.4.sl:0 "自由民主联盟：农民合作社租种，国家担保贷款。"
 KRAUS_el2c.5.t:0 "竞选：工人的保险"
 KRAUS_el2c.5.d:0 "一个纺织工人在机器旁断了手指，赔偿金够不够买一年的面包？议会要定一个标准。\n\n眼下议会里领先的是[KRAUS_pm_GetLeader]。"
 KRAUS_el2c.5.cs:0 "基社：由行会与堂区的互助金库出面补偿。"
 KRAUS_el2c.5.ml:0 "民族自由党：由雇主自愿投保，国家只做监督。"
 KRAUS_el2c.5.sd:0 "社民：强制的国家工伤与疾病保险。"
 KRAUS_el2c.5.sl:0 "自由民主联盟：公民自愿参加的互助保险，国家补贴。"
 KRAUS_el2c.6.t:0 "竞选：军队与征兵"
 KRAUS_el2c.6.d:0 "总参谋部要求延长服役期。议员们想知道：士兵讲谁的语言，听谁的命令？\n\n眼下议会里领先的是[KRAUS_pm_GetLeader]。"
 KRAUS_el2c.6.cs:0 "基社：统一军令，统一语言，延长服役期。"
 KRAUS_el2c.6.ml:0 "民族自由党：志愿兵，募兵所按市场给薪。"
 KRAUS_el2c.6.sd:0 "社民：缩短服役期，设立士兵委员会。"
 KRAUS_el2c.6.sl:0 "自由民主联盟：各王领团保留自己的旗帜与语言。"
 KRAUS_el2c.7.t:0 "竞选：王领议会的权力"
 KRAUS_el2c.7.d:0 "布拉格、布达佩斯、萨格勒布的议员联名递上提案：王领议会该管多少事？\n\n眼下议会里领先的是[KRAUS_pm_GetLeader]。"
 KRAUS_el2c.7.cs:0 "基社：王领议会只管地方事务，大事归维也纳。"
 KRAUS_el2c.7.ml:0 "民族自由党：王领议会可以自己筹款与办企业。"
 KRAUS_el2c.7.sd:0 "社民：王领议会代表工人，要有预算权。"
 KRAUS_el2c.7.sl:0 "自由民主联盟：王领议会拥有立法权，与帝国议会平等。"
 KRAUS_el2c.8.t:0 "竞选：宪法与皇帝"
 KRAUS_el2c.8.d:0 "皇帝的御座旁边，宪法的草稿躺了三年。有人想让它与皇帝并肩，有人想让它高过皇帝。\n\n眼下议会里领先的是[KRAUS_pm_GetLeader]。"
 KRAUS_el2c.8.cs:0 "基社：皇帝是帝国的灵魂，宪法只是他的信件。"
 KRAUS_el2c.8.ml:0 "民族自由党：皇帝只管礼仪，经济由议会定夺。"
 KRAUS_el2c.8.sd:0 "社民：宪法保障工人组织的权利，皇帝签字。"
 KRAUS_el2c.8.sl:0 "自由民主联盟：帝国是各民族的联合，皇帝是第一公民。"
 KRAUS_pm_pullto_cs_el_tt:0 "§Y议会的重心§!向§Y基社§!移动 5%。"
 KRAUS_pm_pullto_ml_el_tt:0 "§Y议会的重心§!向§Y民族自由党§!移动 5%。"
 KRAUS_pm_pullto_sd_el_tt:0 "§Y议会的重心§!向§Y社民§!移动 5%。"
 KRAUS_pm_pullto_sl_el_tt:0 "§Y议会的重心§!向§Y自由民主联盟§!移动 5%。"
 KRAUS_el2c_deadlock_tt:0 "四个党团不分高下，没有一个党能组成内阁。§Y《帝国基本法》§!的起草进度开始，僵局将一直持续到大战爆发。"
