l_simp_chinese:
 KRAUS_SLO_path:0 "斯洛伐克的道路"
 KRAUS_SLO_path_desc:0 "圣斯蒂芬王冠被拆分之后，斯洛伐克第一次有了自己的名字和自己的议程。是靠近维也纳，还是走向自主，要由接下来的每一步决定。"
 KRAUS_SLO_loyal_1:0 "塔特拉山口的铁路"
 KRAUS_SLO_loyal_1_desc:0 "一条穿过塔特拉山口的铁路把斯洛伐克的矿山与维也纳的工厂连在了一起。"
 KRAUS_SLO_loyal_2:0 "布拉迪斯拉发的议事厅"
 KRAUS_SLO_loyal_2_desc:0 "斯洛伐克的议员们在维也纳的议会里有了固定的席位，也有了固定的发言时间。"
 KRAUS_SLO_loyal_3:0 "多瑙河上游的船运"
 KRAUS_SLO_loyal_3_desc:0 "多瑙河上游的船运公司并入帝国的河运名册，货物从此可以不换船直达黑海。"
 KRAUS_SLO_auto_1:0 "斯洛伐克语学校"
 KRAUS_SLO_auto_1_desc:0 "乡村的教区学校开始用斯洛伐克语授课，教师的薪水由地方议会支付。"
 KRAUS_SLO_auto_2:0 "斯洛伐克国民议会"
 KRAUS_SLO_auto_2_desc:0 "一个只讨论斯洛伐克事务的国民议会第一次召开，议程由议员自己排定。"
 KRAUS_SLO_auto_3:0 "自主的斯洛伐克"
 KRAUS_SLO_auto_3_desc:0 "维也纳同意把税收、学校与地方官员的任命交给斯洛伐克人自己。"
 KRAUS_TRS_path:0 "特兰西瓦尼亚的道路"
 KRAUS_TRS_path_desc:0 "特兰西瓦尼亚的匈牙利人、罗马尼亚人与萨克森人第一次被放进同一部宪章里。这块土地将向哪边靠，要看维也纳与克卢日各自拿出什么。"
 KRAUS_TRS_loyal_1:0 "克卢日的大学"
 KRAUS_TRS_loyal_1_desc:0 "克卢日的大学获得帝国的拨款，三种语言的讲席并排设立。"
 KRAUS_TRS_loyal_2:0 "萨克森人的城市"
 KRAUS_TRS_loyal_2_desc:0 "锡比乌与布拉索夫的行会获得帝国的特许状，商路从此直通维也纳。"
 KRAUS_TRS_loyal_3:0 "喀尔巴阡山口的铁路"
 KRAUS_TRS_loyal_3_desc:0 "穿过喀尔巴阡山口的铁路把特兰西瓦尼亚的木材与盐运到了多瑙河上。"
 KRAUS_TRS_auto_1:0 "罗马尼亚语学校"
 KRAUS_TRS_auto_1_desc:0 "罗马尼亚语的学校在山村里开课，教会与地方议会共同出资。"
 KRAUS_TRS_auto_2:0 "特兰西瓦尼亚议会"
 KRAUS_TRS_auto_2_desc:0 "一个由三个民族共同推举的议会第一次在克卢日开会。"
 KRAUS_TRS_auto_3:0 "自主的特兰西瓦尼亚"
 KRAUS_TRS_auto_3_desc:0 "特兰西瓦尼亚的税收、学校与官员任命由当地议会自己决定。"
 KRAUS_cl_loyal_step_tt:0 "该王冠领的地位向忠诚推进一档。"
 KRAUS_cl_auto_step_tt:0 "该王冠领的地位向自主推进一档。"
