l_simp_chinese:
 KRAUS_dip_ukraine_plea:0 "乌克兰的求援"
 KRAUS_dip_ukraine_plea_desc:0 "基辅丢了。盖特曼的使者从利沃夫的车站转乘夜车，抵达维也纳时已经三天没有合眼。他带来的不是条约，是一份请求。"
 KRAUS_dip_poland_plea:0 "波兰的求援"
 KRAUS_dip_poland_plea_desc:0 "俄国人的炮声已经传到维斯瓦河边，波罗的海沿岸的邻国一个接一个倒下。华沙的使者在霍夫堡的候见厅里等了两天。"
 KRAUS_dip_plea.1.t:0 "乌克兰的求援"
 KRAUS_dip_plea.1.d:0 "盖特曼政府在对俄战争中丢掉了基辅。使者在御前说：乌克兰愿意把国家的将来交给哈布斯堡的家族，只求维也纳出兵、出钱、出粮。\n\n宫廷里有人低声说：这只是德国人的又一个傀儡。"
 KRAUS_dip_plea.1.a:0 "乌克兰只是德国人的傀儡，不予理会。"
 KRAUS_dip_plea.1.b:0 "要求哈布斯堡的亲王成为乌克兰的元首。"
 KRAUS_dip_plea.2.t:0 "波兰的求援"
 KRAUS_dip_plea.2.d:0 "俄国的攻势一步步逼近华沙。波罗的海沿岸、立陶宛与白俄罗斯已有国家投降，乌克兰的战线也已崩溃。波兰政府的使者在御前说：愿意让哈布斯堡的亲王登上波兰的王位，只求维也纳不让华沙成为下一个基辅。\n\n宫廷里有人低声说：这只是德国人的又一个傀儡。"
 KRAUS_dip_plea.2.a:0 "波兰只是德国人的傀儡，不予理会。"
 KRAUS_dip_plea.2.b:0 "要求哈布斯堡的亲王成为波兰的元首。"
 KRAUS_dip_plea_ukr_tt:0 "哈布斯堡的亲王成为§Y乌克兰§!的元首，乌克兰获得§Y更强的一体化精神§!。"
 KRAUS_dip_plea_pol_tt:0 "哈布斯堡的亲王成为§Y波兰§!的元首，波兰获得§Y更强的一体化精神§!。"
 KRAUS_ukr_aus_integration_strong:0 "奥乌深度一体化"
 KRAUS_pol_aus_integration_strong:0 "奥波深度一体化"
