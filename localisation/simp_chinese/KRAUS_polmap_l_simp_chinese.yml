 KRAUS_pm_charter_open_tt:0 "《帝国基本法》草案进入议会。"
 KRAUS_pm_comp_low:0 "低"
 KRAUS_pm_comp_mid:0 "中"
 KRAUS_pm_comp_high:0 "高"
 KRAUS_pm_law_text:0 "《帝国基本法》§Y[?KRAUS_pm_law|0]%§!　[KRAUS_pm_GetLawState]"
 KRAUS_pm_law_tt:0 "§Y《帝国基本法》§!的起草进度。\n· 入阁圈里只有主导党一个党：立刻起草，每周 +2.5%。\n· 两个以上的党入阁：内阁组成保持 30 天不变后才开始，两党每周 +2%、三党 +3%、四党 +4%。\n· 主导党更换或内阁变动：本周暂停，多党内阁重新计 30 天。\n写成后由皇帝选择：签字生效（宪政之路，帝国道路定为合众国）或暂缓。大战爆发时基本法仍未生效，由皇帝组建战时内阁。"
 KRAUS_pm_law_st_single:0 "一党主导，起草中"
 KRAUS_pm_law_st_multi:0 "联合内阁起草中"
 KRAUS_pm_law_st_wait:0 "联合内阁已稳定 [?KRAUS_pm_stable_days|0] 天，满 30 天开始起草"
 KRAUS_pm_law_st_paused:0 "内阁刚变动，起草暂停"
 KRAUS_pm_law_st_passed:0 "§G已通过§!"
 KRAUS_pm_law_st_none:0 "等待宪法委员会开会"
 KRAUS_pm_events.2.t:0 "基本法草案呈御前"
 KRAUS_pm_events.2.d_single:0 "一个党坐稳了位置，宪法就按它的意思写完了。草案送进霍夫堡，等皇帝签字。\n\n反对派在议会外请愿：这部宪法只代表一个党。皇帝的顾问则提醒：大战的乌云已经压到边境，一部有争议的宪法，可能让帝国在最需要团结的时候分裂。"
 KRAUS_pm_events.2.d_multi:0 "几个党团在宪法委员会里坐了几个月，吵过、退过席，又回到了桌边。最后一稿上签着不止一个党团领袖的名字，现在送进霍夫堡，等皇帝签字。\n\n皇帝的顾问提醒：宪法一旦生效，帝国的道路就定了。大战将至，有人主张等局势明朗再定国本。"
 KRAUS_pm_events.2.a:0 "签字：帝国从此在宪法之下。"
 KRAUS_pm_charter_passed_tt:0 "《帝国基本法》生效，帝国走上§Y宪政之路§!：大战来临时由议会内阁继续执政。\n§R帝国的道路就此定为合众国，大德意志与神圣罗马帝国路线就此关闭。§! \n§R（这条路线将在后续版本开放，当前版本尚未实装。）§!"
 KRAUS_pm_war.1.t:0 "战时帝国内阁"
 KRAUS_pm_war.1.d:0 "世界大战的消息传到维也纳时，《帝国基本法》还躺在宪法委员会的桌上。议会里没有一个党能独自组阁，也没有几个党愿意坐在一起。\n\n皇帝在霍夫堡召见了四个党团的领袖：「宪法可以等，战争不会等。」当晚，一份举国一致内阁的名单公布了，四个党团各出一位部长，内阁由皇帝亲自主持。"
 KRAUS_pm_war.1.a:0 "为了帝国，先放下争吵。"
 KRAUS_pm_war_cabinet_tt:0 "§Y战时帝国内阁§!成立：皇帝主持，§Y威权民主§!执政，四个党团都进入执政联盟。\n政治地图上出现§Y皇帝§!：采纳皇帝的方案，议会的重心就被拉向皇帝。\n§Y妥协意愿§! §G+15§!"
 KRAUS_pm_war.2.t:0 "宪法之下的战争"
 KRAUS_pm_war.2.d:0 "大战爆发时，《帝国基本法》已经生效。议会照常开会，内阁照常向议会负责，只是会议的议题从此换成了前线、盟友和面包。\n\n皇帝在宪法之下发表了战时讲话，议会全体起立。"
 KRAUS_pm_war.2.a:0 "宪法之下，同仇敌忾。"
 KRAUS_pm_proposer_emp:0 "皇帝"
 KRAUS_pm_proposer_cab:0 "内阁"
 KRAUS_pm_wi.1.t:0 "战时议题：和谁打，打到哪里"
 KRAUS_pm_wi.1.d:0 "战报从前线一份一份地送进霍夫堡。议会里有人开始问：这场仗要打到哪一天？占下来的土地交给谁管？\n\n提案摆在了战时内阁的桌上。"
 KRAUS_pm_wi.1.a:0 "[KRAUS_pm_GetProposerEmp]：战到底，与盟友共进退"
 KRAUS_pm_wi.1.b:0 "社民：保留与敌国工人组织谈判停火的渠道"
 KRAUS_pm_wi.1.c:0 "基社：占领区交给军政府管理"
 KRAUS_pm_wi.2.t:0 "战时议题：盟友要我们出多少兵"
 KRAUS_pm_wi.2.d:0 "盟友的使节第三次登门，要维也纳再派几个师上前线。总参谋部说兵不够，财政部说钱也不够。\n\n帝国该给盟友多少？"
 KRAUS_pm_wi.2.a:0 "[KRAUS_pm_GetProposerEmp]：派代表进联合统帅部，以兵换话语权"
 KRAUS_pm_wi.2.b:0 "民族自由党：用物资代替兵员，让工厂替士兵上前线"
 KRAUS_pm_wi.2.c:0 "自由民主联盟：先守住帝国本土，再谈远征"
 KRAUS_pm_wi.3.t:0 "战时议题：面包与物价"
 KRAUS_pm_wi.3.d:0 "维也纳的面包店门口排起了长队。工会说工人加了三个月的班，工资还是战前的数；交易所说再管下去，商人都不进货了。\n\n战时的面包该由谁来定价？"
 KRAUS_pm_wi.3.a:0 "社民：配给制，由工会监督"
 KRAUS_pm_wi.3.b:0 "民族自由党：放开物价，鼓励生产"
 KRAUS_pm_wi.3.c:0 "[KRAUS_pm_GetProposerEmp]：成立帝国战时救济署"
 KRAUS_pm_wi.4.t:0 "战时议题：王领在战时"
 KRAUS_pm_wi.4.d:0 "王领的部队在前线流血，王领的议会在后方开会。他们想知道：仗打完了，帝国会记得谁？\n\n帝国该怎样对待战时的王领？"
 KRAUS_pm_wi.4.a:0 "[KRAUS_pm_GetProposerEmp]：王领团编入帝国军，统一军令"
 KRAUS_pm_wi.4.b:0 "自由民主联盟：给王领议会战时授权"
 KRAUS_pm_wi.4.c:0 "基社：交给堂区与地方，就地动员"
 KRAUS_pm_pullto_emp_tt:0 "若§Y皇帝§!在场，§Y议会的重心§!向皇帝移动 10%。"
 KRAUS_pm_pullto_cs_tt:0 "§Y议会的重心§!向§Y基社§!移动 6%。"
 KRAUS_pm_pullto_ml_tt:0 "§Y议会的重心§!向§Y民族自由党§!移动 6%。"
 KRAUS_pm_pullto_sd_tt:0 "§Y议会的重心§!向§Y社民§!移动 6%。"
 KRAUS_pm_pullto_sl_tt:0 "§Y议会的重心§!向§Y自由民主联盟§!移动 6%。"
 KRAUS_pm_comp_p15_tt:0 "§Y妥协意愿§! §G+15§!"
 KRAUS_pm_comp_m15_tt:0 "§Y妥协意愿§! §R-15§!"
 KRAUS_pm_warpol_emp:0 "皇帝：帝国战时指挥部"
 KRAUS_pm_warpol_emp_desc:0 "统一指挥，统一后勤。皇帝亲自主持每周一次的战时会议。"
 KRAUS_pm_warpol_sd:0 "社民：工厂委员会"
 KRAUS_pm_warpol_sd_desc:0 "让工人自己管车间的产量，工会保证不罢工。"
 KRAUS_pm_warpol_cs:0 "基社：堂区募兵"
 KRAUS_pm_warpol_cs_desc:0 "神父在礼拜日读出名单，山谷里的年轻人一起上路。"
 KRAUS_pm_warpol_sl:0 "自由民主联盟：战时新闻与公民权"
 KRAUS_pm_warpol_sl_desc:0 "报纸照常出版，议会照常质询。打仗的理由要让所有人都听得懂。"
 KRAUS_pm_warpol_ml:0 "民族自由党：战时信贷"
 KRAUS_pm_warpol_ml_desc:0 "信贷银行承销战争债券，工厂少造点日用品，多造点枪。"
 KRAUS_pm_pullto_emp_dec_tt:0 "§Y议会的重心§!向§Y皇帝§!移动 5%。"
