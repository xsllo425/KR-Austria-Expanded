 KRAUS_pm_activate_tt:0 "§Y皇帝的天平§!收起，换成§Y帝国议会的重心§!：天平最后偏向哪一边、多瑙河危机怎样了结，决定重心从地图上的哪里出发。"
 KRAUS_pm_pull_sd_tt:0 "§Y议会的重心§!向§Y社民§!一角移动（主党 3%，辅党减半）。"
 KRAUS_pm_pull_cs_tt:0 "§Y议会的重心§!向§Y基社§!一角移动（主党 3%，辅党减半）。"
 KRAUS_pm_pull_sl_tt:0 "§Y议会的重心§!向§Y自由民主联盟§!一角移动（主党 3%，辅党减半）。"
 KRAUS_pm_pull_ml_tt:0 "§Y议会的重心§!向§Y民族自由党§!一角移动（主党 3%，辅党减半）。"
 KRAUS_pm_events.1.t:0 "议会多数换了人"
 KRAUS_pm_events.1.d_sd:0 "议会的重心滑向了工人一侧。社民党团的领袖被请进了霍夫堡，新内阁的名单在当晚登上了《工人报》的头版。"
 KRAUS_pm_events.1.d_cs:0 "议会的重心滑向了堂区与田野。基社党团的领袖被请进了霍夫堡，新内阁的名单在礼拜日的布道之后传遍了山谷。"
 KRAUS_pm_events.1.d_sl:0 "议会的重心滑向了市民与各民族的报馆。自由民主联盟的领袖被请进了霍夫堡，新内阁的名单用七种语言登在了报上。"
 KRAUS_pm_events.1.d_ml:0 "议会的重心滑向了交易所。民族自由党的领袖被请进了霍夫堡，新内阁的名单还没公布，信贷银行的股价已经先涨了。"
 KRAUS_pm_events.1.a:0 "议会说了算。"
 KRAUS_pm_test_activate:0 "测试：模拟「明天的帝国」读完（天平收起，地图启用）"
 KRAUS_pm_test_activate_desc:0 "与读完「明天的帝国」时的交接效果相同，但不触发第二次大选。"
 KRAUS_pm_pull_fed_tt:0 "§Y议会的重心§!向§Y社民§!与§Y自由民主联盟§!之间（王领自治一侧）移动 3%。"
 KRAUS_pm_pull_mkt_tt:0 "§Y议会的重心§!向§Y自由民主联盟§!与§Y民族自由党§!之间（自由市场一侧）移动 3%。"
 KRAUS_pm_pull_imp_tt:0 "§Y议会的重心§!向§Y民族自由党§!与§Y基社§!之间（中央集权一侧）移动 3%。"
 KRAUS_pm_issue.1.t:0 "语言：帝国说哪一种话"
 KRAUS_pm_issue.1.d0:0 "第二次大选后的第一场辩论，吵的不是钱，也不是兵，而是话。布拉格的议员要用捷克语发言，萨格勒布的议员要用克罗地亚语答辩，议长手里的铃摇了一下午。\n\n学校、官府、军令，帝国究竟要用哪一种语言？"
 KRAUS_pm_issue.1.a:0 "德语是帝国的共同语"
 KRAUS_pm_issue.1.b:0 "各族语言一律平等"
 KRAUS_pm_issue.1.c:0 "双语并行，各退一步"
 KRAUS_pm_issue.2.t:0 "财政：谁的钱，谁来管"
 KRAUS_pm_issue.2.d0:0 "语言之争以维也纳的胜利收场，可各王领的代表把账记在了另一本本子上：既然话由维也纳定，钱至少该由自己管。\n\n帝国的预算该怎么编？"
 KRAUS_pm_issue.2.d1:0 "各族语言平等的法案刚刚通过，维也纳的财政部就算出了一笔账：七种语言的公文、七套翻译、七份印刷费。部长问议会：谁来出这笔钱？\n\n帝国的预算该怎么编？"
 KRAUS_pm_issue.2.d2:0 "双语折中让所有人都不满意，也让所有人都还坐在议会里。下一张摆上桌的是预算案，这一次没人愿意再各退一步。\n\n帝国的预算该怎么编？"
 KRAUS_pm_issue.2.a:0 "统一预算，维也纳一本账"
 KRAUS_pm_issue.2.b:0 "王领保留自己的税权"
 KRAUS_pm_issue.2.c:0 "交易所主导的统一市场"
 KRAUS_pm_issue.2.d:0 "国家主导的公共投资"
 KRAUS_pm_issue.3.t:0 "行政：维也纳的部委与王领的官府"
 KRAUS_pm_issue.3.d0:0 "王领拿回了税权，接着就要拿回收税的人。各邦政府递来一份名单：哪些官职该由本地任命，哪些还归维也纳。\n\n帝国的官府该听谁的？"
 KRAUS_pm_issue.3.d1:0 "预算定下来了，可钱要经过官府才能花出去。维也纳的部委和各王领的官府，在每一张公文上争签字权。\n\n帝国的官府该听谁的？"
 KRAUS_pm_issue.3.a:0 "维也纳直辖"
 KRAUS_pm_issue.3.b:0 "王领政府自理"
 KRAUS_pm_issue.3.c:0 "职业文官改革：考试取士，不问出身"
 KRAUS_pm_issue.4.t:0 "军队：一支帝国军，还是六支王领军"
 KRAUS_pm_issue.4.d0:0 "官府收归维也纳之后，总参谋部第一个找上门：既然公文只有一个签字的人，军令为什么还有六个？\n\n帝国的军队该听谁的号令？"
 KRAUS_pm_issue.4.d1:0 "议会吵完了语言、钱和官府，最后一个问题由总参谋部提出：一旦开战，王领的部队听谁的号令？\n\n帝国的军队该听谁的号令？"
 KRAUS_pm_issue.4.a:0 "统一指挥，一支帝国军"
 KRAUS_pm_issue.4.b:0 "保留王领团，战时再合编"
 KRAUS_pm_issue.4.c:0 "职业化改革：先练兵，再谈归属"
 KRAUS_pm_issue.5.t:0 "帝国基本法：草案上桌"
 KRAUS_pm_issue.5.d0:0 "四场辩论吵完，议员们发现彼此之间的分歧没有想象中那么大。宪法委员会的门第一次敞开着开会，草案的第一页已经写好了。\n\n剩下的，是让足够多的人在上面签字。"
 KRAUS_pm_issue.5.d1:0 "四场辩论吵完，议会里只剩下一个共识：谁也不信谁。宪法委员会在霍夫堡的一间小屋里闭门开会，草案改了十一稿，还没有一稿能拿出去。\n\n要写出一部所有人都认的宪法，要么等一个党坐稳了位置，要么等足够多的党愿意坐在一起。"
 KRAUS_pm_issue.5.d2:0 "四场辩论吵完，语言、钱、官府和军队的结论被一条一条抄进了一份草案。宪法委员会说，这是《帝国基本法》的第一稿。\n\n剩下的，是让足够多的人在上面签字。"
 KRAUS_pm_issue.5.a:0 "把草案交给议会。"
