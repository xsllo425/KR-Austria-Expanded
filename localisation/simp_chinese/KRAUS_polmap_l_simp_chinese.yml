l_simp_chinese:
 KRAUS_polmap_category:0 "帝国议会的重心"
 KRAUS_polmap_category_desc:0 "四个党团在这张图上各占一角。议会的重心落在哪里，哪个党团就主导内阁；离重心够近的党团可以入阁。"
 KRAUS_pm_bg_tt:0 "§Y横轴§!：经济，左为国家调节，右为自由市场。\n§Y纵轴§!：帝国构造，上为中央集权，下为王领自治。\n虚线两端的党团互相排斥。"
 KRAUS_pm_dot_tt:0 "§Y议会的重心§!：经济 [?KRAUS_pm_x|0]，构造 [?KRAUS_pm_y|0]。\n白圈内的党团可以入阁；圈的大小由§Y妥协意愿§!（[?KRAUS_pm_comp|0]）决定。"
 KRAUS_pm_emperor_tt:0 "§Y皇帝§!：战时帝国内阁阶段登场。战后大选看议会重心离皇帝多远。"
 KRAUS_pm_readout:0 "主导：§Y[KRAUS_pm_GetLeader]（[KRAUS_pm_GetPremier]）§!　内阁：[KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]　妥协意愿：§Y[KRAUS_pm_GetComp]§!"
