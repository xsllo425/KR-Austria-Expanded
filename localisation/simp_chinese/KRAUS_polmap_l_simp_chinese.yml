 KRAUS_pm_events.2.b:0 "暂缓签字：等风暴过去，再定国本。"
 KRAUS_pm_charter_shelved_tt:0 "草案留在宪法委员会，各党团继续议政。\n若大战爆发，皇帝将主持§Y举国一致的战时内阁§!，大德意志与神圣罗马帝国路线可能由此打开。 \n§R（这条路线将在后续版本开放，当前版本尚未实装。）§!"
 KRAUS_pm_law_st_ready:0 "草案已写成，等待皇帝签字"
 KRAUS_pm_law_st_shelved:0 "草案暂缓签字，留待战后"
 KRAUS_pm_post.1.t:0 "战后大选"
 KRAUS_pm_post.1.a:0 "新的议会，新的政府。"
 KRAUS_pm_post.1.d_emperor:0 "战争结束了，战时内阁却没有散。四个党团谁也没有拿出一份能让别人点头的方案，议会的重心一直停在皇帝身边。\n\n大选的结果是一张没有人愿意写名字的票：皇帝宣布战时的非常安排转为常态，由他亲自执政，议会照常开会，只是不再决定谁来组阁。"
 KRAUS_pm_post.1.d_1:0 "战争结束后的第一次大选，选民把票投给了同一个名字。[KRAUS_pm_GetLeader]独自组阁，皇帝在霍夫堡接见了新的总理。\n\n战时内阁解散，皇帝回到宪法之上的位置。没有谁需要妥协，改革可以放手去做；批评的声音，只能在议会的反对席上发出。"
 KRAUS_pm_post.1.d_2:0 "战争结束后的第一次大选，没有一个党拿到足够的席位。以[KRAUS_pm_GetLeader]为首的两党联合内阁在谈判桌上成形，各取一半纲领。\n\n战时内阁解散，皇帝回到宪法之上的位置。"
 KRAUS_pm_post.1.d_3:0 "战争结束后的第一次大选，议会被切成了几块。三个党团坐在了同一张内阁的桌子旁，以[KRAUS_pm_GetLeader]为首。支持面很广，每一项决定也都要三家点头。\n\n战时内阁解散。共同的敌人不在了，这份联合能维持多久，要看各党还愿不愿意妥协。"
 KRAUS_pm_post.1.d_4:0 "战争结束后的第一次大选，四个党团全部进入了内阁，以[KRAUS_pm_GetLeader]为首。这是帝国议会史上最宽的一次联合。\n\n战时内阁解散。共同的敌人不在了，四个党团能不能继续坐在同一张桌子旁，要看各党还愿不愿意妥协。"
 KRAUS_pm_crisis.1.t:0 "联合内阁出现裂痕"
 KRAUS_pm_crisis.1.d:0 "战时的共同敌人不在了，内阁会议上的火药味一周比一周浓。财政、王领、军队，每一件事都有两个以上的党团想要不同的写法。\n\n总理府的秘书在会议记录里写下了第一次「保留意见」。"
 KRAUS_pm_crisis.1.a:0 "这样下去，联合撑不过今年。"
 KRAUS_pm_crisis.2.t:0 "各党的最后通牒"
 KRAUS_pm_crisis.2.d:0 "三个月来，内阁里没有通过过一项重要法案。有党团公开提出：要么重组内阁，把各党的位置与纲领重新谈一遍；要么干脆承认联合已经走到头，缩回到两个党的组合。\n\n总理府的桌上并排放着两份文件。"
 KRAUS_pm_crisis.2.a:0 "该做决定了。"
 KRAUS_pm_crisis_open_tt:0 "§Y政治地图§!下的决议栏里出现两条一次性决议：§Y重组联合内阁§!与§Y回到两党内阁§!。选其一，§Y联合内阁危机§!的减益随之解除。"
 KRAUS_pm_crisis_idea:0 "联合内阁的裂痕"
 KRAUS_pm_crisis_idea_desc:0 "内阁会议上人人都有保留意见。要么重组内阁，要么缩回两党，只有一次性决议能结束这场危机。"
 KRAUS_pm_crisis_reform:0 "重组联合内阁"
 KRAUS_pm_crisis_reform_desc:0 "各党在霍夫堡重新谈一遍位置与纲领，皇帝出面作调人。要付出一笔政治点数，换回联合的底气。"
 KRAUS_pm_crisis_twoparty:0 "回到两党内阁"
 KRAUS_pm_crisis_twoparty_desc:0 "承认联合已走到头。内阁缩小，会议桌安静下来。"
 KRAUS_pm_crisis_reform_tt:0 "§Y妥协意愿§! §G+25§!，联合内阁的裂痕解除。"
 KRAUS_pm_crisis_twoparty_tt:0 "联合内阁的裂痕解除；内阁随议会重心与妥协意愿回到较小的组合。"
 KRAUS_pm_end_emperor:0 "皇帝亲政"
 KRAUS_pm_end_emperor_desc:0 "战时的非常安排成了常态。皇帝主持政府，军令统一，议会不再决定谁来组阁。"
 KRAUS_pm_end_1:0 "一党执政"
 KRAUS_pm_end_1_desc:0 "没有妥协的政府，改革力度最大，反对声也最直接。"
 KRAUS_pm_end_2:0 "两党联合内阁"
 KRAUS_pm_end_2_desc:0 "两党纲领各取一半，政局平稳。"
 KRAUS_pm_end_3:0 "三党联合内阁"
 KRAUS_pm_end_3_desc:0 "支持面广，但每个决定都要三家点头。需要较高的妥协意愿才能维持。"
 KRAUS_pm_end_4:0 "四党联合内阁"
 KRAUS_pm_end_4_desc:0 "帝国议会史上最宽的联合，稳定，但行动迟缓。需要较高的妥协意愿才能维持。"
 KRAUS_pm_post_tt:0 "战时帝国内阁解散，§Y皇帝点§!收起；执政党与执政联盟按议会重心的入阁圈重新确定，并获得相应的§Y内阁精神§!。\n若皇帝亲政，政体变为§Y家长制专制§!，议会重心不再决定组阁。"
