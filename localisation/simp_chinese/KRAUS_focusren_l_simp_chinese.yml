 KRAUS_fr_AUS_sdap_7_n_ml:0 "工业订货协约"
 KRAUS_fr_AUS_sdap_7_n_sl:0 "工业公民协约"
 KRAUS_fr_AUS_sdap_7_d_p1:0 "零散的信贷、采购与用工安排需要一份共同的生产协约。工会要求工资按时支付，厂主希望订单不随内阁争执而中断，地方代表则要求知道哪些企业将获支持。伦纳把这些要求放进同一份协议，让恢复生产不再依赖一次次临时让步。签字之后，车间仍要面对资金和原料短缺，但协商已经有了可以延续的基础。"
 KRAUS_fr_AUS_sdap_7_d_cs:0 "零散的信贷、采购与用工安排需要一份共同的生产协约。基社把雇主、工会与地方代表的要求写进同一份协议。"
 KRAUS_fr_AUS_sdap_7_d_sd:0 "零散的信贷、采购与用工安排需要一份共同的生产协约。社民把工会、厂主与地方代表的要求放进同一份协议，让恢复生产不再依赖临时让步。"
 KRAUS_fr_AUS_sdap_7_d_ml:0 "民族自由党把订货、信贷与用工安排写成一份商业协约，订单不再随内阁争执而中断。"
 KRAUS_fr_AUS_sdap_7_d_sl:0 "自由民主联盟把订货、信贷与用工写进一份公开协约，各方代表签名，议会存档备查。"
