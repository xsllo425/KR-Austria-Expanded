 KRAUS_fr_AUS_sdap_6_n_ml:0 "打通商品流通"
 KRAUS_fr_AUS_sdap_6_n_sl:0 "省际供应协商"
 KRAUS_fr_AUS_sdap_6_d_p1:0 "煤、钢与机床在各省之间流动不畅，工程屡屡因缺料停摆。政府协调铁路运力、统一部分订货标准，并设立跨省调配的协商渠道。打通瓶颈不等于产能立刻回升，而是让已经开工的工地不再停工待料。调配谁先谁后，仍要在各省之间反复协商。"
 KRAUS_fr_AUS_sdap_6_d_cs:0 "煤、钢与机床在各省之间流动不畅。基社协调铁路运力、统一部分订货标准，让已开工的工地不再停工待料。"
 KRAUS_fr_AUS_sdap_6_d_sd:0 "社民协调铁路运力、统一部分订货标准，并设立跨省调配的协商渠道，让开工的工地不再停工待料。"
 KRAUS_fr_AUS_sdap_6_d_ml:0 "民族自由党取消各省之间不必要的关卡与手续，让煤、钢与机床按市场价格自己找到买主。"
 KRAUS_fr_AUS_sdap_6_d_sl:0 "自由民主联盟设立由各省议会派员参加的供应协商会，煤与钢的调配先谈后配。"
 KRAUS_fr_AUS_sdap_7_n_p1:0 "工业生产协约"
