 KRAUS_fr_AUS_sdap_4_n_ml:0 "以工代赈"
 KRAUS_fr_AUS_sdap_4_n_sl:0 "公共工程队"
 KRAUS_fr_AUS_sdap_4_d_p1:0 "救济不能只靠面包券。政府把失业者编入公共工程队，修路、筑堤、清理河道，同时与工会商定工时和最低工价。救济与劳动之间的界线由此变得模糊：拿到工作的人有了收入，没被编入的人仍在门外等候。政府必须解释谁先上岗、凭什么。"
 KRAUS_fr_AUS_sdap_4_d_cs:0 "救济不能只靠面包券。基社把失业者编入公共工程队，修路、筑堤、清理河道，工价按最低标准发放。"
 KRAUS_fr_AUS_sdap_4_d_sd:0 "救济不能只靠面包券。社民把失业者编入公共工程队，与工会商定工时和最低工价。拿到工作的人有了收入，没被编入的还在等。"
 KRAUS_fr_AUS_sdap_4_d_ml:0 "民族自由党让失业者以工代赈：修路、筑堤，工价由国库与承包商共同支付，不另发救济。"
 KRAUS_fr_AUS_sdap_4_d_sl:0 "自由民主联盟设立由地方议会监督的公共工程队，招募名额与工价公开，防止被一个党派垄断。"
