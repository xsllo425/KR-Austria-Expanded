l_simp_chinese:
 KRAUS_fr_AUS_cs_national_austerity_council_n_p1:0 "国家紧缩政策委员会"
 KRAUS_fr_AUS_cs_national_austerity_council_n_cs:0 "国家紧缩政策委员会"
 KRAUS_fr_AUS_cs_national_austerity_council_n_sd:0 "紧缩的责任委员会"
 KRAUS_fr_AUS_cs_national_austerity_council_n_ml:0 "预算纪律委员会"
 KRAUS_fr_AUS_cs_national_austerity_council_n_sl:0 "公共支出审议会"
 KRAUS_fr_AUS_cs_national_austerity_council_d_p1:0 "财政部召集银行、工业与地方代表组成紧缩委员会，先把支出压到可承受的限度。委员会要决定哪些项目暂缓、哪些债务必须偿付，也要承担由此带来的失业与不满。紧缩可以稳住账目，却不能自动换来信任，政府必须说明省下的钱将用在何处。"
 KRAUS_fr_AUS_cs_national_austerity_council_d_cs:0 "基社把财政部的账本摊开，银行、工业与地方代表坐在同一张桌边，先决定哪些项目暂缓、哪些债务必须偿付。紧缩能稳住账目，却不会自动换来信任。"
 KRAUS_fr_AUS_cs_national_austerity_council_d_sd:0 "社民不愿让工人独自承担紧缩。委员会里工会与银行、工业并排而坐，每一笔削减都要公开说明，由谁承担，省下的钱用在何处。"
 KRAUS_fr_AUS_cs_national_austerity_council_d_ml:0 "民族自由党要的是可核对的数字：委员会按项目逐条排出支出优先级，该缓的缓，该还的还，把账目先摆平。"
 KRAUS_fr_AUS_cs_national_austerity_council_d_sl:0 "自由民主联盟主张削减也要经过议会审议。支出审议会把每一项削减摆上桌面，让纳税人看得见钱花去了哪里。"
 KRAUS_fr_AUS_cs_2_n_p1:0 "控制通货膨胀"
 KRAUS_fr_AUS_cs_2_n_cs:0 "控制通货膨胀"
 KRAUS_fr_AUS_cs_2_n_sd:0 "保住工资的购买力"
 KRAUS_fr_AUS_cs_2_n_ml:0 "币值与信用"
 KRAUS_fr_AUS_cs_2_n_sl:0 "稳住物价与信贷"
 KRAUS_fr_AUS_cs_2_d_p1:0 "物价上涨侵蚀着刚有起色的工资。政府收紧货币、管制部分必需品价格，并以公债回笼流通中的纸币。控制通胀会得罪投机者与债权人，也会让急需廉价信贷的工厂叫苦。财政部必须在稳定币值与维持生产之间反复权衡，任何一步走偏都要付出代价。"
 KRAUS_fr_AUS_cs_2_d_cs:0 "物价侵蚀着刚有起色的工资。基社收紧货币，管制部分必需品价格，用公债回笼纸币，宁可得罪投机者，也要守住币值。"
 KRAUS_fr_AUS_cs_2_d_sd:0 "社民把物价管制放在首位：必需品限价，公债回笼纸币，让工资袋里的钱不会一周比一周薄。"
 KRAUS_fr_AUS_cs_2_d_ml:0 "民族自由党相信稳定的币值是一切生意的基础：收紧货币，回笼纸币，让信用重新有处落脚。"
 KRAUS_fr_AUS_cs_2_d_sl:0 "自由民主联盟尝试在稳定币值与维持生产之间找平衡：限价只限必需品，其余交给市场与信用社。"
 KRAUS_fr_AUS_cs_3_n_p1:0 "重点工程配资"
 KRAUS_fr_AUS_cs_3_n_cs:0 "重点工程配资"
 KRAUS_fr_AUS_cs_3_n_sd:0 "公共工程配资"
 KRAUS_fr_AUS_cs_3_n_ml:0 "招标工程配资"
 KRAUS_fr_AUS_cs_3_n_sl:0 "基础设施配资"
 KRAUS_fr_AUS_cs_3_d_p1:0 "财政部不再平均撒钱，而是挑选少数重点工程集中配资：修复关键铁路、扩建电力与建材产能。资金随进度拨付，工程局须按期交出账目和实物。集中投入能更快见效，却也让被排除在名单外的地区不满。谁进名单，取决于工程能力与政治分量。"
 KRAUS_fr_AUS_cs_3_d_cs:0 "基社不再平均撒钱，只挑少数重点工程集中配资：关键铁路、电力与建材产能。资金随进度拨付，账目要按期交出。"
 KRAUS_fr_AUS_cs_3_d_sd:0 "社民把资金投向最能带动用工的工程：铁路、电站、建材厂。名单由工程局与工会共同审核。"
 KRAUS_fr_AUS_cs_3_d_ml:0 "民族自由党让重点工程公开招标，资金按进度拨付，承包商以报价与工期竞争。"
 KRAUS_fr_AUS_cs_3_d_sl:0 "自由民主联盟把配资与地方议会挂钩：铁路、电力、建材，各省按工程能力申报，再由中央统一审核。"
 KRAUS_fr_AUS_cs_4_n_p1:0 "与社民工党妥协"
 KRAUS_fr_AUS_cs_4_n_cs:0 "与社民工党妥协"
 KRAUS_fr_AUS_cs_4_n_sd:0 "与基社党妥协"
 KRAUS_fr_AUS_cs_4_n_ml:0 "与两大工会党派妥协"
 KRAUS_fr_AUS_cs_4_n_sl:0 "与左右两翼妥协"
 KRAUS_fr_AUS_cs_4_d_p1:0 "米克拉斯政府需要社会民主党在议会中的配合，以通过紧缩与税收方案。妥协意味着在福利、工资和工会权利上有所让步，换取对方支持财政纪律。党内强硬派认为让步太多，社民党则担心被绑上紧缩的车。协议能撑一阵，却让双方都欠下政治人情。"
 KRAUS_fr_AUS_cs_4_d_cs:0 "基社需要社民党在议会里配合通过紧缩与税收方案。让出福利、工资与工会权利上的一部分，换取财政纪律。"
 KRAUS_fr_AUS_cs_4_d_sd:0 "社民需要基社党在议会里配合通过福利与税收方案。让出一部分财政纪律，换取工人保障。"
 KRAUS_fr_AUS_cs_4_d_ml:0 "民族自由党在议会里没有多数，只能同基社与社民分别谈条件，用有限的让步换取预算案的通过。"
 KRAUS_fr_AUS_cs_4_d_sl:0 "自由民主联盟夹在基社与社民之间，一条一条地谈：福利让一点，纪律让一点，换预算案过关。"
 KRAUS_fr_AUS_cs_5_n_p1:0 "农民补贴"
 KRAUS_fr_AUS_cs_5_n_cs:0 "农民补贴"
 KRAUS_fr_AUS_cs_5_n_sd:0 "乡村互助补贴"
 KRAUS_fr_AUS_cs_5_n_ml:0 "农业信贷补贴"
 KRAUS_fr_AUS_cs_5_n_sl:0 "小农与合作社补贴"
 KRAUS_fr_AUS_cs_5_d_p1:0 "农村破产会把失业和不满一起带进城市。政府向小农与合作社发放定向补贴，条件是稳定粮食供应、参与地方信贷担保。补贴缓解了燃眉之急，却不能改变低价的根本处境。地主与富农也想分一杯羹，财政部门须在乡村的多种诉求间划出界限。"
 KRAUS_fr_AUS_cs_5_d_cs:0 "农村破产会把失业与不满一起带进城市。基社向小农与合作社发放定向补贴，条件是稳定粮食供应、参与地方信贷担保。"
 KRAUS_fr_AUS_cs_5_d_sd:0 "社民把补贴发给合作社与农业工人，而不是大庄园。粮食供应稳定了，城里人才吃得起面包。"
 KRAUS_fr_AUS_cs_5_d_ml:0 "民族自由党把补贴换成信贷：农户凭抵押物从合作银行借款，利率由国库贴补。"
 KRAUS_fr_AUS_cs_5_d_sl:0 "自由民主联盟向小农与合作社发放补贴，并要求账目公开，防止大地主吞掉大部分份额。"
 KRAUS_fr_AUS_cs_6_n_p1:0 "修补社会矛盾"
 KRAUS_fr_AUS_cs_6_n_cs:0 "修补社会矛盾"
 KRAUS_fr_AUS_cs_6_n_sd:0 "弥合城乡与行业的裂缝"
 KRAUS_fr_AUS_cs_6_n_ml:0 "商会调解委员会"
 KRAUS_fr_AUS_cs_6_n_sl:0 "社会调解委员会"
 KRAUS_fr_AUS_cs_6_d_p1:0 "紧缩与补贴的副作用逐渐显露：工人不满、地方抱怨、企业与工会互相指责。政府以调解和有限让利修补裂痕，把各方拉回谈判桌。修补不等于和解，只是避免矛盾在此刻爆发。若下一轮预算再次收紧，现有的妥协随时可能被推翻。"
 KRAUS_fr_AUS_cs_6_d_cs:0 "紧缩与补贴的副作用逐渐显露：工人不满，地方抱怨。基社以调解和有限让利把各方拉回谈判桌，只求矛盾不在此刻爆发。"
 KRAUS_fr_AUS_cs_6_d_sd:0 "社民把工人、农民与小商人请到同一张桌边，让他们把怨言说出来，再一条一条对照预算。"
 KRAUS_fr_AUS_cs_6_d_ml:0 "民族自由党请商会与行会出面调解劳资与行业纠纷，用有限的让利换取各方继续做生意。"
 KRAUS_fr_AUS_cs_6_d_sl:0 "自由民主联盟设立由各方代表组成的调解委员会，让争议在议会之外先谈一轮。"
 KRAUS_fr_AUS_cs_7_n_p1:0 "维也纳社会协定"
 KRAUS_fr_AUS_cs_7_n_cs:0 "维也纳社会协定"
 KRAUS_fr_AUS_cs_7_n_sd:0 "维也纳劳资协定"
 KRAUS_fr_AUS_cs_7_n_ml:0 "维也纳工商协定"
 KRAUS_fr_AUS_cs_7_n_sl:0 "维也纳公民协定"
 KRAUS_fr_AUS_cs_7_d_p1:0 "政府召集雇主、工会与地方代表，把工资、工时与用工条件写进一份社会协定，以换取短期的劳资和平。协定确立的是协商与仲裁的程序，并非宣布制度危机已经结束。各方签下名字，也保留在下一轮会谈中重新讨价的权利。秩序由此多了一层可执行的约定。"
 KRAUS_fr_AUS_cs_7_d_cs:0 "政府召集雇主、工会与地方代表，把工资、工时与用工条件写进一份社会协定，换取短期的劳资和平。协定确立的是协商与仲裁的程序。"
 KRAUS_fr_AUS_cs_7_d_sd:0 "社民推动雇主与工会签下劳资协定：工资、工时与用工条件写成条文，争议交由仲裁。"
 KRAUS_fr_AUS_cs_7_d_ml:0 "民族自由党召集工商联合会与工会，把工资、工时与订单周期写进协定，让生意能做下去。"
 KRAUS_fr_AUS_cs_7_d_sl:0 "自由民主联盟召集雇主、工会与地方议会，把工资、工时与用工条件写进一份公开协定。"
 KRAUS_fr_AUS_cs_fill_the_coffers_n_p1:0 "填补国库"
 KRAUS_fr_AUS_cs_fill_the_coffers_n_cs:0 "填补国库"
 KRAUS_fr_AUS_cs_fill_the_coffers_n_sd:0 "向富人征收补缺税"
 KRAUS_fr_AUS_cs_fill_the_coffers_n_ml:0 "整理公债与垫款"
 KRAUS_fr_AUS_cs_fill_the_coffers_n_sl:0 "公开账目的垫款"
 KRAUS_fr_AUS_cs_fill_the_coffers_d_p1:0 "国库接近见底，财政部一方面追收欠税、整理公债，另一方面向银行界寻求短期垫款。填补缺口只是第一步，任何一笔钱都要说明来源与用途。企业希望减税，地方要求拨款，谁都明白此刻的每一枚硬币都带着条件。"
 KRAUS_fr_AUS_cs_fill_the_coffers_d_cs:0 "国库接近见底。基社一面追收欠税、整理公债，一面向银行界寻求短期垫款，每一笔钱都要说明来源与用途。"
 KRAUS_fr_AUS_cs_fill_the_coffers_d_sd:0 "社民把缺口算到最有能力承担的人头上：追收欠税、整理公债，并向大资产加征一笔补缺税。"
 KRAUS_fr_AUS_cs_fill_the_coffers_d_ml:0 "民族自由党同银行界谈垫款条件，整理公债，用市场的办法一步步把国库填满。"
 KRAUS_fr_AUS_cs_fill_the_coffers_d_sl:0 "自由民主联盟要求财政部公布每一笔垫款与欠税的来龙去脉，再向银行界与国库借款填补缺口。"
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_p1:0 "公共福利改革"
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_cs:0 "福利改革"
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_sd:0 "公共福利改革"
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_ml:0 "福利基金改革"
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_sl:0 "公共福利改革"
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_p1:0 "工人委员会与厂主就福利范围争执不下。政府选择先扩展公共福利：把工伤、失业与医疗的兜底写进可核查的条款，由工会与地方机构共同经办。福利要真正落地，需要财政与雇主配合；若只发一纸承诺，工人依旧会把它当作空话。"
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_cs:0 "基社愿意把工伤、失业与医疗写成可核查的条款，由教区与行会共同经办，福利要有人兜得起。"
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_sd:0 "工人委员会与厂主争执不下，社民选择先扩展公共福利：工伤、失业与医疗写进可核查的条款，由工会与地方机构共同经办。"
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_ml:0 "民族自由党主张福利靠基金来兜底：雇主与雇员共同缴费，政府只负责监督与补缺。"
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_sl:0 "自由民主联盟把福利写成公民的权利：工伤、失业与医疗条款公开，由地方议会共同监督。"
 KRAUS_fr_AUS_sdap_1_n_p1:0 "学校、医院与公园"
 KRAUS_fr_AUS_sdap_1_n_cs:0 "学校、医院与教堂"
 KRAUS_fr_AUS_sdap_1_n_sd:0 "学校、医院与公园"
 KRAUS_fr_AUS_sdap_1_n_ml:0 "学校、医院与商会大楼"
 KRAUS_fr_AUS_sdap_1_n_sl:0 "学校、医院与图书馆"
 KRAUS_fr_AUS_sdap_1_d_p1:0 "政府把第一批公共资金投向最看得见的地方：修缮学校与医院，清理城郊的公园和工人社区。工程由地方机构与工会共同安排用工，材料和工资单都要逐项登记。这些项目不会立刻带来产值，却能让民众看见恢复不是空话，也让承包商学会在监督下施工。"
 KRAUS_fr_AUS_sdap_1_d_cs:0 "基社把第一批公共资金投向最看得见的地方：修缮学校、医院与教堂，工程由教区与地方机构安排用工。"
 KRAUS_fr_AUS_sdap_1_d_sd:0 "社民把第一批公共资金投向最看得见的地方：修缮学校与医院，清理城郊的公园和工人社区，由工会与地方机构共同安排用工。"
 KRAUS_fr_AUS_sdap_1_d_ml:0 "民族自由党让商会与地方机构联合出资修缮学校、医院与公共建筑，材料与工资单逐项登记。"
 KRAUS_fr_AUS_sdap_1_d_sl:0 "自由民主联盟把第一批公共资金投向学校、医院与市立图书馆，由地方议会监督用工与账目。"
 KRAUS_fr_AUS_sdap_2_n_p1:0 "自然之友"
 KRAUS_fr_AUS_sdap_2_n_cs:0 "教区远足会"
 KRAUS_fr_AUS_sdap_2_n_sd:0 "自然之友"
 KRAUS_fr_AUS_sdap_2_n_ml:0 "山地旅行协会"
 KRAUS_fr_AUS_sdap_2_n_sl:0 "公民徒步会"
 KRAUS_fr_AUS_sdap_2_d_p1:0 "自然之友的徒步队把维也纳的工人带进了山间，也让城市里的政治走进乡村。内阁愿意支持这类活动：工人需要休憩，保守的村庄也应有机会认识那些常被描述成危险激进派的邻居。组织者带着路线图与行囊出发，地方居民则观察这些访客究竟会带来交谈，还是又一轮宣传。"
 KRAUS_fr_AUS_sdap_2_d_cs:0 "基社支持教区与各类协会组织的远足与朝圣，让城里人与乡下人在同一条路上相识。"
 KRAUS_fr_AUS_sdap_2_d_sd:0 "自然之友的徒步队把维也纳的工人带进山间，也让城市里的政治走进乡村。内阁愿意支持这类活动，让工人与保守的村庄相识。"
 KRAUS_fr_AUS_sdap_2_d_ml:0 "民族自由党支持私人旅行协会开辟山径与旅舍，让旅行成为一门体面的生意，也让城里人认识乡村。"
 KRAUS_fr_AUS_sdap_2_d_sl:0 "自由民主联盟资助各民族的徒步社团，让不同语言的人在同一条山路上互相认识。"
 KRAUS_fr_AUS_sdap_3_n_p1:0 "帝国广播网络"
 KRAUS_fr_AUS_sdap_3_n_cs:0 "帝国广播网络"
 KRAUS_fr_AUS_sdap_3_n_sd:0 "帝国广播网络"
 KRAUS_fr_AUS_sdap_3_n_ml:0 "商业广播网络"
 KRAUS_fr_AUS_sdap_3_n_sl:0 "多语种广播网络"
 KRAUS_fr_AUS_sdap_3_d_p1:0 "政府着手整理并扩展广播覆盖，让政令、市价和气象信息能够传到城市与乡村。多语种节目既要顾及各民族，也要服务于协调与动员。广播是恢复时期少有的统一工具，但谁掌握节目编排，谁就能影响民众如何理解这场危机。"
 KRAUS_fr_AUS_sdap_3_d_cs:0 "政府整理并扩展广播覆盖，让政令、市价与气象信息传到城市与乡村。节目要顾及各民族，也要服务于秩序。"
 KRAUS_fr_AUS_sdap_3_d_sd:0 "社民整理并扩展广播覆盖，让政令、市价与气象信息传到城市与乡村。多语种节目既顾及各民族，也服务于协调。"
 KRAUS_fr_AUS_sdap_3_d_ml:0 "民族自由党让广播同商业电台、市价行情连成一片，让订单与行情能够当天传到各省。"
