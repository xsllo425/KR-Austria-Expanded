 KRAUS_fr_AUS_sdap_5_n_sl:0 "小企业周转信贷"
 KRAUS_fr_AUS_sdap_5_d_p1:0 "工厂复工卡在周转资金上。政府联合合作银行与工会基金，向愿意接受劳资协商的企业提供短期信贷，专款用于购料与发薪。信贷附条件：账目要接受检查，工资不得拖欠。资金有限，审批顺序本身就会引起争论，哪些厂先拿到钱，成了新的政治问题。"
 KRAUS_fr_AUS_sdap_5_d_cs:0 "工厂复工卡在周转资金上。基社联合合作银行向愿意复工的企业提供短期信贷，专款用于购料与发薪，账目接受检查。"
 KRAUS_fr_AUS_sdap_5_d_sd:0 "社民联合合作银行与工会基金，向愿意接受劳资协商的企业提供短期信贷，专款用于购料与发薪，工资不得拖欠。"
 KRAUS_fr_AUS_sdap_5_d_ml:0 "民族自由党让银行界牵头提供短期信贷，利率由市场决定，国库只做担保。"
 KRAUS_fr_AUS_sdap_5_d_sl:0 "自由民主联盟优先把短期信贷发给小企业与合作工场，审批顺序公开，由地方议会监督。"
 KRAUS_fr_AUS_sdap_6_n_p1:0 "打通供应瓶颈"
