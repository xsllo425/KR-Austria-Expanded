l_simp_chinese:
 KRAUS_tomorrow_empire:0 "明天的帝国"
 KRAUS_tomorrow_empire_desc:0 "危机过去了。帝国没有散，也没有赢，它只是还在。\n\n接下来的一百天里，各王领的议员要走进同一座议会大厦，各国的使馆要重新计算维也纳的分量。这一百天里的每一次抉择，都会在二战到来之时，决定帝国用什么样的面孔走进明天。\n\n§R一旦开始，就不能回头。§!"
 KRAUS_tomorrow_done_tt:0 "多瑙河危机已经了结，帝国进入§Y走向二战的时期§!：整合王冠领，联络邻国。"
 KRAUS_lean_usga_tt:0 "帝国更倾向于§Y合众国§!：日后选择这条道路将更容易，奖励更多。"
 KRAUS_lean_gg_tt:0 "帝国更倾向于§Y大德意志§!：日后选择这条道路将更容易，奖励更多。 \n§R（这条路线将在后续版本开放，当前版本尚未实装。）§!"
 KRAUS_lean_hre_tt:0 "帝国更倾向于§Y神圣罗马§!：日后选择这条道路将更容易，奖励更多。 \n§R（这条路线将在后续版本开放，当前版本尚未实装。）§!"
 KRAUS_tomorrow_events.1.t:0 "议会大厦的旗帜"
 KRAUS_tomorrow_events.1.d:0 "新议会大厦的屋顶只有一根旗杆。有人说，上面该并排升起各王领的旗帜；也有人说，帝国只需要一面旗。\n\n工匠们等着答复，油漆已经调好了。"
 KRAUS_tomorrow_events.1.a:0 "并排升起各王领的旗帜。"
 KRAUS_tomorrow_events.1.b:0 "只升起皇帝的旗帜。"
 KRAUS_tomorrow_events.1.c:0 "先空着，等议会定了再说。"
 KRAUS_tomorrow_events.2.t:0 "柏林的来信"
 KRAUS_tomorrow_events.2.d:0 "德国大使送来了一封措辞温和的信：莫斯科与第三国际的阴影越来越长，维也纳作为德国传统的盟友，不应当置身事外。柏林建议签订一份经济与防务合作备忘录，并暗示，帝国公约的大门随时为奥地利敞开。\n\n备忘录不是同盟，但从备忘录到同盟，往往只隔着一个冬天。"
 KRAUS_tomorrow_events.2.a:0 "签署备忘录。"
 KRAUS_tomorrow_events.2.b:0 "礼貌地保持距离。"
 KRAUS_tomorrow_events.2.c:0 "回信拖延。"
 KRAUS_tomorrow_events.3.t:0 "东面的照会"
 KRAUS_tomorrow_events.3.d:0 "来自莫斯科与第三国际的外交照会几乎同时抵达，措辞不同，意思却一样：奥地利最好保持中立，作为回报，边境会保持安静。\n\n外交大臣把两份照会并排放在桌上，说：「他们很客气，客气得让人不安。」"
 KRAUS_tomorrow_events.3.a:0 "宣布奥地利不加入任何集团。"
 KRAUS_tomorrow_events.3.b:0 "回绝：奥地利的朋友在西边。"
 KRAUS_tomorrow_events.3.c:0 "沉默，不作答复。"
 KRAUS_tomorrow_events.4.t:0 "王领议员的联合提案"
 KRAUS_tomorrow_events.4.d:0 "来自布拉格、伦贝格、萨格勒布与布达佩斯的议员联名提交了一份提案：设立一个帝国议会委员会，规定各王领议会使用本地语言的范围，并保障地方议会的预算权。\n\n维也纳的官员们摇头：「这样下去，帝国会变成一堆邦联。」议员们回答：「这样下去，帝国才会变成一个整体。」"
 KRAUS_tomorrow_events.4.a:0 "成立委员会。"
 KRAUS_tomorrow_events.4.b:0 "维持中央统一管理。"
 KRAUS_tomorrow_events.5.t:0 "帝国的明天"
 KRAUS_tomorrow_events.5.d:0 "一百天快过完了。议会大厦里的灯亮到很晚，各个王领的议员坐在同一排长椅上，用四种不同的语言争论同一件事。\n\n帝国没有因此变得更好，也没有变得更糟。它只是继续存在，并且开始想象自己的下一步。"
 KRAUS_tomorrow_events.5.a:0 "让我们走进明天。"
 KRAUS_party_social_democrat:0 "帝国社民工党"
 KRAUS_party_social_democrat_long:0 "帝国社会民主工党(Sozialdemokratische Reichspartei)\n§L各民族的社会民主党沿用 1899 年布吕恩纲领的办法结成同盟：在文化上自治，在议会里同一个党团。维也纳与施泰尔马克的产业工人、工会和市政雇员是它的基本盘，布拉格的钳工与萨格勒布的码头工人也在其中。它要的不是革命，而是八小时工作制、公共住房，和一部能把各民族都写进去的宪法。§!"
 KRAUS_party_social_conservative:0 "帝国基社党"
 KRAUS_party_social_conservative_long:0 "帝国基督教社会党(Christlichsoziale Reichspartei)\n§L天主教保守派的大旗下，匈牙利贝特伦伯爵一派的保守贵族坐进了同一个议员俱乐部。堂区的神父、阿尔卑斯的农民和维也纳的小店主投它的票，因为它会维护秩序、保卫教会学校、不把账本交给银行家。它对皇帝的忠诚，比对任何民族的忠诚都更久远。§!"
 KRAUS_party_authoritarian_democrat:0 "帝国农民同盟"
 KRAUS_party_authoritarian_democrat_long:0 "帝国农民同盟(Reichsbauernbund)\n§L波希米亚农业党、加利西亚的皮亚斯特和克罗地亚农民党，终于想起了他们是同一个阶级。它不关心维也纳的宪法争论，只关心粮价、农业信贷与铁路运费：谁能让田里的收成变成账本上的数字，谁就能得到它的选票。§!"
 KRAUS_party_social_liberal:0 "自由民主联盟"
 KRAUS_party_social_liberal_long:0 "帝国自由民主联盟(Liberaldemokratische Reichsvereinigung)\n§L捷克的民族民主派与乌克兰的民族民主联盟在议会里并肩坐到了一起，后面是大学教授、律师、记者与各民族的知识分子。它相信多民族的国家靠权利而不是靠恐惧维系，主张普选、出版自由，并把更多的权限交给各王领的议会。§!"
 KRAUS_party_paternal_autocrat:0 "德意志民族联盟"
 KRAUS_party_paternal_autocrat_long:0 "德意志民族联盟(Deutscher Nationalverband)\n§L苏台德德意志人加入了大德意志人民党，用的是 1910 年老德意志民族联盟的名字。它代表帝国里最担心自己被稀释的那一群人：官员、教师、边境城镇的德意志商人。它要的是德语在帝国里的主导地位，和一个不被各王领议会拖后腿的中央。§!"
 KRAUS_party_national_populist:0 "祖国阵线"
 KRAUS_party_national_populist_long:0 "祖国阵线(Vaterländische Front)\n§L乡土集团与匈牙利国家统一党在表面上握了手，纯洁权利党站在场外。它把「祖国」二字写在每一张传单的顶部，用乡村的怀旧与对城市的怀疑拼出一个阵线。旗帜是统一的，里面的口号却至少有三种。§!"
 KRAUS_tomorrow_events.10.t:0 "议会里的新格局"
 KRAUS_tomorrow_events.10.d:0 "一百天的议会生活之后，维也纳的政党牌子换了。\n\n§Y帝国社民工党§!：各民族的社会民主党结成联盟，沿用 1899 年布吕恩纲领的老办法。\n§Y帝国基社党§!：天主教保守派的大旗，匈牙利贝特伦伯爵一派的保守贵族坐进了同一个议员俱乐部。\n§Y帝国农民同盟§!：波希米亚农业党、加利西亚的皮亚斯特和克罗地亚农民党，终于想起了他们是同一个阶级。\n§Y自由民主联盟§!：捷克的民族民主派与乌克兰的民族民主联盟，在议会里并肩坐到了一起。\n§Y德意志民族联盟§!：苏台德德意志人加入了大德意志人民党，用的是 1910 年老德意志民族联盟的名字。\n§Y祖国阵线§!：乡土集团与匈牙利国家统一党在表面上握了手，纯洁权利党站在场外。\n\n名字换了，派系没有少。有人说这是帝国的整合，也有人说，这只是把旧矛盾搬到了更大的屋子里。"
 KRAUS_tomorrow_events.10.a:0 "帝国的议会，终于像个帝国的议会了。"
 KRAUS_tomorrow_events.11.t:0 "同盟的座次"
 KRAUS_tomorrow_events.11.d:0 "多瑙—亚得里亚同盟的代表第一次在维也纳坐到同一张桌子旁，却先为座次吵了起来：谁坐主位，谁的旗帜排在前面。\n\n危机之后，没有人再怀疑维也纳有这个资格。真正的问题是：它要做同盟的主人，还是同盟的主席。"
 KRAUS_tomorrow_events.11.a:0 "维也纳坐主位，其余按入盟先后排。"
 KRAUS_tomorrow_events.11.b:0 "设轮值主席，各盟国轮流坐庄。"
 KRAUS_tomorrow_events.11.c:0 "不排座次，用圆桌。"
 KRAUS_tomorrow_events.12.t:0 "匈牙利的账单"
 KRAUS_tomorrow_events.12.d:0 "布达佩斯的议员要求特赦所有卷入危机的人，军官团则要求把首要分子送上军事法庭。两份请愿书同一天送到了霍夫堡。\n\n皇帝说：「一个帝国的宽大，和一个帝国的威严，是同一枚硬币的两面。」"
 KRAUS_tomorrow_events.12.a:0 "全面特赦，宽大处理。"
 KRAUS_tomorrow_events.12.b:0 "审判首要分子，其余从宽。"
 KRAUS_tomorrow_events.12.c:0 "严惩，作为对各王领的警告。"
 KRAUS_tomorrow_events.13.t:0 "帝国公约的观察员"
 KRAUS_tomorrow_events.13.d:0 "柏林邀请奥地利总参谋部派观察员出席帝国公约的秋季演习。信里说得很客气，意思却很清楚：德国想让所有人看到，维也纳坐在谁的旁边。"
 KRAUS_tomorrow_events.13.a:0 "派出高级军官，以盟友的身份出席。"
 KRAUS_tomorrow_events.13.b:0 "只派一名武官。"
 KRAUS_tomorrow_events.13.c:0 "借口准备不足，婉拒。"
 KRAUS_tomorrow_events.14.t:0 "亚得里亚的舰队"
 KRAUS_tomorrow_events.14.d:0 "同盟的海军将领们提出，把联合舰队的司令部设在波拉或的里雅斯特，由此决定亚得里亚海谁说了算。\n\n一位老海军上将说：「陆军可以在维也纳开会，海军只能在海上证明自己。」"
 KRAUS_tomorrow_events.14.a:0 "司令部设在波拉，由奥地利海军统领。"
 KRAUS_tomorrow_events.14.b:0 "各国轮流指挥，在的里雅斯特设联络处。"
 KRAUS_tomorrow_events.14.c:0 "维持各自指挥。"
 KRAUS_tomorrow_events.15.t:0 "美利坚的使者"
 KRAUS_tomorrow_events.15.d:0 "大洋彼岸分裂出的各个政权，都派使者来到了维也纳。有的希望奥地利承认他们，有的只希望奥地利至少保持沉默。\n\n外交部的老官员说：「一个多民族国家如何分裂，我们比谁都清楚。」"
 KRAUS_tomorrow_events.15.a:0 "保持中立，向两边出口工业品。"
 KRAUS_tomorrow_events.15.b:0 "公开表示不赞成分裂，强调多民族国家的团结。"
 KRAUS_tomorrow_events.15.c:0 "拒绝接见。"
 KRAUS_tomorrow_events.16.t:0 "波希米亚的工厂"
 KRAUS_tomorrow_events.16.d:0 "皮尔森的斯柯达兵工厂与上奥地利的施泰尔集团，同时递交了军工订单的申请。两家的董事会都说，没有这份订单，工厂撑不过明年。\n\n波希米亚的议员们特意提醒：「维也纳的军工，不能只在维也纳。」"
 KRAUS_tomorrow_events.16.a:0 "订单交给斯柯达，波希米亚的工厂开足马力。"
 KRAUS_tomorrow_events.16.b:0 "订单集中到维也纳周边的工厂。"
 KRAUS_tomorrow_events.16.c:0 "按比例分配，设立联合军工委员会。"
 KRAUS_tomorrow_events.17.t:0 "德国的关税提议"
 KRAUS_tomorrow_events.17.d:0 "德奥之间的关税同盟早已建成。柏林现在提议更进一步：统一对外关税，取消农产品的配额与例外，并设立共同的清算银行。德国的出口商满怀期待，奥地利的工业家和农场主却各有各的担心。\n\n财政大臣算了很久，说：「这是一笔好买卖，只是不知道，买卖做成之后，谁在柜台后面。」"
 KRAUS_tomorrow_events.17.a:0 "同意统一对外关税，开始谈判。"
 KRAUS_tomorrow_events.17.b:0 "只同意取消工业品的例外。"
 KRAUS_tomorrow_events.17.c:0 "维持现有的关税同盟，不再深化。"
 KRAUS_tomorrow_events.18.t:0 "渥太华、巴黎与伦敦"
 KRAUS_tomorrow_events.18.d:0 "渥太华的流亡王室通过协约国的使馆，邀请奥地利使节出席一场茶会。同一周里，巴黎的人民公社与伦敦的不列颠联盟也联名发来了访问请求，措辞是同志式的。\n\n外交大臣把几封信并排放着，说：「三年前，他们谁都不会给我们写信。现在他们都想知道，维也纳会站在棋盘的哪一边。」"
 KRAUS_tomorrow_events.18.a:0 "接受协约国的茶会邀请。"
 KRAUS_tomorrow_events.18.b:0 "回访第三国际的工人代表团。"
 KRAUS_tomorrow_events.18.c:0 "两边都接待，哪边也不得罪。"
