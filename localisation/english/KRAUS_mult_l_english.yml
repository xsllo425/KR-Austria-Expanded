l_english:
 # ===== 10-27 merge: focuses taken over from the team version, rewritten in the old version's tone =====
 aus_mult_danube_plan:0 "The Golden Danube"
 aus_mult_danube_plan_desc:0 "From Linz to the Iron Gates, the channels, locks and wharves are handed to a single commission. The plans were drawn up under the late Emperor and have sat in a ministry cabinet for twenty years."
 KRAUS_mult_danube_unlock_tt:0 "Unlocks the §YGolden Danube§! works decisions."
 aus_mult_ballhaus_quota:0 "The Ballhausplatz Quota"
 aus_mult_ballhaus_quota_desc:0 "For three weeks the parties and the crownland delegates bargained on the Ballhausplatz over how the ministries' senior posts would be shared. Nobody got everything; nobody left empty-handed."
 aus_mult_joint_construction:0 "The Social Housing Fund"
 aus_mult_joint_construction_desc:0 "Vienna and the crownlands pool a fund to subsidise housing, hospitals and schools. The first works break ground in Vienna, Prague and Budapest on the same day."
 aus_mult_sdap_promise_1:0 "The Eight-Hour Day"
 aus_mult_sdap_promise_1_desc:0 "The Social Democrats made the eight-hour day a condition of coalition. Once it passed, the factory owners of Bohemia and Lower Austria had no choice but to hire more hands."
 aus_mult_sdap_promise_2:0 "Works Councils"
 aus_mult_sdap_promise_2_desc:0 "Large factories set up works councils whose worker delegates may read the books and speak on profit-sharing. The Social Democrats call it the way to keep workers off a more radical road."
 aus_mult_cs_promise_1:0 "Parish Relief"
 aus_mult_cs_promise_1_desc:0 "The Christian Socials insist that relief money be paid out through the parishes. A village priest knows better than any official from Vienna which household needs help."
 aus_mult_cs_promise_2:0 "Guilds and Apprentices"
 aus_mult_cs_promise_2_desc:0 "The craft guilds regain the right to hold apprentice examinations, and small workshops may deduct their training costs from tax."
 aus_mult_lb_promise_1:0 "Free Ports on the Adriatic"
 aus_mult_lb_promise_1_desc:0 "Trieste and Fiume become free ports, and the last transit duties between the crownlands are abolished. The liberal economists had fought for this for ten years."
 aus_mult_lb_promise_2:0 "Railway and Power Concessions"
 aus_mult_lb_promise_2_desc:0 "New branch lines and power stations are opened to private capital under concession. The Treasury breathes easier; the unions do not."
 aus_mult_gdvp_promise_1:0 "Common Technical Standards"
 aus_mult_gdvp_promise_1_desc:0 "The technical colleges of Vienna, Prague and Graz recognise each other's diplomas, and the country's factories adopt a single drawing standard."
 aus_mult_gdvp_promise_2:0 "The Industrialists' Association"
 aus_mult_gdvp_promise_2_desc:0 "Industrialists from northern Bohemia and Styria form an association, and the government offers subsidised loans for their mines and mills."
 aus_mult_first_verdict:0 "The First Federal Precedent"
 aus_mult_first_verdict_desc:0 "The Supreme Administrative Court heard a railway clerk who had been passed over for promotion because he did not speak German. The court found for him. The judgement ran to two pages, and every newspaper in the land printed it in full."
 KRAUS_mult_gdvp_industry_bonus:0 "Common Technical Standards"
 KRAUS_mult_rural_relief_tt:0 "All former crownland states that are not yet our cores gain §Y+5 compliance§!."
 KRAUS_mult_open_claims_tt:0 "The governing party may table its two demands in parliament (only the governing party's pair of focuses is shown)."
 aus_mult_defense_prep:0 "Joint Mobilisation Plan"
 aus_mult_defense_prep_desc:0 "The General Staff and the crownland district commands draw up a joint mobilisation plan: which battalions assemble within three days, which depots open within twelve hours."
 aus_mult_skoda_relocate:0 "Skoda's Reserve Works"
 aus_mult_skoda_relocate_desc:0 "Copies of the Skoda and Steyr drawings and dies are stored in new workshops in the Upper Austrian hills. When war comes, Pilsen need not be the only place that can make guns."
 aus_mult_officer_corps:0 "Common Regulations"
 aus_mult_officer_corps_desc:0 "The Ludovika Academy and Wiener Neustadt adopt the same manuals. Hungarian officers and Czech staff men stand over the same sand table for the first time."
 aus_mult_auth_prague:0 "The Prague Industrial Committee"
 aus_mult_auth_prague_desc:0 "Military orders are allocated by a committee of Prague industrialists. The cabinet sets the quantities and the deadlines; which works gets which batch is the committee's affair."
 aus_mult_auth_ludovika_fiume:0 "The Budapest and Fiume Defence Offices"
 aus_mult_auth_ludovika_fiume_desc:0 "The defence of the Hungarian plain goes to Budapest, the Adriatic coast to Fiume. Each trains its own troops and sends Vienna the same returns."
 aus_mult_fort_line:0 "Frontier Fortresses"
 aus_mult_fort_line_desc:0 "The old forts of the Sudetes, the Carpathian passes and Istria are surveyed afresh. Engineers strengthen them to one set of plans, starting with the stretches on the border."
 KRAUS_mult_autopick_econ_tt:0 "Every §Y90§! days from now on, the committee completes one §Yjoint economic§! focus whose prerequisites are met, and we receive its reward."
 KRAUS_mult_autopick_mil_tt:0 "Every §Y90§! days from now on, the defence offices complete one §Yjoint military§! focus (or a prerequisite it needs) whose prerequisites are met, and we receive its reward; they will not pick between mutually exclusive paths for us."
 aus_war_entry:0 "State of War"
 aus_war_entry_desc:0 "War has broken out in Europe. The cabinet declares a state of war, and parliament grants the government emergency powers until a peace is signed."
 aus_war_arms_conversion:0 "Industrial Requisition"
 aus_war_arms_conversion_desc:0 "The civilian factories' order books are taken away and replaced with the quartermaster's. Canneries make shell casings; truck works make tractors."
 aus_war_mass_conscription:0 "The Call to All Nations"
 aus_war_mass_conscription_desc:0 "The call-up is printed in every language of the Empire. In the first week the queues outside the depots speak many tongues."
 aus_war_air_defense_sabotage:0 "Guarding Key Points"
 aus_war_air_defense_sabotage_desc:0 "Anti-aircraft guns and gendarme posts guard the Danube bridges and the marshalling yards. The cities black out at night."
 aus_war_multinational_mobilization:0 "Mobilisation Committees"
 aus_war_multinational_mobilization_desc:0 "Every crownland sets up a mobilisation committee staffed by locals. Registration, medicals and training manuals are all in the local language."
 aus_war_evacuate_industry:0 "Moving the Factories"
 aus_war_evacuate_industry_desc:0 "Machinery in the border districts is dismantled and sent by rail to the Alps. What cannot be moved, the engineers deal with before they leave."
 aus_war_rationing:0 "Wartime Rationing"
 aus_war_rationing_desc:0 "Uniform bread and coal coupons are issued nationwide. Prices are set by the control office, and hoarders answer to the military courts."
 aus_war_supreme_command:0 "The Supreme Defence Council"
 aus_war_supreme_command_desc:0 "The Emperor convenes a Supreme Defence Council of army and navy commanders and crownland delegates. From now on the decisions of the war are made there."
 KRAUS_mult_dec_wachau:0 "The Wachau Power Station"
 KRAUS_mult_dec_wachau_desc:0 "Dam the Wachau stretch of the Danube and enlarge the power station to supply the factories of Lower Austria."
 KRAUS_mult_dec_wachau_tt:0 "Lower Austria gains §Y1§! civilian factory and §Y+5% construction speed§! (lost if the state changes hands)."
 KRAUS_mult_dec_budapest:0 "The Budapest River Port"
 KRAUS_mult_dec_budapest_desc:0 "Dredge the Budapest channel and enlarge the deep-water berths and the marshalling yard."
 KRAUS_mult_dec_budapest_tt:0 "Central Hungary gains §Y1§! level of infrastructure and §Y1§! building slot."
 KRAUS_mult_dec_iron_gate:0 "Clearing the Iron Gates"
 KRAUS_mult_dec_iron_gate_desc:0 "Blast the reefs of the Iron Gates and widen the main channel, so that barges no longer lighten their loads to pass."
 KRAUS_mult_dec_iron_gate_tt:0 "§YConsumer goods -2%§! nationwide (permanent)."
 KRAUS_mult_dec_bohemia_boom:0 "Orders for Bohemia"
 KRAUS_mult_dec_bohemia_boom_desc:0 "The Treasury and the Ministry of Industry place a round of orders, with credit, with Bohemia's engineering, chemical and arms firms."
 KRAUS_mult_dec_bohemia_boom_tt:0 "§YFactory output +15%§! for §Y180§! days; can be taken again every 180 days."
 KRAUS_mult_dec_galicia_boom:0 "Public Works in Galicia"
 KRAUS_mult_dec_galicia_boom_desc:0 "The revenue of integration is put into Galicia's roads, bridges and workshops."
 KRAUS_mult_dec_galicia_boom_tt:0 "Galician states gain §Y+15% construction speed§! (180 days), and we gain §Y2§! offsite civilian factories; can be taken again every 180 days."
 KRAUS_mult_dec_doleance:0 "Grants for the Volunteer Societies"
 KRAUS_mult_dec_doleance_desc:0 "Pay grants to the volunteer societies and veterans' associations in return for their reporting first when mobilisation comes."
 KRAUS_mult_dec_doleance_tt:0 "§YMobilisation speed +15%§! (90 days) and §Y15000§! manpower at once; can be taken again every 180 days."
 KRAUS_mult_dec_iron_gate_spirit:0 "The Iron Gates Channel"
 KRAUS_mult_dec_iron_gate_spirit_desc:0 "Barges pass the Iron Gates fully laden."
 KRAUS_mult_dec_bohemia_boom_spirit:0 "Orders for Bohemia"
 KRAUS_mult_dec_bohemia_boom_spirit_desc:0 "Bohemia's factories are fully booked."
 KRAUS_mult_dec_doleance_spirit:0 "Grants for the Volunteer Societies"
 KRAUS_mult_dec_doleance_spirit_desc:0 "The volunteer societies have been paid."
 KRAUS_mult_dm_wachau:0 "Wachau Power Station"
 KRAUS_mult_dm_galicia:0 "Public Works in Galicia"
 KRAUS_mult.3.t:0 "The Judgement at the Palace of Justice"
 KRAUS_mult.3.d:0 "The case itself was simple. A railway clerk who had worked eleven years in Brünn had three times been left off the promotion list, each time for the same reason: he had not passed the German examination. He took the railway administration to the Supreme Administrative Court.\n\nCounsel for the administration said this had been the custom of the imperial railways for years. Counsel for the plaintiff simply read out one article of the Charter.\n\nThe court took forty minutes to read its judgement: custom cannot stand above the Charter, and the administration must repay the allowances it withheld. The judgement ran to two pages. The next day the papers of Vienna, Prague, Lemberg and Agram printed it in full."
 KRAUS_mult.3.a:0 "The court has spoken."
 KRAUS_mult.4.t:0 "The Danube Is Open"
 KRAUS_mult.4.d:0 "The first joint convoy left Linz at dawn, its barges carrying machine tools, bearings and wheat from the Banat. It passed Vienna, Pressburg and Budapest, and at the Iron Gates it did not stop to lighten its load.\n\nFor twenty years this river had seven tariffs, four sets of navigation rules and more shallows than anyone could count. Most of them are gone now. The chambers of commerce along the banks sent their congratulations to Vienna; the dockers were more interested in when the next boat would come."
 KRAUS_mult.4.a:0 "Keep the boats moving."
 KRAUS_mult_evt_verdict:0 "The Judgement at the Palace of Justice"
 KRAUS_mult_evt_verdict_desc:0 "The ministries' customs must now answer to the Charter."
 KRAUS_mult_evt_danube:0 "The Danube Is Open"
 KRAUS_mult_evt_danube_desc:0 "Convoys can run straight from Linz to the Black Sea."
 # --- 10-27 federalisation: clearing the debts, and what comes after ---
 KRAUS_mult.5.t:0 "The First Sitting of the State Diets"
 KRAUS_mult.5.d:0 "Every state diet met for the first time in the same week, and every one had the same first item on its agenda: in which language should the minutes be kept?\n\nThe Ministry of the Interior's view was simple: keep them in German and let each state translate, so that the ministries in Vienna can read them and business moves quickly. The deputies of the states answered that if the federation holds all its peoples equal, a state diet should keep its minutes in the state's own language, with a German copy attached.\n\nEither way will work. They simply cost in different places."
 KRAUS_mult.5.a:0 "The minutes will be kept in German."
 KRAUS_mult.5.b:0 "Each state keeps its minutes in its own language."
 KRAUS_fed_lang_german:0 "Minutes in German"
 KRAUS_fed_lang_german_desc:0 "Business moves quickly, though the states' deputies are not pleased."
 KRAUS_fed_lang_many:0 "Minutes in Many Languages"
 KRAUS_fed_lang_many_desc:0 "The states' deputies are satisfied; Vienna's translation office has twice the work."
