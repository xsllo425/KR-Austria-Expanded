l_english:
 KRAUS_integ_start_fast_tt:0 "§YFast integration§!: shorter and costlier; the 'Local Grievances' that follow are heavier (3 steps)."
 KRAUS_integ_start_slow_tt:0 "§YCareful integration§!: longer and cheaper; lighter grievances (2 steps) and a stronger Crownland spirit once settled."
 KRAUS_cg_diet_tt:0 "When finished, the 'Local Grievances' ease by one step."
 KRAUS_cg_tour_tt:0 "When finished, the 'Local Grievances' ease by one step."
 KRAUS_cg_diet_3:0 "Diet Hearings"
 KRAUS_cg_diet_3_desc:0 "The Imperial Diet hears the delegates of every crownland and society and amends what can be amended."
 KRAUS_cg_tour_3:0 "Imperial Tour of Reassurance"
 KRAUS_cg_tour_3_desc:0 "The Emperor appears in offices, schools and barracks so that officials and officers see Vienna has not forgotten them."
 KRAUS_cg_diet_2:0 "Diet Hearings"
 KRAUS_cg_diet_2_desc:0 "The Imperial Diet hears the delegates of every crownland and society and amends what can be amended."
 KRAUS_cg_tour_2:0 "Imperial Tour of Reassurance"
 KRAUS_cg_tour_2_desc:0 "The Emperor appears in offices, schools and barracks so that officials and officers see Vienna has not forgotten them."
 KRAUS_cg_diet_1:0 "Diet Hearings"
 KRAUS_cg_diet_1_desc:0 "The Imperial Diet hears the delegates of every crownland and society and amends what can be amended."
 KRAUS_cg_tour_1:0 "Imperial Tour of Reassurance"
 KRAUS_cg_tour_1_desc:0 "The Emperor appears in offices, schools and barracks so that officials and officers see Vienna has not forgotten them."
 KRAUS_cg_gov_3:0 "Local Grievances"
 KRAUS_cg_gov_2:0 "Local Grievances"
 KRAUS_cg_gov_1:0 "Local Grievances"
 KRAUS_cg_gov_3_desc:0 "With the crownland absorbed, the administration and every society are still being rearranged. Parliament or the Emperor must settle the grievances step by step."
 KRAUS_cg_gov_2_desc:0 "The reorganisation continues; the backlog has eased, but society still watches."
 KRAUS_cg_gov_1_desc:0 "Only the last ripples remain: a few offices still have to sort out staff and accounts."
 KRAUS_cr_CZE:0 "Bohemia Crownland"
 KRAUS_cr_CZE_desc:0 "Bohemia is now part of the Empire's registers."
 KRAUS_cr_CZE_s:0 "Bohemia Crownland (Mature)"
 KRAUS_cr_CZE_s_desc:0 "The integration of Bohemia went carefully and its dividend is larger."
 KRAUS_cg_CZE_3:0 "Bohemia Officials' Discontent"
 KRAUS_cg_CZE_3_desc:0 "Civil servants and officers in Bohemia resent the new arrangements and drag their feet."
 KRAUS_cg_reg_CZE_3:0 "Appease the Officials of Bohemia"
 KRAUS_cg_reg_CZE_3_desc:0 "Negotiate with the civil servants and officers of Bohemia, keep their posts and ranks and pay the overdue allowances."
 KRAUS_cg_CZE_2:0 "Bohemia Officials' Discontent"
 KRAUS_cg_CZE_2_desc:0 "Civil servants and officers in Bohemia resent the new arrangements and drag their feet."
 KRAUS_cg_reg_CZE_2:0 "Appease the Officials of Bohemia"
 KRAUS_cg_reg_CZE_2_desc:0 "Negotiate with the civil servants and officers of Bohemia, keep their posts and ranks and pay the overdue allowances."
 KRAUS_cg_CZE_1:0 "Bohemia Officials' Discontent"
 KRAUS_cg_CZE_1_desc:0 "Civil servants and officers in Bohemia resent the new arrangements and drag their feet."
 KRAUS_cg_reg_CZE_1:0 "Appease the Officials of Bohemia"
 KRAUS_cg_reg_CZE_1_desc:0 "Negotiate with the civil servants and officers of Bohemia, keep their posts and ranks and pay the overdue allowances."
 KRAUS_cg_reg_CZE_tt:0 "When finished, the discontent in Bohemia eases by one step; once the last step is gone the Crownland spirit takes effect."
 KRAUS_integ53_CZE_tt:0 "Bohemia receives its Crownland spirit."
 KRAUS_integ53.21.t:0 "Grievances in Bohemia Settled"
 KRAUS_integ53.21.d:0 "The offices of Bohemia finally use the same forms as Vienna and the officials' grievances have faded."
 KRAUS_integ53.21.a:0 "A good beginning."
