 KRAUS_bm_layer_start_NOT:0 "This cycle's timer has not started"
 KRAUS_bm_deadline_settled:0 "The deadline has been settled"
 KRAUS_bm_deadline_settled_NOT:0 "The deadline has not been settled"
 KRAUS_bm_deadline_reminded:0 "The negotiation reminder has been shown"
 KRAUS_bm_deadline_reminded_NOT:0 "The negotiation reminder has not been shown"

 # --- 期限系统其余旗标（条件提示会显示，故一并补 _NOT）---
 KRAUS_bm_dc320_reached:0 "The Danube negotiations have reached their closing event"
 KRAUS_bm_dc320_reached_NOT:0 "The Danube negotiations have not reached their closing event"
 KRAUS_bm_worst_snapshot:0 "Black Monday was at its heaviest stage when the deadline arrived"
 KRAUS_bm_worst_snapshot_NOT:0 "Black Monday was not at its heaviest stage when the deadline arrived"
