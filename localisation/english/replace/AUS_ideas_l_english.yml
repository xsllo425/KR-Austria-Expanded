l_english:
 aus_economic_crisis_2: "A Regionally Developing Economy"
 aus_economic_crisis_3: "A Balanced Imperial Economy"
 aus_military_weakness_2: "A United Empire, An Unreformed Army"
 aus_military_weakness_3: "A United Empire, An Unreformed Army"
 aus_political_instability_2: "The Balkan Powder Keg"
 aus_political_instability_3: "The Balkan Powder Keg"
 KRAUS_arms_trade_profits: "Arms Sold to Both Sides"
 KRAUS_arms_trade_profits_desc: "The wartime dividend of betting on both sides: factories at full capacity, treasury full."
 KRAUS_bata_industrial_cooperation: "Bata Industrial Cooperation"
 KRAUS_bata_industrial_cooperation_desc: "Tomas Bata brought the Zlin shoe empire into Vienna's industry. His assembly lines, standardised parts and global network were exactly what Austrian heavy industry lacked.\n\n§YThe shoemaker's son taught the Habsburg engineers something: efficiency is itself an industrial capability.§!"
 KRAUS_cep_final_heavy: "Austro-German Economic Community"
 KRAUS_cep_final_heavy_desc: "The Ruhr's chimneys rise in Vienna too. Steel, coal, machinery and armaments take the resources, and arms capacity climbs a step -- at the price of bare shelves.\n\n§YNot Austria joining Germany, nor Germany annexing Austria. Two countries on one balance sheet.§!"
 KRAUS_cep_final_infra: "Austro-German Economic Community"
 KRAUS_cep_final_infra_desc: "The Danube is dredged and the Southern Railway electrified, and Alpine ore reaches Prague cheaply at last. The end of this road is not a factory but a net across Central Europe.\n\n§YInfrastructure is the only productive capacity that never goes out of date.§!"
 KRAUS_cep_final_light: "Austro-German Economic Community"
 KRAUS_cep_final_light_desc: "Vienna's shelves are full, prices steady, the grumbling quieter -- meat on the workers' tables, new shoes for the children.\n\nThis road cannot become tanks, but it makes the Empire steady.\n\n§YA country with hungry people cannot win any war.§!"
 KRAUS_cep_germany_heavy: "Austro-German Economic Community"
 KRAUS_cep_germany_heavy_desc: "The Ruhr's capacity is wired to Austria's skilled labour: steel, coal, machinery and armaments scheduled to one table, German factories taking steady southern orders.\n\n§YMaking the pie bigger suits both sides.§!"
 KRAUS_cep_germany_infra: "Austro-German Economic Community"
 KRAUS_cep_germany_infra_desc: "Dredging the Danube and electrifying the Southern Railway let Austrian goods flow cheaply into Germany for the first time. Both countries share the network, and Berlin gains too -- only rather less than Vienna.\n\n§YThe dividend of infrastructure was never one country's to keep.§!"
 KRAUS_cep_germany_light: "Austro-German Economic Community"
 KRAUS_cep_germany_light_desc: "Austria puts its resources into living standards, and German consumer goods find a steady market. Vienna's shelves are full, Berlin's factories have orders.\n\n§YA stable neighbour is more useful than a hungry one.§!"
 KRAUS_common_army_reborn: "Rebirth of the Imperial Army"
 KRAUS_common_army_reborn_desc: "The old manual was challenged clause by clause through a full training cycle. Commanders coordinate by radio instead of drawing axes, and the armour is reorganised into independent units.\n\n§YAn army that fights together has replaced the one that had a little of everything.§!"
 KRAUS_common_prosperity_CRO: "Common Prosperity (Illyria)"
 KRAUS_common_prosperity_CRO_desc: "Vienna's and Illyria's factories share one set of standards, their railways join, and orders flow between them.\n\nThe Empire's prosperity no longer belongs to the capital alone."
 KRAUS_common_prosperity_CZE: "Common Prosperity (Bohemia)"
 KRAUS_common_prosperity_CZE_desc: "Vienna's and Bohemia's factories share one set of standards, their railways join, and orders flow between them.\n\nThe Empire's prosperity no longer belongs to the capital alone."
 KRAUS_common_prosperity_GAL: "Common Prosperity (Galicia-Lodomeria)"
 KRAUS_common_prosperity_GAL_desc: "Vienna's and Galicia's factories share one set of standards, their railways join, and orders flow between them.\n\nThe Empire's prosperity no longer belongs to the capital alone."
 KRAUS_common_prosperity_HUN: "Common Prosperity (Hungary)"
 KRAUS_common_prosperity_HUN_desc: "Vienna's and Hungary's factories share one set of standards, their railways join, and orders flow between them.\n\nThe Empire's prosperity no longer belongs to the capital alone."
 KRAUS_crown_harmony: "Harmonious Development of the Crown Lands"
 KRAUS_crown_harmony_desc: "The Crown Lands are no longer merely colours on a map. Bohemia delivers to Vienna's standards, Slovakia joins the trunk lines, and Hungarian grain rides to Trieste.\n\n§YThe Empire is no longer the sum of eleven grievances, but a place where people make money together.§!"
 KRAUS_eco_recovered: "Danubian Prosperity"
 KRAUS_eco_recovered_desc: "Idle capacity turns again: orders from Krupp, then from a Berlin railway company.\n\nWorkers are back at the benches. Vienna's shelves are full, prices steady, the grumbling quieter."
 KRAUS_german_brotherhood: "German Brotherhood"
 KRAUS_german_brotherhood_desc: "Berlin and Vienna have stopped scheming against each other.\n\nOne set of standards, one body of research, and newspapers that call each other not "allies" but "brothers".\n\n§YWhat is like one family was never only the royal houses.§!"
 KRAUS_german_capital_inflow: "German Capital Inflow"
 KRAUS_german_capital_inflow_desc: "German banks began lending to Austrian firms on fair terms: shares kept, management Austrian. The Germans want markets and raw materials, which Austria can supply.\n\n§YThe direction of capital sets the direction of politics: Vienna's cycle now runs with Berlin's.§!"
 KRAUS_german_economic_heavy: "Heavy Industry Path"
 KRAUS_german_economic_heavy_desc: "Steel, coal, machinery and armaments take the resources.\n\nChimneys grow, freight doubles, arms capacity rises -- at the price of consumer shortages.\n\n§YWar preparation first. The people's livelihood second.§!"
 KRAUS_german_economic_infrastructure: "Infrastructure Path"
 KRAUS_german_economic_infrastructure_desc: "Railways, roads, power stations, ports -- the money goes where you cannot see it. In the long run it pays best.\n\n§YInfrastructure is the only productive capacity that never goes out of date.§!"
 KRAUS_german_economic_light: "Light Industry Path"
 KRAUS_german_economic_light_desc: "Textiles, food and consumer goods take the resources.\n\nVienna's shelves are full, prices steady, the grumbling quieter. This road builds no tanks, but it makes the Empire steady.\n\n§YA country with hungry people cannot win any war.§!"
 KRAUS_german_industrial_standard_desc: "Production was reorganised from the ground up: shorter lead times, fewer defects, smoother handovers. The engineers understood at last why German factories outproduced Austrian ones.\n\n§YEfficiency can be learned -- but only if you admit you are behind.§!"
 KRAUS_german_military_armor: "Armour First"
 KRAUS_german_military_armor_desc: "The General Staff chose the armoured arm. Skoda began building tank chassis and the Tyrol grounds ran day and night; Germany gave blueprints, Austria gave capacity.\n\n§YConcentrate the armour, rather than scattering it among the infantry.§!"
 KRAUS_german_military_combined: "Broad Front"
 KRAUS_german_military_combined_desc: "The General Staff rejected a single-arm approach. Every arm formed one battle group on one rhythm -- demanding high training, and soldiers willing to answer for each other.\n\n§YExpensive. But such a force can win any battle between equals.§!"
 KRAUS_german_military_equipment: "Standardise on German Equipment"
 KRAUS_german_military_equipment_desc: "The calibres are unified.\n\nRifles, machine guns, artillery, ammunition -- all to German specification. Fewer logistics complaints, smoother supply, shorter training.\n\nThe price: §Ythe Austrian arsenal now grows out of the German supply chain.§!"
 KRAUS_german_military_infantry: "Infantry First"
 KRAUS_german_military_infantry_desc: "The General Staff chose infantry and artillery.\n\nManpower is abundant, industry is not: rather than hundreds of tanks, give every division enough guns and training.\n\n§YThe most rational choice available to a poor country.§!"
 KRAUS_refugee_labour: "Refugee Labour"
 KRAUS_refugee_labour_desc: "Refugees from the Balkans have filled the factories of Vienna and Lower Austria. Most have no papers and take any wage -- which delights the owners and enrages the unions.\n\n§GConstruction and mobilisation improve, but consumer supply is strained.§!"
 KRAUS_sanctioned_by_austria: "Austrian Sanctions"
 KRAUS_sanctioned_by_austria_desc: "Vienna has cut the credit, the shipping lanes and the orders. Without a shot, Belgrade's treasury empties and Bucharest's papers turn on their own government.\n\n§YSome wars do not need an army.§!"
 KRAUS_volunteer_act_idea: "Volunteer Act"
 KRAUS_volunteer_act_idea_desc: "The Empire lets serving officers fight abroad as "personal volunteers" -- unimpeachable, since the government never sent a soldier. But the Bulgarians soon saw them in Austrian uniform, answering Austrian commands, in numbers enough to fill a front."
 KRAUS_german_military_mission: "Theresian Military Academy"
 KRAUS_german_military_mission_desc: "Founded in 1751 by Maria Theresa at Wiener Neustadt, the Theresian Military Academy is the world's oldest. German instructors now fill its halls, and the curriculum has been rebuilt around fast, coordinated, decisive warfare."
 KRAUS_german_industrial_standard: "Preliminary Industrial Standardisation"
 aus_economic_crisis: "Economic Crisis"
 aus_economic_crisis_desc: "The Austrian economy is in ruins after the Great War: output collapsed, unemployment rampant, the treasury nearly empty. Recovery will need massive investment and structural reform."
 aus_political_instability: "Political Instability"
 aus_political_instability_desc: "Political factions are tearing Austria apart -- monarchists, socialists, nationalists, separatists, with no consensus possible. Government stability is at an all-time low."
 aus_military_weakness: "Military Weakness"
 aus_military_weakness_desc: "The once-proud Austro-Hungarian military is a shadow of itself: outdated equipment, low morale, and an officer corps divided by politics rather than doctrine."
 KRAUS_common_prosperity_SLO: "Common Prosperity (Slovakia)"
 KRAUS_common_prosperity_SLO_desc: "Vienna's and Slovakia's factories share one set of standards, their railways join, and orders flow between them."
 KRAUS_common_prosperity_TRS: "Common Prosperity (Transylvania)"
 KRAUS_common_prosperity_TRS_desc: "Vienna's and Transylvania's factories share one set of standards, their railways join, and orders flow between them."
