 ### Focus state rewards + economic programme -------------------------------------

 KRAUS_renner_economic_program:0 "The Big-Tent Economic Agreement"
 KRAUS_renner_economic_program_desc:0 "Renner wants recovery to become the shared business of his coalition. Cooperative credit, public procurement, and local investment go into one agreement that can be debated and audited, so workers, industry, and crownland delegates all see their stake. The Golden Danube Plan starts with home-country pilots and links to imperial construction; how far it goes depends on whether the coalition keeps paying the price."
 KRAUS_miklas_economic_program:0 "Economy of Order"
 KRAUS_miklas_economic_program_desc:0 "Miklas would restore production through honorable credit and clear responsibility. Parish networks, bargaining between employers and workers, and imperial endorsement all back the Golden Danube Plan. Order cannot mean mere obedience; contracts must be honored and localities included. Moving from home-country works to imperial construction, the government must prove the method serves more than Vienna."
 KRAUS_econ_program_dm_tt: "§YThe economic programme.§!\n\nWhat the government has actually built, and what it intends to keep building.\n\n§G+5% political power, and factory output rising with every completed commitment.§!"


