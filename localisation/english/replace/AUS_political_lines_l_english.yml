 ### Emperor authority ---------------------------------------------------------
 KRAUS_imperial_authority_dm: "The Emperor's Authority"
 KRAUS_imperial_authority_dm_tt: "§YThe Crown's standing, accumulated and spent.§!\n\nAuthority is gathered from holding the balance, from surviving the crisis, and from keeping the Crownlands in the Empire. It is spent on acts only the Emperor can perform.\n\n§GCurrent authority: §Y[?AUS.KRAUS_imperial_authority]§! / 100§!\n\n§GAt 100 authority: +10% stability, +10% political power, +10% war support.§!\n\n§RIt recovers slowly — roughly 5 per quarter, if nothing goes wrong.§!"
 KRAUS_ia_convoke_diet: "Convoke the Imperial Diet"
 KRAUS_ia_convoke_diet_desc: "The Emperor does not legislate. He convenes.\n\nBoth chambers, in one room, with the Crown present and listening. Nothing is decided — but a great deal is understood, and the men who were shouting in the corridors come back to the table.\n\n§YCosts 25 authority.§!"
 KRAUS_ia_convoke_diet_tt: "§G+30§! political power, §G+3%§! stability"
 KRAUS_ia_imperial_honours: "Imperial Honours"
 KRAUS_ia_imperial_honours_desc: "Decorations, titles, and the small courtesies that cost the Crown nothing but its attention.\n\nThey are handed out where they will do the most good — and received by men who will remember who gave them.\n\n§YCosts 15 authority.§!"
 KRAUS_ia_imperial_honours_tt: "§G+2%§! war support, §G+1§! army experience"
 KRAUS_ia_royal_reserves: "Draw on the Royal Reserves"
 KRAUS_ia_royal_reserves_desc: "The Habsburg private fortune is not the state's. It is, however, available — for a price that will not be paid in money.\n\n§RIt costs half of everything the Crown has built up.§! Spend it now, and the Crown will be visible as diminished for a very long time.\n\n§YCosts 50 authority.§!"
 KRAUS_ia_royal_reserves_tt: "§G+50§! political power"
 KRAUS_dm_renner_victory: "Social Reform Dividend"
 KRAUS_dm_miklas_victory: "Order Dividend"


 ### Crown and Order - rebuilt as a single accumulating value -------------------
 KRAUS_catholic_order_decisions: "The Crown and Order"
 KRAUS_catholic_order_decisions_desc: "Decrees only a Catholic order can justify — and only a Catholic order must pay for."


 ### Decisions -----------------------------------------------------------------
 KRAUS_order_decree_in_emergency: "Govern by Emergency Decree"
 KRAUS_order_decree_in_emergency_desc: "The Cabinet can do what the Parliament will not. It is legal in the narrow sense, and it is the exact method Renner spent thirty years arguing the Empire could not survive.\n\nThe cost is paid in political capital — and paid again, every time we do it."
 KRAUS_order_suppress_press: "Suppress the Hostile Press"
 KRAUS_order_suppress_press_desc: "Papers that will not print the truth will not print at all.\n\nThe streets will notice. They always do."
 KRAUS_order_church_schools: "Expand the Church Schools"
 KRAUS_order_church_schools_desc: "The parish school is the cheapest instrument of order the Empire has ever possessed.\n\nIt is also slow, and while the schools are being built, the crisis is not."
 KRAUS_order_seize_industry: "Seize Industrial Capacity"
 KRAUS_order_seize_industry_desc: "The state takes a plant, and puts it to state purposes.\n\nOne factory will not be there afterwards. That is not a metaphor."
 KRAUS_order_state_of_emergency: "Declare a State of Emergency"
 KRAUS_order_state_of_emergency_desc: "Suspend, arrest, requisition, and govern alone — openly, and with the Emperor's signature on it.\n\n§RIt will be expensive, and it will be remembered.§!"

