 # --- 1936 election flavour + Renner tent focuses (2026-09-21) ---
 KRAUS_renner_tent_1:0 "Prague Industrial Roundtable"
 KRAUS_renner_tent_1_desc:0 "Bohemian industry holds the keys to jobs, orders, and local finances, and to whether the coalition can cross national lines. Renner invites it into governing talks, trading continued investment and steady cooperation for support. Industry will not drop its demands; the government must give it a channel to raise them and hold it responsible for shared plans. A roundtable means consultation, not obedience."
 KRAUS_renner_tent_2:0 "Soothing Vienna and the Army"
 KRAUS_renner_tent_2_desc:0 "Officers and officials fear the empire is dissolving around them, while Vienna's wage earners dread bearing the cost of recovery. The government answers both with budget guarantees, army funding, and pledges to civil servants, saying plainly what can be met now and what must wait. Soothing is not bribery; it assures these forces the center still coordinates and has not abandoned order."
 KRAUS_renner_tent_3:0 "The Big Tent Holds"
 KRAUS_renner_tent_3_desc:0 "Industry, regional delegates, and the coalition's factions finally find a way to keep working together. The cabinet can turn from mutual probing to the recovery still unfinished, but the disagreements do not vanish. Renner means to keep a coalition that keeps negotiating, not a permanently united camp. The big tent holds for now; budgets and building will keep testing it."

 KRAUS_election_flavor.1.t: "The Streets of the Capital"
 KRAUS_election_flavor.1.d: "The queues outside the labour exchanges are longer than the year before. In the workers' districts, men who had once been content to grumble are beginning to ask who is responsible."
 KRAUS_election_flavor.2.t: "A Word from the Pulpit"
 KRAUS_election_flavor.2.d: "The bishops have made their preference known, delicately. In the countryside and the smaller towns, that word still travels further than any newspaper."
 KRAUS_election_flavor.3.t: "The Hunting Party"
 KRAUS_election_flavor.3.d: "The Crown Prince's hunting party was meant to show the Empire's strength. Instead, the papers are full of the damage it caused — and of a hunting party that cost more than a village earns in a year.\n\nThe government must respond."
 KRAUS_election_flavor.3.a: "Defend the Court"
 KRAUS_election_flavor.3.b: "Acknowledge the Mishap"
 KRAUS_election_flavor.4.t: "Renner Speaks"
 KRAUS_election_flavor.4.d: "Karl Renner addresses the party congress. He speaks of the Empire as a house with many rooms, and of the duty of every room to keep the roof on. The workers listen, and so — carefully — do the shopkeepers."
 KRAUS_election_flavor.4.a: "Everyone keeps the roof on."
 KRAUS_election_flavor.5.t: "The Silence"
 KRAUS_election_flavor.5.d: "A scandal in the outgoing government has left the President with a decision. The politicians would have issued a statement before noon.\n\nMiklas has said nothing, and looks inclined to leave it that way."
 KRAUS_election_flavor.5.a: "He remains silent."
 KRAUS_election_flavor.5.b: "He speaks out."
