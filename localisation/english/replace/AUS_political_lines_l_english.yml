 # ===== KRAUS Political Lines: Renner + Miklas (2026-09-21) =====

 # --- entry focuses ---


 # --- Miklas order focuses ---
 KRAUS_miklas_order_1:0 "Emergency Decree"
 KRAUS_miklas_order_1_desc:0 "Miklas prepares emergency measures to tidy administration and social bargaining, forcing answers on stalled business. Supporters believe decisive action restores order; critics fear the government stepping past normal consultation. A decree shortens procedure but cannot erase resentment in execution, and may be challenged later. The government must state the limits of its authority and pay the political price now."
 KRAUS_miklas_order_2:0 "Guarding the Symbol"
 KRAUS_miklas_order_2_desc:0 "The red-white-red flies over the Hofburg again. In an age when everything is negotiable, the crown insists some symbols will not be surrendered, seeking a foothold for central authority. Holding the flag rallies some loyalties and makes autonomy-seekers warier. Symbols cannot replace budgets and contracts, but they lend public credibility to keeping promises."
 KRAUS_miklas_order_3:0 "The Price of Reorganization"
 KRAUS_miklas_order_3_desc:0 "Reorganisation finally reaches a civilian factory. When the closure order arrives, its owners demand reconsideration, workers ask where their next wage will come from, and even parish delegates loyal to the cabinet petition on their behalf. Miklas cannot merely report improved order while leaving others to bear the loss. He must publicly accept responsibility for the decision and face the divisions it will leave in his coalition and the locality."

