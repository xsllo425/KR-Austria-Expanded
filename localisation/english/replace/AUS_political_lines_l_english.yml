 # --- third pass: BM appearance event, settlement tooltips, flavour options ---
 KRAUS_black_monday_events.0.t: "The Black Monday Reaches Austria"
 KRAUS_black_monday_events.0.d: "When Black Monday struck Germany, it was only a matter of time before the storm crossed the border. Austria is among the first to be dragged under.\n\nThe Chancellery has opened an emergency ledger: §YReorganise the Imperial Economy§! is now available in the Decisions panel. Each stage of the ledger runs §Y110§! days — if its conditions are met and §Y90§! days have passed, it settles early and the crisis eases a stage; otherwise the crisis deepens by a stage when the time runs out."
 KRAUS_black_monday_events.0.a: "God help us."
 KRAUS_black_monday_events.3.t: "No Progress"
 KRAUS_black_monday_events.3.d: "The ledger has come due and nothing was entered in it. The measures that were supposed to soften the crisis were never taken, and the crisis has spread accordingly."
 KRAUS_black_monday_events.3.a: "We let it slip."
