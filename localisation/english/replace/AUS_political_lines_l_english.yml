 ### Crisis choices (Black Monday) -----------------------------------------------
 KRAUS_crisis_left_tt: "§GThe left is satisfied.§! The right will not forget this."
 KRAUS_crisis_right_tt: "§GThe right is satisfied.§! The left will not forget this."
 KRAUS_crisis_choices.1.t: "A Run on the Banks"
 KRAUS_crisis_choices.1.d: "The Kreditanstalt's doors opened to a queue that stretched around the block, and the queue has not shortened since.\n\nThe left demands the state take the banks outright. The right demands the state merely guarantee what is in them. Both will cost money we do not have."
 KRAUS_crisis_choices.1.a: "Nationalise the banks."
 KRAUS_crisis_choices.1.b: "Guarantee the deposits."
 KRAUS_crisis_choices.2.t: "The Unemployed March"
 KRAUS_crisis_choices.2.d: "They came down the Ringstrasse in their thousands, and they were orderly, and that was somehow worse.\n\nOne wing wants relief widened, whatever it costs. The other wants the budget cut, whatever it costs. Neither of them is wrong about the arithmetic and both of them are wrong about the country."
 KRAUS_crisis_choices.2.a: "Widen relief."
 KRAUS_crisis_choices.2.b: "Cut the budget."
 KRAUS_crisis_choices.3.t: "The Countryside Fails"
 KRAUS_crisis_choices.3.d: "The harvest was poor, the mortgages were not, and the smallholders have begun to write letters that the Ministry of Agriculture has stopped answering.\n\nLand reform would answer the letters. Subsidies would answer the mortgages. There is money for one."
 KRAUS_crisis_choices.3.a: "Land reform."
 KRAUS_crisis_choices.3.b: "Farm subsidies."
 KRAUS_crisis_choices.4.t: "General Strike"
 KRAUS_crisis_choices.4.d: "The railways have stopped. The trams have stopped. The printers have stopped, which means that within a day nobody will know what is happening anywhere.\n\nThe government must decide, quickly, what kind of state it is."
 KRAUS_crisis_choices.4.a: "Recognise the unions."
 KRAUS_crisis_choices.4.b: "Send in the army."

