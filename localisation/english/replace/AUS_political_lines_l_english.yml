 # ===== Leader introductions (2026-09-21 sixth pass) =====
 KRAUS_leader_intro.1.t: "Karl Renner"
 KRAUS_leader_intro.1.d: "The man who is spoken of whenever the Social Democrats need a government formed is Karl Renner.\n\nHe has done this before. In 1918, when the Monarchy came apart and nobody knew what would replace it, it was Renner who held the pieces together — not by force, but by refusing to let any one nation be treated as the enemy. He did not save the Empire then. He saved the possibility of one, and he has spent every year since arguing that the same trick can be worked twice.\n\nHe leads the §YSocial Democratic Workers' Party of Austria§! — the party of the industrial workers, of the trade unions, of the great cities. To the conservatives of Vienna he is a revolutionary biding his time. To the radicals of his own party he is a man who has compromised too often.\n\nHe calls his method the §YGreater Tent§!: hold everyone inside, satisfy no one entirely, and the structure stands."
 KRAUS_leader_intro.1.a: "A man with a method."

 KRAUS_leader_intro.2.t: "Wilhelm Miklas"
 KRAUS_leader_intro.2.d: "Where Renner builds, Wilhelm Miklas guards.\n\nThe son of a postman, a schoolmaster by training and the father of twelve, Miklas has one conviction and has never traded it: Catholic Austria must survive the modern age. He is not a man of grand designs. He is a man of one line, drawn once, that he will not cross.\n\nHe leads the §YChristian Social Party§! — the party of the Church, the countryside, the small towns and the Catholic middle class; the party that has governed Austria more often than any other, and that regards the Social Democrats as the standing threat to everything it exists to protect.\n\nHe knows what is being done in his name is not entirely constitutional. He has said so — in his own hand, in his private diary, at length, and late at night. In public he says nothing at all. Those who know him understand that both halves of that are true, and that the second half is the one that matters."
 KRAUS_leader_intro.2.a: "A man with one line."

 KRAUS_leader_intro.3.t: "The Emperor's Balance"
 KRAUS_leader_intro.3.d: "Two men, two parties, two entirely different ideas of what Austria is for — and between them, the Emperor.\n\nKarl is not the author of either programme. He is the reason neither programme can be carried out alone. Renner commands the cities and the trade unions; Miklas commands the Church and the countryside. If either were to prevail completely, the Empire would have to become something else entirely — and there is no other thing it could become that would hold.\n\nSo the Crown does what Crowns have always done in Austria: it holds the centre. It gives each side just enough to keep them at the table, and denies each side just enough to keep them from leaving it.\n\nThe 1936 election will decide which of them forms a government. It will not decide which of them is right — and it will not free the Emperor from the work of balancing between them.\n\n§YFrom the next election onward, the Empire's Balance will appear in the Balance of Power panel. Keep the two camps in rough equilibrium and the Empire holds; let either one run unchecked, and the centre will not survive it.§!"
 KRAUS_leader_intro.3.a: "The centre holds — for now."

 # --- Miklas victory choice ---
 KRAUS_leader_intro.10.t: "The Christian Social Government"
 KRAUS_leader_intro.10.d: "Miklas has formed a government, with the Christian Social Party at its head and the authoritarian democrats of the right brought in beside it — order requires allies, and he has taken the ones who will not hinder it.\n\nThere is now an argument within the government about where Austria's future should be anchored. The German connection offers both rifles and factories. It cannot offer both at once."
 KRAUS_leader_intro.10.a: "Rifles first."
 KRAUS_leader_intro.10.b: "Factories first."
 KRAUS_intro10_mil_tt: "§YGerman-Austrian Military Co-operation§! — the military branch of the Berlin-Vienna line has its focus completion time reduced (by up to §G14 days§! per focus)."
 KRAUS_intro10_eco_tt: "§YGerman-Austrian Economic Co-operation§! — the economic branch of the Berlin-Vienna line has its focus completion time reduced (by up to §G14 days§! per focus)."

 # --- Renner victory ---
 KRAUS_leader_intro.11.t: "The Greater Tent Government"
 KRAUS_leader_intro.11.d: "Renner has formed a government, and has done it in the only way he knows: by bringing in more people than strictly necessary. The Social Democrats hold the offices; the radical socialists have been given a hearing rather than a grievance; and enough of the centre has been persuaded that the tent is large enough to stand in.\n\nHe has also turned to the Crown — the part of Austria's politics that is not a party at all. With the Emperor's weight behind the arrangement, the crownlands and the nations of the Empire can be held to a settlement rather than driven to a rupture.\n\n§YThe crown focuses below 'The Weight of the Crown' have their completion time reduced.§!"
 KRAUS_leader_intro.11.a: "Everyone keeps the roof on."
 KRAUS_intro11_tt: "§YThe Greater Tent§! — the §YCrown§! branch has its focus completion time reduced (by up to §G14 days§! per focus). A broad governing coalition is formed."
 # ===== Rewritten KR election events (2026-09-21 sixth pass) =====
 austria_election_events.1.t: "The Austrian Elections of 1936"
 austria_election_events.1.d: "Since the Compromise of 1867, the \"Austrian question\" has been settled in the German-speaking half of the Empire — and for most of that time, the answer has been given by one of two parties. The Christian Social Party speaks for the Church, the countryside and the Catholic middle class, and has governed Austria more often than any other. The Social Democratic Workers' Party speaks for the industrial workers, the trade unions and the great cities, and regards the Christian Socials as the standing obstacle to everything it wants.\n\nOn the economy the two parties do not merely differ — they are opposites. The Social Democrats would meet the crisis with unemployment relief, public works and the weight of the state thrown behind the worker. The Christian Socials would meet it with austerity: cuts, a balanced ledger, and the conviction that a state which spends beyond its means is a state which will shortly cease to exist.\n\nThe Emperor has not endorsed either programme. He has, however, made it known that whoever forms the next government will not form it alone. The balance between these two camps is now something the Crown considers its own business.\n\n§YThe election will decide who governs Austria. It will not decide who is right.§!"
 austria_election_events.1.a: "It is for the people to decide."

 austria_election_events.3.t: "Adler Denounces the SDAP"
 austria_election_events.3.d: "Friedrich Adler — son of Victor Adler, the founding father of the party — is a Radical Socialist best remembered for having shot the Minister-President in 1916 in protest against the Weltkrieg. He has not mellowed with the years.\n\nBefore the party congress he denounces the SDAP in terms that could have come from the other side of the chamber: that it has become \"the kind of socialism that exists to serve the establishment\" — that it negotiates, and compromises, and tempers, until nothing is left of the idea but the word.\n\nHalf the congress applauds. The other half does not. Adler's following is small, loud, and entirely sincere."
 austria_election_events.3.a: "Radicals will be radicals."
 austria_election_events.3.a_tt: "Radical Socialism support: §G+2.50%§! — Adler is left to his own devices."
 austria_election_events.3.b: "Offer Adler an understanding."
 austria_election_events.3.b_tt: "Social Democracy support: §G+2.00%§!"
 austria_election_events.3.b2_tt: "Radical Socialism support: §G+1.00%§! — and they will remember the offer."

 austria_election_events.7.t: "An Understanding on the Left"
 austria_election_events.7.d: "The talks were quiet, and short, and held in a room with no press outside it.\n\nNothing was conceded in public. What was agreed was this: that Adler's radicals would not spend the election attacking the party from the left, and that if the Social Democrats formed the next government, they would not be formed without a place for the left that had criticized them.\n\nAdler left without shaking hands. He also left without denouncing anyone."
 austria_election_events.7.a: "A place at the table."
 austria_election_events.7.a_tt: "Social Democracy support: §G+2.00%§! — the left has been rallied rather than split."

 ### Balance of Power — decisions -------------------------------------------
 KRAUS_bop_crown_arbitration: "Crown Arbitration"
 KRAUS_bop_crown_arbitration_desc: "Neither man will come to the Hofburg on his own. Both will come if the Emperor sends for them.\n\nThe Crown does not rule — it holds. Summon the two of them, put them in the same room, and remind them what happens to Austria if either of them wins outright."
 KRAUS_bop_renner_rally: "A Rally of the Party"
 KRAUS_bop_renner_rally_desc: "The Social Democratic Workers’ Party can still put a hundred thousand people on the Ringstrasse in an afternoon.\n\nIt costs nothing but order. Vienna will not be quiet for a week — but nobody in the Hofburg will be in any doubt about who speaks for the workers of Austria."
 KRAUS_bop_miklas_decree: "Governing by Decree"
 KRAUS_bop_miklas_decree_desc: "The Cabinet can be made to do what the Parliament will not.\n\nIt is legal, in the narrow sense. It is also the exact method Karl Renner spent thirty years arguing the Empire could not survive.\n\n§YOrder for 180 days — and a debt that outlives them.§!"
 KRAUS_bop_imperial_audience: "An Audience with the Emperor"
 KRAUS_bop_imperial_audience_desc: "The Emperor has been reading the papers, and has noticed which way the wind is blowing.\n\nHe will receive the leader who has been gaining ground. He will be gracious. He will say almost nothing. And the man will leave having understood that the Crown is watching, and has not yet decided to be pleased."
