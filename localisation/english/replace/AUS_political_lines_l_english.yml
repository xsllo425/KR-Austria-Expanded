 # --- Renner events ---
 KRAUS_renner_events.1.t: "The Greater Tent Holds"
 KRAUS_renner_events.1.d: "For now, the arrangement is working. The Czech industrialists have their autonomy, the Hungarians have their language rights, and the army still answers to a single staff. Nobody is entirely happy, which is the closest thing to success this Empire has ever managed."
 KRAUS_renner_events.1.a: "Everyone is inside."
 KRAUS_renner_events.2.t: "The Crownlands Move Alone"
 KRAUS_renner_events.2.d: "The balance has swung too far toward the periphery. Prague and Budapest have begun to act as though Vienna need not be consulted — and once that idea takes hold, it is very hard to put back."
 KRAUS_renner_events.2.a: "We are losing them."
 KRAUS_renner_events.3.t: "This Is Not a Greater Tent"
 KRAUS_renner_events.3.d: "The balance has swung too far toward Vienna. The crownlands are still nominally inside the tent, but they are no longer pretending to be content — and a tent nobody wants to stand in is just a roof."
 KRAUS_renner_events.3.a: "We held it too tightly."
 KRAUS_renner_events.10.t: "Renner Forms a Government"
 KRAUS_renner_events.10.d: "Karl Renner accepts the task of government. His first act is to announce that henceforth the Empire will be balanced between the centre and the nations — and that the balance itself is the policy.\n\nHis critics call it indecision. He calls it the only thing that has ever worked."
 KRAUS_renner_events.10.a: "We will all be in this together."

 # --- Miklas events ---
 KRAUS_miklas_events.1.t:0 "The Price of Reorganization"
 KRAUS_miklas_events.1.d:0 "Reorganisation finally reaches a civilian factory. When the closure order arrives, its owners demand reconsideration, workers ask where their next wage will come from, and even parish delegates loyal to the cabinet petition on their behalf. Miklas cannot merely report improved order while leaving others to bear the loss. He must publicly accept responsibility for the decision and face the divisions it will leave in his coalition and the locality."
 KRAUS_miklas_events.1.a:0 "We answer for this decision."
 KRAUS_miklas_events.2.t: "Emergency Decrees"
 KRAUS_miklas_events.2.d: "The government has issued another batch of decrees under the emergency powers. Order improves measurably within the week.\n\nIn the corridors, someone remarks that the Republic is now governed by pen and not by parliament — and that it is working better."
 KRAUS_miklas_events.2.a: "Order first."
 KRAUS_miklas_events.3.t: "The Red-White-Red"
 KRAUS_miklas_events.3.d: "The old banners are hoisted over the Hofburg. There is nothing practical about it; flags do not feed anyone.\n\nBut across the Empire, men who had begun to doubt whether Austria meant anything at all look up at it, and are quiet."
 KRAUS_miklas_events.3.a: "A flag is not nothing."
 KRAUS_miklas_events.10.t: "Miklas Takes the Helm"
 KRAUS_miklas_events.10.d: "Wilhelm Miklas assumes responsibility for the government. His programme is short: the Catholic character of Austria will be preserved, whatever it costs.\n\nThose who know him understand that the second half of that sentence — whatever it costs — is not a figure of speech."
 KRAUS_miklas_events.10.a: "Whatever it costs."
 KRAUS_miklas_events.20.t: "The Legitimacy Crisis"
 KRAUS_miklas_events.20.d: "He succeeded. The Catholic order is secured, and the state has never been steadier.\n\nBut to secure it he governed without the constitution for three years, and the constitution did not survive the experience. The Empire is orderly. The Empire is no longer legitimate. In the salons of Vienna, men who were once fringe have begun to be invited to dinner."
 KRAUS_miklas_events.20.a: "He saved the order. He lost the Empire."

