############################################################
### 全球民主化运动 · 决议与类目（2026-09-24）
############################################################

KRAUS_global_democratisation: "Global Democratisation"
KRAUS_global_democratisation_desc: "The wars did not end when ours did. Somewhere out there, two governments are still spending their children on a border neither of them can explain.\n\nVienna has no territory to gain from any of it. That is precisely why Vienna can be the one to walk into the room.\n\n§YWe are not the world's policeman. We are the world's witness - and witnesses are harder to ignore.§!"

KRAUS_mediate_war: "Offer Austrian Mediation"
KRAUS_mediate_war_desc: "Send a delegation to the warring parties with a single proposal: stop, and keep what you hold. Nothing is taken, nothing is restored, nothing is avenged. The line where the guns stopped becomes the border.\n\nIt is a proposal almost no one accepts while they still believe they can win.\n\n§YThe offer costs us only the price of a train ticket. The refusal costs them everything.§!"
