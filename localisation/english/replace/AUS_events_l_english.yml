l_english:
 KRAUS_balkan_events.1.a_tt: "§GWe will send a military advisory mission to Sofia.§!"
 KRAUS_balkan_events.41.a: "Let them grow rich."
 KRAUS_balkan_events.41.d: "The gunfire has stopped.\n\nBarges load grain on the Sava again, and Vienna's owners issue badges to new hands. The economists call it "Danubian Prosperity" -- they do not say it is brittle enough for one shell to shatter."
 KRAUS_balkan_events.41.t: "Danubian Prosperity"
 KRAUS_balkan_events.50.a: "Let Sofia pay (Bulgaria receives 1 civilian factory)"
 KRAUS_balkan_events.50.b: "Austria bears it alone (both civilian factories go to Austria)"
 KRAUS_balkan_events.50.d: "The machinery is dismantled, but the bill is not settled.\n\nWord comes from Sofia: they will shoulder part of the cost -- at the price of one machine staying in Bulgaria. The quartermaster pushes two sheets across to you and waits."
 KRAUS_balkan_events.50.t: "Who Foots This Bill?"
 KRAUS_court_events.10.a_tt: "§GWe will conciliate Bohemia, Slovakia and Hungary at once, holding the Crown Lands together.§!"
 KRAUS_court_events.14.cro: "Illyria -- the Adriatic ports"
 KRAUS_court_events.14.cze: "Bohemia -- factories and coal"
 KRAUS_court_events.14.d: "The agreement is signed, but only one pilot project can be chosen.\n\nBohemia has coal and machines, Illyria ports, Galicia oil, Hungary grain. Each fits; each is limited.\n\n"Choose one," the Emperor said. "Make the books look good. The rest will come asking to join.""
 KRAUS_court_events.14.gal: "Galicia -- oil and granary"
 KRAUS_court_events.14.hun: "Hungary -- plains and workers"
 KRAUS_court_events.14.t: "Imperial Coordinated Development Agreement"
 KRAUS_crisis_events.4_hun: "Hungary -- ally across the Danube"
 KRAUS_greece_events.1.a: ""A neighbour who does not even dare to nationalise can be talked to.""
 KRAUS_greece_events.1.a_tt: "§GGreece gains 50 political power and its opinion of Austria rises sharply.§!"
 KRAUS_greece_events.1.b: "Every man sweeps before his own door. We have no strength to spare for the Balkans."
 KRAUS_greece_events.1.d: "Athens' papers attacked "foreign capital" for three days, and parliament moved to nationalise the German and Austrian holdings.\n\nBut nothing happened. The Finance Minister suppressed the bill: §Y"We cannot afford the compensation. And once nationalised, who runs it?"§!\n\nIn Vienna the Emperor said: §Y"A neighbour who dares not nationalise can be talked to."§!"
 KRAUS_greece_events.1.t: "The Ledger by the Aegean"
 KRAUS_greece_helped_us: "Austria Aided Us in Our Hour of Need"
 KRAUS_greece_snubbed: "Austria Looked On Coldly"
 KRAUS_balkan_events.1.t: "KRAUS_balkan_events.1.t"
 KRAUS_balkan_events.1.d: "KRAUS_balkan_events.1.d"
 KRAUS_balkan_events.1.a: "\"No army to spare does not mean no men to spare.\""
 KRAUS_balkan_events.30.t: "KRAUS_balkan_events.30.t"
 KRAUS_balkan_events.30.d: "KRAUS_balkan_events.30.d"
 KRAUS_balkan_events.30.a: "\"Central Europe needs a voice.\""
 KRAUS_balkan_events.30.b: "Say nothing. Not worth the exposure."
 KRAUS_balkan_events.11.t: "KRAUS_balkan_events.11.t"
 KRAUS_balkan_events.11.d: "KRAUS_balkan_events.11.d"
 KRAUS_balkan_events.11.a: "\"We will not forget.\""
 KRAUS_balkan_events.12.t: "KRAUS_balkan_events.12.t"
 KRAUS_balkan_events.12.d: "KRAUS_balkan_events.12.d"
 KRAUS_balkan_events.12.a: "The situation has stabilised."
 KRAUS_balkan_events.40.t: "KRAUS_balkan_events.40.t"
 KRAUS_balkan_events.40.d: "KRAUS_balkan_events.40.d"
 KRAUS_balkan_events.40.a: "\"Prepare for the next one. This time we do not wait for them.\""
 KRAUS_balkan_events.31.t: "KRAUS_balkan_events.31.t"
 KRAUS_balkan_events.31.d: "KRAUS_balkan_events.31.d"
 KRAUS_balkan_events.31.a: "Put our name to it."
 KRAUS_balkan_events.31.b: "Bury it in a drawer."
 KRAUS_balkan_events.21.t: "KRAUS_balkan_events.21.t"
 KRAUS_balkan_events.21.d: "KRAUS_balkan_events.21.d"
 KRAUS_balkan_events.21.a: "\"Noted.\""
 KRAUS_balkan_events.20.t: "KRAUS_balkan_events.20.t"
 KRAUS_balkan_events.20.d: "KRAUS_balkan_events.20.d"
 KRAUS_balkan_events.20.a: "\"This is the Balkans' own affair.\""
 KRAUS_balkan_events.10.t: "KRAUS_balkan_events.10.t"
 KRAUS_balkan_events.10.d: "KRAUS_balkan_events.10.d"
 KRAUS_balkan_events.10.a: "Approve the plan."
 KRAUS_court_events.13.t: "KRAUS_court_events.13.t"
 KRAUS_court_events.13.d: "KRAUS_court_events.13.d"
 KRAUS_court_events.13.a: "Promise nothing, refuse nothing."
 KRAUS_court_events.2.t: "KRAUS_court_events.2.t"
 KRAUS_court_events.2.d: "KRAUS_court_events.2.d"
 KRAUS_court_events.2.a: "Keep the list safe."
 KRAUS_court_events.12.t: "KRAUS_court_events.12.t"
 KRAUS_court_events.12.d: "KRAUS_court_events.12.d"
 KRAUS_court_events.12.a: "\"The Austrians finally know our name.\""
 KRAUS_court_events.10.t: "KRAUS_court_events.10.t"
 KRAUS_court_events.10.d: "KRAUS_court_events.10.d"
 KRAUS_court_events.10.a: "Keep all three banners in the hall."
 KRAUS_court_events.3.t: "KRAUS_court_events.3.t"
 KRAUS_court_events.3.d: "KRAUS_court_events.3.d"
 KRAUS_court_events.3.a: "\"The politer they are, the more we should watch them.\""
 KRAUS_court_events.1.t: "KRAUS_court_events.1.t"
 KRAUS_court_events.1.d: "KRAUS_court_events.1.d"
 KRAUS_court_events.1.a: "\"At least they brought an abacus this time, not a bayonet.\""
 KRAUS_court_events.11.t: "KRAUS_court_events.11.t"
 KRAUS_court_events.11.d: "KRAUS_court_events.11.d"
 KRAUS_court_events.11.a: "\"This time Vienna seems to mean it.\""
 KRAUS_crisis_events.2.t: "KRAUS_crisis_events.2.t"
 KRAUS_crisis_events.2.d: "KRAUS_crisis_events.2.d"
 KRAUS_crisis_events.2.a: "Get the machines turning again."
 KRAUS_crisis_events.1.t: "KRAUS_crisis_events.1.t"
 KRAUS_crisis_events.1.d: "KRAUS_crisis_events.1.d"
 KRAUS_crisis_events.1.a: "Retrain the whole army the new way."
 KRAUS_crisis_events.3.t: "KRAUS_crisis_events.3.t"
 KRAUS_crisis_events.3.d: "KRAUS_crisis_events.3.d"
 KRAUS_crisis_events.3.a: "Someone is finally deciding for this Empire."
 KRAUS_startup_events.1.t: "KRAUS_startup_events.1.t"
 KRAUS_startup_events.1.d: "KRAUS_startup_events.1.d"
 KRAUS_startup_events.1.a: "\"We carry on as we always have.\""
 KRAUS_startup_events.1.b: "\"No. We start over.\""
 KRAUS_crisis_events.4.t: "The Weight of the Imperial Army"
 KRAUS_crisis_events.4.d: "Three proposals lie on the Emperor's desk. He can only push one of them to the limit."
 KRAUS_crisis_events.4.a: "Armour first."
 KRAUS_crisis_events.4.b: "Infantry as the backbone."
 KRAUS_crisis_events.4.c: "Air superiority first."
 KRAUS_crisis_events.5.t: "The Reply from Berlin"
 KRAUS_crisis_events.5.d: "Berlin's reply arrived three days later — brief, but unexpectedly warm."
 KRAUS_crisis_events.5.a: "We go together."


############################################################
### 战后秩序 · 全球去殖民化浪潮（2026-09-24）
############################################################

KRAUS_war_order_events.1.t: "The Decolonisation Wave"
KRAUS_war_order_events.1.d: "The empires of Europe are on their knees, and every one of them is still holding colonies it can no longer afford to keep.\n\nVienna has no colonies. That is not a weakness - it is a mandate. We are the only great power in Europe that can demand the dismantling of the colonial system without being asked what we intend to keep.\n\n§YEqual brotherhood. Solidarity. Cooperation. Democracy. We did not invent these words to keep them in Europe.§!"
KRAUS_war_order_events.1.a: "Declare the wave, without exception"
KRAUS_war_order_events.1.b: "Press only the defeated powers"

KRAUS_war_order_events.2.t: "Vienna Demands the Colonies"
KRAUS_war_order_events.2.d: "An Austrian note has arrived, and it is not a request. It states, in plain terms, that the colonial system is finished, that Vienna holds no colonies and therefore will not be bribed, and that any power still holding one will be named in the next conference.\n\nThere is no threat in the letter. There does not need to be.\n\n§YThe war ended. The accounting has not.§!"
KRAUS_war_order_events.2.a: "Release them. There is no money left to hold them."
KRAUS_war_order_events.2.b: "We will not be dictated to by Vienna."

KRAUS_war_order_events.3.t: "The Wave Has Begun"
KRAUS_war_order_events.3.d: "The replies are coming in, and they are not replies to a request - they are capitulations dressed as policy.\n\nOne after another, the colonial powers are discovering that they have neither the ships nor the treasury nor the will to keep an empire. The flags are coming down. Nobody is firing a shot.\n\n§YWe did not defeat their empires. We simply told them the truth about the cost, out loud, where everyone could hear.§!"
KRAUS_war_order_events.3.a: "The map is changing. Let it."

KRAUS_war_order_events.4.t: "The German Colonial Question"
KRAUS_war_order_events.4.d: "Mittelafrika and German East Asia are the two largest colonial administrations left standing in the world, and both of them answer to Berlin.\n\nThe German government knows the arithmetic: a continent it cannot administer, a garrison it cannot pay, and an entire generation at home asking why German boys are dying in the Congo.\n\n§YWe are not asking them to give up an empire. We are asking them to notice they already lost it.§!"
KRAUS_war_order_events.4.a: "Accept: dissolve Mittelafrika and German East Asia"
KRAUS_war_order_events.4.b: "Refuse: Germany keeps her colonies"

KRAUS_war_order_events.5.t: "A Colony Has Become a Nation"
KRAUS_war_order_events.5.d: "Another colonial administration has folded, and another nation has taken its place at the table - with a flag, a delegation, and a seat in the European Union.\n\nThey will remember who opened the door. Not out of gratitude, but because there was no one else standing there.\n\n§YAn empire is a debt. A nation is a partner. We have been on the wrong side of that distinction before.§!"
KRAUS_war_order_events.5.a: "Welcome them."


############################################################
### 全球民主化运动 · 调停事件（2026-09-24）
############################################################

KRAUS_war_order_events.10.t: "An Austrian Offer"
KRAUS_war_order_events.10.d: "An Austrian delegation has arrived at the front, carrying no terms and no demands - only an observation.\n\nIt states that the line the two armies now stand on can be made permanent today, at no cost to either side, and that Vienna will guarantee it. Nothing is surrendered. Nothing is regained. The shooting simply stops.\n\n§YThey are offering us exactly what we hold. The question is whether we believe we can take more.§!"
KRAUS_war_order_events.10.a: "Accept. Let the line become the border."
KRAUS_war_order_events.10.b: "Refuse. We are not done here."

KRAUS_war_order_events.11.t: "The Guns Have Stopped"
KRAUS_war_order_events.11.d: "Two governments that would not speak to each other have both spoken to Vienna, and the answer was yes.\n\nThe armistice is signed on the current line. No territory is exchanged, no reparations are paid, no government falls. The border is wherever the soldiers happened to be standing when the order came.\n\n§YWe did not win their war for them. We simply made it stop being worth continuing.§!"
KRAUS_war_order_events.11.a: "Record it, and move on."

KRAUS_war_order_events.12.t: "They Refused Vienna"
KRAUS_war_order_events.12.d: "The answer came back the way answers always come back in wartime: that the war was not ours to end, that the position was recoverable, that Vienna did not understand.\n\nIt said this while its own casualty lists were still being printed.\n\n§YThey have chosen the war. We have only chosen whether to keep watching.§!"
KRAUS_war_order_events.12.a: "Note their refusal. Say nothing."
KRAUS_war_order_events.12.b: "Say it publicly: Vienna will not stand aside."


KRAUS_mediation_accepted_tt: "§GAn armistice has been signed on the current line.§!"
KRAUS_mediation_escalated_tt: "§RUnlocks the choice to intervene on either side.§!"
### ══ War Order: Entente Returns & Russia (2026-10-07) ══
KRAUS_war_order_events.6.t: "Britain Returns"
KRAUS_war_order_events.6.d: "Seven days after the armistice was signed, a fleet flying the old royal standard steamed into Portsmouth. The terms of Halifax had finally been honoured — Germany had not marched west for the whole war, and Britain kept its homeland. After twenty-seven years in exile, Britain was home. She brought a request with her: in the new order of Europe, she would like to keep her crown."
KRAUS_war_order_events.6.a: "Welcome them. The King is still on his throne — good."

KRAUS_war_order_events.7.t: "The Fate of France"
KRAUS_war_order_events.7.d: "The same terms reached a second government in exile. Since the fall of the homeland and the flight to Algiers, France had not held a country at all. Vienna must now take a position. The Commune of France is the government that burned its own capital; National France is the one that never surrendered the homeland. Austria has no business deciding this for Paris — but Paris needs someone who will recognise it."
KRAUS_war_order_events.7.a: "Recognise their right to decide. It is our tradition."

KRAUS_war_order_events.8.t: "The Tsar's Legacy"
KRAUS_war_order_events.8.d: "The Emperor is still on the throne. That, and only that, is why we may speak.\n\nVienna knows its own position well. We were a multinational empire too, and we survived not by crushing our differences but by letting each of them settle where it belonged. The Tsar's Russia chose the opposite road, and the bill is still being added up. Whether he continues after the war is his own affair.\n\nWe can at least offer him two of them: one to continue as he is, and one to look at ours."
KRAUS_war_order_events.8.a: "Walk with the Tsar. The last monarchs of the old world should look after each other."
KRAUS_war_order_events.8.b: "Send him our example. Let him see that nationalities need not be repressed to live together."

KRAUS_war_order_events.9.t: "The Russian Republic"
KRAUS_war_order_events.9.d: "The Emperor is gone.\n\nWhich means we have no standing to advise anyone about staying in the old world — we are no longer that empire ourselves. The United States of Greater Austria has not had an easy decade, but it has proved one thing: a multinational state can stand without an emperor.\n\nIt is Russia's turn to take that step now. There is little we can do, but we can stand beside them."
KRAUS_war_order_events.9.a: "Recognise them. We walked the same road."
 KRAUS_greece_events.12.t:0 "Athens Reassesses"
 KRAUS_greece_events.12.d:0 "The text of the Belgrade Treaty was settled in three days, but in the week that followed every demand became more specific: fortresses, the use of ports, a say over shipping in the Aegean.\n\nThe cabinet in Athens remembered another letter. Vienna had not enforced the sanctions, had set no conditions, had asked for nothing.\n\nThe cabinet voted on Thursday, seven to four."
 KRAUS_greece_events.12.a:0 "Greece withdraws from the Belgrade Treaty."
 KRAUS_greece_events.12.b:0 "Stay in the treaty."
 KRAUS_greece_events.13.t:0 "Athens Withdraws"
 KRAUS_greece_events.13.d:0 "Greece has delivered a note of withdrawal to Belgrade, citing "a reassessment of its own interests". Vienna sent no envoy and set no conditions.\n\nThe minister wrote in his report: §Y"They remember who did not kick them when they were down."§!"
 KRAUS_greece_events.13.a:0 "We did nothing. Perhaps that was the best course."
 KRAUS_crisis_events.4_slo: "Slovakia - the industrial corridor of the upper Danube"
 KRAUS_crisis_events.4_trs: "Transylvania - the mines and forests of the Carpathians"
