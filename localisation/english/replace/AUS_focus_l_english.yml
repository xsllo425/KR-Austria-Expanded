 AUS_sdap_7_desc:0 "[KRAUS_fr_AUS_sdap_7_d]"
 AUS_sdap_industrial_workers_council:0 "[KRAUS_fr_AUS_sdap_industrial_workers_council_n]"
 AUS_sdap_industrial_workers_council_desc:0 "[KRAUS_fr_AUS_sdap_industrial_workers_council_d]"
 AUS_skoda: "Skoda"
 AUS_skoda_desc: "During the Weltkrieg, the Škoda Works to the west of Prague was our biggest arms producer, but has fallen on hard times with the overbearing power of German industries. With Germany rocked to the core by Black Monday, subsidies for Škoda is a large step in repairing our economy."
 AUS_small_ships_effort: "Screening Fleet Programme"
 AUS_small_ships_effort_desc: "It has been decided that we need new models for destroyers and light cruisers, to combat enemy submarines and establish a surface presence. While our submarines are all well and good, larger ships are need to support land operations and do the tasks submarines do not have the firepower to complete."
 AUS_status_quo: "Maintain the Status Quo"
 AUS_status_quo_desc: "Just like a decade prior, our negotiations for an administratively united Empire fell flat. We cannot do more than bide our time while trying to bind Transleithania closer by reform."
 AUS_still_their_king: "Still Their King"
 AUS_still_their_king_desc: "Hungary can claim what they want, we are still their suzerain, and we are at war against and external threat now. No matter how this ends, we need to put our differences aside for now."
 AUS_suedbahn: "Electrify the Southern Railway"
 AUS_suedbahn_desc: "The Südbahn, or Southern Railway, is a railroad that runs from Vienna over Graz to Laibach and Triest, the main seaport of the Austro-Hungarian Monarchy, and finally Milano. Though still a major line of transportation, it was built from 1836 to 1860, so the tracks are in dire need of modernisation. Electrifying the connection would go over relatively swiftly, and help a lot with that."
 AUS_tank_trials: "Tank Trials"
 AUS_tank_trials_desc: "With the trauma of the Weltkrieg still fresh for many, tanks were eagerly embraced in the Austro-Hungarian military as their use were proven during the war, with companies such as Škoda and ČKD developing some of the most advanced tank designs in the world. As tank development rapidly advances, the TMK wants to hold trials for new tanks for different purposes."
 AUS_the_illyrian_suedbahn: "Illyrian Southern Railway"
 AUS_the_illyrian_suedbahn_desc: "The Südbahn, already competed towards Triest, could be easily extended into Illyria, which could help integrate the Agram basin and the Illyrian coastline into the Empies industries. This would also allow us to speed up production of new ships for our navy."
 AUS_the_kk_Identity: "Imperial Identity"
 AUS_the_kk_Identity_desc: "The Austro-Hungarian Empire has often been described as a heap of independent countries who just happen to be ruled by the same family. May they mock our Empire as much as they want, we have Trust in our Kaiser."
 AUS_the_new_Empire: "Austria's Diplomatic Legacy"
 AUS_the_new_Empire_desc: "Austria is not just a geographical region or a country. It is an idea, an expression of the belief in a holy Catholic Empire that has been given a mandate to watch over Europe. Though for centuries our authority has been challenged within and without, our Empire has always persisted, for it is Austria's destiny to rule the world."
 AUS_transcarpathian_railway: "Transcarpathian Railway"
 AUS_transcarpathian_railway_desc: "Reaching the far ends of the Empire had been hard to do for the past two decades, with Hungary refusing to let us modernise their railway network. Now that we are in control again, let us implement an old plan - a high velocity railway straight across the Carpathian Basin."
 AUS_transformation_of_nature: "Transforming Nature"
 AUS_transformation_of_nature_desc: "Our efforts have to go beyond merely the matter of mankind, it must go into the very fabric of nature itself. If we are to develop our newly reinvigorated state further we have to do whatever it takes, even despoiling some of our beautiful wilderness."
 AUS_unify_italy: "Unify Italy"
 AUS_unify_italy_desc: "The rising of the Italian syndicalists in Turin split the country in two, with the French backed Socialist Republic of Italy in the West, and the Italian Republic on our border. With Germany and France openly hostile to each other, helping out the Republic will not only endear us to them, but secure our flank for a war with France."
 AUS_united_states: "A Federation of Equals"
 AUS_united_states_desc: "The United States of Greater Austria, or \"Vereinigte Staaten von Groß-Österreich\", was a proposal, conceived by a group of scholars surrounding Archduke Franz Ferdinand of Austria. This specific proposal was conceived by the lawyer and politician Aurel Popovici in 1906 and aimed at federalising Austria-Hungary to help resolve widespread ethnic and nationalist tensions."
 AUS_us_approaching_the_autonomies: "Towards Autonomy"
 AUS_us_approaching_the_autonomies_desc: "If we are to overcome the divisions of the past, it is essential that we set about treating them, no longer as mere subjects, but members of a true union of states."
 AUS_us_deal_with_Cisleithania: "Integrate Cisleithania"
 AUS_us_deal_with_Cisleithania_desc: "The Cisleithanian lands are ripe for unification. We must break down the internal boundaries in our section of the Empire if we are to implement truly radical reform."
 AUS_us_deal_with_Hungary: "A Deal with Hungary"
 AUS_us_deal_with_Hungary_desc: "The thorn that is Hungary has to be removed from our side, no matter what. We have prepared the reparations they have been asking for over a decade now."
 AUS_us_looking_outwards: "Looking Outwards"
 AUS_us_looking_outwards_desc: "With the divisions of the past cast aside, the United States can now turn its attention to greater matters of state. No longer will we remain saddled with the burden of internal politicking, but instead we shall face the world - together."
 AUS_us_united: "More Than a Union in Name"
 AUS_us_united_desc: "There is no longer a pretence to unity in Austria, there is true unity. Where once there was squabbling and infighting, there now exists concord. We are now a true United States."
 AUS_vienna_circle_1: "Institutionalise the Vienna Circle"
 AUS_vienna_circle_1_desc: "The Vienna Circle is a gathering of the brightest minds of the University of Vienna, brilliant mathematicians, philosophers, natural scientists who are at the forefront of scientific and philosophic research. We will make government funds available to them, but also move their work to new, more practical fields."
 AUS_vienna_circle_2: "Invite Others into the Vienna Circle"
 AUS_vienna_circle_2_desc: "With the Vienna Circle being well-established, funded, and gaining international recognition, the next step is to invite foreign countries with ties to the crown to take part in the research conducted there."
 KRAUS_accord_vassal_tt: "§CThat territory shares \"Harmonious Development of the Crown Lands\", its loyalty is maxed and it receives two civilian factories§!"
 KRAUS_arms_collab_mio_tt: "§CSkoda receives orders and expands: size level +1, additional funding§!"
 KRAUS_austrian_arms_research: "Austrian Armour Research"
 KRAUS_balkan_abstaining_tt: "Not drawn into the Balkan conflict"
 KRAUS_balkan_arms_collaboration: "Skoda and Sofia"
 KRAUS_balkan_arms_collaboration_desc: "Bulgaria orders artillery from Skoda, financed by Vienna's banks, with some blueprints from Germany. The buyer is Austria's neighbour -- and its neighbour's enemy. Selling arms to a neighbour is one business; selling to its enemy is another."
 KRAUS_balkan_arms_factory: "Sofia Arms Works Expansion"
 KRAUS_balkan_arms_factory_art: "Advanced Artillery Research"
 KRAUS_balkan_arms_factory_desc: "Work has begun on an arms works outside Sofia. Bulgaria gives land and labour, the Empire the technology and rails. The guns will be split evenly. A factory is sturdier than a treaty -- it cannot be torn up."
 KRAUS_balkan_arms_factory_sup: "Advanced Support Company Research"
 KRAUS_balkan_arms_factory_tt: "Expands domestic arms factories; military production capacity rises"
 KRAUS_balkan_bulgarian_refugees: "Styrian Resettlement Camps"
 KRAUS_balkan_bulgarian_refugees_desc: "Vienna is at its population limit while the provincial mines and factories need hands. Schönbrunn disperses the Bulgarian refugees by rail to Styria, Carinthia and the west. It costs money and stability, but Styria's workshops are finally fully staffed."
 KRAUS_balkan_dual_arms_sales: "Arms Sold to Both Sides"
 KRAUS_balkan_dual_arms_sales_desc: "From June 1935 the Ordnance Bureau sold 12,700 M95 rifles and 36 Skoda guns to Yugoslavia, and 8,400 rifles and 24 howitzers to Bulgaria, in Swiss francs. At least three batches were fired in the 1936 Macedonian clashes. The goods left Vienna, the money came in, and where the shells landed was not a contract term."
 KRAUS_balkan_isolate_done: "Austro-Bulgarian Joint Staff Exercise"
 KRAUS_balkan_isolate_done_desc: "Austria and Bulgaria hold a joint staff exercise at Plovdiv. On the third day a Bulgarian plan was rejected on the spot: it duplicated an Imperial plan from two years earlier that had already failed.\n\nTelling an ally to their face that they are wrong -- that is what makes a relationship stand."
 KRAUS_balkan_isolated_tt: "Balkan isolation established: Bulgaria can be allied with when recovering the Crown Lands"
 KRAUS_balkan_joint_condemnation: "Joint Declaration"
 KRAUS_balkan_joint_condemnation_desc: "The Foreign Minister oversaw a declaration on attempts to alter the Balkan status quo. It runs a page and a half, and \"Austria\" appears nowhere in it: the signature line was left to Berlin, so Serbia and Romania would understand it exactly. Letting an ally lead keeps Austria's hands clean."
 KRAUS_balkan_joint_condemnation_tt: "Issues a joint declaration of condemnation with Germany and the Imperial Concord"
 KRAUS_balkan_let_them_tt: "Consequence of non-intervention: the Empire will lack Balkan allies after the war"
 KRAUS_balkan_nonintervention: "Non-Intervention in the Balkans"
 KRAUS_balkan_nonintervention_desc: "With the Balkans framed by the Belgrade Treaty, Vienna declares non-intervention. As well as bounding Austrian action, it tells Berlin Vienna will not act unilaterally, steadying everyone's reading of Austrian intent. Doing nothing is sometimes itself a posture."
 KRAUS_balkan_preserve_strength: "Holding Back"
 KRAUS_balkan_preserve_strength_desc: "The General Staff judges war would not favour the Empire either way: a Serbian victory puts a strong power south of the Danube, a Romanian one complicates Transylvania. So the Empire stays out, keeping its forces for later."
 KRAUS_balkan_preserve_strength_tt: "Preserves national strength; accumulates an advantage for the next war"
 KRAUS_balkan_sanction_romania: "The Dobruja Refugee Wave"
 KRAUS_balkan_sanction_romania_desc: "Refugees from the Dobruja move up the Danube, and the numbers crossing rise from thousands to tens of thousands. Bulgaria's ports swell, grain prices jump forty per cent in three days, and the roads are blockaded. A neighbour's catastrophe never stays politely inside the neighbour."
 KRAUS_balkan_sanction_romania_tt: "Imposes economic sanctions on Romania (3 years)"
 KRAUS_balkan_sanction_serbia: "Economic Sanctions on Belgrade"
 KRAUS_balkan_sanction_serbia_desc: "The plan: Serbia lives on farm exports and Romanian oil must leave by the Danube, and the Empire controls both routes. Credit is cut and the Danube blockaded -- replacing two army corps, and hurting more. Cheaper than sending two corps."
 KRAUS_balkan_sanction_serbia_tt: "Imposes economic sanctions on Serbia (3 years)"
 KRAUS_balkan_volunteer_act: "Volunteer Corps Act"
 KRAUS_balkan_volunteer_act_desc: "The Volunteer Corps is an existing Austro-Hungarian formation. The act provides: no declaration of war, no regular troops, volunteers going as private individuals, paid from private funds with equipment from old stocks. As the Foreign Minister put it, we did not send troops -- we merely did not stop them."
 KRAUS_balkan_war_ended: "The Day the Guns Fell Silent"
 KRAUS_balkan_war_ended_desc: "The gunfire has stopped. The old order is over. Vienna's archive filed the past years under \"Balkans -- Closed\". No summary was written: after the war they will understand that every Balkan turning point began in this room."
 KRAUS_balkan_war_ended_tt: "Balkan line complete -- reduces the crisis by one layer after the war"
 KRAUS_balkan_watch: "Watching and Waiting"
 KRAUS_balkan_watch_desc: "Intelligence keeps a team in Belgrade, Sofia and Athens, reporting on timetables, mobilisation and parliamentary rows. The General Staff concludes the conditions for action do not yet exist. Watching is not hesitation -- it is waiting for the other side to blunder first."
 KRAUS_balkan_watch_tt: "No intervention; military spending redirected to civilian construction"
 KRAUS_bulgarian_arms_research: "Bulgarian Armour Research"
 KRAUS_bulgarian_civil_research: "Bulgarian Industrial Research"
 KRAUS_central_european_prosperity_merge_tt: "§CMerges the economic line into one new spirit: §Ythe Austro-German Economic Community§!. \nThe bonus depends on the path you chose -- §YInfrastructure§!, §YHeavy Industry§! or §YLight Industry§! -- which is §Cdoubled§!; the others do not apply.§!"
 KRAUS_combined_arms_operations: "Bavarian Joint Military Exercise"
 KRAUS_combined_arms_operations_desc: "This exercise in Bavaria puts an Austrian mountain division and a German armoured division in one battle group. The first week exposed different radio frequencies, firing tables and map contours; by the third these were worked through. An Austrian colonel wrote: we came not to learn from them, but to confirm that in real fighting we can stand together."
 KRAUS_common_army_reborn_merge_tt: "§CMerges your three military spirits into one new spirit: §Ythe Bavarian Joint Military Exercise§!§!"
 KRAUS_czech_ally_tt: "Czechia: will stand with the Habsburgs in a time of crisis"
 KRAUS_czech_approached_tt: "Vienna has extended an olive branch to Prague"
 KRAUS_german_advisors: "Theresian Military Academy"
 KRAUS_german_advisors_desc: "Wiener Neustadt's academy, founded in 1751, has long trained the Empire's officers. German instructors now hold its chairs and the syllabus follows Reichswehr doctrine -- speed, coordination, decisiveness. One old instructor noted that what they taught for two hundred years, the other side changed in two weeks."
 KRAUS_german_advisors_tt: "German military mission arrives; 50% discount on army doctrine"
 KRAUS_german_armor: "Eimannsberger and Guderian"
 KRAUS_german_armor_desc: "In 1934 Eimannsberger's \"Tank Warfare\" drew little notice. In 1936 Berlin sent Guderian, and the two fell out: Guderian wanted tanks concentrated, Eimannsberger answered that Austria's mountains forbid massed armour. After three hours they went to the training ground to settle it."
 KRAUS_german_armor_doctrine: "Eimannsberger's Armoured Manual"
 KRAUS_german_armor_doctrine_desc: "After three days the General Staff chose the armoured arm. The Empire lacks oil, industry and proving grounds, but the next war will not be fought from trenches. Skoda turns to tank chassis and the Tyrol grounds run around the clock; Germany gives blueprints and instructors.\n\n§YWhat we build is not tanks, but the means by which Vienna will speak again.§!"
 KRAUS_german_armor_doctrine_tt: "Armoured equipment bonus; army attack/breakthrough improved"
 KRAUS_german_armor_tt: "Armoured equipment bonus; army attack/breakthrough improved"
 KRAUS_german_capital: "Deutsche Bank, Vienna Branch"
 KRAUS_german_capital_desc: "Deutsche Bank opens its first Vienna branch in twenty years. Shares stay, management stays Austrian; the Germans take markets and raw materials, which Imperial industry can supply. From today Vienna's cycle runs with Berlin's. Capital sets the direction of politics."
 KRAUS_german_capital_tt: "German capital enters; new civilian factories"
 KRAUS_german_central_european_prosperity: "Austro-German Economic Community"
 KRAUS_german_central_european_prosperity_desc: "Germany and Austria pool their economies: German capital, machinery and orders against Austrian labour, coal, iron and the Danube. A production chain runs from the Ruhr to Trieste.\n\n§YWe have not sold our country; we have found a neighbour willing to make money alongside us.§!"
 KRAUS_german_central_european_prosperity_tt: "The economic line converges: Austro-German capital, capacity and infrastructure join one system"
 KRAUS_german_combined: "The General Staff's Final Plan"
 KRAUS_german_combined_desc: "Over three days the General Staff weighed the armour school's concentration against the infantry's dispersion and the artillery's objections. The final plan puts every arm in one battle group on one rhythm. Signing it, an old general remarked this was the last plan he could still sign."
 KRAUS_german_combined_doctrine: "Combined Arms"
 KRAUS_german_combined_doctrine_desc: "The German advisers objected that Austria could not afford it. Vienna insisted, forming every arm into one battle group on a single rhythm, with hard training to build mutual responsibility. In exercises it achieved the same objective with two thirds of the force, and Berlin fell silent.\n\n§YThe cost is in the budget; the return in future battle reports.§!"
 KRAUS_german_combined_doctrine_tt: "Combined arms: comprehensive combat bonus, requires war support > 30%"
 KRAUS_german_combined_tt: "Combined arms: comprehensive combat bonus, requires war support > 30%"
 KRAUS_german_deep_binding: "From the Danube to the Rhine"
 KRAUS_german_deep_binding_desc: "Germany and Austria ran their economies separately: the Danube through Vienna, Budapest and Belgrade, the Rhine north to the Ruhr. Steel and machine tools now move by rail. From today Austria's business is Germany's business -- and the reverse holds equally."
 KRAUS_german_deep_binding_tt: "Full Austro-German binding -- the Empire becomes a Central European pole again"
 KRAUS_german_economic_coop: "Customs Union Negotiations"
 KRAUS_german_economic_coop_desc: "The customs talks ran two years, the dispute being whether Vienna kept the power to set its own tariffs. Germany agreed, subject to three clauses, and Austria signed.\n\n§YWe are trading part of our freedom for an entire market.§!"
 KRAUS_german_economic_coop_tt: "German capital enters Austrian industry; domestic factories and infrastructure expand"
 KRAUS_german_heavy_industry: "The Ruhr Model"
 KRAUS_german_heavy_industry_desc: "The Ruhr dwarfs Vienna, so the Empire fixes its direction: steel, coal, machinery and armaments first. Within six months arms capacity rises a step, but civilian supply falls and prices climb. A settled choice, not an accident."
 KRAUS_german_heavy_industry_tt: "Heavy industry priority: military production capacity rises sharply"
 KRAUS_german_industry_standard: "The Krupp Standard"
 KRAUS_german_industry_standard_desc: "Krupp's engineers supplied standard tables quantifying hours per operation, steel yield and defect ceilings. Three months after Skoda adopted them unit output rose a fifth.\n\n§YEfficiency can be learned -- but only if you admit you are behind.§!"
 KRAUS_german_industry_standard_tt: "Industrial bonus + additional research slot"
 KRAUS_german_infantry: "Martner's Conscription and Training"
 KRAUS_german_infantry_desc: "Martner's office at the War Ministry handles conscription and training. The Empire has men in abundance and industry in short supply, so he defers tanks to secure guns, shells and training for the infantry. German instructors cut the cycle from eight months to five.\n\n§YWhat he wants is not an elite force, but one that will not break.§!"
 KRAUS_german_infantry_doctrine: "Martner's Infantry Manual"
 KRAUS_german_infantry_doctrine_desc: "The General Staff makes the infantry division the unit of build-up: Skoda adds three artillery lines, Steyr-Daimler doubles truck output, and the new manual demands every soldier handle a gun, a spade and a machine gun.\n\n§YNot the most advanced army. One that will not break.§!"
 KRAUS_german_infantry_doctrine_tt: "Infantry and artillery equipment bonus"
 KRAUS_german_infantry_tt: "Infantry and artillery equipment bonus"
 KRAUS_german_infrastructure: "The Danube Waterway and the Southern Railway"
 KRAUS_german_infrastructure_desc: "In the dry season Danube barges run aground, and the Southern Railway is single-track. The Empire dredges the river and electrifies the line. Freight to the Adriatic takes three days less.\n\n§YInfrastructure is the only productive capacity that never goes out of date.§!"
 KRAUS_german_infrastructure_tt: "Infrastructure priority: infrastructure rises sharply"
 KRAUS_german_joint_ventures: "Skoda-Krupp Consortium"
 KRAUS_german_joint_ventures_desc: "German money has entered two of Austria's principal arms works: Skoda's armour shops expand and the Böhler artillery line is re-equipped with German machine tools. The Vienna partners now supply an industrial system spanning Central Europe. Capital decides which way the guns point."
 KRAUS_german_light_industry: "Vienna's Consumer Goods Industry"
 KRAUS_german_light_industry_desc: "Resources go to textiles, food and consumer goods. Vienna's shelves are full, prices steady, the grumbling quieter -- meat on the workers' tables, new shoes for the children.\n\n§YThe military wants guns. You cannot eat a gun.§!"
 KRAUS_german_light_industry_tt: "Light industry priority: improved living standards, stability rises"
 KRAUS_german_military_coop: "The Berlin Military Agreement"
 KRAUS_german_military_coop_desc: "Austria and Germany sign a military agreement in Berlin. It runs seventeen pages; fourteen are unpublished. The three published pages cover exercises, officer exchanges and intelligence. The fourteen hidden pages concern who commands once war begins.\n\n§YThe substance of an alliance is always in the pages not written down.§!"
 KRAUS_german_military_coop_tt: "German military mission arrives; the Austrian army moves onto German standards"
 KRAUS_german_relations: "From Vienna to Berlin"
 KRAUS_german_relations_desc: "Berlin has never hidden its interest in Austria. To Germany, Austria is the missing piece; to Austria, Germany is the only power that can save it -- and the only one that can swallow it.\n\n§YNot to submit to Germany, but to use it.§!"
 KRAUS_german_relations_tt: "The Empire redefines its relationship with Berlin"
 KRAUS_german_standardisation: "German Calibres"
 KRAUS_german_standardisation_desc: "Austria and Germany ran two standards, so shells would not interchange and screws would not fit. Logistics spent six months merging them, scrapping much usable stock.\n\n§YWe are not saving money -- we are buying that halfway through the fighting, the bullets still fit.§!"
 KRAUS_german_standardisation_tt: "Unified German calibres; new military factories"
 KRAUS_greek_question: "Beneath the Avalanche"
 KRAUS_greek_question_desc: "Black Monday ran from Wall Street through Berlin to Vienna, and on to the Greek ports, doubling unemployment in Athens in three months. The great powers can absorb the shock; Greece cannot. Having drawn on Greek industry in the boom years, we should now keep it running."
 KRAUS_greek_question_spare_tt: "§GSpare Greece and they will be grateful.§!\n\n§YThat goodwill may yet prove useful.§!"
 KRAUS_greek_question_tt: "Beneath the avalanche, pull Athens up -- a kindness now will be remembered for a long time"
 KRAUS_hungarian_approached_tt: "Vienna has made friendly overtures to Budapest"
 KRAUS_imperial_mediation:0 "The Roundtable at Schonbrunn"
 KRAUS_imperial_mediation_desc:0 "Soothing each region separately cannot solve the empire's common problems. The court gathers the parties to put the aid, duties, and local demands already discussed onto one table. The emperor, as coordinator, helps them find workable arrangements rather than declaring victory for anyone. The talks continue only if the next promise is kept."
 KRAUS_joint_doctrine: "Joint Austro-German Doctrine (Austria)"
 KRAUS_joint_doctrine_ger: "Joint Austro-German Doctrine (Germany)"
 KRAUS_joint_ventures_mio_tt: "§CSkoda and Böhler receive German investment: size level +2, additional funding§!"
 KRAUS_new_year_new_way:0 "A New Year, A New Way"
 KRAUS_new_year_new_way_desc:0 "Vienna still has time to choose. Crownlands demand a hearing, Berlin waits for Austria to take a stand, and the Balkans stir along the imperial frontier. Postponing each problem only makes them arrive together. The cabinet rearranges its priorities: first build bargaining that can be honored, then decide how the empire faces the outside world."
 KRAUS_new_year_new_way_tt: "The Empire faces three fundamental problems: the Crown Lands, Germany, the Balkans"
 KRAUS_plot:0 "The Invisible Hand"
 KRAUS_plot_desc:0 "Beyond formal talks, orders, transport arrangements, and local contacts also shift people's choices. Vienna organizes these scattered links so those backing cooperation need not stand alone. Central influence reaches deeper into the regions, yet the network still depends on keeping promises. It can create room for political compromise but cannot replace each region's decision about the empire's future, nor erase the political hue of these ties."
 KRAUS_plotting_tt: "Infiltration complete: the Crown Lands will be far easier to bring into line"
 KRAUS_reflect_our_rule:0 "The Weight of the Crown"
 KRAUS_reflect_our_rule_desc:0 "Petitions from the regions cannot just be filed as security matters. Fiscal shares, local administration, and the center's promises lie at the root of crownland discontent. Vienna puts them on one governing agenda, sorting which demands can be answered at once and which require shared burden. Admitting that governance went wrong is the start of regaining trust, not a sign of weakness."
 KRAUS_reflect_our_rule_tt: "The Empire begins to face the fundamental contradictions of the Crown Lands"
 KRAUS_refugee_construction_research: "Construction Techniques Brought by the Refugees"
 KRAUS_refugee_industry_research: "Industrial Techniques Brought by the Refugees"
 KRAUS_slovak_ally_tt: "Slovakia: will stand with the Habsburgs in a time of crisis"
 KRAUS_slovak_approached_tt: "Vienna has begun to listen to the Slovak voice"
 KRAUS_soothe_czech:0 "An Olive Branch to Prague"
 KRAUS_soothe_czech_desc:0 "What Prague needs must land in local life and industrial production. Vienna backs talks with investment and industrial cooperation, letting regional delegates show voters the benefits of staying in. Factories and contracts open the door to negotiation but cannot replace political trust; today's arrangement must survive tomorrow's fulfillment. The olive branch must match real deeds."
 KRAUS_soothe_hungary:0 "Budapest's Terms"
 KRAUS_soothe_hungary_desc:0 "Budapest insists it is no ordinary province, and the center cannot buy calm with promises it cannot keep. Finances, the army, and transport must be negotiated item by item, with industrial aid giving the talks a real basis. The two sides make progress first where terms are executable, leaving the harder disputes at the table rather than to streets and barracks."
 KRAUS_soothe_slovak:0 "A Voice from the Mountains"
 KRAUS_soothe_slovak_desc:0 "Slovak grievances should not drown in the Vienna-Budapest quarrel. Whether roads, jobs, and public services are attended to is easier to verify than distant slogans. The center folds local needs into its aid plans, giving negotiation something concrete to stand on. Only sustained investment in sight gives the empire's assurances weight."
 KRAUS_trust_czech:0 "No More Defenestration"
 KRAUS_trust_czech_desc:0 "Prague will not drop its guard over a single investment. The next step must make cooperation continuous: industrial orders cannot halt with every cabinet quarrel, and construction must not stop at the signing ceremony. Vienna proves sincerity through verifiable works and daily collaboration, so local concessions no longer rest only on trust in imperial assurances."
 KRAUS_trust_slovak:0 "Slovak Sincerity"
 KRAUS_trust_slovak_desc:0 "Early aid has opened a channel; the task now is to make it lasting cooperation. Works crews, regional delegates, and central offices jointly plan roads and industry, joining scattered promises into an executable program. Locality need not believe every imperial word first but should be able to track each promise's progress. Such ties last longer than a moment's gratitude."
 KRAUS_volunteer_act_tt: "Gains a volunteer division limit bonus (can send 4 volunteer divisions)"
 KRAUS_balkan_anchor: "The Balkan Anchor"
 KRAUS_balkan_anchor_desc: "The Balkans are the Empire's soft underbelly. The Treaty of Belgrade has made the peninsula a Serbian backyard, and Vienna has one option: to draw the Romanians, Bulgarians, Greeks and Albanians back into its orbit."


############################################################
### 战后秩序 · 处理第三国际与莫斯科协约的废墟（2026-09-24）
############################################################

KRAUS_war_order_britain: "The London Reconstruction Commission"
KRAUS_war_order_britain_desc: "The exiles have come home to a country that no longer has room for them.\n\nThe old king is asked to sign away the throne his family lost to revolution, and the crown passes to a Habsburg. Britain is rebuilt not as a syndicalist republic, but as a constitutional monarchy - allied, by marriage and by money, to Vienna.\n\n§YThey are allowed to return. They are just not allowed to rule.§!"
KRAUS_war_order_britain_tt: "§CPlaces a pro-Austrian government in Britain. The old king abdicates; the crown goes to a Habsburg.§!"

KRAUS_war_order_france: "The Paris Reconstruction Commission"
KRAUS_war_order_france_desc: "France needs rebuilding, not occupation.\n\nThe Commune fell because its economy had long since emptied. Vienna provides money, engineers and coal to repair the railways and reopen the factories, in return for a market it can trade with for years and a measure of goodwill.\n\n§YWhat we want is not French obedience but French books that balance again.§!"
KRAUS_war_order_france_tt: "§CAustria funds the reconstruction of France, and trade between the two countries resumes.§!"

KRAUS_war_order_russia: "The Moscow Reconstruction Commission"
KRAUS_war_order_russia_desc: "Russia is among the most complete losers of this war. Its old order has collapsed, and where it goes from here is not for Vienna alone to decide.\n\nWhat the Moscow Reconstruction Committee can offer is loans, engineers and diplomatic mediation to help Russia out of the ruins the war left behind. What kind of state it finally builds depends on its own politics.\n\n§YVienna can build the bridge, but the Russians must cross it themselves.§!"
KRAUS_war_order_russia_tt: "§CAustria assists the reconstruction of Russia; its future depends on its own political course.§!"
