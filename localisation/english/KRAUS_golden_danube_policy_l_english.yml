l_english:
 KRAUS_golden_danube_policy.1.t:0 "Who Pays for the Works"
 KRAUS_golden_danube_policy.1.d:0 "The Renner government must raise money for the first Golden Danube projects. The cooperative banks will invest if the works proceed carefully; the unions will advance the wages if their members are hired first."
 KRAUS_golden_danube_policy.1.a:0 "Let the cooperative banks pay."
 KRAUS_golden_danube_policy.1.b:0 "Let the unions advance the wages."
 KRAUS_golden_danube_policy.2.t:0 "Industry's Terms"
 KRAUS_golden_danube_policy.2.d:0 "Industrialists in Bohemia and Vienna will take on the projects, but want a say in the planning. Turn them down and the state must place the orders with its own money."
 KRAUS_golden_danube_policy.2.a:0 "Bring industry into the planning."
 KRAUS_golden_danube_policy.2.b:0 "The state places the orders itself."
 KRAUS_golden_danube_policy.3.t:0 "Parliament or Emperor"
 KRAUS_golden_danube_policy.3.d:0 "The works budget has caused a quarrel. The Social Democrats want Parliament to review it; the conservatives want the Emperor to arbitrate and settle it quickly."
 KRAUS_golden_danube_policy.3.a:0 "Send it to Parliament."
 KRAUS_golden_danube_policy.3.b:0 "Ask the Emperor to arbitrate."
 KRAUS_golden_danube_policy.4.t:0 "Who Pays for the Works"
 KRAUS_golden_danube_policy.4.d:0 "The Miklas government must raise money for the first projects. Parish mutual societies will stand surety - safe but slow; or the state can issue construction bonds - fast, but it takes on debt."
 KRAUS_golden_danube_policy.4.a:0 "Rely on parish sureties."
 KRAUS_golden_danube_policy.4.b:0 "Issue construction bonds."
 KRAUS_golden_danube_policy.5.t:0 "Labour Contracts"
 KRAUS_golden_danube_policy.5.d:0 "Before work begins the terms of employment must be settled: local agreements with unions and employers that hire locals first, or one central contract with one discipline."
 KRAUS_golden_danube_policy.5.a:0 "Sign local agreements."
 KRAUS_golden_danube_policy.5.b:0 "One central contract."
 KRAUS_golden_danube_policy.6.t:0 "Seats on the Commission"
 KRAUS_golden_danube_policy.6.d:0 "The Social Partnership Reconstruction Commission must seat its first members. The moderates want more seats for workers; the conservatives accept only certified delegates."
 KRAUS_golden_danube_policy.6.a:0 "More worker delegates."
 KRAUS_golden_danube_policy.6.b:0 "Certified delegates only."
