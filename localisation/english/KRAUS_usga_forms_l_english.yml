l_english:
 KRAUS_usga_federal:0 "Federal United States"
 KRAUS_usga_federal_desc:0 "The crownlands keep their own diets and languages and speak as equals in the joint diet in Vienna. The Empire no longer demands that anyone become like anyone else, so stability is firmer, but the benefits of integration are spread more thinly."
 KRAUS_usga_unitary:0 "Unitary United States"
 KRAUS_usga_unitary_desc:0 "One constitution, one government, one chain of command. Direct rule from the centre brings higher industrial and mobilisation efficiency, and also takes away the dignity of the old crownlands."
 KRAUS_usga_unrest:0 "Local Grievances"
 KRAUS_usga_unrest_desc:0 "In the unitary United States, deputies of the old crownlands raise the same question one after another in Vienna: where is our place? Only a one-time decision can calm these grievances."
 KRAUS_usga_unrest.1.t:0 "The Petition of Bohemia"
 KRAUS_usga_unrest.1.d:0 "The deputies of Prague jointly submit a petition: the place of Czech in schools and offices should not be abolished because the United States has unified the constitution.\n\nThe Chancellery's secretary points out that this is the first and will not be the last."
 KRAUS_usga_unrest.1.a:0 "Make some concessions and approve bilingual schools and offices."
 KRAUS_usga_unrest.1.b:0 "Rejected: a unified state has only one official language."
 KRAUS_usga_unrest.2.t:0 "The Taxes of Galicia"
 KRAUS_usga_unrest.2.d:0 "The deputies of Lemberg say that of the taxes Galicia sends up, less than half comes back to Galicia. They demand to keep part of the revenue, managed by the local diet."
 KRAUS_usga_unrest.2.a:0 "Make some concessions and assign part of the revenue to the locality."
 KRAUS_usga_unrest.2.b:0 "Rejected: there is only one treasury."
 KRAUS_usga_unrest.3.t:0 "The Old Privileges of Hungary"
 KRAUS_usga_unrest.3.d:0 "At the joint diet the deputies of Budapest say what all the crownlands wished to say: the United States wants equality, not levelling. They put forward a list setting out the privileges Hungary has held for generations.\n\nGrievances have built up three times; if they are not calmed, they will only run deeper."
 KRAUS_usga_unrest.3.a:0 "Make some concessions and write several items of the list into law."
 KRAUS_usga_unrest.3.b:0 "Rejected: the age of privilege is over."
 KRAUS_usga_unrest_open_tt:0 "The one-time decision §YPacify the Crownlands§! appears in the decisions panel: only it can remove the penalty of the §YLocal Grievances§!."
 KRAUS_usga_pacify:0 "Pacify the Crownlands"
 KRAUS_usga_pacify_desc:0 "A one-time settlement: pay a sum of political power and open another round of dialogue in the joint diet, settling the three grievances at once."
 KRAUS_us_united_tt:0 "Crownlands whose loyalty reaches §YLoyalty II§! or above (Hungary, Slovakia, Transylvania and others) are integrated automatically; the other crownlands still require the integration decision."
