l_english:
 KRAUS_news_events.1.t:0 "New Cabinet Formed in [AUS.GetNameDef]"
 KRAUS_news_events.1.d:0 "The results of the second parliamentary election in [AUS.GetNameDef] have been announced, and the new cabinet list has since received the Emperor's approval.\n\nThe centre of the Diet has moved with the result, and the new cabinet now faces four questions: language, finance, administration and the army."
 KRAUS_news_events.1.a:0 "Noted."
 KRAUS_news_events.2.t:0 "[AUS.GetNameDef] Reorganised as a Federal Union"
 KRAUS_news_events.2.d:0 "Vienna has announced that the Empire is reorganised as a federal union under the United States decision. The crownlands keep their own diets and languages and speak as equals in the joint diet, while foreign affairs and the army remain with the centre.\n\nObservers say the arrangement leaves the country steadier, but the integration of the crownlands will go more slowly."
 KRAUS_news_events.2.a:0 "Noted."
 KRAUS_news_events.3.t:0 "[AUS.GetNameDef] Reorganised as a Unitary Union"
 KRAUS_news_events.3.d:0 "Vienna has announced that the Empire is reorganised as a unitary union under the United States decision: one constitution, one government, one chain of command.\n\nDirect rule from the centre has raised industrial and mobilisation efficiency, but deputies of the old crownlands have already begun to question their position in Vienna."
 KRAUS_news_events.3.a:0 "Noted."
 KRAUS_news_events.4.t:0 "The Danube Crisis Is Over"
 KRAUS_news_events.4.d:0 "The crisis surrounding the crownlands along the Danube has been brought to an end. Vienna has since restored administration and finance in the affected provinces, and river traffic and customs have returned to their normal course."
 KRAUS_news_events.4.a:0 "Noted."
 KRAUS_news_events.5.t:0 "Vienna Treats the 1848 Affair With Leniency"
 KRAUS_news_events.5.d:0 "Vienna has announced leniency for the charges left over from 1848: those concerned are pardoned and confiscated property will be returned.\n\nConservative papers call the move too weak; liberal ones have welcomed it."
 KRAUS_news_events.5.a:0 "Noted."
 KRAUS_news_events.6.t:0 "Vienna Punishes the 1848 Affair"
 KRAUS_news_events.6.d:0 "The courts have published the outcome of the prosecution of the events of 1848: several of the leaders of the time have been sentenced in absentia to heavy terms and the societies concerned have been banned.\n\nDeputies of Hungary have protested the verdict."
 KRAUS_news_events.6.a:0 "Noted."
 KRAUS_news_events.7.t:0 "The Powers of the Crown of St. Stephen Are Divided"
 KRAUS_news_events.7.d:0 "Vienna has announced that the territories of the Crown of St. Stephen will be exercised by the crownlands separately: the southern plain goes to Illyria, Transcarpathia to Galicia, and the Danubian plain to Slovakia.\n\nThe Hungarian parliament has expressed strong opposition."
 KRAUS_news_events.7.a:0 "Noted."
 KRAUS_news_events.8.t:0 "Federal Great Charter of the Crownlands Published"
 KRAUS_news_events.8.d:0 "The Federal Great Charter of the Crownlands was published today. It sets out the rights of the crownlands and the duties of the Empire, and divides the powers of the crownland diets and the Imperial Diet.\n\nThe charter is to be submitted shortly to the crownland diets for ratification."
 KRAUS_news_events.8.a:0 "Noted."
 KRAUS_news_events.9.t:0 "The Habsburg World Empire"
 KRAUS_news_events.9.d:0 "With the war over, Habsburg influence has grown rapidly and now reaches beyond Europe.\n\nThe governments concerned have not yet responded publicly."
 KRAUS_news_events.9.a:0 "Noted."
