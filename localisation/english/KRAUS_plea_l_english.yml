l_english:
 KRAUS_dip_ukraine_plea:0 "Ukraine's Plea for Help"
 KRAUS_dip_ukraine_plea_desc:0 "Kiev is lost. The Hetman's envoy changed at Lemberg station to a night train and arrived in Vienna after three days without sleep. He brings not a treaty but a request."
 KRAUS_dip_poland_plea:0 "Poland's Plea for Help"
 KRAUS_dip_poland_plea_desc:0 "The guns of the Russians can be heard on the banks of the Vistula, and the neighbours along the Baltic fall one after another. Warsaw's envoy has waited two days in the antechamber of the Hofburg."
 KRAUS_dip_plea.1.t:0 "Ukraine's Plea for Help"
 KRAUS_dip_plea.1.d:0 "The Hetman's government has lost Kiev in the war against Russia. The envoy says before the throne: Ukraine is willing to entrust the future of the state to the House of Habsburg, if only Vienna will send troops, money and grain.\n\nSomeone at court whispers: this is only another German puppet."
 KRAUS_dip_plea.1.a:0 "Ukraine is only a German puppet; ignore it."
 KRAUS_dip_plea.1.b:0 "Demand that a Habsburg archduke become head of state of Ukraine."
 KRAUS_dip_plea.2.t:0 "Poland's Plea for Help"
 KRAUS_dip_plea.2.d:0 "The Russian offensive presses closer to Warsaw step by step. The Baltic coast, Lithuania and Belarus have fallen, and the Ukrainian front has collapsed. The envoy of the Polish government says before the throne: Poland is willing to let a Habsburg archduke ascend the Polish throne, if only Vienna does not let Warsaw become the next Kiev.\n\nSomeone at court whispers: this is only another German puppet."
 KRAUS_dip_plea.2.a:0 "Poland is only a German puppet; ignore it."
 KRAUS_dip_plea.2.b:0 "Demand that a Habsburg archduke become head of state of Poland."
 KRAUS_dip_plea_ukr_tt:0 "A Habsburg archduke becomes head of state of §YUkraine§!, and Ukraine gains a §Ystronger integration spirit§!."
 KRAUS_dip_plea_pol_tt:0 "A Habsburg archduke becomes head of state of §YPoland§!, and Poland gains a §Ystronger integration spirit§!."
 KRAUS_ukr_aus_integration_strong:0 "Deep Austro-Ukrainian Integration"
 KRAUS_pol_aus_integration_strong:0 "Deep Austro-Polish Integration"
