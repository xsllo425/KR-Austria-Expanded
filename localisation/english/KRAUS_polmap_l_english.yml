 KRAUS_pm_charter_open_tt:0 "The draft of the §YImperial Basic Law§! enters the Diet."
 KRAUS_pm_comp_low:0 "Low"
 KRAUS_pm_comp_mid:0 "Medium"
 KRAUS_pm_comp_high:0 "High"
 KRAUS_pm_law_text:0 "§YImperial Basic Law§! §Y[?KRAUS_pm_law|0]%§!　[KRAUS_pm_GetLawState]"
 KRAUS_pm_law_tt:0 "Drafting progress of the §YImperial Basic Law§!.\n· Only one party in the cabinet circle: drafting begins at once, +2.5% per week.\n· Two or more parties in the cabinet: begins only after the cabinet composition has stayed unchanged for 30 days; +2% per week for two parties, +3% for three, +4% for four.\n· A change of leading party or cabinet: paused this week; a multi-party cabinet counts 30 days again.\nWhen written, the Emperor chooses: sign it into force (the constitutional road, with the Empire's path set as the United States) or postpone. If the Basic Law is not yet in force when the great war breaks out, the Emperor forms a wartime cabinet."
 KRAUS_pm_law_st_single:0 "Led by one party, drafting"
 KRAUS_pm_law_st_multi:0 "Coalition cabinet drafting"
 KRAUS_pm_law_st_wait:0 "Coalition cabinet stable for [?KRAUS_pm_stable_days|0] days; drafting begins at 30"
 KRAUS_pm_law_st_paused:0 "Cabinet just changed, drafting paused"
 KRAUS_pm_law_st_passed:0 "§GPassed§!"
 KRAUS_pm_law_st_none:0 "Waiting for the constitutional committee to meet"
 KRAUS_pm_events.2.t:0 "The Basic Law Draft Is Presented to the Throne"
 KRAUS_pm_events.2.d_single:0 "One party has settled into its position, and the constitution is finished in its image. The draft is sent to the Hofburg to await the Emperor's signature.\n\nThe opposition petitions outside the Diet: this constitution represents only one party. The Emperor's advisers point out that the dark clouds of the great war are already over the border, and a disputed constitution may split the Empire just when it most needs unity."
 KRAUS_pm_events.2.d_multi:0 "Several caucuses have sat in the constitutional committee for months, quarrelled, walked out and returned to the table. The final draft carries the signatures of more than one caucus leader and is now sent to the Hofburg to await the Emperor's signature.\n\nThe Emperor's advisers remind him that once the constitution takes effect, the path of the Empire is fixed. With a great war approaching, some argue that the nature of the state should be decided only when the situation is clearer."
 KRAUS_pm_events.2.a:0 "Sign: from now on the Empire stands under the constitution."
 KRAUS_pm_charter_passed_tt:0 "The §YImperial Basic Law§! takes effect and the Empire takes the §Yconstitutional road§!: when the great war comes, the parliamentary cabinet continues to govern.\n§RThe Empire's path is thereby fixed as the United States; the Greater German and Holy Roman Empire routes are closed.§! \n§R(This route will be opened in a later version; it is not yet implemented.)§!"
 KRAUS_pm_war.1.t:0 "Wartime Imperial Cabinet"
 KRAUS_pm_war.1.d:0 "When news of the world war reached Vienna, the Imperial Basic Law was still lying on the table of the constitutional committee. No party in the Diet can form a cabinet alone, and few are willing to sit together.\n\nThe Emperor summoned the leaders of the four caucuses to the Hofburg: "The constitution can wait; the war will not." That evening the list of a cabinet of national unity was announced, with one minister from each of the four caucuses and the cabinet chaired by the Emperor in person."
 KRAUS_pm_war.1.a:0 "For the Empire, put the quarrels aside first."
 KRAUS_pm_war_cabinet_tt:0 "The §YWartime Imperial Cabinet§! is formed: chaired by the Emperor, §YAuthoritarian Democracy§! governs, and all four caucuses join the ruling coalition.\nThe §YEmperor§! appears on the political map: adopt the Emperor's proposals and the centre of the Diet is pulled towards him.\n§YWillingness to Compromise§! §G+15§!"
 KRAUS_pm_war.2.t:0 "War Under the Constitution"
 KRAUS_pm_war.2.d:0 "When the great war broke out, the Imperial Basic Law was already in force. The Diet sits as usual and the cabinet answers to it as usual; only the agenda has changed to the front, the allies and bread.\n\nThe Emperor delivered a wartime address under the constitution, and the whole Diet rose to its feet."
 KRAUS_pm_war.2.a:0 "Under the constitution, united against the enemy."
 KRAUS_pm_proposer_emp:0 "The Emperor"
 KRAUS_pm_proposer_cab:0 "The Cabinet"
 KRAUS_pm_wi.1.t:0 "Wartime Issue: Whom to Fight, and How Far"
 KRAUS_pm_wi.1.d:0 "The war reports reach the Hofburg one by one from the front. Someone in the Diet begins to ask: until what day must this war be fought? To whom is the conquered land to be entrusted?\n\nThe proposals lie on the table of the wartime cabinet."
 KRAUS_pm_wi.1.a:0 "[KRAUS_pm_GetProposerEmp]: Fight to the end, standing with the allies"
 KRAUS_pm_wi.1.b:0 "Social Democrats: Keep open the channel to negotiate a ceasefire with the enemy's workers' organisations"
 KRAUS_pm_wi.1.c:0 "Christian Socials: Leave the occupied territories to military government"
 KRAUS_pm_wi.2.t:0 "Wartime Issue: How Many Troops the Allies Want"
 KRAUS_pm_wi.2.d:0 "The allies' envoy comes to the door for the third time and asks Vienna to send a few more divisions to the front. The General Staff says there are not enough men, and the Finance Ministry says there is not enough money either.\n\nHow much should the Empire give its allies?"
 KRAUS_pm_wi.2.a:0 "[KRAUS_pm_GetProposerEmp]: Send delegates to the joint high command, trading troops for a voice"
 KRAUS_pm_wi.2.b:0 "National Liberals: Supply materiel instead of men, letting the factories go to the front in place of soldiers"
 KRAUS_pm_wi.2.c:0 "Liberal Democratic Union: Hold the homeland first, expeditions later"
 KRAUS_pm_wi.3.t:0 "Wartime Issue: Bread and Prices"
 KRAUS_pm_wi.3.d:0 "Long queues form outside the bakeries of Vienna. The unions say the workers have worked three months of overtime and their pay is still the prewar figure; the exchange says that if controls continue, merchants will stop buying stock.\n\nWho should set the price of bread in wartime?"
 KRAUS_pm_wi.3.a:0 "Social Democrats: Rationing, supervised by the unions"
 KRAUS_pm_wi.3.b:0 "National Liberals: Free prices to encourage production"
 KRAUS_pm_wi.3.c:0 "[KRAUS_pm_GetProposerEmp]: Establish an Imperial Wartime Relief Office"
 KRAUS_pm_wi.4.t:0 "Wartime Issue: The Crownlands at War"
 KRAUS_pm_wi.4.d:0 "The troops of the crownlands bleed at the front while the diets of the crownlands sit in the rear. They want to know: when the war is over, whom will the Empire remember?\n\nHow should the Empire treat the crownlands in wartime?"
 KRAUS_pm_wi.4.a:0 "[KRAUS_pm_GetProposerEmp]: Merge the crownland regiments into the imperial army under one command"
 KRAUS_pm_wi.4.b:0 "Liberal Democratic Union: Grant the crownland diets wartime authority"
 KRAUS_pm_wi.4.c:0 "Christian Socials: Leave it to parishes and localities, mobilising on the spot"
 KRAUS_pm_pullto_emp_tt:0 "If the §YEmperor§! is present, the §YCentre of the Diet§! moves 10% towards the Emperor."
 KRAUS_pm_pullto_cs_tt:0 "The §YCentre of the Diet§! moves 6% towards the §YChristian Socials§!."
 KRAUS_pm_pullto_ml_tt:0 "The §YCentre of the Diet§! moves 6% towards the §YNational Liberals§!."
 KRAUS_pm_pullto_sd_tt:0 "The §YCentre of the Diet§! moves 6% towards the §YSocial Democrats§!."
 KRAUS_pm_pullto_sl_tt:0 "The §YCentre of the Diet§! moves 6% towards the §YLiberal Democratic Union§!."
 KRAUS_pm_comp_p15_tt:0 "§YWillingness to Compromise§! §G+15§!"
 KRAUS_pm_comp_m15_tt:0 "§YWillingness to Compromise§! §R-15§!"
 KRAUS_pm_warpol_emp:0 "The Emperor: Imperial Wartime Command"
 KRAUS_pm_warpol_emp_desc:0 "One command, one logistics. The Emperor personally chairs the weekly war council."
 KRAUS_pm_warpol_sd:0 "Social Democrats: Factory Committees"
 KRAUS_pm_warpol_sd_desc:0 "Let the workers manage the output of their own shops; the unions guarantee no strikes."
 KRAUS_pm_warpol_cs:0 "Christian Socials: Parish Recruitment"
 KRAUS_pm_warpol_cs_desc:0 "The priest reads out the list on Sunday, and the young men of the valleys set out together."
 KRAUS_pm_warpol_sl:0 "Liberal Democratic Union: Wartime Press and Civil Rights"
 KRAUS_pm_warpol_sl_desc:0 "The newspapers are published as usual and the Diet interpellates as usual. The reasons for fighting must be understandable to everyone."
 KRAUS_pm_warpol_ml:0 "National Liberals: Wartime Credit"
 KRAUS_pm_warpol_ml_desc:0 "The credit banks underwrite war bonds; factories make fewer everyday goods and more guns."
 KRAUS_pm_pullto_emp_dec_tt:0 "The §YCentre of the Diet§! moves 5% towards the §YEmperor§!."
 KRAUS_pm_pullto_cs_dec_tt:0 "The §YCentre of the Diet§! moves 4% towards the §YChristian Socials§!."
 KRAUS_pm_pullto_ml_dec_tt:0 "The §YCentre of the Diet§! moves 4% towards the §YNational Liberals§!."
 KRAUS_pm_pullto_sd_dec_tt:0 "The §YCentre of the Diet§! moves 4% towards the §YSocial Democrats§!."
 KRAUS_pm_pullto_sl_dec_tt:0 "The §YCentre of the Diet§! moves 4% towards the §YLiberal Democratic Union§!."
 KRAUS_pm_events.2.b:0 "Postpone the signature: wait for the storm to pass before deciding the nature of the state."
 KRAUS_pm_charter_shelved_tt:0 "The draft stays in the constitutional committee and the caucuses continue to legislate.\nIf the great war breaks out, the Emperor will chair a §Ycabinet of national unity§!, and the Greater German and Holy Roman Empire routes may open as a result. \n§R(This route will be opened in a later version; it is not yet implemented.)§!"
 KRAUS_pm_law_st_ready:0 "Draft written, awaiting the Emperor's signature"
 KRAUS_pm_law_st_shelved:0 "Signature postponed; draft left for after the war"
 KRAUS_pm_post.1.t:0 "The Post-War Election"
 KRAUS_pm_post.1.a:0 "A new Diet, a new government."
 KRAUS_pm_post.1.d_emperor:0 "The war is over, but the wartime cabinet has not dispersed. None of the four caucuses has put forward a plan the others could nod to, and the centre of the Diet has remained at the Emperor's side.\n\nThe result of the election is a ballot no one is willing to put a name on: the Emperor declares the extraordinary arrangements of wartime to be permanent and governs in person, the Diet sitting as usual but no longer deciding who forms the cabinet."
 KRAUS_pm_post.1.d_1:0 "In the first election after the war the voters gave their ballots to a single name. [KRAUS_pm_GetLeader] forms the cabinet alone, and the Emperor receives the new Chancellor at the Hofburg.\n\nThe wartime cabinet is dissolved and the Emperor returns to his place above the constitution. No one needs to compromise and reforms can be carried out freely; critical voices can only be raised from the opposition benches."
 KRAUS_pm_post.1.d_2:0 "In the first election after the war no party won enough seats. A two-party coalition cabinet headed by [KRAUS_pm_GetLeader] takes shape at the negotiating table, each taking half the programme.\n\nThe wartime cabinet is dissolved and the Emperor returns to his place above the constitution."
 KRAUS_pm_post.1.d_3:0 "In the first election after the war the Diet was cut into several pieces. Three caucuses sit at the same cabinet table, headed by [KRAUS_pm_GetLeader]. Support is broad, but every decision needs three nods.\n\nThe wartime cabinet is dissolved. With the common enemy gone, how long this coalition lasts depends on whether the parties are still willing to compromise."
 KRAUS_pm_post.1.d_4:0 "In the first election after the war all four caucuses entered the cabinet, headed by [KRAUS_pm_GetLeader]. It is the widest coalition in the history of the Imperial Diet.\n\nThe wartime cabinet is dissolved. With the common enemy gone, whether the four caucuses can keep sitting at the same table depends on whether the parties are still willing to compromise."
 KRAUS_pm_crisis.1.t:0 "Cracks in the Coalition Cabinet"
 KRAUS_pm_crisis.1.d:0 "The common enemy of wartime is gone, and the smell of powder at cabinet meetings grows stronger each week. On finance, the crownlands and the army, every matter has two or more caucuses wanting it written differently.\n\nThe secretary of the Chancellery has written the first "reservation" into the minutes."
 KRAUS_pm_crisis.1.a:0 "At this rate, the coalition will not last the year."
 KRAUS_pm_crisis.2.t:0 "The Parties' Ultimatums"
 KRAUS_pm_crisis.2.d:0 "For three months the cabinet has passed no important bill. A caucus proposes openly: either reshape the cabinet and renegotiate every party's place and programme, or admit that the coalition has run its course and shrink to a combination of two parties.\n\nTwo documents lie side by side on the Chancellor's desk."
 KRAUS_pm_crisis.2.a:0 "The time has come to decide."
 KRAUS_pm_crisis_open_tt:0 "Two one-time decisions appear in the decisions panel under the §YPolitical Map§!: §YReshape the Coalition Cabinet§! and §YReturn to a Two-Party Cabinet§!. Choose one and the penalty of the §YCoalition Cabinet Crisis§! is lifted."
 KRAUS_pm_crisis_idea:0 "Cracks in the Coalition Cabinet"
 KRAUS_pm_crisis_idea_desc:0 "Everyone has reservations at cabinet meetings. Either reshape the cabinet or shrink to two parties; only a one-time decision can end this crisis."
 KRAUS_pm_crisis_reform:0 "Reshape the Coalition Cabinet"
 KRAUS_pm_crisis_reform_desc:0 "The parties renegotiate positions and programme at the Hofburg, with the Emperor mediating. It costs a sum of political power to win back the confidence of the coalition."
 KRAUS_pm_crisis_twoparty:0 "Return to a Two-Party Cabinet"
 KRAUS_pm_crisis_twoparty_desc:0 "Admit that the coalition has run its course. The cabinet shrinks and the council table falls quiet."
 KRAUS_pm_crisis_reform_tt:0 "§YWillingness to Compromise§! §G+25§!, and the cracks in the coalition cabinet are healed."
 KRAUS_pm_crisis_twoparty_tt:0 "The cracks in the coalition cabinet are healed; the cabinet returns to a smaller combination according to the centre of the Diet and willingness to compromise."
 KRAUS_pm_end_emperor:0 "Rule of the Emperor"
 KRAUS_pm_end_emperor_desc:0 "The extraordinary arrangements of wartime have become the norm. The Emperor chairs the government, command is unified, and the Diet no longer decides who forms the cabinet."
 KRAUS_pm_end_1:0 "One-Party Government"
 KRAUS_pm_end_1_desc:0 "A government without compromise: the strongest reforms and the most direct opposition."
 KRAUS_pm_end_2:0 "Two-Party Coalition Cabinet"
 KRAUS_pm_end_2_desc:0 "Each party takes half of its programme and politics are stable."
 KRAUS_pm_end_3:0 "Three-Party Coalition Cabinet"
 KRAUS_pm_end_3_desc:0 "Broad support, but every decision needs three nods. A high willingness to compromise is needed to sustain it."
 KRAUS_pm_end_4:0 "Four-Party Coalition Cabinet"
 KRAUS_pm_end_4_desc:0 "The widest coalition in the history of the Imperial Diet: stable but slow to act. A high willingness to compromise is needed to sustain it."
 KRAUS_pm_post_tt:0 "The wartime imperial cabinet is dissolved and the §YEmperor's point§! is put away; the ruling party and ruling coalition are determined anew by the cabinet circle at the centre of the Diet, and receive the corresponding §YCabinet Spirit§!.\nIf the Emperor governs in person, the government becomes §YPaternal Autocracy§! and the centre of the Diet no longer decides the cabinet."
 KRAUS_pm_premier_cs:0 "Wilhelm Miklas"
 KRAUS_pm_premier_ml:0 "Hermann Foppa"
 KRAUS_pm_premier_sd:0 "Karl Renner"
 KRAUS_pm_premier_sl:0 "Gustav Stolper"
 KRAUS_pm_premier_none:0 "undecided"
