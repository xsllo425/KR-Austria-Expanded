l_english:
 KRAUS_polmap_category:0 "The Centre of the Imperial Diet"
 KRAUS_polmap_category_desc:0 "Each of the four caucuses holds a corner of this map. Wherever the centre of the Diet falls, that caucus leads the cabinet; caucuses close enough to the centre may join it."
 KRAUS_pm_bg_tt:0 "§YHorizontal axis§!: economy, state regulation on the left, free market on the right.\n§YVertical axis§!: imperial structure, centralisation above, crownland autonomy below.\nCaucuses at the two ends of a dotted line exclude each other."
 KRAUS_pm_dot_tt:0 "§YCentre of the Diet§!: economy [?KRAUS_pm_x|0], structure [?KRAUS_pm_y|0].\nCaucuses within the white circle may join the cabinet; the size of the circle is set by the §YWillingness to Compromise§! ([?KRAUS_pm_comp|0])."
 KRAUS_pm_emperor_tt:0 "§YThe Emperor§!: appears in the wartime imperial cabinet phase. In the post-war election, the distance of the centre of the Diet from the Emperor counts."
 KRAUS_pm_readout:0 "Leading: §Y[KRAUS_pm_GetLeader]§!　Cabinet: [KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]　Willingness to compromise: §Y[KRAUS_pm_GetComp]§!"
