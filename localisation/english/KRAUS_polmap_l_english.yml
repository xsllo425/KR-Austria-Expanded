 KRAUS_pm_activate_tt:0 "The §YEmperor's Balance§! is put away and replaced by the §YCentre of the Imperial Diet§!: where the balance finally tilted and how the Danube crisis was ended decide where on the map the centre starts."
 KRAUS_pm_pull_sd_tt:0 "The §YCentre of the Diet§! moves towards the §YSocial Democrat§! corner (leading party 3%, junior party half)."
 KRAUS_pm_pull_cs_tt:0 "The §YCentre of the Diet§! moves towards the §YChristian Social§! corner (leading party 3%, junior party half)."
 KRAUS_pm_pull_sl_tt:0 "The §YCentre of the Diet§! moves towards the §YLiberal Democratic Union§! corner (leading party 3%, junior party half)."
 KRAUS_pm_pull_ml_tt:0 "The §YCentre of the Diet§! moves towards the §YNational Liberal§! corner (leading party 3%, junior party half)."
 KRAUS_pm_events.1.t:0 "A New Majority in the Diet"
 KRAUS_pm_events.1.d_sd:0 "The centre of the Diet has slid to the side of the workers. The leader of the Social Democratic caucus is invited to the Hofburg, and that evening the new cabinet list appears on the front page of the Arbeiter-Zeitung."
 KRAUS_pm_events.1.d_cs:0 "The centre of the Diet has slid to the parishes and fields. The leader of the Christian Social caucus is invited to the Hofburg, and the new cabinet list spreads through the valleys after Sunday's sermon."
 KRAUS_pm_events.1.d_sl:0 "The centre of the Diet has slid to the citizens and the newspapers of the many nations. The leader of the Liberal Democratic Union is invited to the Hofburg, and the new cabinet list is printed in seven languages."
 KRAUS_pm_events.1.d_ml:0 "The centre of the Diet has slid to the exchange. The leader of the National Liberals is invited to the Hofburg, and before the cabinet list is announced the shares of the credit banks have already risen."
 KRAUS_pm_events.1.a:0 "The Diet decides."
 KRAUS_pm_test_activate:0 "Test: Simulate Finishing "Tomorrow's Empire" (Balance Put Away, Map Enabled)"
 KRAUS_pm_test_activate_desc:0 "Same hand-over effect as finishing "Tomorrow's Empire", but does not trigger the second election."
 KRAUS_pm_pull_fed_tt:0 "The §Ycentre of the Reichsrat§! moves 3% towards the side between the §YSocial Democrats§! and the §YLiberal Democrats§! (crownland autonomy)."
 KRAUS_pm_pull_mkt_tt:0 "The §Ycentre of the Reichsrat§! moves 3% towards the side between the §YLiberal Democrats§! and the §YNational Liberals§! (free market)."
 KRAUS_pm_pull_imp_tt:0 "The §Ycentre of the Reichsrat§! moves 3% towards the side between the §YNational Liberals§! and the §YChristian Socials§! (centralism)."
 KRAUS_pm_issue.1.t:0 "Language: Which Tongue the Empire Speaks"
 KRAUS_pm_issue.1.d0:0 "The first debate after the second election is about neither money nor soldiers, but words. The deputies from Prague want to speak in Czech and those from Zagreb to answer in Croatian; the Speaker has rung his bell all afternoon.\n\nSchools, offices and orders: which language will the Empire finally use?"
 KRAUS_pm_issue.1.a:0 "German is the common language of the Empire"
 KRAUS_pm_issue.1.b:0 "All languages are equal"
 KRAUS_pm_issue.1.c:0 "Both languages side by side, each giving way a step"
 KRAUS_pm_issue.2.t:0 "Finance: Whose Money, Who Manages It"
 KRAUS_pm_issue.2.d0:0 "The language dispute ended in Vienna's victory, but the delegates of the crownlands wrote the account in another book: if Vienna decides the language, at least the money should be theirs to manage.\n\nHow should the Empire's budget be drawn up?"
 KRAUS_pm_issue.2.d1:0 "The bill for equal languages has only just passed, and Vienna's Finance Ministry has already worked out the sum: official papers in seven languages, seven sets of translators, seven printing bills. The minister asks the Diet: who will pay?\n\nHow should the Empire's budget be drawn up?"
 KRAUS_pm_issue.2.d2:0 "The bilingual compromise has left everyone dissatisfied, and everyone is still seated in the Diet. The next item on the table is the budget, and this time no one wants to give way a step.\n\nHow should the Empire's budget be drawn up?"
 KRAUS_pm_issue.2.a:0 "A single budget, one ledger in Vienna"
 KRAUS_pm_issue.2.b:0 "The crownlands keep their own taxing power"
 KRAUS_pm_issue.2.c:0 "A unified market led by the exchange"
 KRAUS_pm_issue.2.d:0 "State-led public investment"
 KRAUS_pm_issue.3.t:0 "Administration: Vienna's Ministries and the Crownland Offices"
 KRAUS_pm_issue.3.d0:0 "The crownlands have taken back the power to tax and now want back the men who collect the taxes. The provincial governments hand in a list: which offices should be appointed locally and which should remain with Vienna.\n\nWhom should the Empire's offices obey?"
 KRAUS_pm_issue.3.d1:0 "The budget is settled, but money must pass through the offices before it can be spent. Vienna's ministries and the crownland offices fight over the right to sign every document.\n\nWhom should the Empire's offices obey?"
 KRAUS_pm_issue.3.a:0 "Directly governed by Vienna"
 KRAUS_pm_issue.3.b:0 "Crownland governments manage themselves"
 KRAUS_pm_issue.3.c:0 "Professional civil service reform: examinations, regardless of birth"
 KRAUS_pm_issue.4.t:0 "The Army: One Imperial Army, or Six Crownland Armies"
 KRAUS_pm_issue.4.d0:0 "After the offices have been brought back to Vienna, the General Staff is the first to call: if documents need only one signature, why do orders need six?\n\nWhose orders should the Empire's army obey?"
 KRAUS_pm_issue.4.d1:0 "The Diet has argued out language, money and offices, and the last question is raised by the General Staff: once war breaks out, whose orders do the crownland troops follow?\n\nWhose orders should the Empire's army obey?"
 KRAUS_pm_issue.4.a:0 "Unified command, one imperial army"
 KRAUS_pm_issue.4.b:0 "Keep the crownland regiments, merge them in wartime"
 KRAUS_pm_issue.4.c:0 "Professionalisation reform: train first, discuss allegiance later"
 KRAUS_pm_issue.5.t:0 "The Imperial Basic Law: The Draft Is on the Table"
 KRAUS_pm_issue.5.d0:0 "After the four debates, the deputies find that the differences between them are not as great as they had imagined. For the first time the doors of the constitutional committee stand open during its meetings, and the first page of the draft has been written.\n\nWhat remains is to get enough people to sign it."
 KRAUS_pm_issue.5.d1:0 "After the four debates only one consensus remains in the Diet: no one trusts anyone. The constitutional committee meets behind closed doors in a small room of the Hofburg; the draft has been revised eleven times and none can be taken outside.\n\nTo write a constitution that all recognise, one must either wait for one party to settle into its position, or for enough parties to be willing to sit together."
 KRAUS_pm_issue.5.d2:0 "After the four debates, the conclusions on language, money, offices and army have been copied into a draft, one by one. The constitutional committee says this is the first draft of the Imperial Basic Law.\n\nWhat remains is to get enough people to sign it."
 KRAUS_pm_issue.5.a:0 "Hand the draft to the Diet."
 KRAUS_pm_mv_xmym_tt:0 "The §YCentre of the Diet§! moves towards §YState Regulation and Centralisation§!."
 KRAUS_pm_mv_xm_tt:0 "The §YCentre of the Diet§! moves towards §YState Regulation§!."
 KRAUS_pm_mv_xmyp_tt:0 "The §YCentre of the Diet§! moves towards §YState Regulation and Crownland Autonomy§!."
 KRAUS_pm_mv_ym_tt:0 "The §YCentre of the Diet§! moves towards §YCentralisation§!."
 KRAUS_pm_mv_yp_tt:0 "The §YCentre of the Diet§! moves towards §YCrownland Autonomy§!."
 KRAUS_pm_mv_xpym_tt:0 "The §YCentre of the Diet§! moves towards §YFree Market and Centralisation§!."
 KRAUS_pm_mv_xp_tt:0 "The §YCentre of the Diet§! moves towards §YFree Market§!."
 KRAUS_pm_mv_xpyp_tt:0 "The §YCentre of the Diet§! moves towards §YFree Market and Crownland Autonomy§!."
