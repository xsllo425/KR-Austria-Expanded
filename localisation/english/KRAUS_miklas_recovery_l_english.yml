 KRAUS_miklas_recovery_1:0 "Parish Credit Network"
 KRAUS_miklas_recovery_1_desc:0 "Parishes, mutual societies, and savings institutions link savers to producers, providing dependable finance for recovery. The network leans on local trust and household-by-household records, and must keep mutual bodies from becoming tax offices. It reaches villages banks ignore but cannot carry all the risk alone. Credit works if everyone keeps to the rules."
 KRAUS_miklas_recovery_2:0 "Public Works Tenders"
 KRAUS_miklas_recovery_2_desc:0 "The government coordinates public works contracts so jobs and infrastructure support each other. Bidding is open, tenders state pay, deadlines, and local-hiring shares, and the works bureau supervises. Openness curbs favoritism but slows things down and annoys contractors used to private arrangements. The government must choose a balance between transparency and speed."
 KRAUS_miklas_recovery_3:0 "Crownland Procurement Agreement"
 KRAUS_miklas_recovery_3_desc:0 "Domestic firms want dependable orders, while crownland merchants and local delegates ask what central procurement will leave for them. Miklas proposes linking these scattered demands through a purchasing agreement: orders, deliveries and terms of participation must be clear before anyone signs. Vienna cannot declare its partners' consent unilaterally, and integration must not leave existing contracts without effect."
 KRAUS_miklas_recovery_4:0 "Social-Partner Reconstruction Committee"
 KRAUS_miklas_recovery_4_desc:0 "Construction and procurement have brought workers, firms and local bodies together, but representation remains disputed. Small unions demand participation, employers question unverified membership rolls, and reformers refuse to leave social partners with only the right to sign. Miklas brings these disputes into the reconstruction committee, providing a shared agenda and channels of appeal. It needs rules the parties will accept, rather than new authority standing above them all."
