l_english:
 KRAUS_fr_AUS_cs_national_austerity_council_n_p1:0 "National Austerity Council"
 KRAUS_fr_AUS_cs_national_austerity_council_n_cs:0 "National Austerity Council"
 KRAUS_fr_AUS_cs_national_austerity_council_n_sd:0 "Council for Responsible Austerity"
 KRAUS_fr_AUS_cs_national_austerity_council_n_ml:0 "Budget Discipline Council"
 KRAUS_fr_AUS_cs_national_austerity_council_n_sl:0 "Public Spending Review Board"
 KRAUS_fr_AUS_cs_national_austerity_council_d_p1:0 "The Finance Ministry convenes banks, industry and the provinces into an austerity council to bring spending down to what the state can bear. It must decide which projects wait, which debts are paid, and carry the unemployment and anger that follow. Austerity steadies the books but does not buy trust by itself; the government must say where the savings will go."
 KRAUS_fr_AUS_cs_national_austerity_council_d_cs:0 "The Christian Socials lay the Finance Ministry's ledgers on one table with banks, industry and the provinces, and decide which projects wait and which debts are paid. Austerity steadies the books but does not buy trust by itself."
 KRAUS_fr_AUS_cs_national_austerity_council_d_sd:0 "The Social Democrats will not let workers carry austerity alone. Unions sit beside banks and industry; every cut must be explained: who bears it, and where the savings go."
 KRAUS_fr_AUS_cs_national_austerity_council_d_ml:0 "The National Liberals want numbers that can be checked: the council ranks spending project by project, postpones what can wait, pays what is owed and levels the books first."
 KRAUS_fr_AUS_cs_national_austerity_council_d_sl:0 "The Liberal Democratic Union insists that cuts too pass before parliament. The review board puts every reduction on the table so taxpayers can see where the money went."
 KRAUS_fr_AUS_cs_2_n_p1:0 "Controlling Inflation"
 KRAUS_fr_AUS_cs_2_n_cs:0 "Controlling Inflation"
 KRAUS_fr_AUS_cs_2_n_sd:0 "Protecting the Wage Packet"
 KRAUS_fr_AUS_cs_2_n_ml:0 "Currency and Credit"
 KRAUS_fr_AUS_cs_2_n_sl:0 "Steadying Prices and Credit"
 KRAUS_fr_AUS_cs_2_d_p1:0 "Rising prices eat at wages that had only just begun to recover. The government tightens the currency, caps the prices of some necessities and recalls paper money through bonds. Controlling inflation offends speculators and creditors, and starves factories of cheap credit. The Treasury must keep weighing stable money against production, and every misstep has a price."
 KRAUS_fr_AUS_cs_2_d_cs:0 "Prices eat at wages that had only just begun to recover. The Christian Socials tighten the currency, cap necessities and recall paper money through bonds, preferring to offend speculators rather than lose the currency."
 KRAUS_fr_AUS_cs_2_d_sd:0 "The Social Democrats put price controls first: necessities capped, bonds recalling paper money, so that the money in the wage packet does not get thinner each week."
 KRAUS_fr_AUS_cs_2_d_ml:0 "The National Liberals hold that stable money is the basis of all business: tighten the currency, recall the paper and give credit somewhere to land again."
 KRAUS_fr_AUS_cs_2_d_sl:0 "The Liberal Democratic Union seeks a balance between stable money and production: price caps only on necessities, the rest left to markets and credit unions."
 KRAUS_fr_AUS_cs_3_n_p1:0 "Funding Key Projects"
 KRAUS_fr_AUS_cs_3_n_cs:0 "Funding Key Projects"
 KRAUS_fr_AUS_cs_3_n_sd:0 "Funding Public Works"
 KRAUS_fr_AUS_cs_3_n_ml:0 "Funding Tendered Works"
 KRAUS_fr_AUS_cs_3_n_sl:0 "Funding Infrastructure"
 KRAUS_fr_AUS_cs_3_d_p1:0 "The Finance Ministry stops spreading money evenly and concentrates it on a few key projects: repairing vital railways, expanding power and building-material capacity. Money flows as work progresses, and the works offices must deliver accounts and results on time. Concentration works faster but angers the regions left off the list. Who is on the list depends on capability and political weight."
 KRAUS_fr_AUS_cs_3_d_cs:0 "The Christian Socials stop spreading money evenly and fund only a few key projects: vital railways, power and building materials. Money follows progress and accounts are due on time."
 KRAUS_fr_AUS_cs_3_d_sd:0 "The Social Democrats direct funds to the works that create the most jobs: railways, power stations, building-material plants. The list is reviewed jointly by the works offices and the unions."
 KRAUS_fr_AUS_cs_3_d_ml:0 "The National Liberals put key projects out to open tender; funds follow progress and contractors compete on price and schedule."
 KRAUS_fr_AUS_cs_3_d_sl:0 "The Liberal Democratic Union ties funding to the provincial diets: railways, power, building materials, each province applies according to its capacity and the centre reviews them together."
 KRAUS_fr_AUS_cs_4_n_p1:0 "Compromise with the Social Democrats"
 KRAUS_fr_AUS_cs_4_n_cs:0 "Compromise with the Social Democrats"
 KRAUS_fr_AUS_cs_4_n_sd:0 "Compromise with the Christian Socials"
 KRAUS_fr_AUS_cs_4_n_ml:0 "Compromise with the Two Labour Parties"
 KRAUS_fr_AUS_cs_4_n_sl:0 "Compromise with Left and Right"
 KRAUS_fr_AUS_cs_4_d_p1:0 "The Miklas government needs the Social Democrats' cooperation in parliament to pass the austerity and tax package. Compromise means concessions on welfare, wages and union rights in return for support for fiscal discipline. Hardliners say too much was given away, and the Social Democrats fear being tied to austerity. The deal will hold for a while, but both sides now owe each other political favours."
 KRAUS_fr_AUS_cs_4_d_cs:0 "The Christian Socials need the Social Democrats in parliament to pass the austerity and tax package. They give up part of welfare, wages and union rights in return for fiscal discipline."
 KRAUS_fr_AUS_cs_4_d_sd:0 "The Social Democrats need the Christian Socials in parliament to pass welfare and tax measures. They give up some fiscal discipline in return for security for workers."
 KRAUS_fr_AUS_cs_4_d_ml:0 "The National Liberals have no majority and must bargain separately with the Christian Socials and the Social Democrats, trading limited concessions for the budget."
 KRAUS_fr_AUS_cs_4_d_sl:0 "The Liberal Democratic Union sits between the Christian Socials and the Social Democrats and bargains item by item: a little welfare, a little discipline, for the budget to pass."
 KRAUS_fr_AUS_cs_5_n_p1:0 "Farmer Subsidies"
 KRAUS_fr_AUS_cs_5_n_cs:0 "Farmer Subsidies"
 KRAUS_fr_AUS_cs_5_n_sd:0 "Rural Mutual Aid Subsidies"
 KRAUS_fr_AUS_cs_5_n_ml:0 "Agricultural Credit Subsidies"
 KRAUS_fr_AUS_cs_5_n_sl:0 "Smallholder and Cooperative Subsidies"
 KRAUS_fr_AUS_cs_5_d_p1:0 "Rural bankruptcy would carry unemployment and anger into the cities. The government pays targeted subsidies to smallholders and cooperatives, on condition that they keep up food supply and take part in local credit guarantees. Subsidies ease the immediate crisis but do not change the fundamental problem of low prices. Landlords and rich farmers want their share, and the ministries must draw lines among the many demands of the countryside."
 KRAUS_fr_AUS_cs_5_d_cs:0 "Rural bankruptcy would carry unemployment and anger into the cities. The Christian Socials pay targeted subsidies to smallholders and cooperatives, on condition of stable food supply and local credit guarantees."
 KRAUS_fr_AUS_cs_5_d_sd:0 "The Social Democrats pay subsidies to cooperatives and farm labourers rather than great estates. With food supply steady, city people can afford bread."
 KRAUS_fr_AUS_cs_5_d_ml:0 "The National Liberals turn subsidies into credit: farmers borrow from cooperative banks on collateral, and the treasury subsidises the interest."
 KRAUS_fr_AUS_cs_5_d_sl:0 "The Liberal Democratic Union pays subsidies to smallholders and cooperatives and demands open accounts so that big landowners do not swallow most of the shares."
 KRAUS_fr_AUS_cs_6_n_p1:0 "Mending Social Divisions"
 KRAUS_fr_AUS_cs_6_n_cs:0 "Mending Social Divisions"
 KRAUS_fr_AUS_cs_6_n_sd:0 "Closing the Gaps Between Town, Country and Trade"
 KRAUS_fr_AUS_cs_6_n_ml:0 "Chamber Mediation Committee"
 KRAUS_fr_AUS_cs_6_n_sl:0 "Social Mediation Committee"
 KRAUS_fr_AUS_cs_6_d_p1:0 "The side effects of austerity and subsidies begin to show: workers are discontent, provinces complain, employers and unions blame each other. The government mends the cracks with mediation and limited concessions, bringing the parties back to the table. Mending is not reconciliation; it only keeps the conflict from erupting now. If the next budget tightens again, the existing compromises may be overturned."
 KRAUS_fr_AUS_cs_6_d_cs:0 "The side effects of austerity and subsidies begin to show: workers are discontent, provinces complain. The Christian Socials bring the parties back to the table with mediation and limited concessions, hoping only that conflict does not erupt now."
 KRAUS_fr_AUS_cs_6_d_sd:0 "The Social Democrats seat workers, farmers and small traders at one table, let them voice their grievances and then check them item by item against the budget."
 KRAUS_fr_AUS_cs_6_d_ml:0 "The National Liberals ask chambers of commerce and guilds to mediate labour and trade disputes, trading limited concessions for continued business."
 KRAUS_fr_AUS_cs_6_d_sl:0 "The Liberal Democratic Union sets up a mediation committee of all sides, so that disputes get a first round outside parliament."
 KRAUS_fr_AUS_cs_7_n_p1:0 "Vienna Social Accord"
 KRAUS_fr_AUS_cs_7_n_cs:0 "Vienna Social Accord"
 KRAUS_fr_AUS_cs_7_n_sd:0 "Vienna Labour Accord"
 KRAUS_fr_AUS_cs_7_n_ml:0 "Vienna Trade Accord"
 KRAUS_fr_AUS_cs_7_n_sl:0 "Vienna Citizens' Accord"
 KRAUS_fr_AUS_cs_7_d_p1:0 "The government gathers employers, unions and provincial delegates and writes wages, hours and working conditions into a social accord, in exchange for short-term industrial peace. The accord establishes procedures of consultation and arbitration; it does not declare the crisis of the system over. All sides sign, and keep the right to bargain again in the next round. Order now has one more enforceable agreement."
 KRAUS_fr_AUS_cs_7_d_cs:0 "The government gathers employers, unions and provincial delegates and writes wages, hours and conditions into a social accord, in exchange for short-term industrial peace. The accord sets procedures of consultation and arbitration."
 KRAUS_fr_AUS_cs_7_d_sd:0 "The Social Democrats push employers and unions to sign a labour accord: wages, hours and conditions are written down, and disputes go to arbitration."
 KRAUS_fr_AUS_cs_7_d_ml:0 "The National Liberals gather the chambers of commerce and the unions and write wages, hours and order cycles into an accord so that business can go on."
 KRAUS_fr_AUS_cs_7_d_sl:0 "The Liberal Democratic Union gathers employers, unions and provincial diets and writes wages, hours and conditions into a public accord."
 KRAUS_fr_AUS_cs_fill_the_coffers_n_p1:0 "Fill the Coffers"
 KRAUS_fr_AUS_cs_fill_the_coffers_n_cs:0 "Fill the Coffers"
 KRAUS_fr_AUS_cs_fill_the_coffers_n_sd:0 "A Levy on the Wealthy"
 KRAUS_fr_AUS_cs_fill_the_coffers_n_ml:0 "Tidying Bonds and Advances"
 KRAUS_fr_AUS_cs_fill_the_coffers_n_sl:0 "Advances With Open Accounts"
 KRAUS_fr_AUS_cs_fill_the_coffers_d_p1:0 "The treasury is nearly empty. The Finance Ministry collects back taxes and tidies bonds on one hand, and seeks short-term advances from the banks on the other. Filling the gap is only the first step; every sum must be accounted for in origin and use. Business wants tax cuts and the provinces want grants, and everyone knows that every coin now comes with conditions."
 KRAUS_fr_AUS_cs_fill_the_coffers_d_cs:0 "The treasury is nearly empty. The Christian Socials collect back taxes and tidy bonds on one hand, and seek short-term advances from the banks on the other, accounting for every sum."
 KRAUS_fr_AUS_cs_fill_the_coffers_d_sd:0 "The Social Democrats put the gap on the shoulders best able to bear it: back taxes, tidied bonds and a levy on great fortunes."
 KRAUS_fr_AUS_cs_fill_the_coffers_d_ml:0 "The National Liberals negotiate advance terms with the banks and tidy bonds, filling the treasury step by step by market means."
 KRAUS_fr_AUS_cs_fill_the_coffers_d_sl:0 "The Liberal Democratic Union demands that the Finance Ministry publish the story of every advance and back tax, then borrows from banks and the treasury to fill the gap."
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_p1:0 "Public Welfare Reform"
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_cs:0 "Welfare Reform"
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_sd:0 "Public Welfare Reform"
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_ml:0 "Welfare Fund Reform"
 KRAUS_fr_AUS_sdap_industrial_workers_council_n_sl:0 "Public Welfare Reform"
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_p1:0 "Workers' councils and owners cannot agree on the scope of welfare. The government chooses to expand public welfare first: injury, unemployment and medical cover are written into clauses that can be checked, administered jointly by unions and local bodies. For welfare to become real it needs finance and employers; if only a promise is issued on paper, workers will still dismiss it as empty words."
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_cs:0 "The Christian Socials are willing to write injury, unemployment and medical cover into clauses that can be checked, administered jointly by parishes and guilds. Welfare needs someone who can carry it."
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_sd:0 "Workers' councils and owners cannot agree, and the Social Democrats choose to expand public welfare first: injury, unemployment and medical cover written into clauses that can be checked, run jointly by unions and local bodies."
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_ml:0 "The National Liberals hold that welfare should be backed by funds: employers and employees pay in together, and the government only supervises and fills the gaps."
 KRAUS_fr_AUS_sdap_industrial_workers_council_d_sl:0 "The Liberal Democratic Union writes welfare as a citizen's right: the clauses for injury, unemployment and medical cover are public and supervised by provincial diets."
 KRAUS_fr_AUS_sdap_1_n_p1:0 "Schools, Hospitals and Parks"
 KRAUS_fr_AUS_sdap_1_n_cs:0 "Schools, Hospitals and Churches"
 KRAUS_fr_AUS_sdap_1_n_sd:0 "Schools, Hospitals and Parks"
 KRAUS_fr_AUS_sdap_1_n_ml:0 "Schools, Hospitals and Chamber Buildings"
 KRAUS_fr_AUS_sdap_1_n_sl:0 "Schools, Hospitals and Libraries"
 KRAUS_fr_AUS_sdap_1_d_p1:0 "The government sends the first public funds where they are most visible: repairing schools and hospitals, clearing the parks and workers' districts of the suburbs. Local bodies and unions arrange the labour together, and every item of material and every payroll is logged. These projects will not bring output at once, but they let people see that recovery is not just words, and they teach contractors to build under supervision."
 KRAUS_fr_AUS_sdap_1_d_cs:0 "The Christian Socials send the first public funds where they are most visible: repairing schools, hospitals and churches, with labour arranged by the parishes and local bodies."
 KRAUS_fr_AUS_sdap_1_d_sd:0 "The Social Democrats send the first public funds where they are most visible: repairing schools and hospitals, clearing parks and workers' districts, with labour arranged jointly by unions and local bodies."
 KRAUS_fr_AUS_sdap_1_d_ml:0 "The National Liberals have chambers and local bodies jointly fund the repair of schools, hospitals and public buildings, logging material and payroll item by item."
 KRAUS_fr_AUS_sdap_1_d_sl:0 "The Liberal Democratic Union sends the first public funds to schools, hospitals and municipal libraries, with provincial diets supervising labour and accounts."
 KRAUS_fr_AUS_sdap_2_n_p1:0 "Friends of Nature"
 KRAUS_fr_AUS_sdap_2_n_cs:0 "Parish Hiking Society"
 KRAUS_fr_AUS_sdap_2_n_sd:0 "Friends of Nature"
 KRAUS_fr_AUS_sdap_2_n_ml:0 "Mountain Travel Association"
 KRAUS_fr_AUS_sdap_2_n_sl:0 "Citizens' Hiking Club"
 KRAUS_fr_AUS_sdap_2_d_p1:0 "The hiking parties of the Friends of Nature carried Vienna's workers into the mountains and brought city politics to the countryside. The cabinet is willing to support such activity: workers need rest, and conservative villages should have the chance to know the neighbours so often described as dangerous radicals. The organisers set out with maps and rucksacks, and the locals watch to see whether the visitors bring conversation or another round of propaganda."
 KRAUS_fr_AUS_sdap_2_d_cs:0 "The Christian Socials support hikes and pilgrimages organised by parishes and societies, so that city and country meet on the same road."
 KRAUS_fr_AUS_sdap_2_d_sd:0 "The hiking parties of the Friends of Nature carry Vienna's workers into the mountains and bring city politics to the countryside. The cabinet supports it, so that workers and conservative villages come to know each other."
 KRAUS_fr_AUS_sdap_2_d_ml:0 "The National Liberals support private travel associations that open mountain paths and inns, making travel a respectable business and letting townspeople know the countryside."
 KRAUS_fr_AUS_sdap_2_d_sl:0 "The Liberal Democratic Union funds hiking societies of every nationality, so that people of different languages come to know each other on the same mountain path."
 KRAUS_fr_AUS_sdap_3_n_p1:0 "Imperial Radio Network"
 KRAUS_fr_AUS_sdap_3_n_cs:0 "Imperial Radio Network"
 KRAUS_fr_AUS_sdap_3_n_sd:0 "Imperial Radio Network"
 KRAUS_fr_AUS_sdap_3_n_ml:0 "Commercial Radio Network"
 KRAUS_fr_AUS_sdap_3_n_sl:0 "Multilingual Radio Network"
 KRAUS_fr_AUS_sdap_3_d_p1:0 "The government sets about tidying and extending radio coverage so that decrees, market prices and weather can reach town and country. Multilingual programmes must consider every nationality and also serve coordination and mobilisation. Radio is one of the few unifying tools of the recovery period, but whoever controls the programming influences how people understand this crisis."
 KRAUS_fr_AUS_sdap_3_d_cs:0 "The government tidies and extends radio coverage so that decrees, market prices and weather reach town and country. Programmes must consider every nationality and also serve order."
 KRAUS_fr_AUS_sdap_3_d_sd:0 "The Social Democrats tidy and extend radio coverage so that decrees, market prices and weather reach town and country. Multilingual programmes consider every nationality and also serve coordination."
 KRAUS_fr_AUS_sdap_3_d_ml:0 "The National Liberals link radio with commercial stations and market quotations so that orders and prices reach every province the same day."
 KRAUS_fr_AUS_sdap_3_d_sl:0 "The Liberal Democratic Union promotes broadcasts in every nationality's language so that listeners of each hear their own news."
 KRAUS_fr_AUS_sdap_4_n_p1:0 "Work for the Unemployed"
 KRAUS_fr_AUS_sdap_4_n_cs:0 "Work for the Unemployed"
 KRAUS_fr_AUS_sdap_4_n_sd:0 "Work for the Unemployed"
 KRAUS_fr_AUS_sdap_4_n_ml:0 "Work for Relief"
 KRAUS_fr_AUS_sdap_4_n_sl:0 "Public Works Brigades"
 KRAUS_fr_AUS_sdap_4_d_p1:0 "Relief cannot rest on bread tickets alone. The government enrols the unemployed in public works brigades to build roads and embankments and clear rivers, and fixes hours and minimum wages with the unions. The line between relief and labour blurs: those given work have an income, those not enrolled still wait outside. The government must explain who goes first and why."
 KRAUS_fr_AUS_sdap_4_d_cs:0 "Relief cannot rest on bread tickets alone. The Christian Socials enrol the unemployed in public works brigades to build roads and embankments and clear rivers, paid at the minimum rate."
 KRAUS_fr_AUS_sdap_4_d_sd:0 "Relief cannot rest on bread tickets alone. The Social Democrats enrol the unemployed in public works brigades and fix hours and minimum wages with the unions. Those given work have an income; those not enrolled still wait."
 KRAUS_fr_AUS_sdap_4_d_ml:0 "The National Liberals have the unemployed work for relief: roads and embankments, with wages paid jointly by the treasury and contractors, and no separate dole."
 KRAUS_fr_AUS_sdap_4_d_sl:0 "The Liberal Democratic Union sets up public works brigades supervised by provincial diets, with places and wages made public so that no party can monopolise them."
 KRAUS_fr_AUS_sdap_5_n_p1:0 "Working Capital for Reopening"
 KRAUS_fr_AUS_sdap_5_n_cs:0 "Working Capital for Reopening"
 KRAUS_fr_AUS_sdap_5_n_sd:0 "Working Capital for Reopening"
 KRAUS_fr_AUS_sdap_5_n_ml:0 "Enterprise Working Capital"
 KRAUS_fr_AUS_sdap_5_n_sl:0 "Small Enterprise Working Capital"
 KRAUS_fr_AUS_sdap_5_d_p1:0 "Factories cannot reopen for lack of working capital. The government joins cooperative banks and union funds to give short-term credit to firms willing to accept labour consultation, earmarked for materials and wages. The credit has conditions: accounts are inspected and wages may not be withheld. Funds are limited, and the order of approval itself causes argument; which factories get money first becomes a new political question."
 KRAUS_fr_AUS_sdap_5_d_cs:0 "Factories cannot reopen for lack of working capital. The Christian Socials join cooperative banks to give short-term credit to firms willing to reopen, earmarked for materials and wages, with accounts inspected."
 KRAUS_fr_AUS_sdap_5_d_sd:0 "The Social Democrats join cooperative banks and union funds to give short-term credit to firms willing to accept labour consultation, earmarked for materials and wages, with no wage arrears."
 KRAUS_fr_AUS_sdap_5_d_ml:0 "The National Liberals have the banks lead on short-term credit, with the market setting the rate and the treasury only guaranteeing."
 KRAUS_fr_AUS_sdap_5_d_sl:0 "The Liberal Democratic Union gives short-term credit to small firms and cooperative workshops first, with the order of approval public and supervised by provincial diets."
 KRAUS_fr_AUS_sdap_6_n_p1:0 "Clearing Supply Bottlenecks"
 KRAUS_fr_AUS_sdap_6_n_cs:0 "Clearing Supply Bottlenecks"
 KRAUS_fr_AUS_sdap_6_n_sd:0 "Clearing Supply Bottlenecks"
 KRAUS_fr_AUS_sdap_6_n_ml:0 "Opening the Flow of Goods"
 KRAUS_fr_AUS_sdap_6_n_sl:0 "Interprovincial Supply Talks"
 KRAUS_fr_AUS_sdap_6_d_p1:0 "Coal, steel and machine tools flow poorly between the provinces, and projects repeatedly halt for want of materials. The government coordinates railway capacity, standardises some orders and sets up channels for interprovincial allocation. Clearing the bottleneck does not mean output returns at once; it means sites already opened no longer stand idle waiting for materials. Who comes first must still be negotiated again and again among the provinces."
 KRAUS_fr_AUS_sdap_6_d_cs:0 "Coal, steel and machine tools flow poorly between provinces. The Christian Socials coordinate railway capacity and standardise some orders so that sites already opened no longer stand idle waiting for materials."
 KRAUS_fr_AUS_sdap_6_d_sd:0 "The Social Democrats coordinate railway capacity, standardise some orders and set up interprovincial allocation talks so that opened sites no longer stand idle waiting for materials."
 KRAUS_fr_AUS_sdap_6_d_ml:0 "The National Liberals remove unnecessary barriers and formalities between provinces, so that coal, steel and machine tools find buyers at market prices."
 KRAUS_fr_AUS_sdap_6_d_sl:0 "The Liberal Democratic Union sets up supply talks with delegates from every provincial diet; coal and steel are discussed first and allocated afterwards."
 KRAUS_fr_AUS_sdap_7_n_p1:0 "Industrial Production Pact"
 KRAUS_fr_AUS_sdap_7_n_cs:0 "Industrial Production Pact"
 KRAUS_fr_AUS_sdap_7_n_sd:0 "Industrial Production Pact"
 KRAUS_fr_AUS_sdap_7_n_ml:0 "Industrial Ordering Pact"
 KRAUS_fr_AUS_sdap_7_n_sl:0 "Industrial Citizens' Pact"
 KRAUS_fr_AUS_sdap_7_d_p1:0 "Scattered credit, procurement and labour arrangements need a common production pact. Unions demand wages paid on time, owners want orders not to stop with cabinet quarrels, and local delegates want to know which firms will be supported. Renner puts these demands into one agreement so that recovery no longer depends on one temporary concession after another. After signing, the workshops still face shortages of funds and materials, but consultation now has a base on which to continue."
 KRAUS_fr_AUS_sdap_7_d_cs:0 "Scattered credit, procurement and labour arrangements need a common production pact. The Christian Socials write the demands of employers, unions and local delegates into one agreement."
 KRAUS_fr_AUS_sdap_7_d_sd:0 "Scattered credit, procurement and labour arrangements need a common production pact. The Social Democrats put the demands of unions, owners and local delegates into one agreement so that recovery no longer depends on temporary concessions."
 KRAUS_fr_AUS_sdap_7_d_ml:0 "The National Liberals write ordering, credit and labour arrangements into one commercial pact so that orders no longer stop with cabinet quarrels."
 KRAUS_fr_AUS_sdap_7_d_sl:0 "The Liberal Democratic Union writes ordering, credit and labour into one public pact, signed by delegates of every side and filed with parliament."
