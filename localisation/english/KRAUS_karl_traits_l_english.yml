l_english:
 KRAUS_karl_tomorrow:0 "Father of the Universal Empire"
 KRAUS_karl_tomorrow_desc:0 "After the crisis Karl is no longer the emperor of one nation, but the common father of all of them."
 KRAUS_karl_federal_monarch:0 "Monarch of the Federation"
 KRAUS_karl_federal_monarch_desc:0 "An emperor seated above a federation, who has written the equality of nations into his own titles."
 KRAUS_karl_apostolic_monarch:0 "Apostolic Monarch"
 KRAUS_karl_apostolic_monarch_desc:0 "Between crown and altar there is only a street, and Karl has made it his own road."
 KRAUS_karl_pan_european:0 "Emperor of Pan-Europe"
 KRAUS_karl_pan_european_desc:0 "The throne on the Danube may only be the draft of a larger parliament, and the Emperor is willing to be its first president."
 KRAUS_karl_merchant_emperor:0 "Emperor of Central Europe"
 KRAUS_karl_merchant_emperor_desc:0 "The bells of the exchange and the bells of the church ring together, and the Emperor signs between them."
