l_english:
 KRAUS_pwr_usa_trade:0 "Austro-American Trade Agreement"
 KRAUS_pwr_usa_trade_desc:0 "Industrial goods from across the ocean enter the Central European market through Hamburg and Trieste, and everyday goods are no longer so scarce."
 KRAUS_wartime_joint_prod:0 "Joint Wartime Production"
 KRAUS_wartime_joint_prod_desc:0 "The supply lines and schedules rehearsed in the exercises prove their worth, one after another, in the war."
 KRAUS_crisis_events.40.t:0 "Wartime Exercises"
 KRAUS_crisis_events.40.d:0 "The joint exercises in Bavaria were rehearsed for cooperation in peacetime. Now that war is at hand, the General Staff carries the schedules from the exercises over unchanged into the arsenals and railway dispatch rooms."
 KRAUS_crisis_events.40.a:0 "Put the results of the exercises to use in the war."
 KRAUS_balkan_events.60.t:0 "The Volunteer Legion Is Disbanded"
 KRAUS_balkan_events.60.d:0 "The guns in the Balkans have fallen silent. The banners of the Volunteer Legion form up for the last time before Vienna's railway station; the War Ministry announces that the act has expired, and the men collect their discharge pay and go home."
 KRAUS_balkan_events.60.a:0 "May they return home safely."
 KRAUS_balkan_events_60_tt:0 "The effects of the §YVolunteer Legion Act§! end."
 KRAUS_crisis_events.1.a_tt:0 "§GThe military crisis has eased by one level.§!"
 KRAUS_crisis_events.2.a_tt:0 "§GThe economic crisis has eased by one level.§!"
 KRAUS_crisis_events.3.a_tt:0 "§GThe political crisis has been lifted by one level.§!"
 KRAUS_us_unity_loyalty:0 "Talks in the Joint Diet"
 KRAUS_us_unity_loyalty_desc:0 "The delegates of the crownlands sit down to talk again and again in the joint diet. A union in name cannot be relied on; real trust has to be talked into being, one session at a time."
 KRAUS_us_unity_loyalty_tt:0 "The §YLoyalty§! of each §YCrownland§! moves up one step."
 KRAUS_dm_renner_victory_tt:0 "The core states of Austria gain the §YBenefits of Social Reform§!: local available resources and local construction speed increase."
 KRAUS_dm_miklas_victory_tt:0 "The core states of Austria gain the §YBenefits of Order§!: local available resources and local construction speed increase."
