l_english:
 KRAUS_dc_category:0 "The Danube Crisis"
 KRAUS_dc_category_desc:0 "We have bought a few days before the showdown with Hungary. Their demands can never be met - use the time to bring the crownlands to our side. When the timer runs out, Hungary will reject the ultimatum."
 KRAUS_dc_stall:0 "Stall the Hungarians"
 KRAUS_dc_stall_desc:0 "The talks are a pretext; we are buying time. When the timer runs out Hungary rejects the ultimatum and war follows."
 KRAUS_dc_win_GAL:0 "Win Over Galicia"
 KRAUS_dc_win_GAL_desc:0 "Send an envoy to Lemberg and ask, in the Emperor's name, that Galicia stand with Vienna against Hungary."
 KRAUS_dc_win_CRO:0 "Win Over Illyria"
 KRAUS_dc_win_CRO_desc:0 "Send an envoy to Zagreb. Illyria has old border disputes with Hungary and will gladly march if Vienna gives its word."
 KRAUS_dc_won_CZE_tt:0 "When war comes, §YBohemia§! will fight at our side."
 KRAUS_dc_won_GAL_tt:0 "When war comes, §YGalicia§! will fight at our side."
 KRAUS_dc_won_CRO_tt:0 "When war comes, §YIllyria§! will fight at our side."
 KRAUS_dc_alone_tt:0 "§RThe other crownlands will not join§! - we face Hungary alone."
 KRAUS_dc_341_stall:0 "Steady the crownlands first, then face Hungary."
 KRAUS_dc_stall_tt:0 "Starts a §Y7-day§! timer. Spend political power to win over the crownlands; when it ends Hungary rejects the ultimatum and war breaks out - §Gonly the crownlands we won over will join§!."
