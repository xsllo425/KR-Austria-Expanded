l_english:
 KRAUS_release_SLO:0 "Release Slovakia"
 KRAUS_release_SLO_desc:0 "Hungary has been merged into the Empire, but the states of Slovakia never belonged to Budapest. Restoring them as a crownland acknowledges the fact, and is also an account rendered."
 KRAUS_release_TRS:0 "Release Transylvania"
 KRAUS_release_TRS_desc:0 "The Romanians, Saxons and Magyars of Transylvania never felt at ease under the Hungarian flag. Giving them a crownland of their own is cheaper than making them wait for ever."
 KRAUS_release_HUN:0 "Re-establish the Crownland of Hungary"
 KRAUS_release_HUN_desc:0 "The rebellion is over and Hungary proper needs no garrison, it needs a name it can accept. Restoring it as a crownland is the last step of reconstruction."
 KRAUS_release_SLO_tt:0 "Slovakia becomes a §Ycrownland§!, starting from the neutral level."
 KRAUS_release_TRS_tt:0 "Transylvania becomes a §Ycrownland§!, starting from the neutral level."
 KRAUS_release_HUN_tt:0 "Hungary becomes a §Ycrownland§!, starting from the neutral level."
 KRAUS_release_hun_last_tt:0 "Slovakia and Transylvania have been released (or there are no corresponding states)"
 KRAUS_rel_events.1.t:0 "The Release Period Is Over"
 KRAUS_rel_events.1.d:0 "A year has passed, and the standing of Slovakia, Transylvania and Hungary proper has lain on the parliament's table the whole time.\n\nWhat is left undone is not forgiven by silence. The deputies of the crownlands exchange glances in the corridors: if Vienna will not grant us a name, we need not grant it respect."
 KRAUS_rel_events.1.a:0 "They will not forget."
 KRAUS_rel_events.2.t:0 "The Crownlands Revolt"
 KRAUS_rel_events.2.d:0 "The Empire is fighting great powers on two fronts while the crownlands still bear a grudge against Vienna. Telegrams arrive from Prague, Lemberg and Agram at once: the deputies have left the parliament.\n\nThey say this is not treachery, but a belated claim for a name."
 KRAUS_rel_events.2.a:0 "The Empire faces its worst hour."
 KRAUS_rel_events.3.t:0 "Declaration of Independence"
 KRAUS_rel_events.3.d:0 "We shall no longer pay Vienna one crown, nor send it one recruit."
 KRAUS_rel_events.3.a:0 "In our own name."
 KRAUS_election2.1.t:0 "Parliament after the Crisis"
 KRAUS_election2.1.d:0 "In the corridors of parliament the deputies no longer talk of the crisis. Some talk of budgets, some of schools, some only of the next election.\n\nHalf the house was displeased with the result of the last election, and that crack is being worn smooth by time."
 KRAUS_election2.1.a:0 "The crack is mending."
 KRAUS_election2.2.t:0 "The Second General Election"
 KRAUS_election2.2.d_sd:0 "The ballots are counted. The Social Democrats have won the most seats. Vienna's workers' districts bang pots all night, and from Prague's Vítkov hill to the Zagreb docks, red flags go up over the union halls.\n\nBut workers' votes alone cannot form a cabinet. At the gates of the Hofburg the Social Democratic leader tells reporters: 'The Empire needs a constitution everyone can sign, not a red flag.' That night he shares a carriage with another club's leader.\n\n§YThe new cabinet§!: [KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]"
 KRAUS_election2.2.d_cs:0 "The ballots are counted. The Christian Socials have won the most seats. Parish bells ring three times at dusk in the Alpine valleys, and Tyrolean farmers copy the result onto the church doors.\n\nBut field and altar cannot carry the whole Empire. The Christian Social leader waits an afternoon in the Hofburg before handing in the cabinet list, and more than one club is named on it.\n\n§YThe new cabinet§!: [KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]"
 KRAUS_election2.2.d_sl:0 "The ballots are counted. The Liberal Democratic Union has won the most seats. For the first time the papers of every nation run the same headline about the same result, in seven languages.\n\nCitizens and professors have won the Reichsrat, yet they must still convince workers and farmers. 'Rights count only once they are written down,' says the Union's leader, 'and writing them takes many hands.'\n\n§YThe new cabinet§!: [KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]"
 KRAUS_election2.2.d_ml:0 "The ballots are counted. The National Liberals have won the most seats. The Bourse bell rings five minutes late this evening, and the Creditanstalt's shares rise before the opening.\n\nBut a majority in the ledgers is not a majority in the Reichsrat. 'The market needs order, and order needs allies,' the National Liberal leader says in the Hofburg. Next morning the cabinet list is on the front page of the Neue Freie Presse.\n\n§YThe new cabinet§!: [KRAUS_pm_GetCabCS][KRAUS_pm_GetCabML][KRAUS_pm_GetCabSD][KRAUS_pm_GetCabSL]"
 KRAUS_election2.2.d_other:0 "The votes are in. No club has a decisive majority; the government remains in the hands of the old coalition and the quarrels in parliament will go on."
 KRAUS_election2.2.a:0 "The Empire's choice."
