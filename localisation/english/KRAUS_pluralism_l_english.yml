 KRAUS_fed_no_TRS_tt:0 "Does not have national spirit: §Y$KRAUS_cg_TRS_1$§!"
 KRAUS_pl.3.t:0 "How to Govern the States"
 KRAUS_pl.3.d:0 "Once the outline is posted, the cabinet has one question left to answer: who governs the states?\n\nThe Ministry of the Interior wants to retain the crown lands' old officials, who know their districts; replacing them would only cause delay. The Treasury wants the state administrations rebuilt to a single federal establishment, with the old offices' customs abolished. The Chancellery wants a federal governor sent to every capital, leaving the local governments in place but putting the important matters in the governor's hands.\n\nEach has its supporters. The cabinet can choose only one."
 KRAUS_pl.3.a:0 "Retain the old officials."
 KRAUS_pl.3.b:0 "Reorganise local administration."
 KRAUS_pl.3.c:0 "Dispatch federal governors."
 KRAUS_pl_harmony_later_tt:0 "When we later complete "$KRAUS_federal_charter$", we receive the strengthened "$KRAUS_crown_harmony$" directly."
