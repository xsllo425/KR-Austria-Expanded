l_english:
 KRAUS_pl_L1:0 "Federalising the Crown Lands"
 KRAUS_pl_L1_desc:0 "Vienna's officials draw the integration of each crownland up as a timetable: who signs, who receives, on which day the ledgers change hands. Only when it is posted do the local offices learn the day they will stop work."
 KRAUS_pl_L2:0 "Retaining the Old Officials"
 KRAUS_pl_L2_desc:0 "The crown lands' old officials were not dismissed by decree. They were asked one question instead: those who wish to stay keep their posts, only now the federation pays their salaries. They know the local mines, estates and registers, which newcomers cannot learn overnight."
 KRAUS_pl_L3:0 "Reorganising Local Administration"
 KRAUS_pl_L3_desc:0 "The old offices of the states no longer divide their work by the customs of the crown lands. Interior, finance and public works departments are set up to a single federal establishment, and the new works department resurveys the land the war left waste."
 KRAUS_pl_L4:0 "The Merging of the Seats"
 KRAUS_pl_L4_desc:0 "The crownlands' seats are merged into the roll of the Imperial Council. The deputies take their new places, and with them comes the roster of the officer corps."
 KRAUS_pl_L5:0 "The Great Reconciliation of Peoples"
 KRAUS_pl_L5_desc:0 "At the last joint session nobody spoke any more of who had annexed whom. The delegates of every people signed the same document: the federation consists of its states, and the peoples of the states are equal within it."
 KRAUS_pl_M0:0 "Reviving the Golden Danube Plan"
 KRAUS_pl_M0_desc:0 "From Linz to the Iron Gates, the channels, locks and wharves are handed to a single commission. The plans were drawn up under the late Emperor and sat in a ministry cabinet for twenty years; now the planning commission draws the railways, factories and depots of every state onto the same map."
 KRAUS_pl_M_diet:0 "Forming the State Diets"
 KRAUS_pl_M_diet_desc:0 "Each state elects its own diet under the new charter. At the first sitting the deputies must first agree in which languages the minutes are kept; only then comes the budget."
 KRAUS_pl_M_lang:0 "Equal Standing of the Languages"
 KRAUS_pl_M_lang_desc:0 "Official papers are now printed side by side in the main languages of the Empire. The language of teaching is decided by the local assemblies, no longer assigned from Vienna."
 KRAUS_pl_M_seat:0 "Dividing Federal and State Powers"
 KRAUS_pl_M_seat_desc:0 "What belongs to Vienna and what to the states is written into a list of two columns: foreign affairs, the army, railways and currency on the left; schools, police, roads and poor relief on the right. The appendices are far thicker than the list."
 KRAUS_pl_M_rail:0 "Unified Upkeep of Rail and Road"
 KRAUS_pl_M_rail_desc:0 "The imperial railway office folds the crownlands' own lines into a single upkeep roster, and points and signposts follow one standard from now on."
 KRAUS_pl_M_park:0 "The Federal Industrial Planning Office"
 KRAUS_pl_M_park_desc:0 "The Federal Industrial Planning Office decides where new factories are built. Its first plan favours no state; it is drawn around coal, power and the railways."
 KRAUS_pl_M_mob:0 "The Joint Mobilisation Plan"
 KRAUS_pl_M_mob_desc:0 "The General Staff and the crownland district commands draw up a wartime mobilisation plan: which battalions assemble within three days, which depots open within twelve hours."
 KRAUS_pl_M_arms:0 "Regional Spread of the Arms Industry"
 KRAUS_pl_M_arms_desc:0 "Arms orders no longer cluster around Vienna but are spread among the crownland factories, and crownland engineers are invited into the design offices."
 KRAUS_pl_M_dock:0 "The Istrian Slipways"
 KRAUS_pl_M_dock_desc:0 "On the Istrian peninsula the old slipways are laid with fresh keels, and the Admiralty places the first orders with the crownlands' shipyards."
 KRAUS_pl_M_end:0 "The Single Imperial Market"
 KRAUS_pl_M_end_desc:0 "The last barriers between the states are removed, and weights, measures and commercial registers are unified. The papers printed a full-page map on which nobody could tell any more which lines had once belonged to which crown land."
 KRAUS_pl_R0:0 "The Foreign Outline"
 KRAUS_pl_R0_desc:0 "The Foreign Ministry drafts a note to the neighbours: the Empire's internal integration is a domestic matter, and trade and travel with its neighbours will continue, and be easier."
 KRAUS_pl_R_pol:0 "Cooperation with Poland"
 KRAUS_pl_R_pol_desc:0 "The chambers of commerce of Warsaw and Vienna jointly draft a charter of cooperation, fixing tariffs, through railway traffic and the shares of joint investment."
 KRAUS_pl_R_ukr:0 "Cooperation with Ukraine"
 KRAUS_pl_R_ukr_desc:0 "Kyiv's grain cooperatives sign a long-term agreement with Vienna's banks, and grain and credit begin to flow in both directions."
 KRAUS_pl_R_ger:0 "Cooperation with Germany"
 KRAUS_pl_R_ger_desc:0 "After the German-Austrian trade agreement, factory owners of the Rhine and the Danube sign a more detailed cooperation clause covering machine tools, electrical machinery and technical standards."
 KRAUS_pl_R_ita:0 "Cooperation with Italy"
 KRAUS_pl_R_ita_desc:0 "Ports on both shores of the Adriatic open scheduled sailings to one another, and shipowners of Trieste and Genoa form a joint shipping company."
 KRAUS_pl_R_bal:0 "The Balkan Settlement"
 KRAUS_pl_R_bal_desc:0 "After Bulgaria's defeat, the old accounts of Belgrade and Bucharest are laid on the negotiating table. Vienna proposes that each side withdraw every covert operation on the other's soil."
 KRAUS_pl_speed_tt:0 "The officials' and officers' grievance decisions take 10% less time and cost 10% less (time never below 10 days)."
 KRAUS_pl_cycle30_tt:0 "The integration dividend cycle is 30 days shorter."
 KRAUS_pl_cycle15_tt:0 "The integration dividend cycle is 15 days shorter."
 KRAUS_pl_power_tt:0 "The integration dividend grows one step stronger."
 KRAUS_pl_generals_tt:0 "Generals of crownlands integrated from now on become Austrian."
 KRAUS_pl_comp_15_tt:0 "Non-core states held by Austria whose cores belong to the crownlands gain 15 compliance, and integration by compliance is enabled."
 KRAUS_pl_comp_10_tt:0 "Non-core states held by Austria whose cores belong to the crownlands gain 10 compliance, and integration by compliance is enabled."
 KRAUS_pl_recovery_tt:0 "Crownland core states gain Crownland Recovery: +10% local construction speed and +5% local manpower."
 KRAUS_pl_militia_1_tt:0 "Gain one fully manned, fully equipped, maximum-experience 9-battalion mountain militia division."
 KRAUS_pl_militia_2_tt:0 "Gain two fully manned, fully equipped, maximum-experience 9-battalion mountain militia divisions."
 KRAUS_pl_div_pp_tt:0 "The integration dividend gains a new outcome: extra political power."
 KRAUS_pl_div_rs_tt:0 "The integration dividend gains a new outcome: a research bonus."
 KRAUS_pl_div_pop_tt:0 "The integration dividend gains new outcomes: a militia division and more manpower."
 KRAUS_pl_levy_tt:0 "Recruitable population rises with the loyalty tier of each crownland."
 KRAUS_pl_R0_tt:0 "Unlocks the four cooperation focuses with neighbours and the Balkan Settlement."
 KRAUS_coop_POL_tt:0 "Cooperation with Poland begins; a cooperation dividend arrives once every cycle."
 KRAUS_coop_UKR_tt:0 "Cooperation with Ukraine begins; a cooperation dividend arrives once every cycle."
 KRAUS_coop_GER_tt:0 "Cooperation with Germany begins; a cooperation dividend arrives once every cycle."
 KRAUS_coop_ITA_tt:0 "Cooperation with Italy begins; a cooperation dividend arrives once every cycle."
 KRAUS_coop_start_tt:0 "The cooperation dividend takes effect from the next cycle."
 KRAUS_pl_bal_tt:0 "Romania's sabotage in Transylvania and Serbia's designs on Illyria are undone; Serbia's war-plan focuses against Austria can no longer be taken."
 KRAUS_pl_no_war_tt:0 "Not at war with Serbia or Romania"
 KRAUS_pl_no_war_tt_NOT:0 "At war with Serbia or Romania"
 KRAUS_pl_advisors_tt:0 "Advisors of crownlands integrated from now on become Austrian."
 KRAUS_pl_scientists_tt:0 "Scientists of crownlands integrated from now on become Austrian; the Regional Spread of the Arms Industry gains an extra reward."
 KRAUS_pl_gov_none_tt:0 "Crown lands integrated from now on no longer bring Local Grievances."
 KRAUS_pl_harmony_tt:0 "The effects of the Great Charter of the Habsburg Crownlands are doubled."
 KRAUS_div_bonus_tt:0 "Dividend strength is at its maximum: 30 extra political power and 5,000 manpower."
 KRAUS_pl_mobilisation_tt:0 "Gain 10 fully manned, fully equipped, maximum-experience 9-battalion mountain militia divisions."
 KRAUS_pl_mobilisation_bal_tt:0 "At war with Serbia or Romania: 5 more of the same divisions."
 KRAUS_pl_recovery:0 "New Local Administration"
 KRAUS_pl_recovery_desc:0 "The interior, finance and public works departments work to a single federal establishment."
 KRAUS_pl_mobilisation:0 "The Imperial Mobilisation Order"
 KRAUS_pl_mobilisation_desc:0 "On the second day of the war the General Staff wires every crownland district command: the plan is in force, the militia assemble."
 KRAUS_coop_tech_POL:0 "Cooperation with Poland"
 KRAUS_coop_POL:0 "Cooperation Dividend: Poland"
 KRAUS_coop_POL_desc:0 "The cooperation charter pays a dividend once per cycle."
 KRAUS_coop_tech_UKR:0 "Cooperation with Ukraine"
 KRAUS_coop_UKR:0 "Cooperation Dividend: Ukraine"
 KRAUS_coop_UKR_desc:0 "The cooperation charter pays a dividend once per cycle."
 KRAUS_coop_tech_GER:0 "Cooperation with Germany"
 KRAUS_coop_GER:0 "Cooperation Dividend: Germany"
 KRAUS_coop_GER_desc:0 "The cooperation charter pays a dividend once per cycle."
 KRAUS_coop_tech_ITA:0 "Cooperation with Italy"
 KRAUS_coop_ITA:0 "Cooperation Dividend: Italy"
 KRAUS_coop_ITA_desc:0 "The cooperation charter pays a dividend once per cycle."
 KRAUS_pl.1.t:0 "The Entrepreneurs of the States"
 KRAUS_pl.1.d:0 "Once the way of governing the states is settled, the president of the Vienna Chamber of Commerce hands over a list: dozens of the states' entrepreneurs and advisers to their old governments are willing to serve in the federal ministries, provided someone introduces them."
 KRAUS_pl.1.a:0 "Introduce them and take them in."
 KRAUS_pl.1.b:0 "Set the matter aside for now."
 KRAUS_pl.2.t:0 "The Scientists of the States"
 KRAUS_pl.2.d:0 "One page of the Federal Industrial Planning Office's staff lists records the researchers of the states' institutes. Their laboratories have not been closed, but they are still waiting for a clear word from Vienna."
 KRAUS_pl.2.a:0 "Invite them into the Empire's research system."
 KRAUS_pl.2.b:0 "Leave things as they are and only grant funds."
 KRAUS_coop.1.t:0 "The Start of Cooperation with Poland"
 KRAUS_coop.1.d:0 "The signing of the cooperation charter has no speeches; two clerks simply exchange the stamped texts. The next day, the first goods and the first remittance leave together."
 KRAUS_coop.1.a:0 "The charter takes effect."
 KRAUS_coop.11.t:0 "Cooperation Dividend: Poland"
 KRAUS_coop.11.d:0 "A cycle passes and the ledger of the cooperation charter reaches Vienna. The figures are modest, but there is one line more than in the previous cycle."
 KRAUS_coop.11.a:0 "Enter it in the Empire's books."
