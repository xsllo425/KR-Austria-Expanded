 KRAUS_pl_sci:0 "Crownland Scientists' Work"
 KRAUS_pl_sci_tt:0 "Research bonus from the crownland scientists who joined the Empire."
 KRAUS_pl_balkan_open_tt:0 "Austria has not yet completed §YThe Balkan Settlement§!"
 KRAUS_pl_L2b:0 "A Federal Land Policy"
 KRAUS_pl_L2b_desc:0 "Page by page, the land registers of the states are copied into the federal cadastre, and the sale, inheritance and taxation of land now follow a single law. For the first time, Vienna's tax rolls and the states' agree."
 KRAUS_pl_L3b:0 "Dispatching Federal Governors"
 KRAUS_pl_L3b_desc:0 "Vienna does not abolish the state governments; it sends a governor to every capital, chosen locally and answerable only to the federation. Land use and public works in the states now need the governor's approval, and more of them are approved than before."
 KRAUS_pl_L3c:0 "The Federal Building Board"
 KRAUS_pl_L3c_desc:0 "The Federal Building Board opens a branch in every state capital; the money comes from the federation, the choice of works from the states. The first to break ground are granaries, schools and water supply."
 KRAUS_pl_L3d:0 "An Open Federal Officer Corps"
 KRAUS_pl_L3d_desc:0 "Commissions in the common army are opened to the crownlands' officer families on the same terms as to Austrian ones. The first names entered in the new register come from Zagreb, Prague and Lviv."
 KRAUS_pl_M_crown:0 "The Federal Development Programme"
 KRAUS_pl_M_crown_desc:0 "With the seats, the railways and the slipways all agreed, the planning committee presents a single programme for the whole Empire: one schedule, one budget, one seal. What the programme builds depends on what the Empire has become."
 KRAUS_pl_R_stance_ger:0 "The German Orientation"
 KRAUS_pl_R_stance_ger_desc:0 "The Foreign Ministry decides that Vienna's future lies north and west. The German legation is told, quietly, that Austria will not be found on the other side of any future line."
 KRAUS_pl_R_stance_ent:0 "The Entente Orientation"
 KRAUS_pl_R_stance_ent_desc:0 "The Foreign Ministry decides that the Empire's future lies with the Western powers. Envoys are received in Paris and London, and the Balkan file is put away in a drawer marked later."
 KRAUS_pl_R_stance_own:0 "A Course of Our Own"
 KRAUS_pl_R_stance_own_desc:0 "The Foreign Ministry decides that the Empire will sign with no bloc and promise nothing to anyone. The note sent to the embassies is three sentences long, and every one of them is about trade."
 KRAUS_pl_R_second:0 "The Second Round of Cooperation"
 KRAUS_pl_R_second_desc:0 "The cooperation charters signed in the first years are extended. The same clerks meet in the same rooms, but this time the annexes are longer and the sums are larger."
 KRAUS_pl_gov_to2_tt:0 "Local Grievances are lowered one tier."
 KRAUS_pl_slots_crownland_tt:0 "Every state Austria owns and controls whose core belongs to a crownland gains one shared building slot."
 KRAUS_pl_M_crown_seats_tt:0 "Every state Austria owns and controls whose core belongs to a crownland gains one shared building slot. Each of those states that is not an Austrian core also gains 10 compliance."
 KRAUS_pl_M_crown_dyn_tt:0 "Gain two civilian factories off-map and 5% stability."
 KRAUS_pl_R_stance_ger_tt:0 "Germany's opinion of Austria improves."
 KRAUS_pl_R_stance_ent_tt:0 "France and Britain think better of Austria."
 KRAUS_pl_R_stance_own_tt:0 "Austria stands outside every bloc and promises nothing to anyone."
 KRAUS_pl_R_second_ger_tt:0 "A second German cooperation dividend is drawn at once."
 KRAUS_pl_R_second_pol_tt:0 "A second Polish cooperation dividend is drawn at once."
 KRAUS_pl_R_second_ita_tt:0 "A second Italian cooperation dividend is drawn at once."
 KRAUS_pl_R_second_ukr_tt:0 "A second Ukrainian cooperation dividend is drawn at once."
 KRAUS_pl_R_second_none_tt:0 "No cooperation charter stands; the Empire takes the profit of standing alone."
