 KRAUS_golden_danube_category:0 "Golden Danube Plan"
 KRAUS_golden_danube_category_desc:0 "Restore employment through credit and public procurement, beginning with projects in Austria and working towards cooperation across the crownlands.\n\nOnly one crownland project can run at a time; each builds a civilian factory when its progress bar completes. If Bohemia, Illyria or Galicia belongs to a subject, invite it to take part first."
