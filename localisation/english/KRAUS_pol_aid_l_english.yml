l_english:
 KRAUS_pol_aid.1.t:0 "Warsaw's Republicans"
 KRAUS_pol_aid.1.d:0 "The Polish election is not yet over, and the bankers of Kraków and Lemberg begin to send money to Warsaw. The Republican editorial offices lack paper and the deputies' campaigns lack cars; little is missing, but everything costs money.\n\nThe Polish society in Lemberg brings a list."
 KRAUS_pol_aid.1.a:0 "Fund the Republican press and campaign through the Galician banks."
 KRAUS_pol_aid.1.b:0 "Besides money, send advisers to help the Republicans organise a parliamentary caucus."
 KRAUS_pol_aid.1.c:0 "Warsaw's affairs are for Warsaw to settle."
 KRAUS_pol_aid.2.t:0 "A Second Round of Funding"
 KRAUS_pol_aid.2.d:0 "Two months have passed. The Republicans in Warsaw have won a few more seats in the Sejm, but the election is not over. The bankers of Kraków ask: should another sum be added?"
 KRAUS_pol_aid.2.a:0 "Add another sum."
 KRAUS_pol_aid.2.b:0 "That is enough."
 KRAUS_pol_aid_a_tt:0 "The influence of the §YPolish Republicans§! rises."
 KRAUS_pol_aid_b_tt:0 "The influence of the §YPolish Republicans§! rises sharply, and §YAustria's§! influence in Poland rises too."
