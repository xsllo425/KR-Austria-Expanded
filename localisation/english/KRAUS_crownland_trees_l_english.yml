l_english:
 KRAUS_cl_dispute_tt:0 "Austria will be asked to settle this dispute."
 KRAUS_dispute_backed_claim:0 "Austria backed a crownland's territorial demand"
 KRAUS_dispute_status_quo:0 "Austria upheld the status quo"
 KRAUS_dispute_arbitrated:0 "Austria convened an arbitration"
 KRAUS_CZE_war_school:0 "Places at the Vienna War School"
 KRAUS_CZE_kohout_manual:0 "Kohout's Soldier's Handbook"
 KRAUS_GAL_legion_tradition:0 "The Tradition of the Legions"
 KRAUS_CZE_tatra_trucks:0 "Tatra Trucks"
 KRAUS_GAL_jagiellonian:0 "The Jagiellonian University"
 KRAUS_cl_dispute.1.t:0 "The Slovak Question"
 KRAUS_cl_dispute.1.d:0 "A delegation from Prague has come to Schönbrunn, asking the Emperor to do justice to the Slovaks under Hungarian rule. Budapest has already let it be known that this is an internal matter of the Hungarian Crown and none of Bohemia's business.\n\nThe Emperor must judge between two of his crowns."
 KRAUS_cl_dispute.1.a:0 "The Slovaks deserve the protection of Bohemia."
 KRAUS_cl_dispute.1.b:0 "Keep things as they are."
 KRAUS_cl_dispute.1.c:0 "Convene an arbitration and let everyone talk."
 KRAUS_cl_dispute.2.t:0 "The Transcarpathian Question"
 KRAUS_cl_dispute.2.d:0 "The Ruthenian deputies of Lemberg again demand that their kin beyond the Carpathians be placed under Galicia. Budapest refuses outright.\n\nThe Emperor must judge between two of his crowns."
 KRAUS_cl_dispute.2.a:0 "Transcarpathia belongs with Galicia."
 KRAUS_cl_dispute.2.b:0 "Keep things as they are."
 KRAUS_cl_dispute.2.c:0 "Convene an arbitration and let everyone talk."
 KRAUS_CZE_path:0 "Bohemia's Path"
 KRAUS_CZE_path_desc:0 "The lands of the Crown of Saint Wenceslas are the Empire's forge: Pilsen's guns, Brno's rifles, Liberec's tungsten. Prague must decide for whom this forge works."
 KRAUS_CZE_reopen_diet:0 "Reopen the Bohemian Diet"
 KRAUS_CZE_reopen_diet_desc:0 "Prague's deputies have not cast a vote since 1930. It is time to open the Diet's doors again."
 KRAUS_CZE_tatra_trucks_desc:0 "Tatra of Kopřivnice is the only arms maker that belongs to Bohemia alone. Its trucks can turn an infantry division into a motorised one."
 KRAUS_CZE_liberec_tungsten:0 "Tungsten of Liberec"
 KRAUS_CZE_liberec_tungsten_desc:0 "The tungsten mines of Liberec are the only source of tungsten among the crownlands."
 KRAUS_CZE_prague_brno_rail:0 "The Prague–Brno Railway"
 KRAUS_CZE_prague_brno_rail_desc:0 "Freight between Bohemia and Moravia still goes round by way of Vienna. A direct line would bind the two industrial cities together."
 KRAUS_CZE_sudeten_germans:0 "The Sudeten Germans"
 KRAUS_CZE_sudeten_germans_desc:0 "Vienna's negotiators once said: \"We could do a little more with the Bohemian Germans, could we not?\" Prague cannot pretend not to have heard."
 KRAUS_CZE_loyal_officers:0 "Officers Loyal to the Emperor"
 KRAUS_CZE_loyal_officers_desc:0 "When Alois Podhajsky studied at the cadet school in Pressburg, no one imagined that this Czech farmer's son would join the imperial General Staff. Forty years on, he is still the most loyal man in Prague."
 KRAUS_CZE_war_school_desc:0 "Bílý, Votruba, Kohout: the best officers of Bohemia all learned staff work at the War School in Vienna. A few more places for Prague means a few more Bohemian generals for the Empire."
 KRAUS_CZE_skoda_orders:0 "Imperial Orders for Škoda"
 KRAUS_CZE_skoda_orders_desc:0 "Škoda of Pilsen survived Black Monday on orders from Vienna. The more orders the Empire places, the better its directors know which side they are on."
 KRAUS_CZE_imperial_bohemia:0 "Imperial Bohemia"
 KRAUS_CZE_imperial_bohemia_desc:0 "On the flagpoles of Prague Castle the black-and-yellow flies beside the red-and-white. The old say it reminds them of the days before the Great War."
 KRAUS_CZE_masaryk_course:0 "Masaryk's Course"
 KRAUS_CZE_masaryk_course_desc:0 "Jan Masaryk believes Bohemia can stay within the Empire, but it must first be a state of its own people."
 KRAUS_CZE_kohout_manual_desc:0 "In 1933 Bohuslav Kohout wrote a new soldier's handbook for the Bohemian Landwehr. \"Find the Germans or the Hungarians and learn from them!\" he said. \"And we can teach them too!\""
 KRAUS_CZE_prague_officer_school:0 "The Prague Officer School"
 KRAUS_CZE_prague_officer_school_desc:0 "Viktor Hoppe, too close to Czech nationalist circles, was kept in the Landwehr all his life. Prague will have its own officer school, and Vienna will no longer decide who becomes a general."
 KRAUS_CZE_crown_of_wenceslas:0 "The Crown of Saint Wenceslas"
 KRAUS_CZE_crown_of_wenceslas_desc:0 "In St Vitus Cathedral the Crown of Saint Wenceslas is solemnly brought out for the people to see. It belongs to Bohemia, they say, not to Vienna."
 KRAUS_CZE_slovak_brothers:0 "For Our Slovak Brethren"
 KRAUS_CZE_slovak_brothers_desc:0 "At the Ausgleich talks the Bohemian delegation already said it: the Slovaks under Hungarian rule have no self-government at all. Prague will ask the Emperor to judge the matter."
 KRAUS_GAL_path:0 "Galicia's Path"
 KRAUS_GAL_path_desc:0 "Galicia has the only oilfields of the crownlands and the poorest villages of the Empire; it has Poles and it has Ruthenians. Archduke Karl Albrecht, sent here to rule, must find a road for them all."
 KRAUS_GAL_boryslaw_oil:0 "The Borysław Oilfields"
 KRAUS_GAL_boryslaw_oil_desc:0 "The wells of Borysław are the only oil in the crownlands, yet no proper company runs them."
 KRAUS_GAL_eastern_farms:0 "The Eastern Farmlands"
 KRAUS_GAL_eastern_farms_desc:0 "Czernowitz and Suceava have not a single factory, only wheat fields and dirt roads."
 KRAUS_GAL_jagiellonian_desc:0 "The Jagiellonian University of Kraków is among the oldest in Central Europe, and young men like Ulam are growing up in its halls."
 KRAUS_GAL_witos_peasants:0 "Witos's Peasants"
 KRAUS_GAL_witos_peasants_desc:0 "Vice-regent Wincenty Witos was born a peasant. He wants Vienna to bring railways and fertiliser to the poor eastern provinces."
 KRAUS_GAL_ruthenian_schools:0 "Schools for the Ruthenians"
 KRAUS_GAL_ruthenian_schools_desc:0 "At the Ausgleich talks Vienna listened to the Polish elite and not to the \"Ruthenian peasants\". Petrushevych and Levytskyi are still waiting for an answer."
 KRAUS_GAL_habsburg_poles:0 "The Habsburg Poles"
 KRAUS_GAL_habsburg_poles_desc:0 "Karl Albrecht was born in Pola in Istria, yet he is more Polish than many Poles. He means to prove that loyalty to the Emperor and love of Poland can live together."
 KRAUS_GAL_magnates:0 "The Magnates and the Crown"
 KRAUS_GAL_magnates_desc:0 "Count Alfred Potocki's estates are larger than some principalities. As long as the Crown protects their lands, the great nobles of Galicia will protect the Crown."
 KRAUS_GAL_sapieha_blessing:0 "Bishop Sapieha's Blessing"
 KRAUS_GAL_sapieha_blessing_desc:0 "Bishop Adam Sapieha of Kraków prays for the Emperor from the pulpit. In Galicia that does more than a hundred proclamations."
 KRAUS_GAL_imperial_galicia:0 "Imperial Galicia"
 KRAUS_GAL_imperial_galicia_desc:0 "In front of the governor's palace in Lemberg the Emperor's portrait is hung back in its place. The Kraków papers write: Galicia is part of the Empire, not anyone's bargaining chip."
 KRAUS_GAL_sikorski_army:0 "Sikorski's People's Army"
 KRAUS_GAL_sikorski_army_desc:0 "After the Great War, Władysław Sikorski \"refused to serve another German king\" and stayed in Galicia. He wants a modern, motorised Galician army."
 KRAUS_GAL_legion_tradition_desc:0 "In the Great War the Polish Legions marched out of Kraków to fight the Russians. Their veterans are all in Galicia now."
 KRAUS_GAL_krakow_arms:0 "Arms of Kraków"
 KRAUS_GAL_krakow_arms_desc:0 "The works at Tarnów can make artillery. Galicia's army can fire Galicia's guns."
 KRAUS_GAL_polish_galicia:0 "A Polish Galicia"
 KRAUS_GAL_polish_galicia_desc:0 "In the market square of Kraków the crowd sings \"Poland Is Not Yet Lost\". The officials from Vienna do not stop them."
 KRAUS_GAL_transcarpathia:0 "Transcarpathia"
 KRAUS_GAL_transcarpathia_desc:0 "At the Ausgleich talks the Ruthenian delegation reminded Vienna that their kin beyond the Carpathians are not even formally recognised by the Hungarian government."
 KRAUS_cl_treat.1.t:0 "A Petition from the Diet"
 KRAUS_cl_treat.1.d:0 "The Diet of [KRAUS_cl_target.GetName] has sent a petition: local officials, courts and schools should use the local language rather than German. Vienna's officials consider it a slow dismantling of the imperial administration."
 KRAUS_cl_treat.1.a:0 "Grant their request."
 KRAUS_cl_treat.1.b:0 "Reject the petition and dissolve the Diet."
 KRAUS_cl_treat_1_good:0 "Austria treated us well (A Petition from the Diet)"
 KRAUS_cl_treat_1_bad:0 "Austria treated us badly (A Petition from the Diet)"
 KRAUS_cl_treat.2.t:0 "Tax Arrears"
 KRAUS_cl_treat.2.d:0 "[KRAUS_cl_target.GetName] has once again failed to deliver its taxes to Vienna on time. The local officials plead a poor harvest and factories laying men off. The treasury says the Empire cannot keep paying other people's bills."
 KRAUS_cl_treat.2.a:0 "Forgive it this time."
 KRAUS_cl_treat.2.b:0 "Send the tax collectors and take every last krone."
 KRAUS_cl_treat_2_good:0 "Austria treated us well (Tax Arrears)"
 KRAUS_cl_treat_2_bad:0 "Austria treated us badly (Tax Arrears)"
 KRAUS_cl_treat.3.t:0 "Conscription Quotas for the Common Army"
 KRAUS_cl_treat.3.d:0 "The War Ministry demands that [KRAUS_cl_target.GetName] send its quota of recruits to the Common Army. The local regiments would rather keep their sons at home, led by officers who speak their language."
 KRAUS_cl_treat.3.a:0 "Let them stay in the local regiments."
 KRAUS_cl_treat.3.b:0 "Draft the full quota, not one man less."
 KRAUS_cl_treat_3_good:0 "Austria treated us well (Conscription Quotas for the Common Army)"
 KRAUS_cl_treat_3_bad:0 "Austria treated us badly (Conscription Quotas for the Common Army)"
 KRAUS_cl_treat.4.t:0 "Factory Relocation"
 KRAUS_cl_treat.4.d:0 "A Viennese firm wants to move a whole factory from [KRAUS_cl_target.GetName] back to Austria proper: the workers there are cheap, but Vienna's workers need the jobs more. The locals say the Empire should be building factories there, not taking them away."
 KRAUS_cl_treat.4.a:0 "Let the Empire pay for a new one there."
 KRAUS_cl_treat.4.b:0 "Move the factory home."
 KRAUS_cl_treat_4_good:0 "Austria treated us well (Factory Relocation)"
 KRAUS_cl_treat_4_bad:0 "Austria treated us badly (Factory Relocation)"
 KRAUS_cl_treat.5.t:0 "Who Leads the Men"
 KRAUS_cl_treat.5.d:0 "A divisional command in the local forces of [KRAUS_cl_target.GetName] has fallen vacant. The War Ministry recommends a staff officer from Vienna; the locals recommend a colonel who has served twenty years in their own regiments."
 KRAUS_cl_treat.5.a:0 "Promote the local colonel."
 KRAUS_cl_treat.5.b:0 "Send the staff officer from Vienna."
 KRAUS_cl_treat_5_good:0 "Austria treated us well (Who Leads the Men)"
 KRAUS_cl_treat_5_bad:0 "Austria treated us badly (Who Leads the Men)"
 KRAUS_cl_treat.6.t:0 "Riots in the Streets"
 KRAUS_cl_treat.6.d:0 "Riots have broken out in the capital of [KRAUS_cl_target.GetName]: first a street sign written only in German was smashed, then a newspaper office, then the windows of the police station."
 KRAUS_cl_treat.6.a:0 "Send someone to talk, and promise bilingual signs."
 KRAUS_cl_treat.6.b:0 "Send the gendarmes and restore order."
 KRAUS_cl_treat_6_good:0 "Austria treated us well (Riots in the Streets)"
 KRAUS_cl_treat_6_bad:0 "Austria treated us badly (Riots in the Streets)"
 KRAUS_CRO_mountain_training:0 "Dragojlov's Mountain Training"
 KRAUS_CRO_illyrian_academy:0 "The Illyrian Academy"
 KRAUS_HUN_ludovika:0 "The Ludovika Academy"
 KRAUS_trs_magyarization:0 "Magyarisation"
 KRAUS_trs_secured_tt:0 "Romania's covert preparations for a rising in §YTransylvania§! will be exposed: the preparations are void, the revolt count returns to zero, and resistance in the states subsides."
 KRAUS_trs_events.1.t:0 "The Network Is Exposed"
 KRAUS_trs_events.1.d:0 "Bad news from Transylvania: the separatists we funded are being taken by the gendarmes one after another, the rifles hidden in the mountain villages have been found, and the list of our contacts is in their hands. Years of preparation are undone overnight."
 KRAUS_trs_events.1.a:0 "Damn."
 KRAUS_trs_events.2.t:0 "A Plot in Transylvania"
 KRAUS_trs_events.2.d:0 "The gendarmes have broken a Romanian-funded rising in the mountain villages of Transylvania: rifles, leaflets and the list of contacts are all on the table. Bucharest's plan has come to nothing."
 KRAUS_trs_events.2.a:0 "Transylvania is safe."
 KRAUS_cl_dispute.3.t:0 "The Bačka Question"
 KRAUS_cl_dispute.3.d:0 "A delegation from Zagreb asks the Emperor to give Bačka to Illyria, for its South Slavs are still ruled from Budapest. Budapest's answer is simple: never.\n\nThe Emperor must judge between two of his crowns."
 KRAUS_cl_dispute.3.a:0 "Bačka belongs with Illyria."
 KRAUS_cl_dispute.3.b:0 "Keep things as they are."
 KRAUS_cl_dispute.3.c:0 "Convene an arbitration and let everyone talk."
 KRAUS_cl_dispute.4.t:0 "The Croatia-Slavonia Question"
 KRAUS_cl_dispute.4.d:0 "A delegation from Budapest demands that the Emperor return Croatia-Slavonia to the Hungarian Crown: its transfer to Illyria in 1926 was, to Hungarian eyes, a betrayal. Zagreb answers that it is the heart of Illyria.\n\nThe Emperor must judge between two of his crowns."
 KRAUS_cl_dispute.4.a:0 "Croatia-Slavonia returns to Hungary."
 KRAUS_cl_dispute.4.b:0 "Keep things as they are."
 KRAUS_cl_dispute.4.c:0 "Convene an arbitration and let everyone talk."
 KRAUS_CRO_path:0 "Illyria's Path"
 KRAUS_CRO_path_desc:0 "The Triune Kingdom of Illyria was founded in 1926 amid a South Slav rising and German intervention. Built by nobles and officers loyal to Vienna, it nonetheless demands more autonomy and an end to Hungarian rule over the South Slavs."
 KRAUS_CRO_unity_road:0 "The Unity Road"
 KRAUS_CRO_unity_road_desc:0 "The prime minister's bill would build a road linking Zagreb and Sarajevo. With subsidies from Austria there will be workers enough, and many districts will have some relief from unemployment."
 KRAUS_CRO_dalmatian_bauxite:0 "Dalmatian Bauxite"
 KRAUS_CRO_dalmatian_bauxite_desc:0 "The hills of Dalmatia hold the Empire's second-largest bauxite deposits, yet no proper company works them."
 KRAUS_CRO_illyrian_academy_desc:0 "Founded in 1842 to establish a single Illyrian literary standard, this society is now to become the academy of the kingdom."
 KRAUS_CRO_rijeka_yard:0 "The Yards of Fiume"
 KRAUS_CRO_rijeka_yard_desc:0 "Fiume has the only shipyard among the crownlands. Illyria has nine naval bases and not a single ship of its own."
 KRAUS_CRO_two_scripts:0 "One Illyria, Two Scripts"
 KRAUS_CRO_two_scripts_desc:0 "Six in ten Illyrians are Croats, three in ten are Serbs. One writes in Latin letters, the other in Cyrillic; Illyria must learn to write in both."
 KRAUS_CRO_emperors_illyria:0 "The Emperor's Illyria"
 KRAUS_CRO_emperors_illyria_desc:0 "In 1926 the Croatian nobility and the imperial officers swore loyalty before the Emperor, and received this kingdom in return. They have not forgotten that it was Vienna that held Budapest off."
 KRAUS_CRO_croat_serb_coalition:0 "The Croat-Serb Coalition"
 KRAUS_CRO_croat_serb_coalition_desc:0 "The Croat-Serb Coalition took 23% of the vote. It leans on Vienna yet does not shut out the Serbs: the most practical road open to Illyria."
 KRAUS_CRO_stepinac_church:0 "Stepinac's Church"
 KRAUS_CRO_stepinac_church_desc:0 "Aloysius Stepinac prays for the Emperor from the pulpit in Zagreb. The Catholic Church is the strongest thread between Illyria and Vienna."
 KRAUS_CRO_imperial_illyria:0 "Imperial Illyria"
 KRAUS_CRO_imperial_illyria_desc:0 "In the harbour of Fiume the imperial flagship runs up the Illyrian colours. On the quays they say the sea is the Empire's again."
 KRAUS_CRO_radic_peasants:0 "Radić's Peasant Party"
 KRAUS_CRO_radic_peasants_desc:0 "Stjepan Radić's Croatian People's Peasant Party is the largest in the kingdom. The peasants do not care how Vienna and Budapest quarrel; they want their own land and their own diet."
 KRAUS_CRO_croatian_command:0 "The Croatian Officer Corps"
 KRAUS_CRO_croatian_command_desc:0 "\"We must restrict officer posts to Croats alone.\" Slavko Kvaternik's policy caused great friction in the Home Guard, but from now on the army answers only to Zagreb."
 KRAUS_CRO_dragojlov_mountaineers:0 "Dragojlov's Mountaineers"
 KRAUS_CRO_dragojlov_mountaineers_desc:0 "Fedor Dragojlov has made mountain warfare his speciality. In the Dinaric Alps, Illyria's mountain infantry can hold up any invading army."
 KRAUS_CRO_south_slav_autonomy:0 "South Slav Autonomy"
 KRAUS_CRO_south_slav_autonomy_desc:0 "In the Diet in Zagreb the deputies debate, for the first time, only in Croatian and Serbian. No one mentions Vienna, and no one mentions Budapest."
 KRAUS_CRO_backa:0 "Bačka"
 KRAUS_CRO_backa_desc:0 "The South Slavs of Bačka are still ruled from Budapest. The Illyrian delegation raised the claim at the Ausgleich talks, a bold move. Now Zagreb will ask the Emperor to judge."
 KRAUS_HUN_path:0 "The Path of the Crown of Saint Stephen"
 KRAUS_HUN_path_desc:0 "Hungary is no crownland; it is the other half of the Empire. The Compromise of 1867 gave Budapest its own parliament and home affairs, and Emperor Karl's reforms stopped at the Leitha, turned back by the Hungarian nobility."
 KRAUS_HUN_transdanubian_bauxite:0 "Transdanubian Bauxite"
 KRAUS_HUN_transdanubian_bauxite_desc:0 "The bauxite of Transdanubia makes up most of the Empire's supply, alongside coal and the only oil well in all the Empire."
 KRAUS_HUN_alfold_granary:0 "The Granary of the Great Plain"
 KRAUS_HUN_alfold_granary_desc:0 "Two million eight hundred thousand people live on the Great Plain, and they grow the Empire's wheat."
 KRAUS_HUN_budapest_factories:0 "The Factories of Budapest"
 KRAUS_HUN_budapest_factories_desc:0 "Hungary has 25 civilian and 10 military factories, the largest industry among the crowns. It is also the largest defaulter on the Empire's common budget."
 KRAUS_HUN_ludovika_desc:0 "The Ludovika Academy has trained nearly every Hungarian officer. Its Protestant commandant, Jány, has set out to weaken the hold of the Catholics there, and built a Lutheran chapel."
 KRAUS_HUN_mountain_hunters:0 "The Mountain Hunters"
 KRAUS_HUN_mountain_hunters_desc:0 "The mountain hunters of the Carpathians are the best troops in the Hungarian Home Guard."
 KRAUS_HUN_joseph_august:0 "Archduke Joseph August"
 KRAUS_HUN_joseph_august_desc:0 "The Archduke transferred to the Royal Hungarian Home Guard in 1902, and has belonged body and soul to the Kingdom of Hungary ever since. Since the Great War he has been the bond between the Empire and Hungary."
 KRAUS_HUN_pay_the_quota:0 "Pay the Common Quota"
 KRAUS_HUN_pay_the_quota_desc:0 "The Danube crisis is over. Budapest has at last paid into the treasury of the common ministries the share it withheld for ten years."
 KRAUS_HUN_imperial_gendarmes:0 "Imperial Gendarmes in Transylvania"
 KRAUS_HUN_imperial_gendarmes_desc:0 "Romanian agents hand out leaflets and hide rifles in the mountain villages of Transylvania. Budapest has called in the imperial gendarmerie to search them village by village."
 KRAUS_HUN_imperial_hungary:0 "Imperial Hungary"
 KRAUS_HUN_imperial_hungary_desc:0 "In Buda Castle the Emperor opens the Diet as King of Hungary. Two crowns, one monarch."
 KRAUS_HUN_tradition_1848:0 "The Tradition of 1848"
 KRAUS_HUN_tradition_1848_desc:0 "The governing Independence and '48 Party takes its name from the revolution of 1848. László Bárdossy and his party have never accepted Vienna's mastery."
 KRAUS_HUN_magyarization:0 "Magyarisation"
 KRAUS_HUN_magyarization_desc:0 "Budapest needs no imperial gendarmes. The Hungarian gendarmerie will go into Transylvania itself, and close the Romanian schools and newspapers while it is there."
 KRAUS_HUN_honved:0 "The Royal Honvéd"
 KRAUS_HUN_honved_desc:0 "The Royal Hungarian Home Guard was never wholly part of the Common Army. Now it is to become Hungary's own army."
 KRAUS_HUN_crown_autonomy:0 "The Autonomy of the Holy Crown"
 KRAUS_HUN_crown_autonomy_desc:0 "Before the Parliament in Budapest the crowd sings the Szózat. There is not a single Viennese flag to be seen."
 KRAUS_HUN_croatia_slavonia:0 "Croatia-Slavonia"
 KRAUS_HUN_croatia_slavonia_desc:0 "The Hungarians believe Vienna betrayed them in 1926 by handing Croatia to Illyria. Budapest demands that the Emperor return Croatia-Slavonia."
 KRAUS_found_SLO:0 "Found the Crownland of Slovakia"
 KRAUS_found_SLO_desc:0 "At the Ausgleich talks the Bohemian delegation already said it: the Slovaks under Hungarian rule have no self-government at all. A Slovak government has long been formed; it lacks only land."
 KRAUS_found_TRS:0 "Found the Crownland of Transylvania"
 KRAUS_found_TRS_desc:0 "The Grand Principality of Transylvania once answered directly to the Habsburg crown, until it was merged into Hungary in 1867. Take it back from Budapest and give it to a Transylvanian government answering to Vienna."
 KRAUS_found_cond_tt:0 "Austria defeated Hungary in the war of the Danube crisis, §Yor§! Hungary is at §YCrownland Status: Loyalty II§! or higher"
 KRAUS_found_SLO_tt:0 "The states Hungary holds with §YSlovak§! cores (except those with Galician cores) are separated to found the §YCrownland of Slovakia§!."
 KRAUS_found_TRS_tt:0 "The states Hungary holds with §YTransylvanian§! cores are separated to found the §YCrownland of Transylvania§!. Romania's rising will then target Transylvania instead of Hungary."
