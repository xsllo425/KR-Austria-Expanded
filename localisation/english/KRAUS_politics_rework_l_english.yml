 KRAUS_joint_mil_gate_2_tt:0 "§YTier 2§!: Austria has relieved its military weakness by at least §Y2 stages§! and has at least §Y25§! Crown and Order"
 KRAUS_joint_mil_gate_3_tt:0 "§YTier 3§!: Austria has relieved its military weakness by at least §Y4 stages§! and has at least §Y50§! Crown and Order"
 KRAUS_joint_mil_aus_dm:0 "Common Imperial Army"
 KRAUS_joint_mil_spirit_1:0 "Common Imperial Army I"
 KRAUS_joint_mil_spirit_1_desc:0 "The crownlands' troops train under Vienna's regulations and share the Empire's staff, schools and equipment. One army, many peoples."
 KRAUS_joint_mil_spirit_2:0 "Common Imperial Army II"
 KRAUS_joint_mil_spirit_2_desc:0 "The crownlands' troops train under Vienna's regulations and share the Empire's staff, schools and equipment. One army, many peoples."
 KRAUS_joint_mil_spirit_3:0 "Common Imperial Army III"
