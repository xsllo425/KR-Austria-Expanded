 KRAUS_joint_mil_spirit_5:0 "Common Imperial Army V"
 KRAUS_joint_mil_spirit_5_desc:0 "The crownlands' troops train under Vienna's regulations and share the Empire's staff, schools and equipment. One army, many peoples."
 KRAUS_crownland_integration_category:0 "Crownland Integration"
 KRAUS_crownland_integration_category_desc:0 "Every crownland can be integrated into Austria proper. The cost and duration depend on its §YCrownland Status§!: the more loyal, the cheaper; the more autonomous, the dearer.\n\nOnce integrated, its Common Danubian Development and Common Imperial Army levels become Austria's §Yintegration dividend§!, and every 180 days it pays a further dividend. Left unintegrated, a more autonomous crownland counts for more shares in Austria's common-tree spirits."
 KRAUS_integ_start_tt:0 "When the timer ends, the crownland is integrated into Austria proper: Austria gains its cores, and its generals, scientists and advisors transfer over."
 KRAUS_integ_dividend_tt:0 "§YIntegration dividend§!: the crownland's Common Danubian Development and Common Imperial Army levels pass to Austria's Unified Imperial Administration, §G+50%§! at Loyalty II or higher. A further dividend is paid every §Y180§! days."
 KRAUS_integ_dividend_dm:0 "Unified Imperial Administration"
 KRAUS_integ_dividend_dm_tt:0 "Dividend from integrated crownlands: per economic share, factory output §G+1%§! and research speed §G+0.5%§!; per military share, army organisation §G+1%§! and recruitable population §G+0.5%§!.\nEconomic shares: §Y[?KRAUS_integ_div_econ|1]§!, military shares: §Y[?KRAUS_integ_div_mil|1]§!"
 KRAUS_integ_boom_industry:0 "Integration Dividend: Industrial Boom"
 KRAUS_integ_boom_construction:0 "Integration Dividend: Building Boom"
 KRAUS_joint_econ_aus_dm_tt:0 "Per share of crownlands in the common development: factory output §G+2%§!, research speed §G+1%§!. A crownland counts as 1 share; at Autonomy I, II or III it counts as 1.5, 2 or 2.5.\nNow: §Y[?KRAUS_joint_members|0]§! crownlands, §Y[?KRAUS_joint_shares|1]§! shares\nThe permanent bonuses from joint economy focuses Austria has completed itself (consumer goods, construction speed, research, resources, factory output and so on) also accumulate on this one modifier."
 KRAUS_joint_mil_aus_dm_tt:0 "Per share of crownlands in the common development: army organisation §G+2%§!, recruitable population §G+1%§!, training time §G-2%§!. A crownland counts as 1 share; at Autonomy I, II or III it counts as 1.5, 2 or 2.5.\nNow: §Y[?KRAUS_joint_members|0]§! crownlands, §Y[?KRAUS_joint_shares|1]§! shares"
 KRAUS_cl_auto_3:0 "Crownland Status: Autonomy III"
 KRAUS_cl_auto_3_desc:0 "Its own diet, officer schools and treasury look more and more like those of a state. It is a stronger partner of the Empire, and ever harder to integrate."
 KRAUS_cl_auto_2:0 "Crownland Status: Autonomy II"
 KRAUS_cl_auto_2_desc:0 "Its own diet, officer schools and treasury look more and more like those of a state. It is a stronger partner of the Empire, and ever harder to integrate."
 KRAUS_cl_auto_1:0 "Crownland Status: Autonomy I"
 KRAUS_cl_auto_1_desc:0 "Its own diet, officer schools and treasury look more and more like those of a state. It is a stronger partner of the Empire, and ever harder to integrate."
 KRAUS_cl_loyal_1:0 "Crownland Status: Loyalty I"
 KRAUS_cl_loyal_1_desc:0 "Its elites stake their future on Vienna: their sons attend imperial schools, their factories fill imperial orders. Integrating it costs less and less."
 KRAUS_cl_loyal_2:0 "Crownland Status: Loyalty II"
 KRAUS_cl_loyal_2_desc:0 "Its elites stake their future on Vienna: their sons attend imperial schools, their factories fill imperial orders. Integrating it costs less and less."
 KRAUS_cl_loyal_3:0 "Crownland Status: Loyalty III"
 KRAUS_cl_loyal_3_desc:0 "Its elites stake their future on Vienna: their sons attend imperial schools, their factories fill imperial orders. Integrating it costs less and less."
 KRAUS_integrate_CZE:0 "Integrate Bohemia"
 KRAUS_integrate_CZE_desc:0 "Merge Bohemia into Austria proper and gain its cores; its generals, scientists and advisors transfer to Austria. Grievances follow, and the dividend depends on its standing."
 KRAUS_integ_dividend_CZE:0 "Bohemia Integration Dividend"
 KRAUS_integ_dividend_CZE_desc:0 "After Bohemia joined Austria proper, a dividend is settled every 180 days."
 KRAUS_integ_tech_CZE:0 "Engineers of Bohemia"
 KRAUS_integ_events.1.t:0 "Dividend from Bohemia"
 KRAUS_integ_events.1.d:0 "For the first time, the factory owners of Prague pay their taxes to the treasury in Vienna rather than to the Diet in Prague. The ledgers have a new cover; the chimneys of Pilsen and Brno smoke as before."
 KRAUS_integ_events.1.a:0 "One ledger for the Empire."
 KRAUS_integrate_GAL:0 "Integrate Galicia"
 KRAUS_integrate_GAL_desc:0 "Merge Galicia into Austria proper and gain its cores; its generals, scientists and advisors transfer to Austria. Grievances follow, and the dividend depends on its standing."
 KRAUS_integ_dividend_GAL:0 "Galicia Integration Dividend"
 KRAUS_integ_dividend_GAL_desc:0 "After Galicia joined Austria proper, a dividend is settled every 180 days."
 KRAUS_integ_tech_GAL:0 "Engineers of Galicia"
 KRAUS_integ_events.2.t:0 "Dividend from Galicia"
 KRAUS_integ_events.2.d:0 "The wells of Borysław now report straight to Vienna. The old deputies of Lemberg still grumble, but the bankers of Kraków have already signed the new imperial bonds."
 KRAUS_integ_events.2.a:0 "One ledger for the Empire."
 KRAUS_integrate_CRO:0 "Integrate Illyria"
 KRAUS_integrate_CRO_desc:0 "Merge Illyria into Austria proper and gain its cores; its generals, scientists and advisors transfer to Austria. Grievances follow, and the dividend depends on its standing."
 KRAUS_integ_dividend_CRO:0 "Illyria Integration Dividend"
 KRAUS_integ_dividend_CRO_desc:0 "After Illyria joined Austria proper, a dividend is settled every 180 days."
 KRAUS_integ_tech_CRO:0 "Engineers of Illyria"
 KRAUS_integ_events.3.t:0 "Dividend from Illyria"
 KRAUS_integ_events.3.d:0 "The shipyards of Fiume and Split receive their first orders directly from the imperial naval ministry, no longer passing through Zagreb."
 KRAUS_integ_events.3.a:0 "One ledger for the Empire."
 KRAUS_integrate_HUN:0 "Integrate Hungary"
 KRAUS_integrate_HUN_desc:0 "Merge Hungary into Austria proper and gain its cores; its generals, scientists and advisors transfer to Austria. Grievances follow, and the dividend depends on its standing."
 KRAUS_integ_dividend_HUN:0 "Hungary Integration Dividend"
 KRAUS_integ_dividend_HUN_desc:0 "After Hungary joined Austria proper, a dividend is settled every 180 days."
 KRAUS_integ_tech_HUN:0 "Engineers of Hungary"
 KRAUS_integ_events.4.t:0 "Dividend from Hungary"
 KRAUS_integ_events.4.d:0 "The bauxite of Transdanubia and the granaries of the Great Plain share one ledger with Austria proper for the first time. The old politicians of Budapest have fallen silent."
 KRAUS_integ_events.4.a:0 "One ledger for the Empire."
 KRAUS_integrate_SLO:0 "Integrate Slovakia"
 KRAUS_integrate_SLO_desc:0 "Merge Slovakia into Austria proper and gain its cores; its generals, scientists and advisors transfer to Austria. Grievances follow, and the dividend depends on its standing."
 KRAUS_integ_dividend_SLO:0 "Slovakia Integration Dividend"
 KRAUS_integ_dividend_SLO_desc:0 "After Slovakia joined Austria proper, a dividend is settled every 180 days."
 KRAUS_integ_tech_SLO:0 "Engineers of Slovakia"
 KRAUS_integ_events.5.t:0 "Dividend from Slovakia"
 KRAUS_integ_events.5.d:0 "The mining towns of the Slovak hills join the unified imperial administration, and the new road now runs to the village gate."
 KRAUS_integ_events.5.a:0 "One ledger for the Empire."
 KRAUS_integrate_TRS:0 "Integrate Transylvania"
 KRAUS_integrate_TRS_desc:0 "Merge Transylvania into Austria proper and gain its cores; its generals, scientists and advisors transfer to Austria. Grievances follow, and the dividend depends on its standing."
 KRAUS_integ_dividend_TRS:0 "Transylvania Integration Dividend"
 KRAUS_integ_dividend_TRS_desc:0 "After Transylvania joined Austria proper, a dividend is settled every 180 days."
 KRAUS_integ_tech_TRS:0 "Engineers of Transylvania"
 KRAUS_integ_events.6.t:0 "Dividend from Transylvania"
 KRAUS_integ_events.6.d:0 "The bauxite and natural gas of Transylvania are now allocated directly by the unified imperial administration."
 KRAUS_integ_events.6.a:0 "One ledger for the Empire."
 KRAUS_ia_need_95_tt:0 "Requires §YCrown and Order ≥ 95§!"
 KRAUS_je_institute:0 "Imperial Institute of Technology"
 KRAUS_je_institute_desc:0 "The polytechnics of Vienna, Prague, Budapest and Krakow have gone their separate ways for too long. Merged into one institute with one programme and one budget, every crownland sits at the same drawing board."
 KRAUS_je_works:0 "Danube Canals and Harbours"
 KRAUS_je_works_desc:0 "The waterways from Vienna to the Black Sea never kept pace with the freight. Dredged, embanked and extended, the rivers of the crownlands become one network."
 KRAUS_je_resources:0 "Oil and Bauxite Concessions"
 KRAUS_je_resources_desc:0 "The oil of the Vienna basin and the bauxite of Hungary have long been run by private concessions at low output. Taken back and run as one, they become the empire's own strategic reserve."
 KRAUS_je_charter:0 "Danubian Economic Community"
 KRAUS_je_charter_desc:0 "With arms, research, civil works and resources complete, what remains is to put it in writing: each crownland's contribution, dividend and duty become part of imperial finance instead of an annual bargain."
 KRAUS_flame_tank:0 "Flamethrower Tanks"
 KRAUS_flame_tank_desc:0 "Machine guns and cannon often fail to clear bunkers and trenches. A tank carrying a flamethrower spares the infantry many lives."
 KRAUS_nuclear_tech:0 "Nuclear Technology"
 KRAUS_nuclear_tech_desc:0 "Rockets let us send things far away, and the physicists of Vienna and Prague have long known how much energy lies inside the atom. Putting it on the imperial research programme is a wager nobody can see the end of."
 AUS_military_mountaineers:0 "Military Engineering Vehicles"
 KRAUS_je_institute_tb:0 "Imperial Institute Results"
 KRAUS_jm_intel:0 "Imperial Intelligence Net"
 KRAUS_jm_war_ministry:0 "Imperial War Ministry Reorganisation"
