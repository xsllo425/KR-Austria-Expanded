l_english:
 KRAUS_root_ecr_gate_tt:0 "The aftermath of §YBlack Monday§! lingers. Once it has passed, this last level is §Gremoved automatically§!."
 KRAUS_root_pol_gate_tt:0 "Requires §YCrown and Order ≥ 50§!. Once reached, this last level is §Gremoved automatically§!."
 KRAUS_econ_eff_bonus_tt:0 "Economic programme: factory output growth §G+5%§!"
 KRAUS_econ_start_bonus_tt:0 "Economic programme: factory starting output §G+5%§!"
 KRAUS_bop_locked_tt:0 "The §YEmperor's Balance§! is settled and §Rcan no longer be adjusted§!."
 KRAUS_renner_hegemony:0 "The Big Tent Governs"
 KRAUS_renner_hegemony_desc:0 "Renner has won. Social Democrats and the representatives of the nationalities fill the cabinet, and the conservatives can no longer swing the outcome. Factories, schools and housing advance at full speed - and the officer corps must accept an Empire that no longer puts them first."
 KRAUS_miklas_hegemony:0 "Government of Order"
 KRAUS_miklas_hegemony_desc:0 "Miklas has won. The Christian Socials and their allies hold every ministry and parliament merely approves. The army gets everything it asked for; the people learn to live on tighter budgets."
 KRAUS_root_events.1.t:0 "An Old Ailment Recedes"
 KRAUS_root_events.1.d:0 "One of the ailments that has weighed on the Empire for years has finally loosened its grip. The papers gave it a full page; in the corridors the ministers only muttered that there was more to do."
 KRAUS_root_events.1.a:0 "One step at a time."
 KRAUS_root_events.2.t:0 "Harmonious Development of the Crownlands"
 KRAUS_root_events.2.d:0 "Economic crisis, a weak army, a restless parliament - all three cracks have closed. For the first time Vienna and the crownlands can talk about a shared future rather than shared troubles."
 KRAUS_root_events.2.a:0 "The Empire stands firm."
 KRAUS_root_events.10.t:0 "Crown and Order"
 KRAUS_root_events.10.d:0 "Emperor Karl writes no laws and leads no party. He holds only two things: six centuries of Habsburg prestige, and the Catholic order upheld by Vienna's cathedral, the parishes and the schools.\n\nThe two have always been one. The prestige of the crown brings the nationalities to the same table; the Church and order make sure the Empire is still there when they leave.\n\nToday little of either remains. Parliament and the street are losing patience with the court, and every reform and every crisis will add to it or take away from it."
 KRAUS_root_events.10.a:0 "The crown must be respected again."
 KRAUS_root_events.10.a_tt:0 "§YCrown and Order§! (0-100) grants a set of lasting bonuses that grow with each tier.\nFocuses, keeping the Balance centred and weathering crises raise it; §YCrown and Order§! decisions spend it for political power, stability and more.\nIt is also required (≥ 50) to remove the last level of §YPolitical Instability§!."
 austria_election_events.101.a_tt:0 "Gain the national spirit §YDivided Society§!."
 austria_election_events.102.a_tt:0 "Gain the national spirit §YDivided Society§!."
 aus_economic_crisis_1h:0 "Sluggish Regional Recovery"
 aus_economic_crisis_1h_desc:0 "The Austrian economy is in ruins after the Great War: output collapsed, unemployment rampant, the treasury nearly empty. Recovery will need massive investment and structural reform."
 aus_economic_crisis_2h:0 "Regions Drawing Level"
 aus_economic_crisis_2h_desc:0 "The Austrian economy is in ruins after the Great War: output collapsed, unemployment rampant, the treasury nearly empty. Recovery will need massive investment and structural reform."
 aus_economic_crisis_3h:0 "A Nearly Balanced Imperial Economy"
 aus_economic_crisis_3h_desc:0 "The Austrian economy is in ruins after the Great War: output collapsed, unemployment rampant, the treasury nearly empty. Recovery will need massive investment and structural reform."
 aus_military_weakness_1h:0 "Military Weakness"
 aus_military_weakness_1h_desc:0 "The once-proud Austro-Hungarian military is a shadow of itself: outdated equipment, low morale, and an officer corps divided by politics rather than doctrine."
 aus_military_weakness_2h:0 "A United Empire, An Unreformed Army"
 aus_military_weakness_2h_desc:0 "The once-proud Austro-Hungarian military is a shadow of itself: outdated equipment, low morale, and an officer corps divided by politics rather than doctrine."
 aus_military_weakness_3h:0 "A United Empire, An Unreformed Army"
 aus_military_weakness_3h_desc:0 "The once-proud Austro-Hungarian military is a shadow of itself: outdated equipment, low morale, and an officer corps divided by politics rather than doctrine."
 aus_political_instability_1h:0 "Political Instability"
 aus_political_instability_1h_desc:0 "Political factions are tearing Austria apart -- monarchists, socialists, nationalists, separatists, with no consensus possible. Government stability is at an all-time low."
 aus_political_instability_2h:0 "The Balkan Powder Keg"
 aus_political_instability_2h_desc:0 "Political factions are tearing Austria apart -- monarchists, socialists, nationalists, separatists, with no consensus possible. Government stability is at an all-time low."
 aus_political_instability_3h:0 "The Balkan Powder Keg"
 aus_political_instability_3h_desc:0 "Political factions are tearing Austria apart -- monarchists, socialists, nationalists, separatists, with no consensus possible. Government stability is at an all-time low."
 KRAUS_ia_need_10_tt:0 "Requires §YCrown and Order ≥ 10§!"
 KRAUS_ia_need_15_tt:0 "Requires §YCrown and Order ≥ 15§!"
 KRAUS_ia_need_25_tt:0 "Requires §YCrown and Order ≥ 25§!"
 KRAUS_ia_need_50_tt:0 "Requires §YCrown and Order ≥ 50§!"
 KRAUS_root_events.20.t:0 "Crisis of the Crown"
 KRAUS_root_events.20.d:0 "The prestige of the court has hit rock bottom. Deputies mock the palace openly and portraits of the Emperor are torn down in the street. If nothing is done, the Empire will be nothing but a name."
 KRAUS_root_events.20.a:0 "Rule by emergency decree."
 KRAUS_root_events.20.b:0 "Open the treasury and buy loyalty."
 KRAUS_root_events.20.c:0 "Let it be."
 KRAUS_crown_eclipse:0 "The Crown Eclipsed"
 KRAUS_crown_eclipse_desc:0 "No one listens to the court any more. Ministers go their own way and the provinces simply wait to see who governs next."
 KRAUS_bul_won_balkan_war_tt:0 "Bulgaria won the Balkan war"
 KRAUS_balkan_events.42.t:0 "Bulgaria Defeated"
 KRAUS_balkan_events.42.d:0 "Bulgaria has lost the Balkan war. Every stake Vienna placed in the south is gone: the victors of the Belgrade Pact are eyeing the Empire's southern border, and at home people are asking who put us on the wrong side."
 KRAUS_balkan_events.42.a:0 "That bill will come due."
 KRAUS_ia_gain_5_tt:0 "§YCrown and Order§! §G+5§!"
 KRAUS_ia_gain_8_tt:0 "§YCrown and Order§! §G+8§!"
