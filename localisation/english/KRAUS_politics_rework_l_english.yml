 KRAUS_joint_econ_spirit_9:0 "Danubian Economic Community"
 KRAUS_joint_econ_spirit_9_desc:0 "Contributions, dividends and obligations are written into the imperial treasury; the Vienna Circle chairs, the Skoda works and the crownland mines all sit in this one ledger."
 KRAUS_je_spirit_up_tt:0 "Danubian Joint Works rises one level; its permanent bonuses are folded into this one modifier."
