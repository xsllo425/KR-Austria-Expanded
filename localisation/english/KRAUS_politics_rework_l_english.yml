 KRAUS_war_college_3:0 "Imperial War College III"
 KRAUS_doctrine_enhance_tt:0 "Upgrades the modern army spirit according to the chosen doctrine:"
 KRAUS_balkan_events.70.t:0 "The Guns of the Balkans"
 KRAUS_balkan_events.70.d:0 "The war between Bulgaria and Serbia has begun. Envoys, officers and merchants of the Belgrade Pact crowd into Vienna and ask where the Empire stands.\n\nSend volunteers to one side, or watch from beyond the border while both exhaust themselves? Either way, the focuses on the chosen route will grant extra political power."
 KRAUS_balkan_events.70.a:0 "Send volunteers and intervene"
 KRAUS_balkan_events.70.a_tt:0 "Completing the intervention route focuses later grants additional political power."
 KRAUS_balkan_events.70.b:0 "Stay out and observe"
 KRAUS_balkan_events.70.b_tt:0 "Completing the non-intervention route focuses later grants additional political power."
 KRAUS_dip_spain:0 "The Old Crown of Iberia"
 KRAUS_dip_spain_desc:0 "Spain was once Habsburg land, and the shadow of that crown still lies over Madrid. While the civil war rages, envoys of every side queue in Vienna; once it ends, the new masters will need recognition from their neighbours.\n\nDuring the war this focus lets Austria back one side; after it, Austria reaches out to the victor."
 KRAUS_dip_italy_others:0 "Reaching Out to the Other Italian Powers"
 KRAUS_dip_italy_others_desc:0 "Italy is more than one government: the Two Sicilies, Sardinia-Piedmont and the Papal States each have their own claims and fears. Vienna sends envoys to each court to learn who would return to the Danubian-Adriatic alliance."
 KRAUS_nb_flexible:0 "Flexible Fleet Organisation"
 KRAUS_nb_large:0 "Large Fleet Training"
 KRAUS_nb_small:0 "Small Ship Tactics"
 KRAUS_nb_capital:0 "Capital Ship Experience"
 KRAUS_nb_ports:0 "Istrian Port Complex"
 KRAUS_ab_aviation:0 "Aviation Corps Training"
 KRAUS_ab_school:0 "Flying School System"
 KRAUS_ab_fighter:0 "Fighter Trial Results"
 KRAUS_ab_light:0 "Light Bomber Tactics"
 KRAUS_ab_medium:0 "Medium Bomber Tactics"
 KRAUS_ab_bases:0 "Airbase Network"
 KRAUS_dip_blackhand:0 "Clear Out the \"Black Hand\""
 KRAUS_dip_blackhand_desc:0 "The shots of Sarajevo came from a secret society within the Serbian Army. The old Black Hand under a new name, the Konspiracija, overthrew the dynasty in 1925, rearming around the Treaty of Wartholz while waiting for revenge. With the great war begun, the Empire will not let a conspiracy of officers hold an army any longer."
 KRAUS_dip_impaler:0 "No More Impalers"
 KRAUS_dip_impaler_desc:0 "The Legion writes the name of Vlad the Impaler on its banners, treats the humiliation of defeat as a new faith and the Greater Romania as an oath to be paid for in blood. The Empire does not mean to watch this warrior cult on the lower Danube rise again."
 KRAUS_balkan_events.80.t:0 "Vienna's Ultimatum"
 KRAUS_balkan_events.80.d:0 "Serbia lost the Fourth Balkan War to Bulgaria, owes reparations and has no faction willing to take it in. The officers of the Konspiracija still talk of revenge in Belgrade's General Staff.\n\nAustria's envoy brings a new document: hand foreign affairs and the army to Vienna and dissolve the officers' secret society. It replaces the Treaty of Wartholz, which has become a dead letter."
 KRAUS_balkan_events.80.a:0 "Sign: Serbia becomes Austria's puppet."
 KRAUS_balkan_events.80.b:0 "Refuse; the officer corps decides."
 KRAUS_balkan_events.81.t:0 "Vienna's Ultimatum"
 KRAUS_balkan_events.81.d:0 "Romania lost the Fourth Balkan War to Bulgaria and is alone once more. The King's court and the Legion's Captain each try to find a culprit for the defeat.\n\nAustria's envoy brings a document: hand foreign affairs and the army to Vienna, and the Legion's warrior bands are to be dissolved on the spot."
 KRAUS_balkan_events.81.a:0 "Sign: Romania becomes Austria's puppet."
 KRAUS_balkan_events.81.b:0 "Refuse; the King and the Legion decide."
 KRAUS_balkan_events.82.t:0 "The Balkan Share"
 KRAUS_balkan_events.82.d:0 "Serbia and Romania are both under Vienna's banner. The Finance Ministry brings a list: 20% of each one's military and civilian industry goes to the Empire, and the coal, iron and oil within them are opened to Austria."
 KRAUS_balkan_events.82.a:0 "Sign it."
 KRAUS_balkan_events.82.b:0 "Share the proceeds with Bulgaria, in return for it joining our faction."
 KRAUS_balkan_events.82.b_tt:0 "§YBulgaria§! gains the right to use the resources in both countries and joins Austria's faction."
 KRAUS_blackhand_apply_tt:0 "Serbia and Romania each hand §Y20%§! of their military and civilian factories to Austria, and Austria gains the right to use all strategic resources in both countries."
 KRAUS_blackhand_share:0 "The Balkan Share"
 KRAUS_blackhand_share_desc:0 "Part of the puppets' military and civilian industry works for Vienna."
 KRAUS_ab_heavy:0 "Heavy Bomber Tactics"
 KRAUS_ab_phoenix:0 "Phoenix Airframe Programme"
 KRAUS_no_form_germany_tt:0 "Austria does not become "Germany" as a result; it gains claims on the states of southern Germany only, and the other German states go the way of sponsored puppets."
 KRAUS_promise.1.t:0 "The Promise Kept: Hungary Independent"
 KRAUS_promise.1.d:0 "The great war is over. Among the secret promises made to Budapest before the war, one reads: after the war Hungary becomes independent under a common crown, with defence still borne by the common army. The Emperor turns to that page and says nothing more."
 KRAUS_promise.1.a:0 "Honour the promise."
 KRAUS_promise.1.a_tt:0 "§YHungary§! leaves its puppet status and gains the §YCommon Defence§! spirit."
 KRAUS_promise.2.t:0 "The Promise Kept: Privileges of the Crown Lands"
 KRAUS_promise.2.d:0 "In the secret promises before the war, several crown lands were assured of keeping their standing and privileges. The route has ended here and the Empire has returned to the constitutional path, but these words still count."
 KRAUS_promise.2.a:0 "Keep them as agreed."
 KRAUS_promise.2.a_tt:0 "Crown lands that signed \"Standing and Privileges\" gain the §YPromise of the Empire§! spirit."
 KRAUS_promise_common_defence:0 "Common Defence"
 KRAUS_promise_common_defence_desc:0 "After independence, Hungary's defence still shares one staff system with the Empire."
 KRAUS_promise_privileges:0 "Promise of the Empire"
 KRAUS_promise_privileges_desc:0 "The standing and privileges signed before the war are kept in full by the Empire."
 KRAUS_habsburg_monarch_leader_desc:0 "A member of the House of Habsburg, put forward by Austria to head this state."
 KRAUS_war_order_events.20.t:0 "A New Monarch in London"
 KRAUS_war_order_events.20.d:0 "The plan of the London Reconstruction Committee has reached the table: a member of the House of Habsburg is to become monarch of Britain, and the British government will be tied to Vienna in the form of a constitutional monarchy.\n\nThe old royal house sent no one to the signing."
 KRAUS_war_order_events.20.a:0 "Crown him."
 KRAUS_war_order_events.20.a_tt:0 "§YOtto von Habsburg§! becomes head of state of §YBritain§!."
 KRAUS_war_order_events.21.t:0 "A New Monarch in Paris"
 KRAUS_war_order_events.21.d:0 "The settlement of France reaches its last page: the government is to be headed by a member of the House of Habsburg, and economic and customs affairs are opened to Vienna.\n\nThe Paris papers spend much space explaining that this is not an occupation but an agreement."
 KRAUS_war_order_events.21.a:0 "Sign."
 KRAUS_war_order_events.21.a_tt:0 "§YMaximilian Eugen von Habsburg§! becomes head of state of §YFrance§!."
 KRAUS_war_order_events.22.t:0 "A New Monarch in Madrid"
 KRAUS_war_order_events.22.d:0 "Spain has become a dependency of Vienna. With the civil war over, the court puts forward a name: Joseph August of the House of Habsburg is to become head of state, so that the old crown of Iberia returns to a family bound by blood to Vienna."
 KRAUS_war_order_events.22.a:0 "Approve."
 KRAUS_war_order_events.22.a_tt:0 "§YJoseph August von Habsburg§! becomes head of state of §YSpain§!."
 KRAUS_hd_double_tt:0 "The effect of the §YHabsburg Diplomatic Legacy§! is doubled: political power gain per ally rises from +1% to +2%."
 KRAUS_war_order_events.20.b:0 "Stay out; Britain decides its own head of state."
 KRAUS_war_order_events.21.b:0 "Stay out; France decides its own head of state."
 KRAUS_war_order_events.22.b:0 "Stay out; Spain decides its own head of state."
 KRAUS_joint_econ_spirit_6:0 "Danubian Joint Works VI"
 KRAUS_joint_econ_spirit_6_desc:0 "Vienna's joint economic programme lays railways, mines, institutes and factories across the crownlands. Each focus completed in the joint economy tree deepens it by one level; every permanent bonus accumulates on this one spirit."
 KRAUS_joint_econ_spirit_7:0 "Danubian Joint Works VII"
 KRAUS_joint_econ_spirit_7_desc:0 "Vienna's joint economic programme lays railways, mines, institutes and factories across the crownlands. Each focus completed in the joint economy tree deepens it by one level; every permanent bonus accumulates on this one spirit."
