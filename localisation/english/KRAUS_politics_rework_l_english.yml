 KRAUS_ia_need_20_tt:0 "Requires §YCrown and Order ≥ 20§!"
 KRAUS_ia_reform_endorsement:0 "Ask the Emperor to Endorse Reform"
 KRAUS_ia_reform_endorsement_desc:0 "Renner does not need the Emperor's power, only his name. One word from the Hofburg and the conservatives can no longer claim reform is tearing down the Empire."
 KRAUS_ia_dipl_powers:0 "Imperial Greetings: [FROM.GetName]"
 KRAUS_ia_dipl_powers_desc:0 "Habsburg diplomacy never relied on embassies alone. A letter in the Emperor's hand or a private visit by a member of the house often does more than ten notes - and every success reminds the country that the crown is still the Empire's face to the world."
 KRAUS_ia_dipl_italy:0 "Imperial Greetings: [FROM.GetName]"
 KRAUS_ia_dipl_italy_desc:0 "The Italian peninsula is divided, and the House of Habsburg has centuries of ties to every court and every bishop in it. The Emperor's word still carries weight here."
 KRAUS_ia_dipl_balkans:0 "Imperial Greetings: [FROM.GetName]"
 KRAUS_ia_dipl_balkans_desc:0 "The Balkan states outside the Belgrade Pact are looking for a patron strong enough to stand against it. Vienna is willing to be that patron."
 KRAUS_ia_visit_prague:0 "Visit Prague"
 KRAUS_ia_visit_prague_desc:0 "The Emperor comes to Prague Castle and addresses the Czech deputies in Czech. The crownlands exist because of the Emperor - the parties rule in Vienna, but in Prague people still look to the crown."
 KRAUS_ia_visit_lemberg:0 "Visit Lemberg"
 KRAUS_ia_visit_lemberg_desc:0 "The Emperor visits Lemberg and receives the Polish nobility and the Ukrainian clergy. In Galicia only the Emperor can bring both into the same room."
 KRAUS_ia_visit_zagreb:0 "Visit Zagreb"
 KRAUS_ia_visit_zagreb_desc:0 "The Emperor travels to Zagreb and renews the crown's promise to the southern peoples before the Illyrian diet."
 KRAUS_unlock_visit_lemberg_tt:0 "Unlocks the Crown and Order decision §YVisit Lemberg§!."
 KRAUS_unlock_visit_zagreb_tt:0 "Unlocks the Crown and Order decision §YVisit Zagreb§!."
 KRAUS_echo_1848:0 "Echoes of 1848"
 KRAUS_echo_1848_desc:0 "In 1848 the Hungarians rose too. The Empire survived by sword and concession but never answered their question. This crisis has passed, yet the question remains: why should the nations stay under one crown?"
 KRAUS_galicia_promise:0 "A Promise to Galicia"
 KRAUS_galicia_promise_desc:0 "Galicia has always been the poorest crownland. Vienna promises factories, railways and schools - and this time the promise must be kept."
 KRAUS_adriatic_gate:0 "Gateway to the Adriatic"
 KRAUS_adriatic_gate_desc:0 "Illyria holds the Empire's gate to the sea. Bind its ports, roads and fleet to the Empire and it can never leave Vienna."
 KRAUS_diet_reform:0 "Reform of the Imperial Diet"
 KRAUS_diet_reform_desc:0 "The old Reichsrat was built for an Empire that no longer exists. The governing party will turn it into a parliament that truly represents the crownlands - on its own terms."
 KRAUS_imperial_tour:0 "The Emperor Tours the Crownlands"
 KRAUS_imperial_tour_desc:0 "The Emperor sets out to visit every crownland. Only when the crown has enough prestige will such a journey be a triumph rather than a farce."
 KRAUS_common_army_people:0 "A Common Army and People"
 KRAUS_common_army_people_desc:0 "Sons of every crownland serve in one army under one flag. The barracks become the Empire's best school: Czechs, Poles and Croats learn the same commands - and learn each other."
 KRAUS_federal_charter:0 "Great Charter of the Habsburg Crownlands"
 KRAUS_federal_charter_desc:0 "Economic crisis, a weak army and political turmoil have been overcome; the crownlands are reconciled and the diet reformed. Now the Empire can write it all into a charter: the rights and duties of the nations under one crown."
 KRAUS_dc_resolved_tt:0 "The Danube crisis is settled"
 KRAUS_political_line_done_tt:0 "The political line is complete (§YThe Big Tent Holds§! or §YSocial Partnership Reconstruction Commission§!)"
 KRAUS_roots_solved_tt:0 "Economic Crisis, Military Weakness and Political Instability are all gone"
 KRAUS_danube_crisis.1.t:0 "The Crownlands Answer"
 KRAUS_danube_crisis.1.d:0 "War with Hungary has begun. Telegrams from Vienna go out to every crownland capital - now we will see how many of the promises we won are kept."
 KRAUS_danube_crisis.1.a:0 "The Empire does not fight alone."
 KRAUS_dc_none_join_tt:0 "§RNo crownland answers the call§! - we face Hungary alone."
 KRAUS_root_events.30.t:0 "Berlin Lends a Hand"
 KRAUS_root_events.30.d:0 "Germany has not stood idle as Black Monday strikes. Under the customs union, German loans and orders begin flowing into Austria to carry us through the worst. The aid will last as long as the crisis does."
 KRAUS_root_events.30.a:0 "The Germans are reliable allies."
 KRAUS_root_events.31.t:0 "The German-Austrian Economic Community"
 KRAUS_root_events.31.d:0 "With the economic community in place, Berlin raises its aid to Austria to a new scale."
 KRAUS_root_events.31.a:0 "Through the storm together."
 KRAUS_root_events.32.t:0 "The Aid Ends"
 KRAUS_root_events.32.d:0 "The aftermath of Black Monday has passed and Germany's emergency aid ends with it. From here Austria walks on its own."
 KRAUS_root_events.32.a:0 "Thank you, Berlin."
 KRAUS_german_bm_aid_tt:0 "This aid only lasts during §YBlack Monday§! and ends automatically when the crisis is over."
 KRAUS_german_bm_aid_1:0 "German Emergency Aid"
 KRAUS_german_bm_aid_1_desc:0 "German loans and orders help Austria through Black Monday."
 KRAUS_german_bm_aid_2:0 "Facing the Crisis Together"
 KRAUS_german_bm_aid_2_desc:0 "The German-Austrian Economic Community throws its full weight behind Austria against Black Monday."
 KRAUS_party_events.1.t:0 "A New School Opens"
 KRAUS_party_events.1.d:0 "A new school opened today in the Viennese suburbs. A Social Democrat councillor handed out the textbooks himself, and the next morning the papers gave it half a page."
 KRAUS_party_events.1.a:0 "This is what we are here for."
 KRAUS_party_buff_1:0 "Fruits of Public Welfare"
 KRAUS_party_buff_1_desc:0 "Schools, hospitals and parks are opening, and working families feel for the first time that the state is on their side."
 KRAUS_party_events.2.t:0 "The Friends of Nature Go Hiking"
 KRAUS_party_events.2.d:0 "At the weekend thousands of working families take the train into the Alps. Around the Friends of Nature camps people sing and talk not of wages but of which mountain to climb next."
 KRAUS_party_events.2.a:0 "The mountains belong to the workers too."
 KRAUS_party_buff_2:0 "The Friends of Nature Movement"
 KRAUS_party_buff_2_desc:0 "Workers have somewhere to spend their leisure; there is less anger in the cities and more goodwill towards the government."
 KRAUS_party_events.3.t:0 "Vienna Is Broadcasting"
 KRAUS_party_events.3.d:0 "The Imperial broadcasting network now reaches every crownland. The same programme airs in German, Czech and Hungarian in turn, and the Emperor's New Year address has reached every village for the first time."
 KRAUS_party_events.3.a:0 "The voice of the Empire."
 KRAUS_party_buff_3:0 "Voice of the Empire"
 KRAUS_party_buff_3_desc:0 "Imperial radio carries the government's word everywhere."
 KRAUS_party_events.4.t:0 "A Handshake Across the Aisle"
 KRAUS_party_events.4.d:0 "The leaders of the Christian Socials and the Social Democrats shook hands in a parliamentary corridor. Both called it a courtesy, but the next day several long-stalled bills passed."
 KRAUS_party_events.4.a:0 "Steady the country first."
 KRAUS_party_buff_4:0 "Cross-Party Consensus"
 KRAUS_party_buff_4_desc:0 "The two great parties have set their quarrels aside for now, and parliament can finally get things done."
 KRAUS_party_events.5.t:0 "A Letter of Thanks"
 KRAUS_party_events.5.d:0 "Farmers from a village in Lower Austria have signed a letter of thanks: the subsidies carried them through the hardest winter. Miklas hung it on his office wall."
 KRAUS_party_events.5.a:0 "The farmers are the root of the nation."
 KRAUS_party_buff_5:0 "Support of the Farmers"
 KRAUS_party_buff_5_desc:0 "The countryside stands firmly behind the government, and farmers' sons are readier to enlist."
 KRAUS_party_events.6.t:0 "Reconciliation at the Factory Gate"
 KRAUS_party_events.6.d:0 "A factory on strike for three months has gone back to work. Owner and union signed the agreement at the gate, and the workers watching applauded."
 KRAUS_party_events.6.a:0 "Reconciliation is harder than conflict, and worth more."
 KRAUS_party_buff_6:0 "Social Reconciliation"
 KRAUS_party_buff_6_desc:0 "Tension between capital and labour eases, and society regains a little patience."
 KRAUS_ia_gain_3_tt:0 "§YCrown and Order§! §G+3§!"
 KRAUS_ia_cost_3_tt:0 "§YCrown and Order§! §R-3§!"
