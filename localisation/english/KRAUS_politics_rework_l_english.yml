 KRAUS_ia_cost_10_tt:0 "§YCrown and Order§! §R-10§!"
 KRAUS_bop_pending_miklas_05_tt:0 "After the election, the §YEmperor's Balance§! moves §Y5%§! towards §YMiklas§!"
 KRAUS_bop_pending_miklas_10_tt:0 "After the election, the §YEmperor's Balance§! moves §Y10%§! towards §YMiklas§!"
 KRAUS_bop_pending_renner_05_tt:0 "After the election, the §YEmperor's Balance§! moves §Y5%§! towards §YRenner§!"
 KRAUS_bop_pending_renner_10_tt:0 "After the election, the §YEmperor's Balance§! moves §Y10%§! towards §YRenner§!"
 KRAUS_bm_present_tt_NOT:0 "Black Monday has ended"
 KRAUS_montage_upgrade_tt:0 "§YAustrian Alpine Montan§! upgraded: civilian factory construction §G+10%§! → §G+20%§! (once hired)"
 KRAUS_austria_montage_2:0 "Austrian Alpine Montan"
 KRAUS_bm_recovered:0 "Recovering from Black Monday"
 KRAUS_bm_recovered_desc:0 "The worst days are over. The factories are running again, the orders are back and people believe tomorrow will be better than today."
 KRAUS_root_events.41.t:0 "A Crown Divided"
 KRAUS_root_events.41.d:0 "Austria proper is governed by parliament and parties; Bohemia, Galicia, Illyria and Hungary each have their own diet, their own government and their own grievances against Vienna. What holds these lands together is neither a party nor a law, but one Emperor.\n\nEmperor Karl cannot command, only persuade; he cannot legislate, only arbitrate. His prestige is the glue of the Empire - the greater it is, the more willing the crownlands are to stay; when it runs out, the Empire is just a line on a map."
 KRAUS_root_events.41.a:0 "The weight of the crown is the Emperor's to bear."
 KRAUS_root_events.40.t:0 "The Recruits Take the Oath"
 KRAUS_root_events.40.d:0 "On the parade ground at Wiener Neustadt, recruits from every crownland swear loyalty to the same Emperor, each in his own language. An old officer says he has not seen such a sight since 1914."
 KRAUS_root_events.40.a:0 "One army, one Empire."
 KRAUS_cw_invite:0 "Invite the Crownlands to Joint Investment"
 KRAUS_cw_invite_desc:0 "Invite every crownland (including Hungary) to the joint investment programme. Any crownland with at least 50 political power will accept and reply in 7 days. Members receive an investment every 90 days. Not possible during the Danube crisis."
 KRAUS_cw_invite_tt:0 "Crownlands with ≥ 50 political power will accept; they reply in §Y7 days§!."
 KRAUS_cw_program:0 "Crownland Joint Investment"
 KRAUS_cw_program_desc:0 "Every 90 days each member crownland receives one investment: a military factory, a civilian factory, infrastructure or a building slot. A new round starts automatically."
 KRAUS_cw_program_tt:0 "Each member crownland randomly receives §G1 military factory§!, §G1 civilian factory§!, §G+1 infrastructure§! or §G1 building slot§!."
 KRAUS_cw_program_start_tt:0 "Starts §YCrownland Joint Investment§!: a round every 90 days, repeating."
 KRAUS_dc_ongoing_tt:0 "The Danube crisis is under way"
 KRAUS_dc_hun_no_declare_tt:0 "During the war §YHungary§! cannot declare war on other countries."
 KRAUS_cw_events.1.t:0 "The Crownlands Reply"
 KRAUS_cw_events.1.d:0 "Replies from the crownland capitals arrive in Vienna one after another."
 KRAUS_cw_events.1.a:0 "The joint investment begins."
 KRAUS_cw_events.1.b:0 "No takers. Another time."
 KRAUS_cw_events.2.t:0 "Investment Suspended"
 KRAUS_cw_events.2.d:0 "The Danube crisis has broken out and the joint investment programme is suspended. It will resume automatically when the crisis is over."
 KRAUS_cw_events.2.a:0 "First things first."
 KRAUS_cw_events.3.t:0 "Investment Resumes"
 KRAUS_cw_events.3.d:0 "The Danube crisis is over and the crownland joint investment programme starts again."
 KRAUS_cw_events.3.a:0 "Back to building."
 KRAUS_cw_events.4.t:0 "The Legacy of Joint Investment"
 KRAUS_cw_events.4.d:0 "The crownlands are no more, but the factories, railways and skilled people left by years of joint investment remain on the Empire's soil."
 KRAUS_cw_events.4.a:0 "It was not in vain."
 KRAUS_cw_legacy_1:0 "Legacy of Joint Investment"
 KRAUS_cw_legacy_2:0 "Rich Legacy of Joint Investment"
 KRAUS_cw_legacy_3:0 "Monument to Crownland Development"
 KRAUS_cw_legacy_1_desc:0 "Industry and infrastructure left by years of joint investment with the crownlands."
 KRAUS_cw_legacy_2_desc:0 "Industry and infrastructure left by years of joint investment with the crownlands."
 KRAUS_cw_legacy_3_desc:0 "Industry and infrastructure left by years of joint investment with the crownlands."
 KRAUS_dc_release_tt:0 "§YBohemia, Galicia, Illyria§! and the other crownlands §Rdeclare independence and leave our faction§! for this conflict. Only the crownlands we win over will become crownlands again and fight beside us when war comes."
 KRAUS_military_lock_tt:0 "§RUntil the Disunited Imperial Army reaches its third level, we cannot recruit units, edit templates or disband units.§!"
 KRAUS_military_lock_desc:0 "The Imperial army is not yet unified (unlocks when the Disunited Imperial Army reaches its third level)"
 KRAUS_military_unlock_tt:0 "§GThe Imperial army is unified:§! recruiting, template editing and disbanding are available again."
 KRAUS_danube_crisis.2.t:0 "The Reckoning"
 KRAUS_danube_crisis.2.d:0 "The Danube crisis is settled. The crownlands that declared independence during it are brought back into the Empire.\n\nThose that stood aside while we fought will pay for it: their factories are dismantled and the machinery shipped to Vienna and to the crownlands that fought beside the Empire."
 KRAUS_danube_crisis.2.a:0 "Loyalty is rewarded; desertion has its price."
 KRAUS_dc_illyria_rally_tt:0 "§YBohemia§! and §YGalicia§! join the war against Hungary. §YIllyria§! pays for it: for each crownland that joins, Illyria loses §R75§! political power and hands one civilian factory to that crownland."
 KRAUS_joint_econ_gate_2_tt:0 "§YTier 2§!: Austria has relieved its economic crisis by at least §Y3 stages§! and has at least §Y25§! Crown and Order"
 KRAUS_joint_econ_gate_3_tt:0 "§YTier 3§!: Austria has relieved its economic crisis by at least §Y5 stages§! and has at least §Y50§! Crown and Order"
 KRAUS_joint_skoda_tech:0 "Skoda Technology Transfer"
 KRAUS_joint_daimler_tech:0 "Austro-Daimler Cooperation"
 KRAUS_joint_vienna_tech:0 "Vienna Circle Chairs"
 KRAUS_joint_econ_aus_dm:0 "Common Danubian Development"
 KRAUS_joint_econ_aus_dm_final:0 "Danubian Economic Community"
 KRAUS_joint_econ_spirit_1:0 "Common Danubian Development I"
 KRAUS_joint_econ_spirit_1_desc:0 "Vienna's joint economic programme lays railways, mines, institutes and factories across the crownlands. Each focus completed in the joint economy tree deepens it by one level; every permanent bonus accumulates on this one spirit."
 KRAUS_joint_econ_spirit_2:0 "Common Danubian Development II"
 KRAUS_joint_econ_spirit_2_desc:0 "Vienna's joint economic programme lays railways, mines, institutes and factories across the crownlands. Each focus completed in the joint economy tree deepens it by one level; every permanent bonus accumulates on this one spirit."
