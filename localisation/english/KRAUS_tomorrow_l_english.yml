l_english:
 KRAUS_tomorrow_empire:0 "Tomorrow's Empire"
 KRAUS_tomorrow_empire_desc:0 "The crisis has passed. The Empire has neither dissolved nor triumphed. It is simply still there.\n\nOver the coming hundred days the deputies of every crownland will walk into the same parliament building, and every legation will recalculate the weight of Vienna. Every choice made in these hundred days will decide what face the Empire shows when the world war arrives.\n\n§ROnce begun, there is no turning back.§!"
 KRAUS_tomorrow_done_tt:0 "The Danube Crisis is over. The Empire enters §Ythe run-up to the war§!: bind the crownlands, court the neighbours."
 KRAUS_lean_usga_tt:0 "The Empire leans towards the §YUnited States of Greater Austria§!: this road will be easier and better rewarded later."
 KRAUS_lean_gg_tt:0 "The Empire leans towards §YGreater Germany§!: this road will be easier and better rewarded later. \n§R(This route will be opened in a later version; it is not yet implemented.)§!"
 KRAUS_lean_hre_tt:0 "The Empire leans towards the §YHoly Roman Empire§!: this road will be easier and better rewarded later. \n§R(This route will be opened in a later version; it is not yet implemented.)§!"
 KRAUS_tomorrow_events.1.t:0 "The Flag over the Parliament"
 KRAUS_tomorrow_events.1.d:0 "The roof of the new parliament building has only one flagpole. Some say the flags of the crownlands should fly side by side; others say the Empire needs only one.\n\nThe workmen wait for an answer, the paint already mixed."
 KRAUS_tomorrow_events.1.a:0 "Raise the crownland flags side by side."
 KRAUS_tomorrow_events.1.b:0 "Raise only the Emperor's flag."
 KRAUS_tomorrow_events.1.c:0 "Leave it empty until parliament decides."
 KRAUS_tomorrow_events.2.t:0 "A Letter from Berlin"
 KRAUS_tomorrow_events.2.d:0 "The German ambassador has delivered a courteous letter: the shadow of Moscow and the Third International grows longer, and Vienna, Germany's traditional ally, should not stand aside. Berlin suggests an economic and defence memorandum and hints that the doors of the Reichspakt are always open to Austria.\n\nA memorandum is not an alliance, but between the two there is often only one winter."
 KRAUS_tomorrow_events.2.a:0 "Sign the memorandum."
 KRAUS_tomorrow_events.2.b:0 "Politely keep our distance."
 KRAUS_tomorrow_events.2.c:0 "Delay the reply."
 KRAUS_tomorrow_events.3.t:0 "Notes from the East"
 KRAUS_tomorrow_events.3.d:0 "Diplomatic notes from Moscow and the Third International arrive almost together, worded differently but saying the same: Austria had best remain neutral, and in return the border will stay quiet.\n\nThe foreign minister lays the two notes side by side and says: \"They are very polite. Politely enough to be unsettling.\""
 KRAUS_tomorrow_events.3.a:0 "Declare that Austria joins no bloc."
 KRAUS_tomorrow_events.3.b:0 "Refuse: Austria's friends are in the west."
 KRAUS_tomorrow_events.3.c:0 "Remain silent."
 KRAUS_tomorrow_events.4.t:0 "A Joint Proposal of the Crownland Deputies"
 KRAUS_tomorrow_events.4.d:0 "Deputies from Prague, Lemberg, Agram and Budapest have submitted a joint proposal: set up an imperial parliamentary committee to define where local languages may be used in the crownland diets and to guarantee their budgetary rights.\n\nThe officials in Vienna shake their heads: \"At this rate the Empire becomes a heap of confederations.\" The deputies reply: \"At this rate the Empire becomes one whole.\""
 KRAUS_tomorrow_events.4.a:0 "Establish the committee."
 KRAUS_tomorrow_events.4.b:0 "Keep central administration."
 KRAUS_tomorrow_events.5.t:0 "Tomorrow's Empire"
 KRAUS_tomorrow_events.5.d:0 "The hundred days are almost over. The lights in the parliament burn late, and deputies from every crownland sit on the same benches arguing the same matter in four languages.\n\nThe Empire has not become better, nor worse. It simply continues, and begins to imagine its next step."
 KRAUS_tomorrow_events.5.a:0 "Let us walk into tomorrow."
 KRAUS_party_social_democrat:0 "Imperial Social Democrats"
 KRAUS_party_social_democrat_long:0 "Imperial Social Democratic Workers' Party (Sozialdemokratische Reichspartei)\n§LThe social democratic parties of the nations have joined in the manner of the 1899 Brünn programme: cultural autonomy, one caucus in parliament. Industrial workers, trade unions and municipal employees of Vienna and Styria are its base, alongside the fitters of Prague and the dockers of Zagreb. It wants not revolution but the eight-hour day, public housing, and a constitution that has room for every nation.§!"
 KRAUS_party_social_conservative:0 "Imperial Christian Social Party"
 KRAUS_party_social_conservative_long:0 "Imperial Christian Social Party (Christlichsoziale Reichspartei)\n§LUnder the banner of Catholic conservatism, the conservative nobility around Count Bethlen's Hungarian faction now sit in the same club. Parish priests, Alpine farmers and Viennese shopkeepers vote for it because it keeps order, defends the church schools and keeps the ledgers away from the bankers. Its loyalty to the Emperor is older than any loyalty to a nation.§!"
 KRAUS_party_authoritarian_democrat:0 "Imperial Peasants' League"
 KRAUS_party_authoritarian_democrat_long:0 "Imperial Peasants' League (Reichsbauernbund)\n§LThe Bohemian Agrarians, the Galician Piast and the Croatian Peasant Party have finally remembered that they are one class. It has no interest in Vienna's constitutional quarrels, only in grain prices, agricultural credit and freight rates: whoever turns the harvest into figures in the ledger gets its votes.§!"
 KRAUS_party_social_liberal:0 "Liberal Democratic League"
 KRAUS_party_social_liberal_long:0 "Imperial Liberal Democratic League (Liberaldemokratische Reichsvereinigung)\n§LThe Czech National Democrats and the Ukrainian National Democratic Alliance now sit shoulder to shoulder, with professors, lawyers, journalists and the intelligentsia of every nation behind them. It believes a multinational state is held together by rights, not fear, and demands universal suffrage, a free press and wider powers for the crownland diets.§!"
 KRAUS_party_paternal_autocrat:0 "German National Union"
 KRAUS_party_paternal_autocrat_long:0 "German National Union (Deutscher Nationalverband)\n§LThe Sudeten Germans joined the Greater German People's Party, under the name of the old German National Association of 1910. It speaks for those in the empire who fear being diluted the most: officials, teachers and the German merchants of the border towns. It wants German predominance in the empire and a centre not held back by the crownland diets.§!"
 KRAUS_party_national_populist:0 "Fatherland Front"
 KRAUS_party_national_populist_long:0 "Fatherland Front (Vaterländische Front)\n§LThe Heimatblock and the Hungarian National Unity Party have shaken hands, at least on the surface, while the Party of Pure Rights stands outside. It prints the word 'fatherland' at the top of every leaflet and builds its front out of rural nostalgia and suspicion of the cities. The flag is the same; the slogans underneath are at least three.§!"
 KRAUS_tomorrow_events.10.t:0 "A New Shape in Parliament"
 KRAUS_tomorrow_events.10.d:0 "After a hundred days of parliamentary life, the signs on the parties of Vienna have changed.\n\n§YImperial Social Democrats§!: the social democratic parties of the nations form a union, as in the old Brünn programme of 1899.\n§YImperial Christian Social Party§!: the banner of Catholic conservatism, with the conservative nobles of Count Bethlen's circle in the same club.\n§YImperial Peasants' League§!: the Bohemian Agrarians, the Galician Piast and the Croatian Peasant Party at last remember they are one class.\n§YLiberal Democratic League§!: Czech national democrats and the Ukrainian National Democratic Alliance sit side by side.\n§YGerman National Union§!: the Sudeten Germans join the Greater German People's Party under the name of the old union of 1910.\n§YFatherland Front§!: the Heimatblock and the Hungarian National Unity Party shake hands in public, while the Pure Party of Rights stays outside.\n\nThe names have changed, the factions have not gone. Some call it the integration of the Empire; others say old quarrels have simply moved into a bigger house."
 KRAUS_tomorrow_events.10.a:0 "The imperial parliament at last looks like one."
 KRAUS_tomorrow_events.11.t:0 "Seating the Alliance"
 KRAUS_tomorrow_events.11.d:0 "For the first time the delegates of the Danube-Adriatic alliance sit at the same table in Vienna, and the first thing they quarrel over is the seating: who takes the head, whose flag stands first.\n\nSince the crisis, nobody doubts that Vienna has the right. The real question is whether it will be the alliance's master or its chairman."
 KRAUS_tomorrow_events.11.a:0 "Vienna takes the head; the rest by order of joining."
 KRAUS_tomorrow_events.11.b:0 "A rotating chair, each member in turn."
 KRAUS_tomorrow_events.11.c:0 "No seating order: a round table."
 KRAUS_tomorrow_events.12.t:0 "Hungary's Bill"
 KRAUS_tomorrow_events.12.d:0 "Deputies in Budapest ask for an amnesty for everyone drawn into the crisis; the officer corps asks for the ringleaders to be sent before a court-martial. Both petitions reach the Hofburg on the same day.\n\nThe Emperor says: \"An empire's mercy and an empire's majesty are two sides of one coin.\""
 KRAUS_tomorrow_events.12.a:0 "A full amnesty, with clemency."
 KRAUS_tomorrow_events.12.b:0 "Try the ringleaders, spare the rest."
 KRAUS_tomorrow_events.12.c:0 "Punish severely, as a warning to the crownlands."
 KRAUS_tomorrow_events.13.t:0 "Observers for the Reichspakt"
 KRAUS_tomorrow_events.13.d:0 "Berlin invites the Austrian general staff to send observers to the Reichspakt autumn manoeuvres. The letter is courteous, but the meaning is plain: Germany wants everyone to see whom Vienna sits beside."
 KRAUS_tomorrow_events.13.a:0 "Send senior officers, as an ally."
 KRAUS_tomorrow_events.13.b:0 "Send only an attaché."
 KRAUS_tomorrow_events.13.c:0 "Plead unreadiness and decline."
 KRAUS_tomorrow_events.14.t:0 "The Adriatic Fleet"
 KRAUS_tomorrow_events.14.d:0 "The alliance's admirals propose placing the joint fleet's headquarters at Pola or Trieste, which will settle who has the final say in the Adriatic.\n\nAn old admiral remarks: \"The army can hold its conferences in Vienna; the navy can only prove itself at sea.\""
 KRAUS_tomorrow_events.14.a:0 "Headquarters at Pola, under the Austrian navy."
 KRAUS_tomorrow_events.14.b:0 "Rotating command, with a liaison office in Trieste."
 KRAUS_tomorrow_events.14.c:0 "Keep separate commands."
 KRAUS_tomorrow_events.15.t:0 "Envoys from America"
 KRAUS_tomorrow_events.15.d:0 "The regimes that have split from the nation across the ocean have all sent envoys to Vienna. Some want Austria to recognise them; others hope it will at least keep silent.\n\nAn old official in the foreign ministry says: \"How a multinational state comes apart, we know better than anyone.\""
 KRAUS_tomorrow_events.15.a:0 "Stay neutral and sell industrial goods to both."
 KRAUS_tomorrow_events.15.b:0 "Publicly deplore the split, stressing the unity of multinational states."
 KRAUS_tomorrow_events.15.c:0 "Refuse to receive them."
 KRAUS_tomorrow_events.16.t:0 "The Factories of Bohemia"
 KRAUS_tomorrow_events.16.d:0 "The Škoda works in Pilsen and the Steyr group in Upper Austria have submitted applications for arms contracts at the same time. Both boards say the factory cannot last another year without the order.\n\nThe Bohemian deputies take care to remind Vienna: \"Vienna's arms industry cannot be only in Vienna.\""
 KRAUS_tomorrow_events.16.a:0 "The order goes to Škoda; Bohemian factories run at full steam."
 KRAUS_tomorrow_events.16.b:0 "Concentrate the orders around Vienna."
 KRAUS_tomorrow_events.16.c:0 "Split it proportionally under a joint armaments committee."
 KRAUS_tomorrow_events.17.t:0 "Germany's Customs Proposal"
 KRAUS_tomorrow_events.17.d:0 "The customs union between Germany and Austria was built long ago. Berlin now proposes to go further: a common external tariff, no more quotas or exceptions for farm produce, and a joint clearing bank. German exporters are hopeful; Austrian industrialists and farmers each have their own worries.\n\nThe finance minister calculates for a long time and says: \"It is a good bargain. I only wonder who will be behind the counter once it is made.\""
 KRAUS_tomorrow_events.17.a:0 "Agree to a common external tariff and open negotiations."
 KRAUS_tomorrow_events.17.b:0 "Agree only to drop the exceptions on industrial goods."
 KRAUS_tomorrow_events.17.c:0 "Keep the existing customs union, and go no further."
 KRAUS_tomorrow_events.18.t:0 "Ottawa, Paris and London"
 KRAUS_tomorrow_events.18.d:0 "The royal family in exile at Ottawa invites an Austrian envoy to tea through the Entente embassy. In the same week the Paris Commune and the Union of Britain at London send a joint request for a visit, worded in the language of comrades.\n\nThe foreign minister lays the letters side by side and says: \"Three years ago none of them would have written to us. Now they all want to know which side of the board Vienna will stand on.\""
 KRAUS_tomorrow_events.18.a:0 "Accept the Entente's invitation to tea."
 KRAUS_tomorrow_events.18.b:0 "Return the Third International delegation's visit."
 KRAUS_tomorrow_events.18.c:0 "Receive all and offend none."
