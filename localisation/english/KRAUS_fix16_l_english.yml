 KRAUS_fix16.1.t:0 "The Powder Keg Goes Out"
 KRAUS_fix16.1.d:0 "Sofia's victory did not turn into another round of revenge, nor did it fall into anyone's lap. When the volunteer corps' banners came down, the diplomats of Belgrade, Bucharest and Athens spoke of trade rather than borders at the same table for the first time. In Vienna, the staff officers pulled the red pins out of the Balkan map one by one."
 KRAUS_fix16.1.a:0 "The peninsula finally falls quiet."
 KRAUS_fix16.2.t:0 "The Last Ninety Days"
 KRAUS_fix16.2.d:0 "The great war has begun, yet the Balkan account is still unsettled. The General Staff has drawn a line: it must be settled within ninety days, or it will be left for the war to decide."
 KRAUS_fix16.2.a:0 "Noted."
 KRAUS_dip_bul_skip_tt:0 "Bulgaria already shares our faction, so the invitation is skipped; Bulgaria's opinion of us improves."
 KRAUS_dip_corridor_alt_tt:0 "Warsaw gains 1 building slot and 1 level of infrastructure, and a railway is built from Warsaw to Vienna."
 KRAUS_gal_sez:0 "Economic Cooperation Zone"
