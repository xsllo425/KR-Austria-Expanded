 KRAUS_gal_sez_tt:0 "Galician states form an Economic Cooperation Zone: +10% local construction speed and +10% local resources."
 KRAUS_gal_sez_tri_tt:0 "Galician states form a trilateral Economic Cooperation Zone: +20% local construction speed and +20% local resources."
 KRAUS_gal_corridor_faster_tt:0 "'The Galician Corridor' needs 7 fewer days to complete."
 KRAUS_poland_events_233_prosperity_tri:0 "Decline to cede it, and build a trilateral economic cooperation zone with Poland and Ukraine."
 KRAUS_ukraine_republican_events_100_prosperity_tri:0 "Decline to cede it, and build a trilateral economic cooperation zone with Ukraine and Poland."
 KRAUS_comm_auto_tt:0 "One week after the result, Public Welfare Reform or the National Austerity Policy Committee is completed automatically according to the ruling party."
