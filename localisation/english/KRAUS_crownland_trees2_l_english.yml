l_english:
 KRAUS_SLO_path:0 "Slovakia's Path"
 KRAUS_SLO_path_desc:0 "The Crown of St. Stephen has been broken apart, and Slovakia has, for the first time, a name and an agenda of its own. Whether it leans toward Vienna or toward autonomy will be decided one step at a time."
 KRAUS_SLO_loyal_1:0 "塔特拉山口的铁路"
 KRAUS_SLO_loyal_1_desc:0 "A railway through the Tatra passes ties Slovak mines to Vienna's factories."
 KRAUS_SLO_loyal_2:0 "布拉迪斯拉发的议事厅"
 KRAUS_SLO_loyal_2_desc:0 "Slovak deputies now hold permanent seats, and permanent speaking time, in Vienna's parliament."
 KRAUS_SLO_loyal_3:0 "多瑙河上游的船运"
 KRAUS_SLO_loyal_3_desc:0 "Upper Danube shipping joins the imperial river register, and cargo can run to the Black Sea without changing boats."
 KRAUS_SLO_auto_1:0 "斯洛伐克语学校"
 KRAUS_SLO_auto_1_desc:0 "Village parish schools begin teaching in Slovak, and the teachers are paid by the local assembly."
 KRAUS_SLO_auto_2:0 "斯洛伐克国民议会"
 KRAUS_SLO_auto_2_desc:0 "A national assembly for Slovak affairs meets for the first time, its agenda set by the deputies themselves."
 KRAUS_SLO_auto_3:0 "自主的斯洛伐克"
 KRAUS_SLO_auto_3_desc:0 "Vienna agrees to leave taxes, schools and local appointments to the Slovaks themselves."
 KRAUS_TRS_path:0 "Transylvania's Path"
 KRAUS_TRS_path_desc:0 "Hungarians, Romanians and Saxons of Transylvania are written into a single charter for the first time. Which way the land leans depends on what Vienna and Cluj each put on the table."
 KRAUS_TRS_loyal_1:0 "克卢日的大学"
 KRAUS_TRS_loyal_1_desc:0 "Cluj's university receives imperial funds, and chairs in three languages are founded side by side."
 KRAUS_TRS_loyal_2:0 "萨克森人的城市"
 KRAUS_TRS_loyal_2_desc:0 "The guilds of Sibiu and Brasov receive imperial charters, and the trade routes run straight to Vienna."
 KRAUS_TRS_loyal_3:0 "喀尔巴阡山口的铁路"
 KRAUS_TRS_loyal_3_desc:0 "A railway through the Carpathian passes carries Transylvanian timber and salt down to the Danube."
 KRAUS_TRS_auto_1:0 "罗马尼亚语学校"
 KRAUS_TRS_auto_1_desc:0 "Romanian-language schools open in the mountain villages, funded jointly by the church and the local assembly."
 KRAUS_TRS_auto_2:0 "特兰西瓦尼亚议会"
 KRAUS_TRS_auto_2_desc:0 "An assembly chosen by all three peoples meets in Cluj for the first time."
 KRAUS_TRS_auto_3:0 "自主的特兰西瓦尼亚"
 KRAUS_TRS_auto_3_desc:0 "Transylvania's taxes, schools and appointments are now decided by its own assembly."
 KRAUS_cl_loyal_step_tt:0 "The crownland's standing moves one step toward loyalty."
 KRAUS_cl_auto_step_tt:0 "The crownland's standing moves one step toward autonomy."
