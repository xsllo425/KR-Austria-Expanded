l_english:
 KRAUS_pp_main_tt:0 "The §Ycaucus that finishes first§! dominates the Diet and its rewards take full effect; rewards of later caucuses are halved."
 KRAUS_pp_root:0 "The Four Clubs of the Reichsrat"
 KRAUS_pp_root_desc:0 "The Reichsrat no longer has only two voices. Social Democrats, Christian Socials, the Liberal Democratic League and the National Liberals each speak for countless classes and regions: left and right, integration and decentralisation, local autonomy and centralism, federal and imperial, arranged in different combinations.\n\nThe Social Democrats and the National Liberals oppose each other, as do the Liberal Democrats and the Christian Socials: complete a focus of one club and the club diagonally opposite is locked. The two neighbouring clubs may still cooperate, but the one taken second works at half strength. Coalition focuses between neighbouring clubs open as soon as either of them has completed the same step."
 KRAUS_pp_sd_1:0 "The Ledger of Red Vienna"
 KRAUS_pp_sd_1_desc:0 "Housing, the eight-hour day, works councils. The industrial workers, unions and municipal employees of Vienna and Styria are the base of the Social Democrats."
 KRAUS_pp_sd_2:0 "Workers of Every Nation"
 KRAUS_pp_sd_2_desc:0 "The fitter in Prague, the railwayman in Lemberg and the docker in Agram belong to the same union. The Social Democrats want every nation to enjoy cultural and local autonomy within the Empire."
 KRAUS_pp_sd_3:0 "A Federal Constitution"
 KRAUS_pp_sd_3_desc:0 "Otto Bauer wrote that a nation is not a territory but a community of people. Write that into the constitution and it is a federation."
 KRAUS_pp_cs_1:0 "Parish and Field"
 KRAUS_pp_cs_1_desc:0 "Farm credit, church schools, cooperatives for small shopkeepers. Alpine farmers, parish priests and Vienna shopkeepers are the base of the Christian Socials."
 KRAUS_pp_cs_2:0 "Loyalty to the Empire"
 KRAUS_pp_cs_2_desc:0 "Loyalty to the Emperor is older than loyalty to any nation. The Christian Socials want the crownlands bound more closely to Vienna."
 KRAUS_pp_cs_3:0 "Crown and Altar"
 KRAUS_pp_cs_3_desc:0 "Lueger's Vienna was never merely politics: it was a street between the church, the town hall and the palace."
 KRAUS_pp_sl_1:0 "Rights of the Citizen"
 KRAUS_pp_sl_1_desc:0 "Universal suffrage, a free press, university autonomy. Teachers, lawyers, journalists and the intelligentsia of every nation are the base of the Liberal Democratic League."
 KRAUS_pp_sl_2:0 "Voting in One's Own Tongue"
 KRAUS_pp_sl_2_desc:0 "Deputies in Prague and Lemberg both want to speak their own language in the diets. The League wants broader powers for the crownland assemblies."
 KRAUS_pp_sl_3:0 "A Blueprint for Europe"
 KRAUS_pp_sl_3_desc:0 "Coudenhove-Kalergi wrote of a Pan-Europe. A multinational empire may be the first draft of a European union."
 KRAUS_pp_ml_1:0 "The Single Market"
 KRAUS_pp_ml_1_desc:0 "Tariffs, currency, railways. The Creditanstalt, the boards of Škoda and Steyr and the exporters are the base of the National Liberals."
 KRAUS_pp_ml_2:0 "One Balance Sheet"
 KRAUS_pp_ml_2_desc:0 "One market, one ledger, one treasury. The National Liberals want the finances of the crownlands folded into the Empire's balance sheet."
 KRAUS_pp_ml_3:0 "The Exchange of Central Europe"
 KRAUS_pp_ml_3_desc:0 "Vienna could become the London of Central Europe, provided its customs with Berlin can speak with one voice, like a single state."
 KRAUS_pps_sd_1:0 "Developing Workers' Organisations"
 KRAUS_pps_sd_2:0 "Flourishing Workers' Organisations"
 KRAUS_pps_sd_3:0 "Workers' Organisations Nearing Completion"
 KRAUS_pps_cs_1:0 "Developing Parishes and Fields"
 KRAUS_pps_cs_2:0 "Flourishing Parishes and Fields"
 KRAUS_pps_cs_3:0 "Parishes and Fields Nearing Completion"
 KRAUS_pps_sl_1:0 "Developing Civil Society"
 KRAUS_pps_sl_2:0 "Flourishing Civil Society"
 KRAUS_pps_sl_3:0 "Civil Society Nearing Completion"
 KRAUS_pps_ml_1:0 "Developing Unified Market"
 KRAUS_pps_ml_2:0 "Flourishing Unified Market"
 KRAUS_pps_ml_3:0 "Unified Market Nearing Completion"
 KRAUS_pp_boom_sd:0 "The Red Vienna Surge"
 KRAUS_pp_boom_cs:0 "Harvest Festival and Parish Fair"
 KRAUS_pp_boom_sl:0 "A Free Press Boom"
 KRAUS_pp_boom_ml:0 "Boom on the Exchange"
 KRAUS_pp_events.1.t:0 "The Workers Stand with You"
 KRAUS_pp_events.1.d:0 "A scene never seen in the Reichsrat: Social Democratic deputies rise to speak at once for the fitters of Vienna, the steelworkers of Styria, the textile women of Prague and the dockers of Agram.\n\nUnions, municipal employees and the labour organisations of every nation have taken this programme as their banner. They do not expect heaven, only a place to speak within the Empire."
 KRAUS_pp_events.1.a:0 "Workers are the backbone of the Empire."
 KRAUS_pp_events.2.t:0 "Farmers and Parishes Stand with You"
 KRAUS_pp_events.2.d:0 "Alpine farmers, parish priests, Vienna shopkeepers and minor officials have written to the Reichsrat in the same week: they will vote for the party that keeps order, protects the church schools and will not hand their ledgers to the bankers.\n\nThe Christian Social deputies find they speak for the quietest people in the Empire."
 KRAUS_pp_events.2.a:0 "Order is the last property of the poor."
 KRAUS_pp_events.3.t:0 "Citizens and Intellectuals Stand with You"
 KRAUS_pp_events.3.d:0 "Professors, schoolteachers, lawyers, journalists and the intellectuals of every nation copy out the programme of the Liberal Democratic League again and again in the coffee houses.\n\nThey ask for little: to speak their own language, read their own paper, and vote in their own diets. They believe a multinational state is held together by rights, not by fear."
 KRAUS_pp_events.3.a:0 "Rights are the cheapest loyalty."
 KRAUS_pp_events.4.t:0 "Banks and Factories Stand with You"
 KRAUS_pp_events.4.d:0 "The board of the Creditanstalt, the shareholders of Škoda and Steyr, the exporters and the great landowners have, rarely, signed the same statement: they back a single market and a single ledger.\n\nOn the Vienna exchange the day closes three points up."
 KRAUS_pp_events.4.a:0 "The market is the greatest parliament of the Empire."
 KRAUS_usga_main_sd:0 "The Union of Labour"
 KRAUS_usga_main_cs:0 "The Union of the Parishes"
 KRAUS_usga_main_sl:0 "The Union of Citizens"
 KRAUS_usga_main_ml:0 "The Union of Markets"
 KRAUS_pp_events.11.t:0 "The Workers' Programme Is Written"
 KRAUS_pp_events.11.d:0 "The Social Democratic club has finished its programme in three steps. Printed as pamphlets, it passes page by page through the workers' quarters of Vienna, the mines of Styria and the workshops of Prague.\n\nSomeone reads it aloud to an old worker who cannot read. When it is done, he asks only: \"Is this written for us, or for the Reichsrat?\""
 KRAUS_pp_events.11.a:0 "For us, and for the Reichsrat."
 KRAUS_pp_events.12.t:0 "The Parish Programme Is Written"
 KRAUS_pp_events.12.d:0 "The Christian Social club has finished its programme in three steps, and the priests read it to the parish on Sunday. It speaks of farm credit, church schools and loyalty to the Empire.\n\nThe farm women set down their baskets and say: \"At least next year's taxes will not be heavier.\""
 KRAUS_pp_events.12.a:0 "The field is the oldest parliament of the Empire."
 KRAUS_pp_events.13.t:0 "The Citizens' Programme Is Written"
 KRAUS_pp_events.13.d:0 "The Liberal Democratic League has finished its programme in three steps. Every newspaper prints it in full, some in German, some in Czech, some in Polish and Ruthenian.\n\nIn the coffee house someone folds the paper in four and tucks it into his coat: \"This is the first time anyone has set our rights down so precisely.\""
 KRAUS_pp_events.13.a:0 "To write rights down is the cheapest loyalty."
 KRAUS_pp_events.14.t:0 "The Exchange's Programme Is Written"
 KRAUS_pp_events.14.d:0 "The National Liberals have finished their programme in three steps. The Creditanstalt has it bound and sent to every director and exporter.\n\nThe London Times, unusually, gives it a whole column: \"Vienna wants to be the counting-house of Central Europe.\""
 KRAUS_pp_events.14.a:0 "The counting-house is also the heart of a state."
 KRAUS_pc_boom_fed:0 "The Federalist Surge"
 KRAUS_pc_fed_1:0 "The Equality of Nations Act"
 KRAUS_pc_fed_1_desc:0 "Social Democrats and liberals sign the same bill: every nation shall have an equal language status in parliament and in the offices.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; it excludes nothing.)"
 KRAUS_pc_fed_2:0 "The Social Insurance Act"
 KRAUS_pc_fed_2_desc:0 "Sickness, old age, unemployment: the state cannot look away. The Social Democrats want insurance for workers, the Liberal Democrats security for citizens, and both sign the same bill. The workshop and the field are written onto the same list for the first time.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; not exclusive with other focuses.)"
 KRAUS_pc_fed_3:0 "The Multinational Charter"
 KRAUS_pc_fed_3_desc:0 "A charter that can be printed in six languages: equal standing for every language, and a budget of their own for every diet. Social Democrats and Liberal Democrats agree that the Empire lasts only if every nation feels it is theirs.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; not exclusive with other focuses.)"
 KRAUS_pc_boom_mkt:0 "The Free-Market Boom"
 KRAUS_pc_mkt_1:0 "Freedom of Press and Trade"
 KRAUS_pc_mkt_1_desc:0 "The liberals ask for two things: papers that are not censored, and tariffs that do not rob.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; it excludes nothing.)"
 KRAUS_pc_mkt_2:0 "The Imperial Central Bank"
 KRAUS_pc_mkt_2_desc:0 "One bank, one currency, one ledger. Both the National Liberals and the Liberal Democrats think this is what the Empire lacks most.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; it excludes nothing.)"
 KRAUS_pc_mkt_3:0 "The Vienna Exchange"
 KRAUS_pc_mkt_3_desc:0 "Vienna could be the London of Central Europe, if it can make Berlin's capital want to linger.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; it excludes nothing.)"
 KRAUS_pc_boom_imp:0 "The Dividend of Imperial Unity"
 KRAUS_pc_imp_1:0 "The Imperial Commercial Code"
 KRAUS_pc_imp_1_desc:0 "One code, valid from Prague to Agram. Merchants and officials agree on this for once.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; it excludes nothing.)"
 KRAUS_pc_imp_2:0 "One Crown, One Timetable"
 KRAUS_pc_imp_2_desc:0 "The crown should be the same in every crownland, and no timetable should show a border. The National Liberals want an open market, the Christian Socials a united empire, and this time they want the same thing.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; not exclusive with other focuses.)"
 KRAUS_pc_imp_3:0 "Parish and Mutual Fund"
 KRAUS_pc_imp_3_desc:0 "The Christian Socials will not let the state do everything; the National Liberals will not let the tax bill grow. Both agree: relief goes to the parish relief stations and the guild mutual funds, and the Empire supplies a statute and a subsidy.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; not exclusive with other focuses.)"
 KRAUS_pc_boom_soc:0 "A Spring of Social Legislation"
 KRAUS_pc_soc_1:0 "The Social Insurance Act"
 KRAUS_pc_soc_1_desc:0 "Christian Socials and Social Democrats do not quarrel on one point: when a man is sick, old or out of work, the state cannot look away.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; it excludes nothing.)"
 KRAUS_pc_soc_2:0 "Parish Relief and the Unions"
 KRAUS_pc_soc_2_desc:0 "The parish relief stations and the unions' mutual funds sit at the same table for the first time.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; it excludes nothing.)"
 KRAUS_pc_soc_3:0 "The Alliance of Worker and Peasant"
 KRAUS_pc_soc_3_desc:0 "The people of the fields and the people of the workshops are written on the same list in parliament for the first time.\n\n(Coalition focus: available once either of the two neighbouring clubs has completed the same step; it excludes nothing.)"
 KRAUS_pp_coal.1.t:0 "The Terms of the Christian Socials"
 KRAUS_pp_coal.1.d:0 "The Christian Social caucus has sat in the committee room through the night.\n\nParish priests, village teachers and the stewards of the great estates have all had their say: the Empire cannot do without altar and throne, but it cannot be run by one man alone. In the end they list three conditions, that parish schools are left alone, agricultural credit is not tightened, and the Emperor's household is not discussed. If these are written into the joint programme, they are willing to join the cabinet."
 KRAUS_pp_coal.1.a:0 "Write it into the programme and invite them into the cabinet."
 KRAUS_pp_coal.1.b:0 "Not this time."
 KRAUS_pp_coal_join_cs_tt:0 "The Christian Socials join the governing coalition."
 KRAUS_pp_coal.2.t:0 "The Ledger of the National Liberals"
 KRAUS_pp_coal.2.d:0 "The National Liberals have sent a banker-turned-deputy, who spreads a ledger on the table.\n\nTariffs, railway freight rates and the interest on state bonds are compared item by item. He does not demand the same platform, only one thing: the budget must not be written by people who cannot count. If the figures add up, they are willing to join the cabinet."
 KRAUS_pp_coal.2.a:0 "The figures add up; invite them into the cabinet."
 KRAUS_pp_coal.2.b:0 "Not this time."
 KRAUS_pp_coal_join_ml_tt:0 "The National Liberals join the governing coalition."
 KRAUS_pp_coal.3.t:0 "Three Seats for the Social Democrats"
 KRAUS_pp_coal.3.d:0 "No one speaks as the Social Democratic delegation walks through the corridors of the Diet.\n\nThe union representatives demand three seats: the Ministry of Labour, the Housing Office and the Factory Inspectorate. They declare that they have not come to share the spoils, but to let the people on the shop floor know that someone in the Diet is keeping watch for them. The terms are agreed and they are willing to join the cabinet."
 KRAUS_pp_coal.3.a:0 "Give them three seats and invite them in."
 KRAUS_pp_coal.3.b:0 "Not this time."
 KRAUS_pp_coal_join_sd_tt:0 "The Social Democrats join the governing coalition."
 KRAUS_pp_coal.4.t:0 "The Last Page of the Union"
 KRAUS_pp_coal.4.d:0 "The deputies of the Liberal Democratic Union bring not a list but a draft charter.\n\nThey are willing to serve in the cabinet with the ruling party, on condition that the page of the draft on freedom of the press, mother-tongue schools and local diets is written unchanged into the last page of the joint programme. The ruling party's negotiator turns to that page, is silent for a while, and nods."
 KRAUS_pp_coal.4.a:0 "Write it on the last page and invite them in."
 KRAUS_pp_coal.4.b:0 "Not this time."
 KRAUS_pp_coal_join_sl_tt:0 "The Liberal Democratic League join the governing coalition."
 KRAUS_pc_adj_fed_tt:0 "The ruling party must be the Social Democrats or the Liberal Democratic League"
 KRAUS_pc_adj_mkt_tt:0 "The ruling party must be the Liberal Democratic League or the National Liberals"
 KRAUS_pc_adj_imp_tt:0 "The ruling party must be the National Liberals or the Christian Socials"
