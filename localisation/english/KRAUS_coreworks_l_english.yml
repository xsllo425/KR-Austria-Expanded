 KRAUS_coreworks_lciv:0 "Lower Austria Civilian Factory"
 KRAUS_coreworks_lciv_desc:0 "Build a civilian factory in Lower Austria; it completes automatically after 60 days. The state must be fully controlled with a free slot; only one core or crownland project can run at a time."
 KRAUS_coreworks_uciv:0 "Upper Austria Civilian Factory"
 KRAUS_coreworks_uciv_desc:0 "Build a civilian factory in Upper Austria; it completes automatically after 90 days. The state must be fully controlled with a free slot; only one core or crownland project can run at a time."
 KRAUS_coreworks_lmil:0 "Lower Austria Military Factory"
 KRAUS_coreworks_lmil_desc:0 "Build a military factory in Lower Austria; it completes automatically after 90 days. The state must be fully controlled with a free slot; only one core or crownland project can run at a time."
 KRAUS_coreworks_m_eco4:0 "Focus Delivery: 3 Civilian Factories in Lower Austria"
 KRAUS_coreworks_m_mil4:0 "Focus Delivery: 3 Military Factories in Lower Austria"
 KRAUS_coreworks_m_mil736:0 "Focus Delivery: 3 Military Factories"
 KRAUS_coreworks_m_rail775:0 "Focus Delivery: Southern Railway, Section I"
 KRAUS_coreworks_m_rail102:0 "Focus Delivery: Southern Railway, Section II"
 KRAUS_coreworks_m_rail736:0 "Focus Delivery: Southern Railway, Section III"
 KRAUS_coreworks_m_rail488:0 "Focus Delivery: Southern Railway, Section IV"
 KRAUS_coreworks_retry_tt:0 "The target state is not under our control or has no free slot; the project is postponed and restarts."
 KRAUS_coreworks_ent_eco_tt:0 "Construction starts automatically: §G3 civilian factories§! in Lower Austria (75 days)."
 KRAUS_coreworks_ent_mil_tt:0 "Construction starts automatically: §G3 military factories§! each in Lower Austria and another core state (90 days)."
 KRAUS_coreworks_ent_rail_tt:0 "Construction starts automatically: §G+1 infrastructure§! in each of the four Southern Railway states (60 days)."
