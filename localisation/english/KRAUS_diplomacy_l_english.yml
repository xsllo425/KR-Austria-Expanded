l_english:
 KRAUS_dip_beyond_danube:0 "Beyond the Danube"
 KRAUS_dip_beyond_danube_desc:0 "The Danube crisis is over and the Empire's household affairs are settled. Vienna can at last raise its eyes to the world beyond the Danube: the Apennines, the Vistula, the Dnieper and the mountains of the Balkans. The Donau-Adriabund must be more than a scrap of paper."
 KRAUS_dip_italy_return:0 "Return to the Donau-Adriabund"
 KRAUS_dip_italy_return_desc:0 "After Black Monday, Italy slipped Vienna's reins. But its neighbours are the same neighbours and its enemies the same enemies. As long as Rome has not fallen to the socialists, Vienna can hold out the olive branch again, this time as an ally. Once Italy is back, the universities exchange scholars and the general staffs exchange maps."
 KRAUS_dip_italy_invite_tt:0 "Invite §YItaly§! back into the §YDonau-Adriabund§!. Italy may accept or refuse."
 KRAUS_dip_friendship:0 "Friendship Beyond the Danube"
 KRAUS_dip_events.1.t:0 "Vienna's Invitation"
 KRAUS_dip_events.1.d:0 "The Austrian ambassador has brought a letter: Vienna invites us to return to the Donau-Adriabund, this time not as a puppet but as an ally.\n\nSome say we only just escaped Vienna; others say that in times like these Italy needs friends."
 KRAUS_dip_events.1.a:0 "We accept."
 KRAUS_dip_events.1.b:0 "Italy will go its own way."
 KRAUS_dip_events.2.t:0 "Italy Returns to the Alliance"
 KRAUS_dip_events.2.d:0 "Rome has accepted our invitation. Italy has rejoined the Donau-Adriabund, this time as an ally."
 KRAUS_dip_events.2.a:0 "The Adriatic is ours again."
 KRAUS_dip_events.3.t:0 "Italy Declines"
 KRAUS_dip_events.3.d:0 "Rome has politely declined our invitation. The Italians remember their days as a puppet."
 KRAUS_dip_events.3.a:0 "Perhaps another time."
 KRAUS_diplomacy_category:0 "Beyond the Danube"
 KRAUS_diplomacy_category_desc:0 "Austria's diplomacy beyond the Danube.\n\n§YPoland§!: Austrian influence §Y[?POL.POL_AUS_influence|0]§!, German influence §Y[?POL.POL_GER_influence|0]§!. When the Polish Republic is proclaimed and Germany issues its ultimatum, Poland turns to Vienna if Austrian influence is above §Y30§! and higher than Germany's."
 KRAUS_dip_pol_fund_republicans:0 "Fund the Polish Republicans"
 KRAUS_dip_pol_fund_republicans_desc:0 "Through the banks of Kraków and Lemberg, money finds its way to the republicans in Warsaw."
 KRAUS_dip_pol_academic:0 "Academic Exchange in Kraków"
 KRAUS_dip_pol_academic_desc:0 "The Jagiellonian University and the University of Vienna exchange professors. Poland's next elite studies in Vienna's coffee houses."
 KRAUS_dip_pol_aid:0 "Economic Aid to Poland"
 KRAUS_dip_pol_aid_desc:0 "Vienna's banks offer Warsaw cheap credit. Not much, but enough to show the Poles that Berlin is not the only choice."
 KRAUS_dip_poland_hand:0 "A Hand Held Out to Warsaw"
 KRAUS_dip_poland_hand_desc:0 "The Germans took Poland from Russia in the Great War and gave it a German king. The republicans in Warsaw have long waited for another choice: Vienna."
 KRAUS_dip_poland_corridor:0 "The Galician Corridor"
 KRAUS_dip_poland_corridor_desc:0 "Only an invisible border lies between Galicia and Poland. The republicans' papers, leaflets and men all pass this way. The more loyal Galicia is to Vienna, the safer the corridor."
 KRAUS_dip_poland_integration:0 "Austro-Polish Economic Integration"
 KRAUS_dip_poland_integration_desc:0 "The alliance treaty is signed; next come tariffs, railways and banks. Between the Vistula and the Danube, Galicia becomes the meeting point of both countries."
 KRAUS_dip_poland_decisions_tt:0 "Unlock §YBeyond the Danube§! decisions: fund the Polish republicans, academic exchange and economic aid, raising Austrian influence in Poland."
 KRAUS_dip_poland_habsburg_tt:0 "§YKarl Albrecht von Habsburg§! becomes head of state of §YPoland§! (under Poland's ruling party); Galicia gets a new head of state and §YGalicia§!'s Crownland Status moves one step towards autonomy."
 KRAUS_gal_invest_start_tt:0 "§YGalicia§! gains or upgrades the spirit Crossroads of Four, and begins to receive investment from §YAustria§! and §YPoland§! every §Y180§! days, each settled separately."
 KRAUS_gal_invest_category:0 "Crossroads of Four"
 KRAUS_gal_invest_category_desc:0 "Galicia is where Austria, Poland and Ukraine meet. Each partner's investment is settled separately."
 KRAUS_gal_invest_AUS:0 "Investment from Vienna"
 KRAUS_gal_invest_POL:0 "Investment from Warsaw"
 KRAUS_gal_invest_UKR:0 "Investment from Kyiv"
 KRAUS_pol_aus_integration:0 "Austro-Polish Economic Integration"
 KRAUS_ukr_aus_integration:0 "Austro-Ukrainian Economic Integration"
 KRAUS_gal_crossroads_1:0 "Crossroads of Four"
 KRAUS_gal_crossroads_2:0 "Crossroads of Four (Full)"
 KRAUS_gal_crossroads_1_desc:0 "Galicia lies between Vienna, Warsaw and Kyiv. Once this was its misfortune; now it is its business."
 KRAUS_gal_crossroads_2_desc:0 "Galicia lies between Vienna, Warsaw and Kyiv. Once this was its misfortune; now it is its business."
 KRAUS_dip_events.10.t:0 "A Habsburg Head of State"
 KRAUS_dip_events.10.d:0 "Archduke Karl Albrecht has left Lemberg for Warsaw. Born in Istria, he is more Polish than many Poles. Now he is the head of the Polish state."
 KRAUS_dip_events.10.a:0 "Long live Poland."
 KRAUS_dip_events.20.t:0 "Investment from Vienna"
 KRAUS_dip_events.20.d:0 "Vienna's bankers have come to Lemberg again, with new credit and new orders."
 KRAUS_dip_events.20.a:0 "Good."
 KRAUS_dip_events.21.t:0 "Investment from Warsaw"
 KRAUS_dip_events.21.d:0 "Warsaw's merchants have opened new houses in Kraków. The barges of the Vistula now sail all the way into Galicia."
 KRAUS_dip_events.21.a:0 "Good."
 KRAUS_dip_events.22.t:0 "Investment from Kyiv"
 KRAUS_dip_events.22.d:0 "Kyiv's co-operatives have built new granaries and workshops in the villages of East Galicia."
 KRAUS_dip_events.22.a:0 "Good."
 KRAUS_dip_ukraine_republicans:0 "The Republicans Beyond the Dnieper"
 KRAUS_dip_ukraine_republicans_desc:0 "The republicans across the Dnieper need Vienna's recognition and support. Austria backs them quietly while sending Kyiv an invitation: the Donau-Adriabund has a chair kept for Ukraine."
 KRAUS_dip_ukraine_integration:0 "Austro-Ukrainian Economic Integration"
 KRAUS_dip_ukraine_integration_desc:0 "Ukrainian grain and Donbas coal travel to Vienna on the railways of Lemberg; Vienna's machines and capital travel the same road to Kyiv. Galicia has gained another partner."
 KRAUS_dip_ukraine_decisions_tt:0 "Unlock the §YBeyond the Danube§! decision to send arms to the Ukrainian republicans through Galicia (during the Ukrainian revolt)."
 KRAUS_dip_ukraine_invite_tt:0 "Invite §YUkraine§! into the §YDonau-Adriabund§!. Ukraine may accept or refuse."
 KRAUS_dip_ukraine_habsburg_tt:0 "§YWilhelm Franz von Habsburg§! (the Red Prince) becomes head of state of §YUkraine§! (under Ukraine's ruling party)."
 KRAUS_gal_invest_start_ukr_tt:0 "§YGalicia§!'s spirit Crossroads of Four is upgraded, and Galicia begins to receive investment from §YUkraine§! every §Y180§! days."
 KRAUS_dip_ukr_arms:0 "Arms Through Galicia"
 KRAUS_dip_ukr_arms_desc:0 "The border near Brody and Radekhiv has never been tightly kept. Rifles and ammunition leave Lemberg and reach the Ukrainian republicans."
 KRAUS_dip_events.4.t:0 "Vienna's Invitation"
 KRAUS_dip_events.4.d:0 "Austria invites us to join the Donau-Adriabund. Vienna's Red Prince is well loved among Ukrainians; perhaps this is a good omen."
 KRAUS_dip_events.4.a:0 "We accept."
 KRAUS_dip_events.4.b:0 "Ukraine will go its own way."
 KRAUS_dip_events.5.t:0 "Ukraine Joins the Alliance"
 KRAUS_dip_events.5.d:0 "Kyiv has accepted our invitation. Ukraine has joined the Donau-Adriabund."
 KRAUS_dip_events.5.a:0 "The Dnieper is our friend now too."
 KRAUS_dip_events.6.t:0 "Ukraine Declines"
 KRAUS_dip_events.6.d:0 "Kyiv has politely declined our invitation."
 KRAUS_dip_events.6.a:0 "Perhaps another time."
 KRAUS_dip_events.11.t:0 "The Red Prince"
 KRAUS_dip_events.11.d:0 "Wilhelm Franz von Habsburg, whom the Ukrainians call Vasyl Vyshyvanyi, Vasyl of the Embroidered Shirt. A Habsburg who grew up in the clothes of a Ukrainian peasant, he is now the head of the Ukrainian state."
 KRAUS_dip_events.11.a:0 "Glory to Ukraine."
 KRAUS_poland_events_233_prosperity:0 "Galicia will not be ceded, but we can prosper together."
 KRAUS_poland_events_246_prosperity:0 "Lemberg goes to no one. Galicia shall be the bridge of common prosperity for all three."
 KRAUS_ukraine_republican_events_100_prosperity:0 "Galicia will not be ceded, but we can prosper together."
 KRAUS_galicia_events_3_prosperity:0 "Stay in the Empire, and prosper together with Poland."
 KRAUS_common_prosperity_tt:0 "§YGalicia§! is not ceded. Instead, it enters an §Yeconomic union§! with the claimant."
 KRAUS_dip_events.30.t:0 "Common Prosperity"
 KRAUS_dip_events.30.d:0 "Vienna refuses to give up Galicia, but offers another plan: a customs union, through railway traffic, joint investment. Galicia stays in the Empire, but its factories and oil wells will serve us as well."
 KRAUS_dip_events.30.a:0 "Better than a war."
 KRAUS_dip_events.31.t:0 "Vienna's Answer"
 KRAUS_dip_events.31.d:0 "Vienna did not agree to our union with Poland, but nor did it simply refuse: Galicia stays in the Empire while forming an economic union with Warsaw. Poles and Ruthenians alike in Lemberg breathe more easily."
 KRAUS_dip_events.31.a:0 "So be it."
 KRAUS_dip_bul_hand:0 "Sofia's Place"
 KRAUS_dip_bul_hand_desc:0 "Sofia knows better than anyone what Bulgaria won and lost in the Balkan War. Austria does not decide for it. It only says: there is a chair in the Donau-Adriabund, kept for an independent Bulgaria. Once in, the two general staffs exchange mobilisation plans and officers study in each other's academies."
 KRAUS_dip_bul_invite_tt:0 "Invite §YBulgaria§! to join the §YDonau-Adriabund§!. How the Balkan War ended for Bulgaria and its foreign policy decide whether it accepts."
 KRAUS_dip_gre_settlement:0 "The Athens Agreement"
 KRAUS_dip_gre_settlement_desc:0 "Greece seized Austrian assets and Austria sanctioned Greece for it. Both sides know that only a third party gains from this. Vienna is willing to drop its claim in exchange for a decent agreement. (If Greece was already spared under \"The Avalanche\", this step is skipped.)"
 KRAUS_dip_gre_invite:0 "An Invitation across the Aegean"
 KRAUS_dip_gre_invite_desc:0 "Greece did not follow the Belgrade Pact to the end of the Balkan War, and it remembers who did not kick it when it was down. Now Vienna can put one question to Athens: Greece has a long coastline and few friends. Once in, the two navies hold joint exercises and exchange instructors."
 KRAUS_dip_gre_settlement_tt:0 "Austria drops its claim against Greece and the Greek §YAustrian Sanctions§! are lifted."
 KRAUS_dip_gre_invite_tt:0 "Invite §YGreece§! to join the §YDonau-Adriabund§!. The greater the threat Greece faces, the more likely it is to accept."
 KRAUS_dip_alb_gendarmerie:0 "Gendarmes for Tirana"
 KRAUS_dip_alb_gendarmerie_desc:0 "Wied's throne is a borrowed one. Austrian gendarmerie instructors can make it steadier, but nobody can promise that borrowed things stay in one's hands."
 KRAUS_dip_alb_gendarmerie_tt:0 "Albania receives a §Ygendarmerie§!, greatly reducing the risk of King Wied being assassinated."
 KRAUS_dip_alb_invite:0 "The Other Shore of the Adriatic"
 KRAUS_dip_alb_invite_desc:0 "Albania is the eastern shore of the Adriatic. Keep it in the alliance and the straits cannot be shut by anyone else."
 KRAUS_dip_alb_invite_tt:0 "Invite §YAlbania§! to join the §YDonau-Adriabund§!."
 KRAUS_dip_ott_olive:0 "An Olive Branch to the Bosphorus"
 KRAUS_dip_ott_olive_desc:0 "The Ottoman Empire is one of the last great empires of the old Europe and has no knot with Vienna that cannot be untied. Sarajevo is a fitting place: neither Vienna nor Constantinople."
 KRAUS_dip_ott_olive_tt:0 "Invite the §YOttoman Empire§! to talks at Sarajevo, starting §YKR's existing Sarajevo Accords event chain§!."
 KRAUS_dip_events.40.t:0 "Vienna's Invitation"
 KRAUS_dip_events.40.d:0 "The Austrian ambassador has brought a letter: Vienna invites Bulgaria to join the Donau-Adriabund. The Balkan War has only just ended and everyone is recalculating who is a friend."
 KRAUS_dip_events.40.a:0 "Bulgaria accepts."
 KRAUS_dip_events.40.b:0 "Bulgaria will go its own way."
 KRAUS_dip_events.41.t:0 "Bulgaria Joins the Alliance"
 KRAUS_dip_events.41.d:0 "Sofia has accepted our invitation. Bulgaria has joined the Donau-Adriabund."
 KRAUS_dip_events.41.a:0 "The Balkans have one more friend."
 KRAUS_dip_events.42.t:0 "Bulgaria Declines"
 KRAUS_dip_events.42.d:0 "Sofia has politely declined our invitation. The Bulgarians remember everyone who turned around during the Balkan War."
 KRAUS_dip_events.42.a:0 "Perhaps another time."
 KRAUS_dip_events.43.t:0 "Vienna's Invitation"
 KRAUS_dip_events.43.d:0 "The sanctions have been lifted and the Austrian ambassador brings a letter: Vienna invites Greece to join the Donau-Adriabund. Greece has many neighbours and few friends."
 KRAUS_dip_events.43.a:0 "Greece accepts."
 KRAUS_dip_events.43.b:0 "Greece stays neutral."
 KRAUS_dip_events.44.t:0 "Greece Joins the Alliance"
 KRAUS_dip_events.44.d:0 "Athens has accepted our invitation. Greece has joined the Donau-Adriabund."
 KRAUS_dip_events.44.a:0 "The Aegean has friends too."
 KRAUS_dip_events.45.t:0 "Greece Declines"
 KRAUS_dip_events.45.d:0 "Athens has politely declined our invitation. The Greeks remember the sanctions that followed the seizure of assets."
 KRAUS_dip_events.45.a:0 "Perhaps another time."
 KRAUS_dip_events.46.t:0 "Vienna's Invitation"
 KRAUS_dip_events.46.d:0 "The Austrian ambassador has brought a letter: Vienna invites Albania to join the Donau-Adriabund. The government in Tirana needs a patron and does not want to lose its independence."
 KRAUS_dip_events.46.a:0 "Albania accepts."
 KRAUS_dip_events.46.b:0 "Albania refuses."
 KRAUS_dip_events.47.t:0 "Albania Joins the Alliance"
 KRAUS_dip_events.47.d:0 "Tirana has accepted our invitation. Albania has joined the Donau-Adriabund."
 KRAUS_dip_events.47.a:0 "The other shore of the Adriatic is secure."
 KRAUS_dip_events.48.t:0 "Albania Declines"
 KRAUS_dip_events.48.d:0 "Tirana has politely declined our invitation."
 KRAUS_dip_events.48.a:0 "Perhaps another time."
