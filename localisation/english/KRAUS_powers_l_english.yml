l_english:
 KRAUS_pwr_root:0 "Invitations of the Powers"
 KRAUS_pwr_root_desc:0 "The shadow of the Third International and the Moscow Accord lies over the east, and Austria, as the traditional ally of Germany, cannot stand aside. Berlin, London, Paris and Moscow are all watching Vienna, each with its own invitation."
 KRAUS_pwr_ger_trade:0 "The Austro-German Trade Agreement"
 KRAUS_pwr_ger_trade_desc:0 "Germany needs a stable Central European market and Austria needs German industrial goods and capital. A tariff-reduction agreement serves both."
 KRAUS_pwr_entente:0 "Contact the Entente"
 KRAUS_pwr_entente_desc:0 "The Entente embassies are never short of tea parties. London does not expect Austria to be a friend, but it remembers that the table at Copenhagen needs a neutral chair."
 KRAUS_pwr_usa:0 "Across the Ocean"
 KRAUS_pwr_usa_desc:0 "America is in the middle of its own civil war, yet remains the greatest industrial nation. Looking across the Atlantic, one can see the lessons of another multinational state."
 KRAUS_pwr_internationale:0 "Contact the Third International"
 KRAUS_pwr_internationale_desc:0 "The Paris Commune will not give up exporting revolution, but its working class also needs to trade. Such a deal must not be known to Berlin."
 KRAUS_pwr_moscow_pact:0 "The Eastern Non-Aggression Pact"
 KRAUS_pwr_moscow_pact_desc:0 "Moscow's demand is simple: Austria should not appear on its western defences. A treaty can quiet the border for a while, but nobody truly believes it."
 KRAUS_pwr_moscow_pact_tt:0 "Propose a non-aggression pact to §YRussia§!. Russia may accept or refuse. If accepted it gives a small boon, but it is only a piece of paper that Moscow may tear up at any time."
 KRAUS_pwr_ger_trade_idea:0 "Austro-German Trade Agreement"
 KRAUS_pwr_entente_contact:0 "Entente Contacts"
 KRAUS_pwr_internationale_contact:0 "International Contacts"
 KRAUS_pwr_moscow_pact_idea:0 "Peace in the East"
 KRAUS_pwr_events.1.t:0 "Vienna's Proposal"
 KRAUS_pwr_events.1.d:0 "The Austrian ambassador brings a draft: non-aggression, a quiet border, each minding its own west or east.\n\nThe People's Commissar for Foreign Affairs reads it twice and says: \"The treaty is cheap. But it must have a price.\""
 KRAUS_pwr_events.1.a:0 "Sign."
 KRAUS_pwr_events.1.b:0 "Not for now."
 KRAUS_pwr_events.2.t:0 "Russia Accepts the Pact"
 KRAUS_pwr_events.2.d:0 "Moscow has accepted the non-aggression pact. The border will stay quiet for a while, at least as long as both countries need it to be."
 KRAUS_pwr_events.2.a:0 "The east is safe for now."
 KRAUS_pwr_events.3.t:0 "Russia Declines the Pact"
 KRAUS_pwr_events.3.d:0 "Moscow has politely declined the non-aggression pact. \"The time is not right,\" the ambassador relays."
 KRAUS_pwr_events.3.a:0 "Perhaps another time."
 KRAUS_pwr_entente_cph_tt:0 "The Entente contact will make Austria a mediator at the §YCopenhagen Conference§!: when it opens, Austria can step in and lower world tension."
 KRAUS_pwr_internationale_tt:0 "This is a §Rsecret treaty§!, signed behind Germany's back. If Berlin finds out, German-Austrian relations will be badly damaged and the trade agreement will be void."
 KRAUS_copenhagen_mediation:0 "Mediation at the Copenhagen Conference"
 KRAUS_pwr_betrayal:0 "Betrayed Trust"
 KRAUS_pwr_events.10.t:0 "A Seat at Copenhagen"
 KRAUS_pwr_events.10.d:0 "Germany, France and the Entente are about to sit at the same table in Copenhagen to discuss lowering world tension. The Entente contact passes on a word: Austria has friends on both sides and may be willing to step forward.\n\nThe foreign minister says: \"This is a chance to be seen, and a risk.\""
 KRAUS_pwr_events.10.a:0 "Step in and mediate."
 KRAUS_pwr_events.10.b:0 "Send only observers."
 KRAUS_pwr_events.20.t:0 "Intelligence from Berlin"
 KRAUS_pwr_events.20.d:0 "German intelligence has intercepted a document: there is an unpublished trade and transit agreement between Austria and the Third International.\n\nThe German ambassador demands an explanation. His tone is calm, calm enough to be unsettling."
 KRAUS_pwr_events.20.a:0 "Deny everything."
 KRAUS_pwr_events.20.b:0 "Admit it, and explain that it is only business."
 KRAUS_pwr_events.30.t:0 "Moscow Tears Up the Treaty"
 KRAUS_pwr_events.30.d:0 "The non-aggression pact has been declared \"no longer suited to the situation\" by Moscow alone. The wording is polite; what it means is that it never intended to keep it.\n\nAn old official in the foreign ministry sighs: \"You cannot truly trust one you sup with the tiger. We merely bought a few quiet months.\""
 KRAUS_pwr_events.30.a:0 "We expected it."
