l_english:
 KRAUS_el2c.0.t:0 "The Campaign Begins"
 KRAUS_el2c.0.d:0 "All four caucuses of the Imperial Diet have planted their flags in their own squares: Social Democrats, Christian Socials, the Liberal Democratic Union and the National Liberals, each with its own slogan and its own audience.\n\nOver the coming months every question will be fought over in turn, and the centre of gravity of the Diet will shift with every statement."
 KRAUS_el2c.0.a:0 "Let them speak."
 KRAUS_el2c.1.t:0 "Campaign: The Language of the Offices"
 KRAUS_el2c.1.d:0 "The courts of Prague, the tax offices of Lemberg and the post offices of Zagreb are all asking the same question: in which language should the official behind the counter speak?\n\nFor now, [KRAUS_pm_GetLeader] leads in the Diet."
 KRAUS_el2c.1.cs:0 "Christian Socials: German is the language of the offices; other languages are spoken at home."
 KRAUS_el2c.1.ml:0 "National Liberals: German and the commercial lingua franca; the market needs no interpreters."
 KRAUS_el2c.1.sd:0 "Social Democrats: every nation has the right to conduct its business in its own language."
 KRAUS_el2c.1.sl:0 "Liberal Democratic Union: two official languages, the second chosen by the local diet."
 KRAUS_el2c.2.t:0 "Campaign: Schools and Churches"
 KRAUS_el2c.2.d:0 "In every village the church bells and the school bell compete for the same children. Some in the Diet want to separate them.\n\nFor now, [KRAUS_pm_GetLeader] leads in the Diet."
 KRAUS_el2c.2.cs:0 "Christian Socials: schools run by the parish, teachers recommended by the priest."
 KRAUS_el2c.2.ml:0 "National Liberals: schools pay for themselves; parents pay and parents choose."
 KRAUS_el2c.2.sd:0 "Social Democrats: free state schools, teachers paid by the state."
 KRAUS_el2c.2.sl:0 "Liberal Democratic Union: schools run by local diets, each nation sets its own curriculum."
 KRAUS_el2c.3.t:0 "Campaign: Who Pays the Taxes"
 KRAUS_el2c.3.d:0 "The finance minister has left one line blank in the budget: who is to fill the gap in tax revenue?\n\nFor now, [KRAUS_pm_GetLeader] leads in the Diet."
 KRAUS_el2c.3.cs:0 "Christian Socials: one tax system, collected by officials from Vienna."
 KRAUS_el2c.3.ml:0 "National Liberals: lower taxes, and let business grow its own tax base."
 KRAUS_el2c.3.sd:0 "Social Democrats: progressive taxation; the rich pay more."
 KRAUS_el2c.3.sl:0 "Liberal Democratic Union: each crownland taxes for itself and sends a share to the centre."
 KRAUS_el2c.4.t:0 "Campaign: Land in the Fields"
 KRAUS_el2c.4.d:0 "Delegates of the farmers' union have laid a petition on the Speaker's desk: should the land of the great estates be given to those who work it?\n\nFor now, [KRAUS_pm_GetLeader] leads in the Diet."
 KRAUS_el2c.4.cs:0 "Christian Socials: protect church and noble estates; farmers are relieved by the parishes."
 KRAUS_el2c.4.ml:0 "National Liberals: free sale of land, bought out by the farmers."
 KRAUS_el2c.4.sd:0 "Social Democrats: great estates to the landless farm workers."
 KRAUS_el2c.4.sl:0 "Liberal Democratic Union: farmers' cooperatives lease the land, with the state guaranteeing loans."
 KRAUS_el2c.5.t:0 "Campaign: Insurance for Workers"
 KRAUS_el2c.5.d:0 "A textile worker loses a finger at the machine: is the compensation enough to buy a year's bread? The Diet must set a standard.\n\nFor now, [KRAUS_pm_GetLeader] leads in the Diet."
 KRAUS_el2c.5.cs:0 "Christian Socials: compensation from the mutual funds of the guilds and parishes."
 KRAUS_el2c.5.ml:0 "National Liberals: employers insure voluntarily; the state only supervises."
 KRAUS_el2c.5.sd:0 "Social Democrats: compulsory state insurance against injury and illness."
 KRAUS_el2c.5.sl:0 "Liberal Democratic Union: voluntary mutual insurance for citizens, subsidised by the state."
 KRAUS_el2c.6.t:0 "Campaign: The Army and Conscription"
 KRAUS_el2c.6.d:0 "The General Staff demands longer terms of service. Members want to know: whose language do the soldiers speak, and whose orders do they follow?\n\nFor now, [KRAUS_pm_GetLeader] leads in the Diet."
 KRAUS_el2c.6.cs:0 "Christian Socials: one command, one language, longer service."
 KRAUS_el2c.6.ml:0 "National Liberals: volunteers; recruiting offices pay market wages."
 KRAUS_el2c.6.sd:0 "Social Democrats: shorter service and soldiers' committees."
 KRAUS_el2c.6.sl:0 "Liberal Democratic Union: crownland regiments keep their own flags and languages."
 KRAUS_el2c.7.t:0 "Campaign: The Powers of the Crownland Diets"
 KRAUS_el2c.7.d:0 "Delegates from Prague, Budapest and Zagreb jointly submit a motion: how much should the crownland diets decide?\n\nFor now, [KRAUS_pm_GetLeader] leads in the Diet."
 KRAUS_el2c.7.cs:0 "Christian Socials: crownland diets handle local affairs only; great matters belong to Vienna."
 KRAUS_el2c.7.ml:0 "National Liberals: crownland diets may raise funds and run enterprises of their own."
 KRAUS_el2c.7.sd:0 "Social Democrats: crownland diets represent the workers and must have budget powers."
 KRAUS_el2c.7.sl:0 "Liberal Democratic Union: crownland diets hold legislative power, equal to the Imperial Diet."
 KRAUS_el2c.8.t:0 "Campaign: The Constitution and the Emperor"
 KRAUS_el2c.8.d:0 "Beside the Emperor's throne the draft constitution has lain for three years. Some want it to stand beside the Emperor, others want it above him.\n\nFor now, [KRAUS_pm_GetLeader] leads in the Diet."
 KRAUS_el2c.8.cs:0 "Christian Socials: the Emperor is the soul of the Empire; the constitution is only his letter."
 KRAUS_el2c.8.ml:0 "National Liberals: the Emperor handles ceremony only; the economy is for the Diet to decide."
 KRAUS_el2c.8.sd:0 "Social Democrats: the constitution guarantees the rights of workers' organisations, and the Emperor signs."
 KRAUS_el2c.8.sl:0 "Liberal Democratic Union: the Empire is a union of nations, and the Emperor is the first citizen."
 KRAUS_pm_pullto_cs_el_tt:0 "The §YCentre of the Diet§! moves 5% towards the §YChristian Socials§!."
 KRAUS_pm_pullto_ml_el_tt:0 "The §YCentre of the Diet§! moves 5% towards the §YNational Liberals§!."
 KRAUS_pm_pullto_sd_el_tt:0 "The §YCentre of the Diet§! moves 5% towards the §YSocial Democrats§!."
 KRAUS_pm_pullto_sl_el_tt:0 "The §YCentre of the Diet§! moves 5% towards the §YLiberal Democratic Union§!."
 KRAUS_el2c_deadlock_tt:0 "The four caucuses are evenly matched and no party can form a cabinet. Work on the §YImperial Basic Law§! begins, and the deadlock will last until the great war breaks out."
