l_english:
 KRAUS_world_category:0 "Storms Abroad"
 KRAUS_world_category_desc:0 "Other nations' civil wars are a mirror for Vienna, and an opportunity."
 KRAUS_spa_support:0 "Spain: Choose a Side"
 KRAUS_spa_support_desc:0 "Spain has fallen into civil war. Austria may back one side, or merely watch from afar; once the war ends the window closes."
 KRAUS_spa_contact:0 "Spain: Contact the Victor"
 KRAUS_spa_contact_desc:0 "The Spanish civil war is over. The new masters need recognition from their neighbours, and Austria can be among the first. If the victor is a socialist government, this step completes itself with no reward."
 KRAUS_acw_support:0 "America: Choose a Side"
 KRAUS_acw_support_desc:0 "America has split. The number and alignment of the belligerents differ each game; Austria may back one of the non-socialist powers, or only watch. The window closes when the war ends."
 KRAUS_acw_contact:0 "America: Contact the Victor"
 KRAUS_acw_contact_desc:0 "The American civil war is over. The powers that remain need recognition from Europe and Austria can extend a hand first. If only socialist governments remain, this step completes itself with no reward."
 KRAUS_civwar_events.1.t:0 "A Choice across the Ocean"
 KRAUS_civwar_events.1.d:0 "America has split. The envoys of the rival regimes knock on the foreign ministry's door in the same week, each insisting it is the lawful successor.\n\nAustria knows better than anyone how a multinational state comes apart, and what it ought to learn from it."
 KRAUS_civwar_events.1.USA:0 "Back the federal government."
 KRAUS_civwar_events.1.ACC:0 "Back the Constitutional Coalition."
 KRAUS_civwar_events.1.WCA:0 "Back the West Coast regime."
 KRAUS_civwar_events.1.NEE:0 "Back New England."
 KRAUS_civwar_events.1.watch:0 "Only observe, take no side."
 KRAUS_civwar_events.2.t:0 "South of the Pyrenees"
 KRAUS_civwar_events.2.d:0 "In the Spanish civil war, envoys of every side have come to Vienna: monarchists, republicans, Carlists, each hoping for Habsburg support.\n\nAn old diplomat says: \"Do not forget, there is a Habsburg shadow on the crown of Madrid as well.\""
 KRAUS_civwar_events.2.SPA:0 "Back the Spanish government."
 KRAUS_civwar_events.2.SPK:0 "Back the republicans."
 KRAUS_civwar_events.2.SPR:0 "Back the Carlists."
 KRAUS_civwar_events.2.watch:0 "Only observe, take no side."
 KRAUS_civwar_events.3.t:0 "The American Civil War Begins"
 KRAUS_civwar_events.3.d:0 "Civil war has broken out in America. The telegraph clatters through the night and the staff officers crowd around the map.\n\nUnder \"Storms Abroad\", Austria may choose to back a side. The course of the war is their own; the window opens only while the fighting lasts."
 KRAUS_civwar_events.3.a:0 "Watch the situation."
 KRAUS_civwar_events.4.t:0 "The Spanish Civil War Begins"
 KRAUS_civwar_events.4.d:0 "Civil war has broken out in Spain.\n\nUnder \"Storms Abroad\", Austria may choose to back a side. The course of the war is their own; the window opens only while the fighting lasts."
 KRAUS_civwar_events.4.a:0 "Watch the situation."
 KRAUS_hungary_rebuild:0 "Rebuilding Hungary"
 KRAUS_hungary_rebuild_desc:0 "The rebellion leaves burnt warehouses, broken railways and shattered trust. Rebuilding is a longer war than suppression: with currency, engineering and time, Budapest must be sewn back into the Empire."
 KRAUS_hd_legacy_dm:0 "Habsburg Diplomatic Legacy"
 KRAUS_hd_legacy_dm_tt:0 "+1% political power gain per ally (+2% after the Habsburg World Empire).\nOnce Beyond the Danube is complete, each subject of any kind also contributes 1% more civilian and military industry."
 KRAUS_hd_legacy_tt:0 "Gain the dynamic modifier §YHabsburg Diplomatic Legacy§!: +1% political power gain per ally."
 KRAUS_hd_sub_tt:0 "The §YHabsburg Diplomatic Legacy§! extends to subjects: each subject (of any kind) contributes 1% more civilian and military industry."
 KRAUS_hd_subject:0 "Habsburg Diplomatic Legacy (subject)"
